<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>記事のコメント欄｜合成検証</title><link rel="stylesheet" href="./dashboard.css"></head><body>
<main class="comment-dashboard">
<h1>ラチェットレンチ（検証用）</h1><p>本番とはつながっていません。テスト文章のみを使います。</p>
<section data-comments aria-labelledby="comment-title">
<h2 id="comment-title">コメント</h2><p>現場で役立ったコツや失敗談を聞かせてください。</p>
<div data-public></div><div data-pending></div><p role="status"></p>
<form class="comment-edit"><h3 data-mode>コメントを書く</h3><label>ニックネーム（任意）<input name="nickname" maxlength="24"></label>
<label>コメント<textarea required maxlength="500" aria-describedby="comment-hint"></textarea></label>
<p id="comment-hint">500字まで。会社名や個人情報は書かないでください。運営が確認してから公開します。</p>
<label class="consent"><input name="consent" type="checkbox">匿名で記事本文に紹介してもよい（任意）</label>
<button type="submit">コメントを投稿</button><button type="button" data-cancel hidden>キャンセル</button>
</form></section></main></body></html>
