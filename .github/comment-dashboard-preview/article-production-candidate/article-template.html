<section data-comments aria-labelledby="dc-article-comments-title">
<h2 id="dc-article-comments-title">コメント</h2>
<p>現場で役立ったコツや失敗談を聞かせてください。</p>
<div data-public></div><div data-pending></div><p role="status"></p>
<form class="comment-edit" method="post" action="/404.html">
<h3 data-mode>コメントを書く</h3>
<label>ニックネーム（任意）<input name="nickname" maxlength="24"></label>
<label>コメント<textarea required maxlength="500" aria-describedby="dc-article-comments-hint"></textarea></label>
<p id="dc-article-comments-hint">500字まで。会社名や個人情報は書かないでください。運営が確認してから公開します。</p>
<p><a href="/privacy-policy/">プライバシーポリシー</a>。投稿を後から修正するには、このブラウザで投稿者を識別するCookieが必要です。</p>
<label class="consent"><input name="consent" type="checkbox">匿名で記事本文に紹介してもよい（任意）</label>
<button type="submit">コメントを投稿</button><button type="button" data-cancel hidden>キャンセル</button>
</form>
</section>
