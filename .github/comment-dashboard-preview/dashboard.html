<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>コメント管理 | 電気コントロール</title>
<link rel="stylesheet" href="./admin-shell.css">
<link rel="stylesheet" href="./dashboard.css">
</head><body>
<div class="shell">
<aside class="side"><a class="brand" href="./">電気コントロール｜運営</a><nav class="nav" aria-label="管理メニュー">
<a href="./">記事評価</a><a href="./cases.html">案件管理</a><a href="./search.html">検索分析</a><a href="./articles.html">記事管理</a><a href="./health.html">サイト異常</a><a href="./comments.html" class="active" aria-current="page">コメント管理</a>
</nav></aside>
<div class="main">
<header class="topbar"><h1>運営ダッシュボード</h1><span class="spacer"></span><a href="./login.html">ログイン</a></header>
<nav class="mobile-admin-nav" aria-label="スマホ管理メニュー">
<a href="./">記事評価</a><a href="./cases.html">案件管理</a><a href="./search.html">検索分析</a><a href="./articles.html">記事管理</a><a href="./health.html">サイト異常</a><a href="./comments.html" class="active" aria-current="page">コメント管理</a>
</nav>
<main class="comment-dashboard" data-comments-dashboard>
<section class="comment-intro" aria-labelledby="comment-desk-title">
<div><p class="comment-eyebrow">読者の声</p><h2 id="comment-desk-title">コメント管理</h2>
<p>失敗談やコツを確認し、承認したコメントだけ記事に表示します。</p></div>
<span class="comment-policy">管理者承認制</span>
</section>
<section class="comment-panel" aria-label="一覧の条件">
<div class="comment-controls">
<label>状態<select><option value="pending">承認待ち</option><option value="published">公開中</option></select></label>
<label>表示中の投稿を絞る<input type="search" data-comments-filter placeholder="記事名・ニックネーム・本文" maxlength="100"></label>
<button type="button" data-comments-refresh>一覧を更新</button>
</div>
</section>
<div class="comment-list-header">
<h3 data-comments-heading>承認待ち</h3>
</div>
<p class="comment-status" data-comments-status role="status">接続先を確認しています。</p>
<div data-comments-list></div>
</main></div></div></body></html>
