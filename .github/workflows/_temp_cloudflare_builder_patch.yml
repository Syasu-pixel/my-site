name: Temporary Cloudflare Builder Patch

on:
  push:
    branches:
      - ai-editorial/cloudflare-preview-smoke

permissions:
  contents: write

jobs:
  patch-builder:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-editorial/cloudflare-preview-smoke
          fetch-depth: 0

      - name: Replace Netlify-specific Builder code
        shell: python
        run: |
          from pathlib import Path

          path = Path('supabase/functions/ai-editorial-article-builder-v4/index.ts')
          text = path.read_text(encoding='utf-8')

          old_const = 'const NETLIFY_SITE=Deno.env.get("AI_EDITORIAL_NETLIFY_SITE")??"frolicking-ganache-2a4a38";'
          new_const = '''const PAGES_PROJECT=Deno.env.get("AI_EDITORIAL_CLOUDFLARE_PAGES_PROJECT")??"denkicontrol-preview";
          function branchAlias(branch:string){return String(branch||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"")}
          function cloudflarePreview(branch:string,articlePath:string){const alias=branchAlias(branch);const path=String(articlePath||"").replace(/^\\/+/,"");return `https://${alias}.${PAGES_PROJECT}.pages.dev/${path}`}'''
          old_preview = 'const preview=`https://deploy-preview-${pr.number}--${NETLIFY_SITE}.netlify.app/${st.article_path}`;'
          new_preview = 'const preview=cloudflarePreview(st.branch,st.article_path);'

          if old_const not in text:
              raise SystemExit('NETLIFY_SITE constant marker not found')
          if old_preview not in text:
              raise SystemExit('Netlify preview URL marker not found')

          text = text.replace(old_const, new_const, 1)
          text = text.replace(old_preview, new_preview)
          text = text.replace('netlify-preview', 'preview')
          text = text.replace('Netlify Preview', 'Cloudflare Pages Preview')

          if 'NETLIFY_SITE' in text or 'deploy-preview-' in text or 'netlify-preview' in text:
              raise SystemExit('Netlify runtime marker remains after patch')

          path.write_text(text, encoding='utf-8')

      - name: Remove temporary workflow and commit patch
        shell: bash
        run: |
          rm -f .github/workflows/_temp_cloudflare_builder_patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/ai-editorial-article-builder-v4/index.ts .github/workflows/_temp_cloudflare_builder_patch.yml
          git commit -m "Preview: Article BuilderをCloudflare Pagesへ統一"
          git push origin HEAD:ai-editorial/cloudflare-preview-smoke
