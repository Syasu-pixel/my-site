name: Patch Cloudflare Preview picker
on:
  push:
    branches:
      - fix/dashboard-cloudflare-preview-selection
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dashboard-cloudflare-preview-selection
      - name: Patch Preview URL selection
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ai-editorial-dashboard/queue-preview-media.js')
          s=p.read_text()
          old="function previewUrl(){const urls=[...absoluteUrls(eventsForSelected())];return urls.find(u=>{try{return new URL(u).hostname.includes('netlify')}catch{return false}})||urls.find(u=>{try{return new URL(u).hostname==='denkicontrol.com'}catch{return false}})||''}"
          new="function previewUrl(){const urls=[...absoluteUrls(eventsForSelected())];return urls.find(u=>{try{const h=new URL(u).hostname.toLowerCase();return h==='denkicontrol-preview.pages.dev'||h.endsWith('.denkicontrol-preview.pages.dev')}catch{return false}})||''}"
          assert old in s, 'old previewUrl marker not found'
          s=s.replace(old,new,1)
          assert "hostname.includes('netlify')" not in s
          assert "hostname==='denkicontrol.com'" not in s
          p.write_text(s)
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/_temp_fix_cloudflare_preview_picker.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-editorial-dashboard/queue-preview-media.js .github/workflows/_temp_fix_cloudflare_preview_picker.yml
          git commit -m "Fix dashboard Cloudflare Preview selection"
          git push