name: Patch autonomous OGP image gate
on:
  push:
    branches: ["ai-editorial/image-gate-autonomous"]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch OGP gate
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/ai-editorial-article-builder-v4/index.ts')
          s=p.read_text()
          start=s.index('if(stage==="body_done"||stage==="ogp_retry")')
          nxt=s.find('\nif(stage===', start+10)
          if nxt<0: nxt=len(s)
          b=s[start:nxt]
          old='if(attempt>3)throw new Error("OGP image quality gate failed after 3 attempts");'
          if old not in b: raise SystemExit('OGP hard-stop guard not found')
          b=b.replace(old,'')
          old2='if(!(review.pass&&Number(review.score)>=95)){'
          if old2 not in b: raise SystemExit('OGP retry condition not found')
          b=b.replace(old2,'if(!(review.pass&&Number(review.score)>=95)&&attempt<3){',1)
          old3='await event(raw,id,"ogp-review-pass",`OGP実画像の監査を通過しました（${review.score}点）。PRを作成します。`);'
          new3='await event(raw,id,review.pass&&Number(review.score)>=95?"ogp-review-pass":"ogp-review-degraded-continue",review.pass&&Number(review.score)>=95?`OGP実画像の監査を通過しました（${review.score}点）。PRを作成します。`:`OGPは3回の再生成で${review.score}点でした。ここでは案件を停止せず候補を採用し、最終Previewの専用OGP監査で再設計します。`,"BUILDING",review.pass&&Number(review.score)>=95?"info":"warning");'
          if old3 not in b: raise SystemExit('OGP pass event not found')
          b=b.replace(old3,new3,1)
          s=s[:start]+b+s[nxt:]
          p.write_text(s)
          PY
      - name: Add note
        run: |
          cat > docs/ai-editorial-ogp-autonomous-gate.md <<'EOF'
          # OGP autonomous gate

          Article Builder no longer fails the whole command when OGP remains below 95 after three generations.
          The third candidate is kept with a warning and the workflow continues to PR / Cloudflare Preview.
          The final Preview OGP audit remains responsible for dedicated redesign rounds.
          Human review remains final-Preview-only.
          EOF
      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/_temp_patch_image_gate_autonomous.yml
          git config user.name "Syasu-pixel"
          git config user.email "syasuta0819@gmail.com"
          git add supabase/functions/ai-editorial-article-builder-v4/index.ts docs/ai-editorial-ogp-autonomous-gate.md .github/workflows/_temp_patch_image_gate_autonomous.yml
          git commit -m "AI編集部: OGP品質ゲートで案件を停止しない"
          git push
