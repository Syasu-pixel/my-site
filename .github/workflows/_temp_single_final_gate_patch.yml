name: Patch single final human gate
on:
  push:
    branches: [ai-editorial/single-final-human-gate]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-editorial/single-final-human-gate
      - name: Patch autonomy flow
        run: |
          python - <<'PY'
          from pathlib import Path

          # secure feed: auto-claim intermediate legacy HUMAN_GATE states.
          p=Path('supabase/functions/ai-editorial-secure-feed/index.ts')
          s=p.read_text()
          old='''async function addStallRecoveryEvent(raw:string,c:any){const id=String(c.command_id),n=Number(c.stall_recovery_count??1),s=Number(c.stale_seconds??180);await rpc(raw,"ai_editorial_command_add_events",{p_command_id:id,p_events:[{event_id:crypto.randomUUID(),job_id:`command-${id}`,role:"system",provider:"orchestrator",event_type:"status",summary:`${Math.max(2,Math.round(s/60))}分以上更新がなかったため、完了済み工程は繰り返さず同じ案件を途中から自動再開します（${n}/3）。`,evidence:[],severity:"medium",state:"PLANNING",created_at:new Date().toISOString(),discussion:{command_id:id,stage:"stall-auto-retry",previous_status:c.previous_status??null,last_activity:c.last_activity??null,stale_seconds:s,stall_recovery_count:n,retry_policy:"checkpoint-same-queue"},availability:{primary_provider:"orchestrator",status:"online"}}]})}\nfunction launch'''
          new='''async function addStallRecoveryEvent(raw:string,c:any){const id=String(c.command_id),n=Number(c.stall_recovery_count??1),s=Number(c.stale_seconds??180);await rpc(raw,"ai_editorial_command_add_events",{p_command_id:id,p_events:[{event_id:crypto.randomUUID(),job_id:`command-${id}`,role:"system",provider:"orchestrator",event_type:"status",summary:`${Math.max(2,Math.round(s/60))}分以上更新がなかったため、完了済み工程は繰り返さず同じ案件を途中から自動再開します（${n}/3）。`,evidence:[],severity:"medium",state:"PLANNING",created_at:new Date().toISOString(),discussion:{command_id:id,stage:"stall-auto-retry",previous_status:c.previous_status??null,last_activity:c.last_activity??null,stale_seconds:s,stall_recovery_count:n,retry_policy:"checkpoint-same-queue"},availability:{primary_provider:"orchestrator",status:"online"}}]})}\nasync function addAutonomousGateEvent(raw:string,c:any){const id=String(c.command_id),stage=String(c.stage||'');await rpc(raw,"ai_editorial_command_add_events",{p_command_id:id,p_events:[{event_id:crypto.randomUUID(),job_id:`command-${id}`,role:"system",provider:"orchestrator",event_type:"status",summary:stage==='gpt-proxy-prebuild-hold'?'Gemini一時制限のためGPT代理検証で同じ案件を自動継続します。管理者確認は最終Previewの1回だけです。':'自動修正上限に達したため安全側の制約を保持したまま制作工程へ継続します。管理者確認は最終Previewの1回だけです。',evidence:[],severity:"medium",state:c.action==='builder'?"BUILDING":"PLANNING",created_at:new Date().toISOString(),discussion:{command_id:id,stage:"autonomous-gate-continue",source_stage:stage,action:c.action,human_gate_policy:"final-preview-only",same_queue:true},availability:{primary_provider:"orchestrator",status:"online"}}]})}\nfunction launch'''
          if old not in s: raise SystemExit('secure-feed helper marker missing')
          s=s.replace(old,new,1)
          s=s.replace('let a:any=null,s:any=null,p:any=null,b:any=null;','let a:any=null,s:any=null,h:any=null,p:any=null,b:any=null;',1)
          old2='''        else{\n          try{p=await rpc(raw,"ai_editorial_claim_preview_wait",{})}catch(e){console.error("preview probe claim failed",e)}'''
          new2='''        else{\n          try{h=await rpc(raw,"ai_editorial_claim_autonomous_gate",{})}catch(e){console.error("autonomous gate claim failed",e)}\n          if(h?.claimed&&h?.command_id){const id=String(h.command_id);try{await addAutonomousGateEvent(raw,h)}catch(e){console.error("autonomous gate event failed",id,e)}if(h.action==='builder')launch(runBuilder(raw,id));else launch(run(raw,id,"resume"))}\n          else{\n          try{p=await rpc(raw,"ai_editorial_claim_preview_wait",{})}catch(e){console.error("preview probe claim failed",e)}'''
          if old2 not in s: raise SystemExit('secure-feed flow marker missing')
          s=s.replace(old2,new2,1)
          old3='''          }\n        }\n      }\n      body=normalizeSingleDeliverable(body);body={...body,auto_retry:a,stalled_retry:s,preview_probe:p,builder_claim:b};'''
          new3='''          }\n          }\n        }\n      }\n      body=normalizeSingleDeliverable(body);body={...body,auto_retry:a,stalled_retry:s,autonomous_gate:h,preview_probe:p,builder_claim:b};'''
          if old3 not in s: raise SystemExit('secure-feed closing marker missing')
          s=s.replace(old3,new3,1)
          p.write_text(s)

          # Preview visual audit: no intermediate human gate. Retry OGP more, then continue degraded.
          p=Path('supabase/functions/ai-editorial-preview-visual-audit/index.ts')
          s=p.read_text()
          s=s.replace('if(round<=2){','if(round<=5){',1)
          s=s.replace('（専用再設計 ${round}/2）。','（専用再設計 ${round}/5）。',1)
          old='''  const next={...st,ogp_dedicated_review:audit,ogp_dedicated_review_pass:false,ogp_dedicated_review_round:round,ogp_dedicated_review_head_sha:sha};\n  await checkpoint(raw,id,"done",next);await rpc(raw,"ai_editorial_command_patch",{p_command_id:id,p_status:"needs_human",p_last_error:null,p_mark_started:false});\n  await event(raw,id,`OGP専用Reviewerで2回の全面再設計後も基準未達です（${audit.score}点）。システムERRORにはせず、OGPだけ管理者確認へ回します。`,"NEEDS_HUMAN","medium",{stage:"ogp-dedicated-review-human",score:audit.score,round,same_queue:true});\n  return {status:"needs_human",round};'''
          new='''  const next={...st,ogp_dedicated_review:audit,ogp_dedicated_review_pass:false,ogp_dedicated_review_round:round,ogp_dedicated_review_head_sha:sha,ogp_degraded_continue:true,preview_verified:false};\n  await checkpoint(raw,id,"preview_wait",next);await rpc(raw,"ai_editorial_command_patch",{p_command_id:id,p_status:"building",p_last_error:null,p_mark_started:false});\n  await event(raw,id,`OGP専用Reviewerで5回の全面再設計後も基準未達です（${audit.score}点）。途中で管理者へ止めず、警告を保持したままPreview全体監査へ進みます。`,"BUILDING","high",{stage:"ogp-dedicated-review-degraded-continue",score:audit.score,round,same_queue:true,human_gate_policy:"final-preview-only"});\n  return {status:"ogp_degraded_continue",round};'''
          if old not in s: raise SystemExit('visual audit OGP marker missing')
          s=s.replace(old,new,1)

          # Final preview gate only when automated Preview audit passes. Failure is system failure, not a human decision gate.
          old_start='async function finalize(raw:string,id:string,st:any,audit:any){const pass=Boolean(audit?.pass)&&Number(audit?.score)>=95;'
          if old_start not in s: raise SystemExit('visual audit finalize marker missing')
          start=s.index(old_start)
          end=s.index('\n\nDeno.serve',start)
          new_func='''async function finalize(raw:string,id:string,st:any,audit:any){\n  const pass=Boolean(audit?.pass)&&Number(audit?.score)>=95;\n  const issues=Array.isArray(audit?.blocking_issues)?audit.blocking_issues:[];\n  if(!pass){\n    const msg=`GPT Preview監査が${audit?.score??0}点で基準未達です。管理者確認には回さず、自動工程の失敗として停止します。`;\n    await rpc(raw,"ai_editorial_command_patch",{p_command_id:id,p_status:"failed",p_last_error:msg,p_mark_started:false});\n    await rpc(raw,"ai_editorial_command_add_events",{p_command_id:id,p_events:[{event_id:crypto.randomUUID(),job_id:`command-${id}`,role:"reviewer",provider:"gpt-preview-audit",event_type:"error",summary:msg,evidence:[{kind:"github-pr",ref:st.pr_url},{kind:"preview",ref:st.preview_url}],severity:"high",state:"ERROR",created_at:new Date().toISOString(),discussion:{command_id:id,stage:"gpt-preview-audit-auto-stop",pr_number:st.pr_number,preview_url:st.preview_url,gpt_visual_audit_pass:false,gpt_visual_audit_score:audit?.score??0,gpt_visual_audit_issues:issues,gpt_revision_instructions:audit?.revision_instructions||[],human_gate_policy:"final-preview-only",requires_human_decision:false},availability:{primary_provider:"gpt-preview-audit",status:"error"}}]});\n    await checkpoint(raw,id,"done",{...st,preview_verified:false,gpt_visual_audit:audit,gpt_visual_audit_pass:false,autonomous_remediation_exhausted:true});\n    return;\n  }\n  const summary=`GPT Preview監査を通過しました（${audit.score}点）。これが唯一の管理者確認です。`;\n  await rpc(raw,"ai_editorial_command_patch",{p_command_id:id,p_status:"needs_human",p_last_error:null,p_mark_started:false});\n  await rpc(raw,"ai_editorial_command_add_events",{p_command_id:id,p_events:[{event_id:crypto.randomUUID(),job_id:`command-${id}`,role:"reviewer",provider:"gpt-preview-audit",event_type:"preview-ready",summary,evidence:[{kind:"github-pr",ref:st.pr_url},{kind:"preview",ref:st.preview_url}],severity:"info",state:"NEEDS_HUMAN",created_at:new Date().toISOString(),discussion:{command_id:id,stage:"gpt-preview-audit",pr_number:st.pr_number,pr_url:st.pr_url,preview_url:st.preview_url,article_path:st.article_path,article_title:st.bp?.title,gpt_visual_audit_pass:true,gpt_visual_audit_score:audit.score,gpt_visual_audit_strengths:audit.strengths||[],gpt_visual_audit_issues:[],gpt_revision_instructions:[],ogp_dedicated_review:st.ogp_dedicated_review||null,admin_gate:"final-review",human_gate_policy:"final-preview-only",preview_verified_by:st.preview_verified_by||"github-actions-playwright+gpt-vision"},availability:{primary_provider:"gpt-preview-audit",status:"waiting-human"}}]});\n  await checkpoint(raw,id,"done",{...st,preview_verified:true,preview_verified_at:new Date().toISOString(),gpt_visual_audit:audit,gpt_visual_audit_pass:true});\n}'''
          s=s[:start]+new_func+s[end:]
          p.write_text(s)

          # Master rule: only the final Preview is a human decision gate.
          p=Path('docs/ai-editorial-master-rules.md')
          s=p.read_text()
          old='''- GPT代理検証は独立プロバイダ検証ではないため、必ず `⚠️ GPT代理検証・Gemini未確認` 相当の表示・記録を残す。\n- GPT代理検証になった案件は記事制作前で一度停止し、管理者または運用ルールに基づく再開判断を待つ。\n- 管理者が再開を許可した案件は、Gemini未確認のままPreviewまで進めてよい。\n- GPT代理検証案件でも、管理者がPreviewを確認しOKすれば公開可能とする。Gemini再検証を公開の絶対条件にはしない。'''
          new='''- GPT代理検証は独立プロバイダ検証ではないため、必ず `⚠️ GPT代理検証・Gemini未確認` 相当の表示・記録を残す。\n- GPT代理検証になっても記事制作前では停止せず、同じ案件内で自動修正・再調査・再試行を継続する。\n- **管理者確認は、全自動監査を通過した最終Previewの1回だけ**とする。企画、調査、Gemini/GPT代理、画像、OGP、HTML、Preview監査の途中ではHUMAN_GATEを発生させない。\n- 自動修正上限や技術監査の重大不合格で安全に続行できない場合は `FAILED / ERROR` とし、途中の「採用/修正/不採用」判断を管理者へ要求しない。\n- GPT代理検証案件でも、最終Previewが自動監査を通過し管理者がOKすれば公開可能とする。Gemini再検証を公開の絶対条件にはしない。'''
          if old not in s: raise SystemExit('master rule marker missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/_temp_single_final_gate_patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/functions/ai-editorial-secure-feed/index.ts supabase/functions/ai-editorial-preview-visual-audit/index.ts docs/ai-editorial-master-rules.md .github/workflows/_temp_single_final_gate_patch.yml
          git commit -m "AI編集部: 管理者確認を最終Previewの1回に限定"
          git push
