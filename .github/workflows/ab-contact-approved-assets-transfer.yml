name: A/B Contact Approved Assets Transfer

on:
  push:
    branches:
      - preview-ab-contact
    paths:
      - .github/workflows/ab-contact-approved-assets-transfer.yml

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: preview-ab-contact
          fetch-depth: 1

      - name: Download and verify approved asset bundle
        shell: bash
        env:
          SHARE_ID: LR-gWGH-v8R1
          FILE_ID: 01a099c50b257758a27573917693042d
          FILE_NAME: a-contact-b-contact-approved-assets.zip
          EXPECTED_ZIP_SHA256: a72d132722867ecb2cf5953b7da09044907936af4d61497ae9d87f09eb666a50
        run: |
          set -euo pipefail
          API="https://api.firestorage.ai/dev/file"

          curl --proto '=https' --tlsv1.2 --fail-with-body --silent --show-error \
            "$API/shares/$SHARE_ID/files?maxResults=1000" > /tmp/meta.json

          python3 - <<'PY'
          import json, os
          meta=json.load(open('/tmp/meta.json','r',encoding='utf-8'))
          file_id=os.environ['FILE_ID']
          file_name=os.environ['FILE_NAME']
          files=meta.get('files') or []
          hit=next((f for f in files if f.get('fileId')==file_id), None)
          if not hit:
              raise SystemExit('firestorage file id not found')
          if hit.get('fileName') != file_name:
              raise SystemExit('firestorage filename mismatch')
          size=hit.get('sizeBytes')
          if not isinstance(size,int) or size < 1 or size > 5*1024*1024:
              raise SystemExit('firestorage file size rejected')
          print(f"metadata ok: {file_name} {size} bytes")
          PY

          curl --proto '=https' --tlsv1.2 --fail-with-body --silent --show-error \
            -X POST "$API/shares/$SHARE_ID/files/$FILE_ID/download" > /tmp/download.json

          DOWNLOAD_URL="$(python3 - <<'PY'
          import json
          d=json.load(open('/tmp/download.json','r',encoding='utf-8'))
          u=d.get('downloadUrl')
          if not isinstance(u,str) or not u.startswith('https://s3.ap-northeast-1.wasabisys.com/'):
              raise SystemExit('download URL rejected')
          print(u)
          PY
          )"

          curl --proto '=https' --tlsv1.2 --fail-with-body --silent --show-error \
            "$DOWNLOAD_URL" -o /tmp/approved-assets.zip
          printf '%s  %s\n' "$EXPECTED_ZIP_SHA256" /tmp/approved-assets.zip | sha256sum -c -

      - name: Extract and verify the five adopted WebP files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ab-approved
          mkdir -p /tmp/ab-approved
          unzip -q /tmp/approved-assets.zip -d /tmp/ab-approved

          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          root=Path('/tmp/ab-approved')
          expected={
            'a-contact-b-contact-basic-ogp.webp': ('bd2c4b90cfcce00bf3b0d8ca7d684b83ad4f0a4010db6da02e79b3aa42a85b9e', 206000),
            'a-contact-b-contact-basic-hero.webp': ('d0c1600ef6525033ae061a2cf864d1040d31898154b1b0382598a18e1b98a0bc', 135650),
            'a-contact-b-contact-basic-a-b-contact-difference.webp': ('44954b0a7008d8ba29f647a684eb1e6ded06c443162fd7642a09a16646d37a0a', 269318),
            'a-contact-b-contact-basic-physical-vs-plc.webp': ('56df792454e945dcc56b8e6e150b124a62f458763af60f68ee693b468e6cdafe', 295420),
            'a-contact-b-contact-basic-pushbutton-relay-plc-basic-flow.webp': ('11e6b7a972a7ffb6eec03f6a8c29da0abc0c92740cc4328ae8102da18f927d06', 249266),
          }
          actual={p.name for p in root.iterdir() if p.is_file()}
          if actual != set(expected):
              raise SystemExit(f'unexpected bundle contents: {sorted(actual)}')
          for name,(sha,size) in expected.items():
              p=root/name
              data=p.read_bytes()
              if len(data) != size:
                  raise SystemExit(f'{name}: size mismatch')
              if not (len(data)>=12 and data[:4]==b'RIFF' and data[8:12]==b'WEBP'):
                  raise SystemExit(f'{name}: WebP signature mismatch')
              got=hashlib.sha256(data).hexdigest()
              if got != sha:
                  raise SystemExit(f'{name}: sha256 mismatch {got}')
              print(f'ok {name} {size} bytes {sha}')
          PY

          target='assets/images/a-contact-b-contact-basic'
          mkdir -p "$target"
          cp /tmp/ab-approved/*.webp "$target"/

      - name: Commit only approved images and remove this transfer workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/ab-contact-approved-assets-transfer.yml
          git config user.name "denkicontrol-preview-writer"
          git config user.email "actions@users.noreply.github.com"
          git add assets/images/a-contact-b-contact-basic .github/workflows/ab-contact-approved-assets-transfer.yml
          git commit -m "Add approved a-contact b-contact article images"
          git push origin HEAD:preview-ab-contact
