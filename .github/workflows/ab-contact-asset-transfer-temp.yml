name: Transfer approved a-contact assets

on:
  push:
    branches:
      - preview-ab-contact
    paths:
      - '.github/workflows/ab-contact-asset-transfer-temp.yml'

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-ab-contact
          fetch-depth: 0
      - name: Inspect shared package and place assets
        shell: bash
        env:
          SHARE_URL: https://firestorage.ai/ja/f/72APLWnaDKwX
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, requests
          from urllib.parse import urljoin
          u='https://firestorage.ai/ja/f/72APLWnaDKwX'
          r=requests.get(u,timeout=30)
          print('share',r.status_code,r.url,r.headers.get('content-type'),len(r.content))
          open('/tmp/share.html','wb').write(r.content)
          text=r.text
          hrefs=re.findall(r'href=["\']([^"\']+)',text)
          for h in hrefs:
              if 'download' in h.lower() or '.zip' in h.lower() or '/api/' in h.lower():
                  print('candidate',urljoin(r.url,h))
          PY
      - name: Remove temporary workflow if transfer not yet implemented
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/ab-contact-asset-transfer-temp.yml
          git commit -m 'Remove temporary asset transfer probe' || true
          git push origin HEAD:preview-ab-contact
