name: Finalize a-contact article text

on:
  push:
    branches:
      - preview-ab-contact
    paths:
      - '.github/workflows/ab-contact-final-text-temp.yml'

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-ab-contact
          fetch-depth: 0
      - name: Apply final article edits
        shell: python
        run: |
          from pathlib import Path

          path = Path('articles/a-contact-b-contact-basic.html')
          s = path.read_text(encoding='utf-8')

          replacements = {
            'https://denkicontrol.com/assets/images/a-contact-b-contact-basic/a-contact-b-contact-basic-hero.png': 'https://denkicontrol.com/assets/images/a-contact-b-contact-basic/a-contact-b-contact-basic-ogp.webp',
            'background:url("../assets/images/a-contact-b-contact-basic/a-contact-b-contact-basic-hero.png") right center / auto 100% no-repeat;\n      opacity:.32;': 'background:url("../assets/images/a-contact-b-contact-basic/a-contact-b-contact-basic-hero.webp") right center / auto 100% no-repeat;\n      opacity:.88;',
            'background:url("../assets/images/a-contact-b-contact-basic/a-contact-b-contact-basic-hero.png") right -28px bottom -14px / 162% auto no-repeat;\n        opacity:.2;': 'background:url("../assets/images/a-contact-b-contact-basic/a-contact-b-contact-basic-hero.webp") right -28px bottom -14px / 162% auto no-repeat;\n        opacity:.62;',
            'background:url("../assets/images/a-contact-b-contact-basic/a-contact-b-contact-basic-hero.png") right center / auto 92% no-repeat;\n        opacity:.24;': 'background:url("../assets/images/a-contact-b-contact-basic/a-contact-b-contact-basic-hero.webp") right center / auto 92% no-repeat;\n        opacity:.72;',
            'background:url("../assets/images/a-contact-b-contact-basic/a-contact-b-contact-basic-hero.png") right -40px bottom -20px / 178% auto no-repeat;\n        opacity:.14;': 'background:url("../assets/images/a-contact-b-contact-basic/a-contact-b-contact-basic-hero.webp") right -40px bottom -20px / 178% auto no-repeat;\n        opacity:.48;',
            '../assets/images/a-contact-b-contact-basic/a-contact-b-contact-basic-a-b-contact-difference.png': '../assets/images/a-contact-b-contact-basic/a-contact-b-contact-basic-contact-compare.webp',
            '../assets/images/a-contact-b-contact-basic/a-contact-b-contact-basic-pushbutton-relay-plc-basic-flow.png': '../assets/images/a-contact-b-contact-basic/a-contact-b-contact-basic-signal-flow.webp',
            '<li>a接点は「普段OFF、動作でON」と覚える</li>\n            <li>b接点は「普段ON、動作でOFF」と覚える</li>': '<li>現物のa接点は「通常時は開、動作すると閉」</li>\n            <li>現物のb接点は「通常時は閉、動作すると開」</li>',
            'a接点とb接点を1組にした切替接点は、c接点（トランスファ接点）と呼ばれます。': 'a接点とb接点を共通端子（COM）で切り替える接点は、c接点（切替接点）と呼ばれます。一般的にはCOM・NO・NCの3端子を確認し、機器の端子図を優先して読みます。',
            '<td class="cell-blue">a接点っぽい動き</td>\n                    <td>PLC入力OFF</td>\n                    <td>PLC入力ON</td>\n                    <td>スタートボタン、動作確認信号</td>': '<td class="cell-blue">入力がOFF→ONになる例</td>\n                    <td>PLC入力OFF</td>\n                    <td>PLC入力ON</td>\n                    <td>操作や検出によって入力信号が入る構成</td>',
            '<td class="cell-orange">b接点っぽい動き</td>\n                    <td>PLC入力ON</td>\n                    <td>PLC入力OFF</td>\n                    <td>停止ボタン、異常監視、断線検知を考慮した信号</td>': '<td class="cell-orange">入力がON→OFFになる例</td>\n                    <td>PLC入力ON</td>\n                    <td>PLC入力OFF</td>\n                    <td>操作や異常で入力信号が切れる構成</td>',
            '停止や異常監視に関わる接点は、断線時の扱いや安全側の考え方が関係します。実際の回路図、仕様書、現場ルールを確認してください。': '停止や安全に関わる回路は、<strong>b接点を使っているだけで安全になるわけではありません</strong>。断線時の扱い、直接開路動作、安全回路の構成などを含め、機器の仕様書・回路図・現場の安全ルールを優先してください。'
          }

          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected text: {old[:90]}')
              s = s.replace(old, new)

          ladder_intro = '''            <p>\n              現物の接点とPLCラダー上の接点は、同じ「a接点・b接点」という言葉でも見方が少し違います。<span class="marker-blue">現物では通常時の開閉、ラダーではデバイスのON/OFFに対して条件が成立するか</span>を見ます。\n            </p>\n'''
          ladder_figure = '''\n            <figure class="article-figure">\n              <img src="../assets/images/a-contact-b-contact-basic/a-contact-b-contact-basic-hard-vs-plc.webp" alt="現物のa接点・b接点とPLCラダー上のa接点・b接点の違いを比較した図" loading="lazy">\n              <figcaption>\n                現物の接点は機械的な開閉、PLCラダーの接点はデバイスのON/OFFに対するプログラム上の条件として読み分けます。\n              </figcaption>\n            </figure>\n'''
          if ladder_figure.strip() not in s:
              if ladder_intro not in s:
                  raise SystemExit('ladder intro not found')
              s = s.replace(ladder_intro, ladder_intro + ladder_figure, 1)

          # Make the physical-contact wording explicit before PLC sections.
          s = s.replace(
              'a接点・b接点は、接点の動き方を表す呼び方です。',
              'a接点・b接点は、まず現物のスイッチやリレーにある接点の動き方を表す呼び方として整理すると分かりやすいです。',
              1
          )

          path.write_text(s, encoding='utf-8')
      - name: Validate key article content
        shell: bash
        run: |
          set -euo pipefail
          FILE=articles/a-contact-b-contact-basic.html
          grep -q 'a-contact-b-contact-basic-ogp.webp' "$FILE"
          grep -q 'a-contact-b-contact-basic-hero.webp' "$FILE"
          grep -q 'a-contact-b-contact-basic-contact-compare.webp' "$FILE"
          grep -q 'a-contact-b-contact-basic-hard-vs-plc.webp' "$FILE"
          grep -q 'a-contact-b-contact-basic-signal-flow.webp' "$FILE"
          grep -q 'b接点を使っているだけで安全になるわけではありません' "$FILE"
      - name: Commit article and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Syasu-pixel'
          git config user.email 'syasuta0819@gmail.com'
          git add articles/a-contact-b-contact-basic.html
          git rm .github/workflows/ab-contact-final-text-temp.yml
          git commit -m 'Finalize a-contact b-contact article content'
          git push origin HEAD:preview-ab-contact
