name: Hand edit a-contact b-contact preview

on:
  push:
    branches:
      - preview-ab-contact

permissions:
  contents: write

jobs:
  edit:
    if: "!contains(github.event.head_commit.message, 'Hand edit a-contact b-contact article')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-ab-contact
      - name: Apply focused article edits
        shell: python
        run: |
          from pathlib import Path
          p = Path('articles/a-contact-b-contact-basic.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
            'https://denkicontrol.com/assets/images/a-contact-b-contact-basic/a-contact-b-contact-basic-hero.png',
            'https://denkicontrol.com/assets/images/a-contact-b-contact-basic/a-contact-b-contact-basic-ogp.png',
            2
          )

          old = '''              <span class="term">a接点</span>・<span class="term">b接点</span>と一緒によく出てくるのが、NO / NC です。NOはNormally Open、NCはNormally Closedの略です。一般的なリレーやスイッチでは、a接点はメーク接点（NO）、b接点はブレーク接点（NC）として整理できます。'''
          new = '''              <span class="term">a接点</span>・<span class="term">b接点</span>と一緒によく出てくるのが、NO / NC です。NOはNormally Open（常開）、NCはNormally Closed（常閉）の略です。一般的なリレーやスイッチでは、<strong>a接点＝メーク接点＝NO、b接点＝ブレーク接点＝NC</strong> と整理できます。'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''            <p>
              一般的な接点表記では、<span class="marker-blue">a接点 = NO、b接点 = NC</span> と整理できます。ただし、端子番号や記号の付け方は機器ごとに異なるため、最終的には回路図・端子表記・メーカー仕様書を確認します。a接点とb接点を1組にした切替接点は、c接点（トランスファ接点）と呼ばれます。
            </p>'''
          new = '''            <p>
              一般的な接点表記では、<span class="marker-blue">a接点 = NO、b接点 = NC</span> と整理できます。ただし、端子番号や記号の付け方は機器ごとに異なるため、最終的には回路図・端子表記・メーカー仕様書を確認します。
            </p>

            <div class="note-box">
              <h3>c接点はa接点とb接点を切り替える接点</h3>
              <p>
                <strong>c接点（トランスファ接点）</strong>は、共通端子（COM）に対してNO側とNC側を切り替える接点です。a接点とb接点を別々に暗記するだけでなく、切替接点として見るとリレーの端子構成を理解しやすくなります。
              </p>
            </div>

            <div class="field-highlight">
              <h3>名前の由来も覚え方になる</h3>
              <p>
                三菱電機の教材では、a接点は <strong>arbeit contact（働く接点）</strong>、b接点は <strong>break contact（途切れる接点）</strong> の頭文字として紹介されています。名称の由来は補助的な覚え方として使い、実際の判断は通常時の開閉状態で行います。
              </p>
            </div>'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''                  <tr>
                    <td class="cell-blue">a接点っぽい動き</td>
                    <td>PLC入力OFF</td>
                    <td>PLC入力ON</td>
                    <td>スタートボタン、動作確認信号</td>
                  </tr>
                  <tr>
                    <td class="cell-orange">b接点っぽい動き</td>
                    <td>PLC入力ON</td>
                    <td>PLC入力OFF</td>
                    <td>停止ボタン、異常監視、断線検知を考慮した信号</td>
                  </tr>'''
          new = '''                  <tr>
                    <td class="cell-blue">OFF → ONになる入力例</td>
                    <td>PLC入力OFF</td>
                    <td>PLC入力ON</td>
                    <td>スタートボタン、動作確認信号など</td>
                  </tr>
                  <tr>
                    <td class="cell-orange">ON → OFFになる入力例</td>
                    <td>PLC入力ON</td>
                    <td>PLC入力OFF</td>
                    <td>停止ボタン、異常監視など</td>
                  </tr>'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''            <p>
              実務では、画面だけでなく現物のボタンやリレーの状態も一緒に見ます。<span class="marker-blue">画面・現物・配線</span>の3つをセットで確認すると、接点の意味を追いやすくなります。
            </p>'''
          new = '''            <p>
              上の表は<strong>PLC入力の状態変化の例</strong>であり、その変化だけから外部機器のa接点・b接点を断定するものではありません。実務では、<span class="marker-blue">画面・現物・配線・図面</span>をセットで確認すると、接点の意味を追いやすくなります。
            </p>'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''              <div class="check-item check-item--field">
                <h3>NO / NC 表記とa/b表記を別物として覚える</h3>
                <p>
                  基本的にはa接点がNO、b接点がNCです。まずは通常時の開閉で整理すると覚えやすいです。
                </p>
              </div>'''
          new = '''              <div class="check-item check-item--field">
                <h3>NO / NC 表記とa/b表記を別物として覚える</h3>
                <p>
                  一般的なリレーやスイッチではa接点がNO、b接点がNCです。まずは通常時の開閉で整理し、端子番号は機器の仕様書で確認します。
                </p>
              </div>'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''              <p>
                停止や異常監視に関わる接点は、断線時の扱いや安全側の考え方が関係します。実際の回路図、仕様書、現場ルールを確認してください。
              </p>'''
          new = '''              <p>
                停止や異常監視に関わる接点は、断線時の扱いや安全側の考え方が関係します。<strong>「b接点を使っているから安全」とは限りません。</strong> 実際の回路図、機器仕様、安全要求、現場ルールを確認してください。
              </p>'''
          assert old in s
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
      - name: Commit focused edits and remove temporary workflow
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ab-contact-hand-edit-temp.yml
          git add articles/a-contact-b-contact-basic.html
          git commit -m "Hand edit a-contact b-contact article"
          git push origin HEAD:preview-ab-contact
