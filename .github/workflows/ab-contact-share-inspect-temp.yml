name: Inspect temporary asset share
on:
  push:
    branches: [preview-ab-contact]
    paths: ['.github/workflows/ab-contact-share-inspect-temp.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-ab-contact
          fetch-depth: 0
      - name: Inspect share HTML
        shell: bash
        run: |
          python - <<'PY'
          import requests,re
          u='https://firestorage.ai/ja/f/72APLWnaDKwX'
          t=requests.get(u,timeout=30).text
          for line in t.splitlines():
              low=line.lower()
              if any(k in low for k in ['download','publicid','shareid','subdir','api/','file_id','filename','object','72aplw','x8mif']):
                  print(line[:4000])
          PY
      - name: Remove probe
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/ab-contact-share-inspect-temp.yml
          git commit -m 'Remove temporary share inspection workflow' || true
          git push origin HEAD:preview-ab-contact
