name: Add PE FG SG to home latest
on:
  push:
    branches: [add-pe-fg-sg-to-home-latest-20260910]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-pe-fg-sg-to-home-latest-20260910
      - name: Update home latest articles
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start = s.index('<section class="info-box info-box--latest" id="new">')
          end = s.index('</section>', start)
          block = s[start:end]
          new_li = '                <li><a href="articles/pe-fg-sg-difference-basic.html">PE・FG・SGの違いとは？保護接地・フレームグランド・シグナルグランドを整理</a></li>\n'
          old_li = '                <li><a href="articles/power-watt-basic.html">電力（W）とは？電圧・電流・消費電力の基本</a></li>\n'
          if 'articles/pe-fg-sg-difference-basic.html' in block:
              raise SystemExit('PE FG SG article is already in latest list')
          if old_li not in block:
              raise SystemExit('Expected bottom latest item not found')
          block = block.replace('              <ul>\n', '              <ul>\n' + new_li, 1)
          block = block.replace(old_li, '', 1)
          if block.count('<li><a href=') != 7:
              raise SystemExit(f'Latest list count changed unexpectedly: {block.count("<li><a href=")}')
          s = s[:start] + block + s[end:]
          p.write_text(s, encoding='utf-8')
          print('Home latest list updated: PE/FG/SG added first, power-watt removed last, count kept at 7')
          PY
      - name: Commit change and remove helper workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/add-pe-fg-sg-home-latest.yml
          git commit -m 'Add PE FG SG article to home latest list'
          git push origin HEAD:add-pe-fg-sg-to-home-latest-20260910
