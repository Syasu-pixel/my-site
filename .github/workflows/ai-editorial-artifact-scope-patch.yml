name: AI Editorial artifact scope patch
on:
  push:
    branches: [fix/artifact-scope-label]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/artifact-scope-label
      - name: Patch artifact heading and weekly-plan artifact
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('ai-editorial-dashboard/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<h2>完成したもの</h2><div id="artifacts"', '<h2>この案件の成果物</h2><div id="artifacts"')
          p.write_text(s,encoding='utf-8')

          p=Path('ai-editorial-dashboard/command-center.js')
          s=p.read_text(encoding='utf-8')
          old="""      if(stage==='weekly-plan-saved'||type==='weekly-plan-saved'){\n        if(!seen.has('weekly-plan')){seen.add('weekly-plan');items.push('<div class=\"card\"><b>📌 今週の編集方針を保存済み</b><div class=\"artifactHint\">火〜日はこの方針を自動参照します。</div></div>')}\n        continue;\n      }\n"""
          if old not in s:
              raise SystemExit('weekly-plan artifact block not found')
          s=s.replace(old, "      if(stage==='weekly-plan-saved'||type==='weekly-plan-saved')continue;\n")
          s=s.replace("version.textContent='chat v0.7.4'", "version.textContent='chat v0.7.5'")
          p.write_text(s,encoding='utf-8')

          p=Path('ai-editorial-dashboard/weekly-plan-ui.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("h.textContent.includes('完成したもの')", "h.textContent.includes('この案件の成果物')||h.textContent.includes('完成したもの')")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ai-editorial-dashboard/index.html ai-editorial-dashboard/command-center.js ai-editorial-dashboard/weekly-plan-ui.js
          git commit -m "Clarify selected-job artifacts and remove weekly plan artifact card"
          git push
