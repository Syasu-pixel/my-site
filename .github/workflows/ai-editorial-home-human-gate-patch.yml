name: AI Editorial home and human gate patch
on:
  push:
    branches: [fix/editorial-home-human-gate]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/editorial-home-human-gate
      - name: Wire dashboard experience script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ai-editorial-dashboard/index.html')
          s=p.read_text(encoding='utf-8')
          marker='<script src="./weekly-plan-ui.js?v=0.7.4"></script>'
          tag='<script src="./dashboard-experience.js?v=0.7.6"></script>'
          if tag not in s:
              if marker not in s:
                  raise SystemExit('weekly plan script marker not found')
              s=s.replace(marker, marker+'\n'+tag)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ai-editorial-dashboard/index.html
          git commit -m "Wire editorial home and human decision UI"
          git push
