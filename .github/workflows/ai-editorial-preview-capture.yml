# Temporary Preview-only builder. DO NOT MERGE into main.
name: Light curtain production-equivalent Preview
on:
  push:
    branches: [preview-final-light-curtain-current-20261004]
    paths: [.github/workflows/ai-editorial-preview-capture.yml]
permissions:
  contents: write
concurrency:
  group: light-curtain-final-preview-20261004
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Compare rule catalog findings with unchanged main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/preview-final-light-curtain-current-20261004
          test "$(git rev-parse origin/main)" = b354aba6dc92b995499b11292630686d010e4d5b
          mkdir -p "$RUNNER_TEMP/lc-evidence"
          python -m pip install PyYAML==6.0.2
          python - <<'PY'
          import json,os,subprocess,sys
          from pathlib import Path
          root=Path.cwd(); temp=Path(os.environ['RUNNER_TEMP']); evidence=temp/'lc-evidence'; main=temp/'lc-main-audit'
          subprocess.run(['git','worktree','add','--detach',str(main),'origin/main'],check=True,stdout=subprocess.DEVNULL)
          records={}
          try:
              for label,path in [('main',main),('preview',root)]:
                  report=evidence/(label+'-rule-catalog-report.json')
                  result=subprocess.run([sys.executable,'scripts/check-rule-catalog.py','--report',str(report)],cwd=path,text=True,capture_output=True)
                  (evidence/(label+'-catalog-output.txt')).write_text(result.stdout+result.stderr)
                  records[label]={'exitCode':result.returncode,'report':json.loads(report.read_text())}
              expected={
                  'unregistered document: docs/comic-scripts/interlock-basic-yonkoma-01.md',
                  'unregistered document: docs/comic-scripts/npn-pnp-basic-yonkoma-01.md',
                  'broken/ambiguous reference: docs/comic-scripts/npn-pnp-basic-yonkoma-01.md -> a_colorful_japanese_manga_style_infographic_comic.png',
                  'broken/ambiguous reference: docs/comic-scripts/npn-pnp-basic-yonkoma-01.md -> assets/images/comics/npn-pnp-basic/npn-pnp-basic-yonkoma-01.png'
              }
              a=set(records['main']['report']['errors']); b=set(records['preview']['report']['errors'])
              assert a==b==expected,{'main':sorted(a),'preview':sorted(b)}
              assert records['main']['exitCode']==records['preview']['exitCode']==1
              report={'baseMain':'b354aba6dc92b995499b11292630686d010e4d5b','mainAndPreviewErrorsIdentical':True,'newErrors':[],'unresolvedInheritedErrors':sorted(a),'ruleCatalogPassed':False,'scope':'Preview generation only; unrelated comic documents and catalog remain unchanged. No merge authorization.','authority':'docs/rules/README.md: unrelated authorized work may proceed while unrelated unresolved findings remain recorded.'}
              (evidence/'inherited-rule-findings.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
              print('::warning::Main and Preview have the same four pre-existing comic documentation catalog errors. Recorded, NOT fixed or marked passed. Publication validators remain mandatory.')
          finally:
              subprocess.run(['git','worktree','remove',str(main)],check=True)
          subprocess.run([sys.executable,'scripts/test-rule-catalog.py'],check=True)
          PY
      - name: Run scoped registrations and unchanged publication builder
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os,subprocess,yaml,json
          source='481ca8e30a23b9898408e6dbb9a10cfd46d44ccf'
          previous=subprocess.check_output(['git','show',source+':.github/workflows/ai-editorial-preview-capture.yml'])
          steps=yaml.safe_load(previous)['jobs']['prepare']['steps']
          wanted=['Guard source and record target-only registrations','Execute unchanged production build and final validation blocks','Materialize verified target and every runtime dependency on output-only branch']
          evidence=Path(os.environ['RUNNER_TEMP'])/'lc-evidence'
          for i,name in enumerate(wanted,1):
              matches=[s for s in steps if s.get('name')==name]; assert len(matches)==1
              script=matches[0]['run']
              if i==1:
                  old='python scripts/check-rule-catalog.py --report "$RUNNER_TEMP/lc-evidence/rule-catalog-report.json"'
                  assert script.count(old)==1
                  script=script.replace(old,'# Catalog executed against both main and Preview above; identical inherited errors retained in evidence.')
              (evidence/('step-'+str(i)+'.sh')).write_text(script)
              print('::group::'+name,flush=True)
              with (evidence/('step-'+str(i)+'.log')).open('w') as log:
                  result=subprocess.run(['bash','-e','-o','pipefail','-c',script],stdout=log,stderr=subprocess.STDOUT)
              lines=(evidence/('step-'+str(i)+'.log')).read_text().splitlines()
              print('\n'.join(lines[-70:]),flush=True)
              print('::endgroup::',flush=True)
              if result.returncode:
                  raise SystemExit(result.returncode)
          PY
      - name: Upload registration and publication proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: light-curtain-final-publication-proof
          path: |
            ${{ runner.temp }}/lc-evidence/
            ${{ runner.temp }}/integration-build/publication-checks.json
            ${{ runner.temp }}/integration-build/publication-final-checks.json
            ${{ runner.temp }}/integration-build/end-independent-checks.json
            ${{ runner.temp }}/integration-build/source-verification.json
            ${{ runner.temp }}/integration-build/link-audit.json
          retention-days: 14
          if-no-files-found: error
