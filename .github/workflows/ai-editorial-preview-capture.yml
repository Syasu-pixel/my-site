# Temporary Preview-only builder. DO NOT MERGE into main.
name: Light curtain production-equivalent Preview
on:
  push:
    branches: [preview-final-light-curtain-current-20261004]
    paths: [.github/workflows/ai-editorial-preview-capture.yml]
permissions:
  contents: write
concurrency:
  group: light-curtain-final-preview-20261004
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Restore verified adopted assets and run unchanged production validators
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/preview-final-light-curtain-current-20261004
          test "$(git rev-parse origin/main)" = b354aba6dc92b995499b11292630686d010e4d5b
          mkdir -p "$RUNNER_TEMP/lc-evidence"
          # Preserve main's CRLF while keeping actual trailing-space checks active.
          git config core.whitespace cr-at-eol
          python -m pip install PyYAML==6.0.2
          python - <<'PY'
          from pathlib import Path
          import os,subprocess,yaml
          evidence=Path(os.environ['RUNNER_TEMP'])/'lc-evidence'
          source='99d60e0bef3b0f59978de87aa58d609aa57bffdf'
          previous=subprocess.check_output(['git','show',source+':.github/workflows/ai-editorial-preview-capture.yml'])
          steps=yaml.safe_load(previous)['jobs']['prepare']['steps']
          wanted=['Restore adopted repository image objects and preserve baseline formatting','Verify inherited findings and execute production-equivalent publication']
          for i,name in enumerate(wanted,1):
              found=[s for s in steps if s.get('name')==name]; assert len(found)==1
              script=found[0]['run']; (evidence/('recovery-'+str(i)+'.sh')).write_text(script)
              print('::group::'+name,flush=True)
              with (evidence/('recovery-'+str(i)+'.log')).open('w') as log:
                  result=subprocess.run(['bash','-e','-o','pipefail','-c',script],stdout=log,stderr=subprocess.STDOUT)
              print('\n'.join((evidence/('recovery-'+str(i)+'.log')).read_text().splitlines()[-65:]),flush=True)
              print('::endgroup::',flush=True)
              if result.returncode:raise SystemExit(result.returncode)
          PY
      - name: Upload publication and adopted image evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: light-curtain-final-publication-proof
          path: |
            ${{ runner.temp }}/lc-evidence/
            ${{ runner.temp }}/integration-build/publication-checks.json
            ${{ runner.temp }}/integration-build/publication-final-checks.json
            ${{ runner.temp }}/integration-build/end-independent-checks.json
            ${{ runner.temp }}/integration-build/published-image-mapping.json
            ${{ github.workspace }}/assets/images/light-curtain-basic/
            ${{ github.workspace }}/_site/assets/images/light-curtain-basic/
          retention-days: 14
          if-no-files-found: error
