name: AI Editorial Preview Capture
run-name: AI Editorial Preview PR #${{ github.event.pull_request.number }}

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  capture:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Resolve article Preview URL
        id: target
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mapfile -t ARTICLE_CANDIDATES < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -E '^articles/.*\.html$' || true)
          ARTICLE_PATH=""

          # Prefer the article whose basename has a matching image asset directory.
          # This avoids selecting stale duplicate HTML files when a PR contains more than one article candidate.
          for candidate in "${ARTICLE_CANDIDATES[@]}"; do
            slug="$(basename "$candidate" .html)"
            if [ -d "assets/images/$slug" ]; then
              ARTICLE_PATH="$candidate"
              break
            fi
          done

          if [ -z "$ARTICLE_PATH" ] && [ "${#ARTICLE_CANDIDATES[@]}" -gt 0 ]; then
            ARTICLE_PATH="${ARTICLE_CANDIDATES[0]}"
          fi

          if [ -z "$ARTICLE_PATH" ]; then
            echo "No article HTML changed; skip capture."
            echo "has_article=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PREVIEW_URL="https://deploy-preview-${PR_NUMBER}--frolicking-ganache-2a4a38.netlify.app/${ARTICLE_PATH}"
          LOCAL_URL="http://127.0.0.1:4173/${ARTICLE_PATH}"
          echo "Resolved article: $ARTICLE_PATH"
          echo "has_article=true" >> "$GITHUB_OUTPUT"
          echo "article_path=$ARTICLE_PATH" >> "$GITHUB_OUTPUT"
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "local_url=$LOCAL_URL" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: steps.target.outputs.has_article == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        if: steps.target.outputs.has_article == 'true'
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local PR render server
        if: steps.target.outputs.has_article == 'true'
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/preview-server.log 2>&1 &
          echo $! >/tmp/preview-server.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              echo "Local PR render server ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/preview-server.log || true
          echo "Local PR render server did not start" >&2
          exit 1

      - name: Capture desktop and mobile Preview
        if: steps.target.outputs.has_article == 'true'
        env:
          PREVIEW_URL: ${{ steps.target.outputs.preview_url }}
          LOCAL_URL: ${{ steps.target.outputs.local_url }}
          ARTICLE_PATH: ${{ steps.target.outputs.article_path }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          OUT="preview-capture/pr-${PR_NUMBER}"
          mkdir -p "$OUT"
          cat > .ai-editorial-capture.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const renderUrl = process.env.LOCAL_URL;
          const previewUrl = process.env.PREVIEW_URL;
          const pr = process.env.PR_NUMBER;
          const out = `preview-capture/pr-${pr}`;
          const browser = await chromium.launch({ headless: true });

          async function capture(name, viewport) {
            const page = await browser.newPage({ viewport, deviceScaleFactor: 1 });
            const response = await page.goto(renderUrl, { waitUntil: 'networkidle', timeout: 90000 });
            if (!response || !response.ok()) throw new Error(`local render failed: ${response?.status() ?? 'no response'} ${renderUrl}`);
            await page.evaluate(async () => {
              if (document.fonts?.ready) await document.fonts.ready;
              await new Promise(r => setTimeout(r, 1200));
            });
            await page.screenshot({ path: `${out}/${name}.png`, fullPage: true });
            if (name === 'desktop') fs.writeFileSync(`${out}/rendered.html`, await page.content(), 'utf8');
            await page.close();
          }

          await capture('desktop', { width: 1440, height: 1000 });
          await capture('mobile', { width: 390, height: 844 });
          await browser.close();

          fs.writeFileSync(`${out}/manifest.json`, JSON.stringify({
            pr_number: Number(pr),
            preview_url: previewUrl,
            render_source: 'local-pr-head',
            article_path: process.env.ARTICLE_PATH,
            head_sha: process.env.HEAD_SHA,
            captured_at: new Date().toISOString(),
            desktop: 'desktop.png',
            mobile: 'mobile.png',
            html: 'rendered.html'
          }, null, 2));
          JS
          node .ai-editorial-capture.mjs
          rm -f .ai-editorial-capture.mjs

      - name: Stop local PR render server
        if: always() && steps.target.outputs.has_article == 'true'
        run: |
          if [ -f /tmp/preview-server.pid ]; then
            kill "$(cat /tmp/preview-server.pid)" || true
          fi

      - name: Upload Preview evidence
        if: steps.target.outputs.has_article == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ai-editorial-preview-pr-${{ github.event.pull_request.number }}
          path: preview-capture/pr-${{ github.event.pull_request.number }}/
          if-no-files-found: error
          retention-days: 14
