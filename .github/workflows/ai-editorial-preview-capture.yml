# Temporary final-preview preparation. DO NOT MERGE this workflow into main.
name: Light curtain final preview preparation
on:
  push:
    branches: [preview-final-light-curtain-current-20261004]
    paths: [.github/workflows/ai-editorial-preview-capture.yml]
permissions:
  contents: read
jobs:
  source-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record source and collect rules and official build implementation
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = b354aba6dc92b995499b11292630686d010e4d5b
          mkdir -p /tmp/light-curtain-evidence
          git rev-parse HEAD > /tmp/light-curtain-evidence/source-sha.txt
          git diff --stat origin/main...HEAD > /tmp/light-curtain-evidence/source-diff.txt
          git archive --format=tar.gz -o /tmp/light-curtain-evidence/source.tar.gz HEAD docs scripts .github tests package.json pnpm-lock.yaml articles en/articles assets/css assets/js assets/data assets/images/light-curtain-basic
      - name: Upload source evidence
        uses: actions/upload-artifact@v4
        with:
          name: light-curtain-final-preview-sources
          path: /tmp/light-curtain-evidence/
          retention-days: 14
          if-no-files-found: error
