name: AI Editorial weekly plan UI patch
on:
  push:
    branches: [fix/monday-completion-order]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/monday-completion-order
      - name: Patch dashboard loaders and lock behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ai-editorial-dashboard/index.html')
          s=p.read_text(encoding='utf-8')
          old='<script src="./queue-organizer.js?v=0.7.0"></script>'
          new=old+'\n<script src="./weekly-plan-ui.js?v=0.7.4"></script>'
          if 'weekly-plan-ui.js' not in s:
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')

          p=Path('ai-editorial-dashboard/command-center.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("version.textContent='chat v0.7.3'","version.textContent='chat v0.7.4'")
          s=s.replace("b.disabled=locked;b.title=active?", "b.disabled=locked||b.dataset.weekCompleted==='1';b.title=active?")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ai-editorial-dashboard/index.html ai-editorial-dashboard/command-center.js
          git commit -m "Wire weekly plan status into dashboard"
          git push
