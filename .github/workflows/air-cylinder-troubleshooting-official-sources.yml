name: Air Cylinder Troubleshooting Official Sources
on:
  push:
    paths:
      - '.github/workflows/air-cylinder-troubleshooting-official-sources.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-air-cylinder-troubleshooting-official-sources-20260916
      - name: Apply official source box
        run: python scripts/air-cylinder-troubleshooting-official-sources.py
      - name: Clean temporary automation and commit
        run: |
          rm -f scripts/air-cylinder-troubleshooting-official-sources.py .github/workflows/air-cylinder-troubleshooting-official-sources.yml
          git config user.name "Syasu-pixel"
          git config user.email "syasuta0819@gmail.com"
          git add -A
          git commit -m "Add manufacturer sources to air cylinder troubleshooting article"
          git push
