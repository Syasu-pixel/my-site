name: Alternate Operation Text Refresh

on:
  push:
    branches:
      - preview-alternate-operation-circuit-text-refresh-20260916

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-alternate-operation-circuit-text-refresh-20260916
          fetch-depth: 0
      - name: Apply refresh
        run: python .github/scripts/alternate_operation_refresh.py
      - name: Commit result
        run: |
          rm -f .github/workflows/alternate-operation-text-refresh.yml
          rm -f .github/scripts/alternate_operation_refresh.py
          git config user.name denkicontrol-preview-writer
          git config user.email actions@users.noreply.github.com
          git add articles/alternate-operation-circuit-basic.html docs/existing-article-improvement-backlog.md .github/workflows/alternate-operation-text-refresh.yml .github/scripts/alternate_operation_refresh.py
          git commit -m "Refresh alternate operation circuit article text and related cards"
          git push origin HEAD:preview-alternate-operation-circuit-text-refresh-20260916
