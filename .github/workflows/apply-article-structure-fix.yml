name: Apply bounded article structure repair

on:
  push:
    branches: [preview-article-structure-fix-20260917]
    paths: ['.github/workflows/apply-article-structure-fix.yml']

permissions:
  contents: write

jobs:
  repair:
    if: github.ref == 'refs/heads/preview-article-structure-fix-20260917'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-article-structure-fix-20260917
      - name: Apply only the two locally verified substitutions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          def blob(data):
              return hashlib.sha1(('blob '+str(len(data))+'\0').encode()+data).hexdigest()
          fixes = [
              ('articles/electrical-symbol-basic.html',
               'db77111be078d19f75e56c7636bf27b7e3980c9d',
               '0e771ee9bf74ffea4f574c03a9f25c16757b58ab',
               '<div class="content-layout"><article class="article-main">',
               '<div class="page-layout"><article class="main-column">'),
              ('articles/control-panel-noise-troubleshooting-guide.html',
               '5255b1cb124492e9e7ec74dfc35dd1a4492ad77c',
               '0f4205170313d5eebd9cb54ba08cdc85e9e87548',
               '<footer class="site-footer"><div class="container">© 電気と制御の実務メモ</div></footer>',
               '<footer class="site-footer">\n  <div class="container">\n    <p>現場で使う工具と、制御の基本を、迷いにくく整理してまとめています。<br>\n      <a href="../privacy-policy/">プライバシーポリシー</a> | <a href="../contact/">お問い合わせ</a>\n    </p>\n    <p>© 電気と制御の実務メモ</p>\n  </div>\n</footer>')
          ]
          pending = []
          for name, expected_before, expected_after, old, new in fixes:
              path = Path(name)
              before = path.read_bytes()
              assert blob(before) == expected_before, 'Source changed; abort: '+name
              old, new = old.encode(), new.encode()
              assert before.count(old) == 1, name
              after = before.replace(old, new, 1)
              assert after.replace(new, old, 1) == before, name
              assert blob(after) == expected_after, 'Output differs from tested copy: '+name
              pending.append((path, after))
          for target in ('privacy-policy/index.html', 'contact/index.html'):
              assert Path(target).is_file(), target
          for path, data in pending:
              path.write_bytes(data)
              print('Verified output:', path, blob(data))
          # This branch-only helper must not appear in the final PR diff.
          Path('.github/workflows/apply-article-structure-fix.yml').unlink()
          PY
          git diff --check
          python3 - <<'PY'
          import subprocess
          actual = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          expected = {'articles/electrical-symbol-basic.html', 'articles/control-panel-noise-troubleshooting-guide.html', '.github/workflows/apply-article-structure-fix.yml'}
          assert actual == expected, actual
          PY
      - name: Commit only to the isolated preview branch
        shell: bash
        run: |
          test "$(git branch --show-current)" = preview-article-structure-fix-20260917
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- articles/electrical-symbol-basic.html articles/control-panel-noise-troubleshooting-guide.html .github/workflows/apply-article-structure-fix.yml
          git commit -m 'fix: restore symbol article layout and noise hub footer links'
          git push origin HEAD:preview-article-structure-fix-20260917
