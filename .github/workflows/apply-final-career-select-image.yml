name: Apply final career select image
on:
  push:
    branches: [preview-career-service-makersjob-v1]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-career-service-makersjob-v1
          fetch-depth: 0
      - name: Download accepted image and clean preview branch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests
          api='https://api.firestorage.ai/dev/file/shares/gh7jdPJmJChv/files/01a0a5efa010730f8d009b51f6864ba2/download'
          r=requests.post(api,timeout=30)
          print('download api:',r.status_code,r.text[:300])
          r.raise_for_status()
          u=r.json()['downloadUrl']
          data=requests.get(u,timeout=60).content
          out='assets/images/fa-engineer-career-service-comparison/fa-engineer-career-service-comparison-select.webp'
          open(out,'wb').write(data)
          print('bytes:',len(data),'magic:',data[:12])
          assert data[:4] == b'RIFF' and data[8:12] == b'WEBP', 'downloaded file is not WebP'
          assert len(data) > 100000, 'downloaded image is unexpectedly small'
          p='articles/fa-engineer-career-service-comparison.html'
          html=open(p,encoding='utf-8').read()
          html=html.replace('fa-engineer-career-service-comparison-select.png','fa-engineer-career-service-comparison-select.webp')
          open(p,'w',encoding='utf-8').write(html)
          PY
          rm -f assets/images/fa-engineer-career-service-comparison/fa-engineer-career-service-comparison-select.png
          rm -f .github/workflows/inspect-firestorage-share.yml
          rm -f .github/workflows/inspect-firestorage-api.yml
          rm -f .github/workflows/inspect-firestorage-alljs.yml
          rm -f .github/workflows/inspect-firestorage-context.yml
          rm -f .github/workflows/test-firestorage-endpoints.yml
          rm -f .github/workflows/find-firestorage-api-host.yml
          rm -f .github/workflows/apply-final-career-select-image.yml
          file assets/images/fa-engineer-career-service-comparison/fa-engineer-career-service-comparison-select.webp
          grep -o 'fa-engineer-career-service-comparison-select\.[a-z]*' articles/fa-engineer-career-service-comparison.html | sort -u
      - name: Commit final image
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'denkicontrol-preview-writer'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Use accepted career comparison image and clean diagnostics'
          git push origin HEAD:preview-career-service-makersjob-v1
