name: Apply PLC02 related OGP cards

on:
  push:
    branches:
      - preview-plc-drilling-project-02-outline
    paths:
      - .github/workflows/apply-plc02-related-ogp.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-plc-drilling-project-02-outline
      - name: Apply related OGP cards only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('articles/plc-drilling-line-design-project-02.html')
          s = p.read_text(encoding='utf-8')

          old_css = '.related-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:16px}.related-card{display:block;padding:16px;border:1px solid #d7e4f3;border-radius:20px;background:#f8fbff;color:var(--text)}.related-card h3{margin:0 0 8px;font-size:16px;color:#1d4ed8}.related-card p{margin:0;font-size:13px;color:#64748b}'
          new_css = '.related-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:16px}.related-card{display:block;overflow:hidden;border:1px solid #d7e4f3;border-radius:20px;background:#fff;color:var(--text);box-shadow:0 8px 20px rgba(15,23,42,.05);transition:transform .18s ease,box-shadow .18s ease}.related-card:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(15,23,42,.09);text-decoration:none}.related-card img{width:100%;aspect-ratio:16/9;object-fit:cover;border-bottom:1px solid #e2e8f0}.related-card-body{padding:15px 16px 17px}.related-card h3{margin:0 0 8px;font-size:16px;line-height:1.45;color:#1d4ed8}.related-card p{margin:0;font-size:13px;color:#64748b}'

          old_html = '<section class="section-card" id="related"><h2>あわせて読みたい記事</h2><div class="related-grid"><a class="related-card" href="./plc-drilling-line-design-project-01.html"><h3>第1回｜設備全体設計</h3><p>設備構成と設計条件を最初から確認する。</p></a><a class="related-card" href="./plc-io-unit-basic.html"><h3>PLC I/Oユニットの基本</h3><p>入力・出力ユニットと信号の考え方を基礎から確認する。</p></a><a class="related-card" href="./dc24v-common-basic.html"><h3>DC24VとCOMの基本</h3><p>I/O配線を考える前に、DC24VとCOMの関係を整理する。</p></a></div></section>'
          new_html = '<section class="section-card" id="related"><h2>あわせて読みたい記事</h2><div class="related-grid"><a class="related-card" href="./plc-drilling-line-design-project-01.html"><img src="../assets/images/articles/plc-drilling-line-design-project-01-ogp.webp" alt="PLCで設備を1から設計する 第1回 設備全体設計" loading="lazy" decoding="async"><div class="related-card-body"><h3>第1回｜設備全体設計</h3><p>設備構成と設計条件を最初から確認する。</p></div></a><a class="related-card" href="./plc-io-unit-basic.html"><img src="../assets/images/plc-io-unit-basic/plc-io-unit-basic-ogp.png" alt="PLC入力ユニット・出力ユニットの基本" loading="lazy" decoding="async"><div class="related-card-body"><h3>PLC I/Oユニットの基本</h3><p>入力・出力ユニットと信号の考え方を基礎から確認する。</p></div></a><a class="related-card" href="./dc24v-common-basic.html"><img src="../assets/images/dc24v-common-basic/dc24v-common-basic-ogp.png" alt="DC24Vのプラスコモン・マイナスコモンの基本" loading="lazy" decoding="async"><div class="related-card-body"><h3>DC24VとCOMの基本</h3><p>I/O配線を考える前に、DC24VとCOMの関係を整理する。</p></div></a></div></section>'

          for label, old, new in [('css', old_css, new_css), ('html', old_html, new_html)]:
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate related image refs
        run: |
          test -f assets/images/articles/plc-drilling-line-design-project-01-ogp.webp
          test -f assets/images/plc-io-unit-basic/plc-io-unit-basic-ogp.png
          test -f assets/images/dc24v-common-basic/dc24v-common-basic-ogp.png
          grep -q 'plc-drilling-line-design-project-01-ogp.webp' articles/plc-drilling-line-design-project-02.html
          grep -q 'plc-io-unit-basic-ogp.png' articles/plc-drilling-line-design-project-02.html
          grep -q 'dc24v-common-basic-ogp.png' articles/plc-drilling-line-design-project-02.html
      - name: Commit related card update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add articles/plc-drilling-line-design-project-02.html
          git diff --cached --quiet && exit 0
          git commit -m '第2回関連記事をOGP画像カード化'
          git push origin HEAD:preview-plc-drilling-project-02-outline
