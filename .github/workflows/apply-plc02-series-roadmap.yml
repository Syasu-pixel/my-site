name: Apply PLC02 series roadmap

on:
  push:
    branches:
      - preview-plc-drilling-project-02-outline
    paths:
      - .github/workflows/apply-plc02-series-roadmap.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-plc-drilling-project-02-outline
      - name: Apply series roadmap
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('articles/plc-drilling-line-design-project-02.html')
          s = p.read_text(encoding='utf-8')

          css_anchor = '.related-card p{margin:0;font-size:13px;color:#64748b}.site-footer{padding:26px 0 36px;border-top:1px solid #dbe7f3;color:#64748b;text-align:center;font-size:12px;font-weight:700}'
          css_insert = '''.related-card p{margin:0;font-size:13px;color:#64748b}\n    #roadmap{background:linear-gradient(180deg,#f8fbff 0%,#ffffff 100%);border-color:#cdddf0}\n    #roadmap h2{margin-bottom:8px}\n    .series-roadmap-lead{margin:0 0 18px!important;color:#64748b}\n    .series-roadmap{list-style:none;margin:0;padding:0;display:grid;gap:10px}\n    .series-roadmap li{display:grid;grid-template-columns:72px minmax(0,1fr) auto;align-items:center;gap:14px;min-height:62px;padding:12px 14px;border:1px solid #dce6f2;border-radius:18px;background:#fff;box-shadow:0 5px 14px rgba(15,23,42,.035)}\n    .series-step{display:inline-flex;align-items:center;justify-content:center;min-height:34px;padding:4px 10px;border-radius:999px;background:#f1f5f9;color:#475569;font-size:12px;font-weight:900;white-space:nowrap}\n    .series-title{font-size:14px;font-weight:800;color:#334155}\n    .series-state{display:inline-flex;align-items:center;justify-content:center;min-height:30px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:900;white-space:nowrap}\n    .series-roadmap li.is-done .series-step{background:#e2e8f0;color:#475569}\n    .series-roadmap li.is-done .series-state{background:#f1f5f9;color:#64748b;border:1px solid #cbd5e1}\n    .series-roadmap li.is-current{border-color:#93c5fd;background:linear-gradient(135deg,#eff6ff 0%,#f8fbff 100%);box-shadow:0 9px 22px rgba(37,99,235,.10)}\n    .series-roadmap li.is-current .series-step{background:#2563eb;color:#fff}\n    .series-roadmap li.is-current .series-title{color:#1d4ed8}\n    .series-roadmap li.is-current .series-state{background:#dbeafe;color:#1d4ed8;border:1px solid #93c5fd}\n    .series-roadmap li.is-next{border-color:#f6c66f;background:linear-gradient(135deg,#fff8e8 0%,#fffdf7 100%);box-shadow:0 9px 22px rgba(245,158,11,.09)}\n    .series-roadmap li.is-next .series-step{background:#f59e0b;color:#fff}\n    .series-roadmap li.is-next .series-title{color:#92400e}\n    .series-roadmap li.is-next .series-state{background:#fff1c7;color:#92400e;border:1px solid #f6c66f}\n    .site-footer{padding:26px 0 36px;border-top:1px solid #dbe7f3;color:#64748b;text-align:center;font-size:12px;font-weight:700}'''
          if s.count(css_anchor) != 1:
              raise SystemExit('css anchor mismatch')
          s = s.replace(css_anchor, css_insert, 1)

          media_anchor = '@media(max-width:520px){:root{--header-h:66px}.brand-title{font-size:13px}.header-search{flex-basis:120px}.article-hero h1{font-size:28px}}'
          media_new = '@media(max-width:520px){:root{--header-h:66px}.brand-title{font-size:13px}.header-search{flex-basis:120px}.article-hero h1{font-size:28px}.series-roadmap li{grid-template-columns:64px minmax(0,1fr);gap:8px 10px;padding:12px}.series-roadmap .series-state{grid-column:2;justify-self:start}.series-title{font-size:13px}}'
          if s.count(media_anchor) != 1:
              raise SystemExit('media anchor mismatch')
          s = s.replace(media_anchor, media_new, 1)

          html_anchor = '  <section class="mini-toc-card"><h2>第2回でわかること</h2><div class="mini-toc">'
          roadmap = '''  <section class="section-card" id="roadmap">\n    <h2>この設備を、設計の順番でシリーズ化する</h2>\n    <p class="series-roadmap-lead">今読んでいる位置と、次に進む記事がすぐ分かるようにシリーズ全体を並べています。</p>\n    <ol class="series-roadmap">\n      <li class="is-done"><span class="series-step">第1回</span><span class="series-title">設備仕様と全体構想</span><span class="series-state">完了</span></li>\n      <li class="is-current"><span class="series-step">第2回</span><span class="series-title">PLC・I/O構成を決める</span><span class="series-state">今ここ</span></li>\n      <li class="is-next"><span class="series-step">第3回</span><span class="series-title">CV01〜CV04の搬送制御を考える</span><span class="series-state">次ここ</span></li>\n      <li><span class="series-step">第4回</span><span class="series-title">加工ステーションのシーケンスを作る</span></li>\n      <li><span class="series-step">第5回</span><span class="series-title">手動運転・異常処理・復旧を設計する</span></li>\n      <li><span class="series-step">第6回</span><span class="series-title">GOT画面と保守・生産情報を作る</span></li>\n      <li><span class="series-step">最終</span><span class="series-title">GX Works2へ実装してシミュレーションする</span></li>\n    </ol>\n  </section>\n\n  <section class="mini-toc-card"><h2>第2回でわかること</h2><div class="mini-toc">'''
          if s.count(html_anchor) != 1:
              raise SystemExit('html anchor mismatch')
          s = s.replace(html_anchor, roadmap, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate roadmap
        run: |
          grep -q 'id="roadmap"' articles/plc-drilling-line-design-project-02.html
          grep -q '第2回</span><span class="series-title">PLC・I/O構成を決める</span><span class="series-state">今ここ' articles/plc-drilling-line-design-project-02.html
          grep -q '第3回</span><span class="series-title">CV01〜CV04の搬送制御を考える</span><span class="series-state">次ここ' articles/plc-drilling-line-design-project-02.html
      - name: Commit article update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add articles/plc-drilling-line-design-project-02.html
          git diff --cached --quiet && exit 0
          git commit -m '第2回にシリーズロードマップを追加'
          git push origin HEAD:preview-plc-drilling-project-02-outline
