name: Noise Guide Preview Patch

on:
  push:
    branches: [ai-binary-upload-smoke]
    paths: [.github/workflows/artifact-ingress-smoke.yml]

permissions:
  contents: write

jobs:
  patch-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target preview branch
        uses: actions/checkout@v4
        with:
          ref: pilot-control-panel-noise-guide
          fetch-depth: 1

      - name: Patch adopted Hero/OGP and official references
        shell: bash
        run: |
          set -euo pipefail
          test -f assets/images/control-panel-noise-troubleshooting-guide/control-panel-noise-troubleshooting-guide-hero.webp
          test -f assets/images/control-panel-noise-troubleshooting-guide/control-panel-noise-troubleshooting-guide-ogp.webp
          python3 - <<'PY'
          from pathlib import Path
          p=Path('articles/control-panel-noise-troubleshooting-guide.html')
          s=p.read_text(encoding='utf-8')

          old_og='https://denkicontrol.com/assets/images/power-signal-wiring-separation-basic/power-signal-wiring-separation-basic-hero.png'
          new_og='https://denkicontrol.com/assets/images/control-panel-noise-troubleshooting-guide/control-panel-noise-troubleshooting-guide-ogp.webp'
          if s.count(old_og) != 2:
              raise SystemExit(f'unexpected OG/Twitter source count: {s.count(old_og)}')
          s=s.replace(old_og,new_og)

          old_css='background:url("../assets/images/power-signal-wiring-separation-basic/power-signal-wiring-separation-basic-hero.png") right center / auto 100% no-repeat'
          new_css='background:url("../assets/images/control-panel-noise-troubleshooting-guide/control-panel-noise-troubleshooting-guide-hero.webp") right center / auto 100% no-repeat'
          if s.count(old_css) != 1:
              raise SystemExit(f'unexpected Hero CSS declaration count: {s.count(old_css)}')
          s=s.replace(old_css,new_css,1)

          old_p='<p>一般的な考え方だけで実機の配線方法を決めず、対象機器の取扱説明書とEMC・配線上の注意を確認します。三菱電機のFA向けEMC資料では、配置・配線による分離、シールド、接地、フィルタ等を基本対策として整理しています。オムロンの制御機器資料でも、ノイズ源からの分離、別ダクト、シールド線、接地、フィルタなどが示されています。</p>'
          new_p='<p>一般的な考え方だけで実機の配線方法を決めず、対象機器の取扱説明書とEMC・配線上の注意を確認します。シールドの接地方法は機器やネットワークによって推奨が変わるため、「片側接地が絶対」などと決めつけず、対象製品の資料を優先します。</p>'
          if s.count(old_p) != 1:
              raise SystemExit(f'unexpected reference paragraph count: {s.count(old_p)}')
          s=s.replace(old_p,new_p,1)

          marker='<div class="key-highlight"><h3>資料で見る項目</h3><p>推奨ケーブル、シールド処理、接地端子の扱い、信号線と動力線の分離、フィルタ・サージ対策の指定、設置距離や配線上の注意を確認します。</p></div>'
          official='<div class="key-highlight"><h3>メーカー公式資料</h3><p><a href="https://www.fa.omron.co.jp/product/special/knowledge/common/goodusage2.html" target="_blank" rel="noopener noreferrer">オムロン｜センサの上手な使い方</a>では、シールド線・ツイストペア線、モータや電磁開閉器などのノイズ源との分離、別ダクト等の考え方を確認できます。<br><a href="https://fa-faq.mitsubishielectric.co.jp/faq/show/10894" target="_blank" rel="noopener noreferrer">三菱電機FA｜一次側からのノイズ対策</a>では、ノイズフィルタや接地条件などの考え方を確認できます。<br><a href="https://fa-faq.mitsubishielectric.co.jp/faq/show/14299" target="_blank" rel="noopener noreferrer">三菱電機FA｜シールド線の接地処理</a>は、機器・ネットワークごとに接地指示が異なり得ることを確認する例として参照できます。</p></div>'
          if s.count(marker) != 1:
              raise SystemExit(f'unexpected reference marker count: {s.count(marker)}')
          s=s.replace(marker,official+'\n          '+marker,1)

          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit preview patch
        run: |
          set -euo pipefail
          git config user.name denkicontrol-ai-writer
          git config user.email actions@users.noreply.github.com
          git add articles/control-panel-noise-troubleshooting-guide.html
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'Use adopted noise guide images and official sources'
          git push origin HEAD:pilot-control-panel-noise-guide
