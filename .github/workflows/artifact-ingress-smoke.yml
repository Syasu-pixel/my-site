name: Artifact Ingress Smoke OGP

on:
  push:
    branches: [ai-binary-upload-smoke]
    paths: [.github/workflows/artifact-ingress-smoke.yml]

permissions:
  contents: write

jobs:
  ingress-ogp:
    runs-on: ubuntu-latest
    steps:
      - name: Import reviewed OGP through broker
        id: broker
        shell: bash
        env:
          BROKER_URL: ${{ vars.ARTIFACT_BROKER_URL }}
          BROKER_TOKEN: ${{ secrets.ARTIFACT_CLEANUP_TOKEN }}
        run: |
          set -euo pipefail
          payload='{"action":"import_firestorage","share_id":"xAuRpBIqGSS_","file_id":"01a076e3d0937007ad975bdac7d73171","file_name":"control-panel-noise-troubleshooting-guide-ogp.webp","sha256":"6472a54b982251185bd234f9e07e2005ab6d02cc52cb2a86d771b9a84a7cc936"}'
          response="$(curl --proto '=https' --tlsv1.2 --fail-with-body --silent --show-error --max-time 60 -X POST -H 'content-type: application/json' -H "x-artifact-broker-token: $BROKER_TOKEN" --data "$payload" "$BROKER_URL")"
          python3 - "$response" >> "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          d=json.loads(sys.argv[1])
          print('artifact_url='+d['download_url'])
          print('object_path='+d['object_path'])
          PY

      - name: Checkout trusted writer runtime
        uses: actions/checkout@v4
        with:
          ref: main
          path: writer-runtime
          sparse-checkout: scripts/ai_artifact_writer.py
          sparse-checkout-cone-mode: false

      - name: Checkout target preview branch
        uses: actions/checkout@v4
        with:
          ref: pilot-control-panel-noise-guide
          path: workspace

      - name: Validate and write OGP
        working-directory: workspace
        env:
          AI_ARTIFACT_ALLOWED_HOSTS: ${{ vars.AI_ARTIFACT_ALLOWED_HOSTS }}
          ARTIFACT_URL: ${{ steps.broker.outputs.artifact_url }}
        run: |
          set -euo pipefail
          target='assets/images/control-panel-noise-troubleshooting-guide/control-panel-noise-troubleshooting-guide-ogp.webp'
          python3 ../writer-runtime/scripts/ai_artifact_writer.py --url "$ARTIFACT_URL" --sha256 6472a54b982251185bd234f9e07e2005ab6d02cc52cb2a86d771b9a84a7cc936 --target-branch pilot-control-panel-noise-guide --target-path "$target"
          git config user.name denkicontrol-ai-writer
          git config user.email actions@users.noreply.github.com
          git add "$target"
          if git diff --cached --quiet; then
            echo 'No OGP change to commit.'
          else
            git commit -m 'Add adopted noise guide OGP image'
            git push origin HEAD:pilot-control-panel-noise-guide
          fi

      - name: Delete temporary broker copy
        if: ${{ success() }}
        env:
          BROKER_URL: ${{ vars.ARTIFACT_BROKER_URL }}
          BROKER_TOKEN: ${{ secrets.ARTIFACT_CLEANUP_TOKEN }}
          OBJECT_PATH: ${{ steps.broker.outputs.object_path }}
        run: |
          set -euo pipefail
          payload="$(python3 -c 'import json,os; print(json.dumps({"action":"delete","object_path":os.environ["OBJECT_PATH"]}))')"
          curl --proto '=https' --tlsv1.2 --fail-with-body --silent --show-error --max-time 20 -X POST -H 'content-type: application/json' -H "x-artifact-broker-token: $BROKER_TOKEN" --data "$payload" "$BROKER_URL"
