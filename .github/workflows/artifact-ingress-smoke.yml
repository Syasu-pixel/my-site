name: Artifact Ingress Smoke Cleanup

on:
  push:
    branches: [ai-binary-upload-smoke]
    paths: [.github/workflows/artifact-ingress-smoke.yml]

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete leftover broker artifact
        env:
          BROKER_URL: ${{ vars.ARTIFACT_BROKER_URL }}
          BROKER_TOKEN: ${{ secrets.ARTIFACT_CLEANUP_TOKEN }}
          OBJECT_PATH: incoming/2026-09-06/3003e217-511f-42b9-991d-c28661cb0b50/control-panel-noise-troubleshooting-guide-hero.webp
        run: |
          set -euo pipefail
          payload="$(python3 -c 'import json,os; print(json.dumps({"action":"delete","object_path":os.environ["OBJECT_PATH"]}))')"
          curl --proto '=https' --tlsv1.2 --fail-with-body --silent --show-error --max-time 20 \
            -X POST \
            -H 'content-type: application/json' \
            -H "x-artifact-broker-token: $BROKER_TOKEN" \
            --data "$payload" \
            "$BROKER_URL"
