name: Audit article feedback placement

on:
  push:
    branches:
      - audit-article-feedback-20260917
    paths:
      - .github/workflows/audit-article-feedback.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Scan all article HTML via GitHub API
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ref = context.sha;
            const treeResp = await github.rest.git.getTree({owner, repo, tree_sha: ref, recursive: '1'});
            const files = treeResp.data.tree
              .filter(x => x.type === 'blob' && /^articles\/[^/]+\.html$/.test(x.path))
              .sort((a,b)=>a.path.localeCompare(b.path));

            function attrsFrom(s){
              const out = {};
              const re = /([:\w-]+)(?:\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s"'=<>`]+)))?/g;
              let m;
              while((m=re.exec(s))) out[m[1].toLowerCase()] = m[2] ?? m[3] ?? m[4] ?? '';
              return out;
            }

            function analyze(html, path){
              const tokenRe = /<!--[\s\S]*?-->|<![^>]*>|<\/?[a-zA-Z][^>]*>/g;
              const voids = new Set(['meta','link','img','br','hr','input','source','area','base','col','embed','param','track','wbr']);
              const root = {tag:'root', attrs:{}, parent:null, children:[], start:0, end:html.length};
              const stack = [root];
              let m;
              while((m=tokenRe.exec(html))){
                const tok = m[0];
                if(tok.startsWith('<!--') || tok.startsWith('<!')) continue;
                const closing = /^<\//.test(tok);
                const nm = tok.match(/^<\/?\s*([a-zA-Z0-9-]+)/);
                if(!nm) continue;
                const tag = nm[1].toLowerCase();
                if(closing){
                  for(let i=stack.length-1;i>0;i--){
                    if(stack[i].tag===tag){ stack[i].end=tokenRe.lastIndex; stack.length=i; break; }
                  }
                  continue;
                }
                const attrText = tok.slice(nm[0].length, tok.length-1);
                const n = {tag, attrs:attrsFrom(attrText), parent:stack[stack.length-1], children:[], start:m.index, end:null};
                n.parent.children.push(n);
                if(!voids.has(tag) && !/\/>$/.test(tok)) stack.push(n);
              }
              const nodes=[]; const walk=n=>{nodes.push(n); n.children.forEach(walk)}; walk(root);
              const classes=n=>new Set((n.attrs.class||'').split(/\s+/).filter(Boolean));
              const contains=(a,b)=>{for(let n=b;n;n=n.parent) if(n===a) return true; return false};
              const scripts=nodes.filter(n=>n.tag==='script').map(n=>n.attrs.src||'');
              const hasSiteSearch=scripts.some(s=>s.includes('assets/js/site-search.js'));
              const hasDirect=scripts.some(s=>s.includes('assets/js/article-feedback.js'));
              const hardcoded=nodes.some(n=>n.attrs.id==='articleFeedbackCard');
              const main=nodes.find(n=>{const c=classes(n); return c.has('main-column')||c.has('article-main')||c.has('main')});

              let related = nodes.find(n=>n.attrs.id==='related') || nodes.find(n=>n.attrs.id==='related-career') || nodes.find(n=>(n.attrs.id||'').startsWith('related'));
              let relatedLabel = related ? 'id:'+(related.attrs.id||'') : '';
              if(!related && main){
                const sections = nodes.filter(n=>n.tag==='section' && contains(main,n));
                for(const s of sections){
                  const frag = html.slice(s.start, Math.min(s.end||html.length, s.start+1800));
                  const hm = frag.match(/<h2[^>]*>([\s\S]*?)<\/h2>/i);
                  if(!hm) continue;
                  const label=hm[1].replace(/<[^>]+>/g,'').replace(/&[^;]+;/g,' ').replace(/\s+/g,' ').trim();
                  if(label.includes('あわせて読みたい記事') || label==='関連記事'){ related=s; relatedLabel='heading:'+label; break; }
                }
              }

              const loader = hasDirect&&hasSiteSearch ? 'direct+auto' : hasDirect ? 'direct' : hasSiteSearch ? 'auto' : 'none';
              const enabled = loader!=='none';
              const issues=[];
              if(!enabled) issues.push('NO_FEEDBACK_LOADER');
              if(enabled&&!main) issues.push('NO_MAIN_CONTAINER');
              if(enabled&&main&&!related) issues.push('NO_RELATED_TARGET_APPEND_TO_MAIN_END');
              if(enabled&&main&&related&&!contains(main,related)) issues.push('RELATED_OUTSIDE_MAIN_APPEND_TO_MAIN_END');
              if(hasDirect&&hasSiteSearch) issues.push('DIRECT_PLUS_AUTO_SAFE_BUT_MIXED');
              if(hardcoded) issues.push('HARDCODED_FEEDBACK_CARD');

              return {path,loader,main:!!main,related:relatedLabel||'-',inside:!!(main&&related&&contains(main,related)),issues};
            }

            const rows=[];
            for(const f of files){
              const blob=await github.rest.git.getBlob({owner,repo,file_sha:f.sha});
              const html=Buffer.from(blob.data.content,'base64').toString('utf8');
              rows.push(analyze(html,f.path));
            }

            console.log(`TOTAL_ARTICLES=${rows.length}`);
            console.log(`FEEDBACK_ENABLED=${rows.filter(r=>r.loader!=='none').length}`);
            console.log(`ISSUE_ARTICLES=${rows.filter(r=>r.issues.length).length}`);
            console.log('\n=== ISSUE ARTICLES ===');
            rows.filter(r=>r.issues.length).forEach(r=>console.log(`${r.path} | loader=${r.loader} | main=${r.main} | related=${r.related} | inside=${r.inside} | issues=${r.issues.join(',')}`));
            console.log('\n=== SUMMARY COUNTS ===');
            const counts={}; for(const r of rows) for(const i of r.issues) counts[i]=(counts[i]||0)+1;
            console.log(JSON.stringify(counts,null,2));
