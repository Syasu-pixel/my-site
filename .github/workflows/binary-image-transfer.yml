name: Binary image transfer

on:
  push:
    paths:
      - .github/binary-transfer-request.json
      - .github/workflows/binary-image-transfer.yml

permissions:
  contents: write

concurrency:
  group: binary-image-transfer-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  transfer:
    if: ${{ !contains(github.event.head_commit.message, '[binary-transfer-complete]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Validate request and fetch binary
        shell: bash
        env:
          REQUEST_PATH: .github/binary-transfer-request.json
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -f "$REQUEST_PATH"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, urllib.parse, urllib.request

          request_path = pathlib.Path(os.environ['REQUEST_PATH'])
          branch = os.environ['TARGET_BRANCH']
          if branch == 'main' or not branch.startswith(('preview-', 'ai-', 'pilot-')):
              raise SystemExit('target branch must be preview-/ai-/pilot- and never main')

          req = json.loads(request_path.read_text(encoding='utf-8'))
          required = ['share_id','file_id','file_name','sha256','size_bytes','target_path']
          missing = [k for k in required if k not in req]
          if missing:
              raise SystemExit(f'missing request fields: {missing}')

          share_id = str(req['share_id'])
          file_id = str(req['file_id'])
          file_name = str(req['file_name'])
          expected_sha = str(req['sha256']).lower()
          expected_size = int(req['size_bytes'])
          target_path = str(req['target_path'])

          if not re.fullmatch(r'[A-Za-z0-9_-]{12}', share_id):
              raise SystemExit('invalid share_id')
          if not re.fullmatch(r'[A-Za-z0-9_-]{32}', file_id):
              raise SystemExit('invalid file_id')
          if not re.fullmatch(r'[0-9a-f]{64}', expected_sha):
              raise SystemExit('invalid sha256')
          if expected_size < 1 or expected_size > 5 * 1024 * 1024:
              raise SystemExit('invalid size')

          posix = pathlib.PurePosixPath(target_path)
          if posix.is_absolute() or '..' in posix.parts or len(posix.parts) < 3 or posix.parts[:2] != ('assets','images'):
              raise SystemExit('target_path must be under assets/images/')
          suffix = posix.suffix.lower()
          if suffix not in {'.webp','.png','.jpg','.jpeg'}:
              raise SystemExit('unsupported target extension')

          meta_url = f'https://api.firestorage.ai/dev/file/shares/{share_id}/files?maxResults=1000'
          meta_req = urllib.request.Request(meta_url, headers={'Accept':'application/json'})
          with urllib.request.urlopen(meta_req, timeout=20) as r:
              meta = json.load(r)
          entry = next((x for x in (meta.get('files') or []) if x.get('fileId') == file_id), None)
          if not entry:
              raise SystemExit('file id not found')
          if entry.get('fileName') != file_name:
              raise SystemExit('filename mismatch')
          if int(entry.get('sizeBytes', -1)) != expected_size:
              raise SystemExit('size metadata mismatch')

          dl_api = f'https://api.firestorage.ai/dev/file/shares/{share_id}/files/{file_id}/download'
          dl_req = urllib.request.Request(dl_api, method='POST', headers={'Accept':'application/json'})
          with urllib.request.urlopen(dl_req, timeout=20) as r:
              dl = json.load(r)
          download_url = dl.get('downloadUrl')
          if not isinstance(download_url, str):
              raise SystemExit('downloadUrl missing')
          parsed = urllib.parse.urlparse(download_url)
          if parsed.scheme != 'https' or parsed.hostname != 's3.ap-northeast-1.wasabisys.com' or parsed.username or parsed.password or parsed.port:
              raise SystemExit('unexpected download URL')

          with urllib.request.urlopen(download_url, timeout=30) as r:
              data = r.read(5 * 1024 * 1024 + 1)
          if len(data) != expected_size:
              raise SystemExit(f'byte size mismatch: {len(data)} != {expected_size}')
          actual_sha = hashlib.sha256(data).hexdigest()
          if actual_sha != expected_sha:
              raise SystemExit(f'sha256 mismatch: {actual_sha}')

          is_webp = len(data) >= 12 and data[:4] == b'RIFF' and data[8:12] == b'WEBP'
          is_png = data.startswith(b'\x89PNG\r\n\x1a\n')
          is_jpeg = data.startswith(b'\xff\xd8\xff')
          if suffix == '.webp' and not is_webp:
              raise SystemExit('WebP signature mismatch')
          if suffix == '.png' and not is_png:
              raise SystemExit('PNG signature mismatch')
          if suffix in {'.jpg','.jpeg'} and not is_jpeg:
              raise SystemExit('JPEG signature mismatch')

          out = pathlib.Path(*posix.parts)
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(data)
          pathlib.Path('/tmp/binary-transfer-target').write_text(target_path, encoding='utf-8')
          print(f'validated {len(data)} bytes sha256={actual_sha} -> {target_path}')
          PY

      - name: Commit verified binary and clear request
        shell: bash
        run: |
          set -euo pipefail
          target_path="$(cat /tmp/binary-transfer-target)"
          git config user.name 'denkicontrol-binary-transfer'
          git config user.email 'actions@users.noreply.github.com'
          git add -- "$target_path"
          git rm -- .github/binary-transfer-request.json
          git commit -m 'chore: transfer verified binary [binary-transfer-complete]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
