name: Career Hero HQ Transfer

on:
  push:
    branches:
      - preview-equipment-maintenance-career-v2
    paths:
      - .github/workflows/career-hero-hq-transfer.yml

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: preview-equipment-maintenance-career-v2
          fetch-depth: 0

      - name: Download approved equipment maintenance images
        shell: bash
        env:
          SHARE_ID: c0yOhaP3R7iB
        run: |
          set -euo pipefail
          API="https://api.firestorage.ai/dev/file"
          mkdir -p /tmp/equipment-assets assets/images/equipment-maintenance-career
          curl --proto '=https' --tlsv1.2 --fail-with-body --silent --show-error \
            "$API/shares/$SHARE_ID/files?maxResults=1000" > /tmp/meta.json

          download_one() {
            file_id="$1"
            file_name="$2"
            expected_sha="$3"
            actual_name="$(jq -r --arg id "$file_id" '.files[] | select(.fileId==$id) | .fileName' /tmp/meta.json)"
            test "$actual_name" = "$file_name"
            curl --proto '=https' --tlsv1.2 --fail-with-body --silent --show-error \
              -X POST "$API/shares/$SHARE_ID/files/$file_id/download" > /tmp/download.json
            url="$(jq -r '.downloadUrl' /tmp/download.json)"
            case "$url" in
              https://s3.ap-northeast-1.wasabisys.com/*) ;;
              *) exit 1 ;;
            esac
            curl --proto '=https' --tlsv1.2 --fail-with-body --silent --show-error \
              "$url" -o "/tmp/equipment-assets/$file_name"
            printf '%s  %s\n' "$expected_sha" "/tmp/equipment-assets/$file_name" | sha256sum -c -
            test "$(head -c 4 "/tmp/equipment-assets/$file_name")" = "RIFF"
            cp "/tmp/equipment-assets/$file_name" "assets/images/equipment-maintenance-career/$file_name"
          }

          download_one 01a0997055b070c9ba40fad9411a60e1 equipment-maintenance-career-hero.webp 2c261b5c8e7a1cd75ab19d84e7f8d9cee3060c4cfb1c17a3b69389fd9df64d1e
          download_one 01a09970c77d74539badd18ca6d08edc equipment-maintenance-career-ogp.webp 9b50ac90635269cab67fbd1e01515a97598d54ae1932f87d25b9d03c4b7c29a5
          download_one 01a099726e8d707a8679a8c00b217977 equipment-maintenance-career-overview.webp d8ec8f9378c395dc57fc627b2e33025f29144271ac75980c5497cb97586ab4dd
          download_one 01a09972962c75a2ad05b640424fa96d equipment-maintenance-career-skills.webp a4b19367ae68aa803266b7a754052aef8c95b684cf7a6c0bed7ba9aa7ef3f671
          download_one 01a09972c194709c9db75e914f0e18ee equipment-maintenance-career-career.webp f3866a116efb3bddf13d5afb5ff77d42f29d3f2fd45f8be271839ff08c852853

      - name: Finalize article
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/temp-finalize-equipment-maintenance.py

      - name: Restore workflow and commit final preview
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "denkicontrol-preview-writer"
          git config user.email "actions@users.noreply.github.com"
          git checkout origin/main -- .github/workflows/career-hero-hq-transfer.yml
          git rm scripts/temp-finalize-equipment-maintenance.py
          git add articles/equipment-maintenance-career.html assets/images/equipment-maintenance-career/ .github/workflows/career-hero-hq-transfer.yml
          git commit -m "Finalize equipment maintenance career article preview"
          git push origin HEAD:preview-equipment-maintenance-career-v2
