name: Cleanup sample direct feedback loads

on:
  push:
    branches:
      - preview-article-feedback-rollout

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-article-feedback-rollout
          fetch-depth: 0
      - name: Remove temporary direct feedback includes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path('articles/air-cylinder-basic.html'),
              Path('articles/tester.html'),
          ]
          marker = '  <script src="../assets/js/article-feedback.js?v=20260916-7" defer></script>\n'
          marker_unindented = '<script src="../assets/js/article-feedback.js?v=20260916-7" defer></script>\n'
          for path in paths:
              text = path.read_text(encoding='utf-8')
              text = text.replace(marker, '').replace(marker_unindented, '')
              if path.name == 'tester.html':
                  text = text.replace('\n<script src="../assets/js/site-search.js" defer></script>\n', '\n  <script src="../assets/js/site-search.js" defer></script>\n')
              path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- articles/air-cylinder-basic.html articles/tester.html
      - name: Commit cleanup
        run: |
          if git diff --quiet -- articles/air-cylinder-basic.html articles/tester.html; then
            echo "No cleanup needed"
            exit 0
          fi
          git config user.name 'Syasu-pixel'
          git config user.email 'syasuta0819@gmail.com'
          git add articles/air-cylinder-basic.html articles/tester.html
          git commit -m 'Cleanup: remove temporary direct feedback includes'
          git push origin HEAD:preview-article-feedback-rollout
