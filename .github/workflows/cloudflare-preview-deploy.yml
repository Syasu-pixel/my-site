name: Cloudflare Preview Deploy
run-name: Cloudflare Preview PR #${{ github.event.pull_request.number }}

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  deploy-preview:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.event.pull_request.head.ref, 'preview-') ||
       startsWith(github.event.pull_request.head.ref, 'pilot-') ||
       startsWith(github.event.pull_request.head.ref, 'ai-editorial/'))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve Preview target
        id: target
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
          PAGES_PROJECT: denkicontrol-preview
        run: |
          ARTICLE_PATH="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -E '^articles/.*\.html$' | head -n 1 || true)"
          BRANCH_ALIAS="$(printf '%s' "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')"
          PREVIEW_ROOT="https://${BRANCH_ALIAS}.${PAGES_PROJECT}.pages.dev"
          PREVIEW_URL="$PREVIEW_ROOT"
          if [ -n "$ARTICLE_PATH" ]; then
            PREVIEW_URL="$PREVIEW_ROOT/$ARTICLE_PATH"
          fi
          echo "article_path=$ARTICLE_PATH" >> "$GITHUB_OUTPUT"
          echo "preview_root=$PREVIEW_ROOT" >> "$GITHUB_OUTPUT"
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "Preview target: $PREVIEW_URL"

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing GitHub Actions secrets CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi

      - name: Deploy PR head to Cloudflare Pages Preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npx --yes wrangler@4 pages deploy . \
            --project-name=denkicontrol-preview \
            --branch="$BRANCH_NAME" \
            --commit-hash="$HEAD_SHA"

      - name: Verify live Preview URL
        env:
          PREVIEW_URL: ${{ steps.target.outputs.preview_url }}
        run: |
          echo "Verifying $PREVIEW_URL"
          for i in $(seq 1 24); do
            body="$(curl -fsSL --max-time 15 "$PREVIEW_URL" 2>/dev/null || true)"
            if [ -n "$body" ] && ! printf '%s' "$body" | grep -q 'まだ何もここにはない'; then
              echo "Live Preview ready: $PREVIEW_URL"
              echo "### Cloudflare Preview" >> "$GITHUB_STEP_SUMMARY"
              echo "$PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Cloudflare Preview did not become live: $PREVIEW_URL"
          exit 1
