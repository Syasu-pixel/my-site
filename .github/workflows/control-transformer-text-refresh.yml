name: Control Transformer Text Refresh

on:
  push:
    branches:
      - preview-control-transformer-text-refresh-20260916

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-control-transformer-text-refresh-20260916
          fetch-depth: 0
      - name: Apply refresh
        run: python .github/scripts/control_transformer_refresh.py
      - name: Commit result
        run: |
          rm -f .github/workflows/control-transformer-text-refresh.yml
          rm -f .github/scripts/control_transformer_refresh.py
          git config user.name denkicontrol-preview-writer
          git config user.email actions@users.noreply.github.com
          git add articles/control-transformer-basic.html docs/existing-article-improvement-backlog.md .github/workflows/control-transformer-text-refresh.yml .github/scripts/control_transformer_refresh.py
          git commit -m "Refresh control transformer article text and related cards"
          git push origin HEAD:preview-control-transformer-text-refresh-20260916
