name: Prepare DC24V production branch
on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/dc24v-common-final-preview.yml
permissions:
  contents: write
jobs:
  prepare:
    if: github.event.pull_request.number == 1824 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ai-editorial/dc24v-common-final-preview'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Stage approved article on a production PR branch
        run: |
          set -euo pipefail
          git fetch origin 51ad2781c2ccfef254a8ed5e1cd1fefba1d064c3
          git restore --source=FETCH_HEAD --worktree -- articles/dc24v-common-basic.html assets/images/dc24v-common-basic/dc24v-common-basic-{hero,ogp,overview,plus-common,field-check}.png
          python3 - <<'PY'
          import hashlib, re, subprocess
          from pathlib import Path
          target='articles/dc24v-common-basic.html'
          sha=hashlib.sha256(Path(target).read_bytes()).hexdigest()
          html=Path(target).read_bytes().decode()
          nav='<nav class="dc-footer-profile-link" aria-label="サイト運営情報"><a href="/profile/">運営者・編集方針</a></nav>'
          if html.count(nav)!=1: raise SystemExit('Expected one approved footer profile link')
          shell_sha=hashlib.sha256(html.replace(nav,'').encode()).hexdigest()
          blob=subprocess.check_output(['git','hash-object',target],text=True).strip()
          for filename, selector, field, value in [
              ('.github/site-shells/manifest.json','output','baselineSha256',shell_sha),
              ('.github/article-components/site-inventory.json','path','gitBlob',blob),
              ('.github/article-components/end/all-preservation-oracle.json','path','sourceSha256',sha),
          ]:
              p=Path(filename)
              original=p.read_bytes().decode()
              pattern=r'("'+selector+r'"\s*:\s*"'+re.escape(target)+r'"(?:(?!\{|\}).)*?"'+field+r'"\s*:\s*")[0-9a-f]+(")'
              updated,count=re.subn(pattern,lambda m:m[1]+value+m[2],original,flags=re.S)
              if count!=1: raise SystemExit(f'{filename}: expected one entry, found {count}')
              p.write_bytes(updated.encode())
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- articles/dc24v-common-basic.html assets/images/dc24v-common-basic/ .github/site-shells/manifest.json .github/article-components/site-inventory.json .github/article-components/end/all-preservation-oracle.json
          git commit -m 'Refresh DC24V common article with approved illustrations'
          git push origin HEAD:refs/heads/publish-dc24v-common-20261109
