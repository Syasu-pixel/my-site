name: DC24V common final publication preview

on:
  pull_request:
    types: [opened, reopened]
    paths:
      - .github/workflows/dc24v-common-final-preview.yml

permissions:
  contents: write

jobs:
  build-and-materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ai-editorial/dc24v-common-final-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Build and verify integrated publication
        env:
          REVIEW_COPY_ASSETS: '0'
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts
          for attempt in $(seq 1 36); do
            git fetch origin preview-dc24v-common-refresh-20261108
            if test "$(git rev-parse FETCH_HEAD:assets/images/dc24v-common-basic/dc24v-common-basic-ogp.png)" = 082da3ce91c5c2efb452f19f8fe8a9cf51c9a78f && test "$(git rev-parse FETCH_HEAD:assets/images/dc24v-common-basic/dc24v-common-basic-overview.png)" = 4ee76f2abdc335416d0ad4cbfac776ac2dca324b && test "$(git rev-parse FETCH_HEAD:assets/images/dc24v-common-basic/dc24v-common-basic-plus-common.png)" = 90c90209266207470896c71364596bf03a603533 && test "$(git rev-parse FETCH_HEAD:assets/images/dc24v-common-basic/dc24v-common-basic-field-check.png)" = c50cd34b062b7eaf0eb057287af8ec9152be708c; then break; fi
            if [ "$attempt" = 36 ]; then exit 1; fi
            sleep 10
          done
          git restore --source=FETCH_HEAD --worktree -- articles/dc24v-common-basic.html assets/images/dc24v-common-basic/
          python3 - <<'PY'
          import hashlib, re, subprocess
          from pathlib import Path
          target='articles/dc24v-common-basic.html'
          sha=hashlib.sha256(Path(target).read_bytes()).hexdigest()
          html=Path(target).read_bytes().decode()
          nav='<nav class="dc-footer-profile-link" aria-label="サイト運営情報"><a href="/profile/">運営者・編集方針</a></nav>'
          if html.count(nav)!=1: raise SystemExit('Expected one approved footer profile link')
          shell_sha=hashlib.sha256(html.replace(nav,'').encode()).hexdigest()
          blob=subprocess.check_output(['git','hash-object',target],text=True).strip()
          for filename, selector, field, value in [
              ('.github/site-shells/manifest.json','output','baselineSha256',shell_sha),
              ('.github/article-components/site-inventory.json','path','gitBlob',blob),
              ('.github/article-components/end/all-preservation-oracle.json','path','sourceSha256',sha),
          ]:
              p=Path(filename)
              original=p.read_bytes().decode()
              pattern=r'("'+selector+r'"\s*:\s*"'+re.escape(target)+r'"(?:(?!\{|\}).)*?"'+field+r'"\s*:\s*")[0-9a-f]+(")'
              updated,count=re.subn(pattern,lambda m:m[1]+value+m[2],original,flags=re.S)
              if count!=1: raise SystemExit(f'{filename}: expected one entry, found {count}')
              p.write_bytes(updated.encode())
          PY
          pnpm check:shells
          python -m pip install lxml==6.1.1
          node scripts/build-integrated-review.mjs /tmp/dc24v-integration
          node scripts/build-additional-shells.mjs /tmp/dc24v-integration/additional-shells
          python scripts/verify-integrated-source.py /tmp/dc24v-integration
          python scripts/audit-integrated-links.py /tmp/dc24v-integration
          python scripts/verify-article-end-preservation.py --oracle .github/article-components/end/all-preservation-oracle.json --candidate /tmp/dc24v-integration/candidate --assets-source . --output /tmp/dc24v-integration/end-independent-checks.json
          python scripts/build-admin-article-catalog.py
          rsync -a ./ _site/ --exclude '_site/' --exclude '.git/' --exclude '.github/' --exclude '/docs/rules/catalog.json' --exclude 'node_modules/' --exclude '.netlify/' --exclude '.wrangler/' --exclude '.cache/' --exclude 'tmp/' --exclude 'temp/' --exclude '*.zip' --exclude '*.tar' --exclude '*.tar.gz' --exclude '*.7z' --exclude '*.psd' --exclude '*.ai'
          node scripts/prepare-integrated-publication.mjs /tmp/dc24v-integration _site
          python scripts/verify-publication-artifact.py snapshot _site /tmp/dc24v-integration
      - name: Optimize the five adopted images in the publication copy
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          root=Path('_site')
          build=Path('/tmp/dc24v-integration')
          names=['hero','ogp','overview','plus-common','field-check']
          directory=Path('assets/images/dc24v-common-basic')
          mapping={}
          for name in names:
              old=directory/f'dc24v-common-basic-{name}.png'
              new=old.with_suffix('.webp')
              src=root/old
              dst=root/new
              if not src.is_file(): raise SystemExit(f'Adopted image missing: {old}')
              subprocess.run(['cwebp','-quiet','-mt','-q','90','-m','4',str(src),'-o',str(dst)],check=True)
              if not dst.is_file() or dst.stat().st_size==0: raise SystemExit(f'WebP optimization failed: {new}')
              mapping[old.as_posix()]=new.as_posix()
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in {'.html','.css','.js','.json','.xml'}:continue
              try: before=path.read_text(encoding='utf-8')
              except UnicodeDecodeError:continue
              after=before
              for old,new in mapping.items():
                  after=after.replace('/'+old,'/'+new).replace(old,new)
              if after!=before:path.write_text(after,encoding='utf-8')
          for old in mapping: (root/old).unlink()
          (build/'published-image-mapping.json').write_text(json.dumps(mapping,indent=2),encoding='utf-8')
          print('Optimized adopted publication images:',len(mapping))
          PY
          python scripts/verify-publication-artifact.py verify _site /tmp/dc24v-integration
          if grep -Eq 'plc-drilling-line-design-project-(01|02|03)\.html' _site/sitemap.xml _site/assets/data/search-index.json; then
            echo 'Paused PLC design article leaked into search/index' >&2
            exit 1
          fi
      - name: Materialize verified publication for this Preview branch only
        run: |
          set -euo pipefail
          target=articles/dc24v-common-basic.html
          cp "_site/$target" "$target"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("articles/dc24v-common-basic.html")
          text=p.read_text(encoding="utf-8")
          old="https://denkicontrol.com/assets/images/dc24v-common-basic/dc24v-common-basic-ogp.webp"
          new="https://ai-editorial-dc24v-common-fi.denkicontrol-preview.pages.dev/assets/images/dc24v-common-basic/dc24v-common-basic-ogp.webp"
          assert text.count(old)==2, text.count(old)
          p.write_text(text.replace(old,new),encoding="utf-8")
          PY
          for p in assets/css/article-toc-v2.css assets/css/article-end-related.css assets/css/article-end-feedback.css assets/css/article-integration-compat.css assets/js/article-toc-v2.js assets/js/article-integration-compat.js; do
            cp "_site/$p" "$p"
          done
          cp _site/assets/images/dc24v-common-basic/*.webp assets/images/dc24v-common-basic/
          grep -q 'class="site-header dc-shell"' "$target"
          grep -q 'dc24v-common-basic-overview.webp' "$target"
          grep -q 'article-integration-compat.js' "$target"
          if grep -Eq 'data-review-only|data-preview-isolation|noindex,nofollow' "$target"; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git reset
          git add "$target" assets/css/article-toc-v2.css assets/css/article-end-related.css assets/css/article-end-feedback.css assets/css/article-integration-compat.css assets/js/article-toc-v2.js assets/js/article-integration-compat.js assets/images/dc24v-common-basic/*.webp
          if ! git diff --cached --quiet; then
            git commit -m 'preview: materialize verified DC24V common publication [skip ci]'
            git push origin HEAD:ai-editorial/dc24v-common-final-preview
          fi

# Preview deployment includes the figure 3 checklist correction.
