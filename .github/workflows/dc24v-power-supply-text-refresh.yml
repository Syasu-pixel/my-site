name: DC24V Power Supply Text Refresh

on:
  push:
    branches:
      - preview-dc24v-power-supply-text-refresh-20260916
    paths:
      - .github/workflows/dc24v-power-supply-text-refresh.yml
      - .github/scripts/dc24v_power_supply_refresh.py

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-dc24v-power-supply-text-refresh-20260916
          fetch-depth: 0
      - name: Apply refresh
        run: python .github/scripts/dc24v_power_supply_refresh.py
      - name: Commit result
        run: |
          rm -f .github/workflows/dc24v-power-supply-text-refresh.yml
          rm -f .github/scripts/dc24v_power_supply_refresh.py
          git config user.name denkicontrol-preview-writer
          git config user.email actions@users.noreply.github.com
          git add articles/dc24v-power-supply-basic.html docs/existing-article-improvement-backlog.md .github/workflows/dc24v-power-supply-text-refresh.yml .github/scripts/dc24v_power_supply_refresh.py
          git commit -m "Refresh DC24V power supply article text and related cards"
          git push origin HEAD:preview-dc24v-power-supply-text-refresh-20260916
