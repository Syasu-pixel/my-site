name: DIN Rail Text Refresh V2
on:
  push:
    branches: [preview-din-rail-text-refresh-20260916]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-din-rail-text-refresh-20260916
          fetch-depth: 0
      - name: Refresh DIN rail article
        run: |
          cat > /tmp/refresh.py <<'PY'
          from pathlib import Path
          import re
          p=Path('articles/din-rail-basic.html')
          b=Path('docs/existing-article-improvement-backlog.md')
          s=p.read_text(encoding='utf-8')
          if '.related-card-thumb{' not in s:
              s,n=re.subn(r'(\.related-card p\{[^}]+\})',r'\1.related-card-thumb{margin:-16px -16px 14px;aspect-ratio:16/9;overflow:hidden;border-radius:19px 19px 12px 12px;background:#eaf1f8;border-bottom:1px solid #d7e4f3}.related-card-thumb img{width:100%;height:100%;object-fit:cover}',s,count=1)
              if n!=1: raise SystemExit('related css not found')
          compat='''
        <section class="section-card" id="compatibility">
          <h2>「DINレール対応」でも寸法と取付条件は確認する</h2>
          <p>制御盤では35mm幅のDINレールが広く使われますが、<strong>すべてのレールと機器が無条件に同じように取り付くわけではありません</strong>。機器側の取付方式、レール形状、板厚、必要な固定部品、周囲のクリアランスなどは製品によって異なります。</p>
          <div class="check-grid">
            <div class="check-item check-item--blue"><h3>機器側の取付仕様</h3><p>対象レール形状や取付方向をメーカー資料で確認します。</p></div>
            <div class="check-item check-item--green"><h3>レールの形状・寸法</h3><p>幅だけでなく断面形状や高さなどの違いがあるため、既設品と同じとは限りません。</p></div>
            <div class="check-item check-item--orange"><h3>固定部品</h3><p>端子台などは横ずれ防止の部品を使うことがあり、必要部品は機器構成に合わせて確認します。</p></div>
            <div class="check-item check-item--red"><h3>放熱・配線スペース</h3><p>取り付けられることと適切な配置であることは別です。必要な離隔や放熱条件は各機器の資料を優先します。</p></div>
          </div>
          <div class="note-box"><h3>「物理的に付く」だけで判断しない</h3><p>交換や増設では、取付仕様、固定部品、配線・放熱スペースまで含めて確認します。</p></div>
        </section>
'''
          if 'id="compatibility"' not in s:
              marker='<section class="section-card" id="field">'
              if marker not in s: marker='<section class="section-card" id="related">'
              if marker not in s: raise SystemExit('insert marker not found')
              s=s.replace(marker,compat+'\n        '+marker,1)
          if '<a href="#compatibility">取付互換性</a>' not in s:
              s=s.replace('<a href="#field">現場で見るポイント</a>','<a href="#compatibility">取付互換性</a>\n        <a href="#field">現場で見るポイント</a>',1)
          related='''<section class="section-card" id="related">
          <h2>関連記事</h2>
          <p>DINレールを理解したら、そこに取り付く機器と、配線を整理する部品を続けて見ると制御盤内の構成がつながります。</p>
          <div class="related-grid">
            <a class="related-card" href="terminal-block-basic.html"><div class="related-card-thumb"><img src="../assets/images/terminal-block-basic/terminal-block-basic-ogp.png" alt="端子台の基本記事" loading="lazy" decoding="async"></div><h3>端子台とは？</h3><p>DINレール上でよく使う代表的な機器として、役割と見方を整理します。</p></a>
            <a class="related-card" href="wiring-duct-basic.html"><div class="related-card-thumb"><img src="../assets/images/wiring-duct-basic/wiring-duct-basic-ogp.png" alt="配線ダクトの基本記事" loading="lazy" decoding="async"></div><h3>配線ダクトとは？</h3><p>DINレールと並んで盤内レイアウトを形づくる、配線整理部品の基本を確認できます。</p></a>
            <a class="related-card" href="plc-io-unit-basic.html"><div class="related-card-thumb"><img src="../assets/images/plc-io-unit-basic/plc-io-unit-basic-ogp.png" alt="PLC I/Oユニットの基本記事" loading="lazy" decoding="async"></div><h3>PLC I/Oユニットとは？</h3><p>DINレールに取り付けられる代表的な制御機器として、入出力とCOMの基本を確認できます。</p></a>
          </div>
        </section>'''
          s,n=re.subn(r'<section class="section-card" id="related">.*?</section>',related,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('related section replacement failed')
          p.write_text(s,encoding='utf-8')
          md=b.read_text(encoding='utf-8')
          old='- [ ] `articles/din-rail-basic.html` — DINレール'
          new='- [ ] `articles/din-rail-basic.html` — DINレール — 作業中（本文見直し / 関連記事画像カード化 / 追加画像は保留）'
          if old in md: md=md.replace(old,new,1)
          elif new not in md: raise SystemExit('backlog row not found')
          note='- 画像生成が利用できない期間は、本文・構成・内部リンク・既存画像を使った関連記事カードを先行改善し、追加画像だけ保留として記録する。\n'
          anchor='- 完了後は必要に応じて Google のインデックス状態確認と、既存 GitHub Actions の IndexNow 通知を確認する。\n'
          if note not in md and anchor in md: md=md.replace(anchor,anchor+note,1)
          md=re.sub(r'次の改善対象は `articles/dc24v-common-basic\.html`。','現在は本文先行で複数記事をPreview中。次の新規着手候補は `articles/alternate-operation-circuit-basic.html`。',md)
          b.write_text(md,encoding='utf-8')
          PY
          python /tmp/refresh.py
          rm -f .github/workflows/din-rail-text-refresh.yml .github/workflows/din-rail-text-refresh-v2.yml
          git config user.name denkicontrol-preview-writer
          git config user.email actions@users.noreply.github.com
          git add articles/din-rail-basic.html docs/existing-article-improvement-backlog.md .github/workflows/din-rail-text-refresh.yml .github/workflows/din-rail-text-refresh-v2.yml
          git commit -m "Refresh DIN rail article text and related cards"
          git push origin HEAD:preview-din-rail-text-refresh-20260916
