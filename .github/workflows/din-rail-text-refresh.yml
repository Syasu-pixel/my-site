name: DIN Rail Text Refresh

on:
  push:
    branches:
      - preview-din-rail-text-refresh-20260916

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-din-rail-text-refresh-20260916
          fetch-depth: 0
      - name: Apply refresh
        run: python .github/scripts/din_rail_refresh.py
      - name: Commit result
        run: |
          rm -f .github/workflows/din-rail-text-refresh.yml
          rm -f .github/workflows/din-rail-text-refresh-v2.yml
          rm -f .github/scripts/din_rail_refresh.py
          git config user.name denkicontrol-preview-writer
          git config user.email actions@users.noreply.github.com
          git add articles/din-rail-basic.html docs/existing-article-improvement-backlog.md .github/workflows/din-rail-text-refresh.yml .github/workflows/din-rail-text-refresh-v2.yml .github/scripts/din_rail_refresh.py
          git commit -m "Refresh DIN rail article text and related cards"
          git push origin HEAD:preview-din-rail-text-refresh-20260916
