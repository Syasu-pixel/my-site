name: Donation changes vs current main
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'index.html'
      - 'en/index.html'
      - 'services/gxworks2-online-support.html'
      - 'contact/index.html'
      - 'en/contact/index.html'
      - 'privacy-policy/index.html'
      - 'en/privacy-policy/index.html'
      - 'categories/career.html'
      - 'categories/air-pneumatic.html'
      - 'categories/circuit-basics.html'
      - 'categories/comparison-guide.html'
      - 'categories/control-basics.html'
      - 'categories/tools-guide.html'
      - 'en/categories/circuit-basics.html'
      - 'en/categories/control-basics.html'
      - 'profile/index.html'
      - '.github/article-components/integration-compat.css'
      - '.github/site-shells/additional/**'
      - 'scripts/build-additional-shells.mjs'
      - 'scripts/check-additional-shell-regeneration.mjs'
      - 'scripts/check-donation-main-diff.mjs'
      - 'scripts/check-reviewed-navigation-delta.mjs'
      - 'tests/donation-main-diff.test.mjs'
      - '.github/workflows/donation-main-diff.yml'
permissions:
  contents: read
jobs:
  strict-generated-diff:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Archive pinned PR base (not the old visual baseline)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          mkdir -p "$RUNNER_TEMP/donation-main-root"
          git archive "$BASE_SHA" | tar -x -C "$RUNNER_TEMP/donation-main-root"
      - name: Build each pinned side with its versioned builder
        run: |
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/donation-main-root/node_modules"
          node "$RUNNER_TEMP/donation-main-root/scripts/build-additional-shells.mjs" "$RUNNER_TEMP/donation-main-generated" "$RUNNER_TEMP/donation-main-root"
          node scripts/build-additional-shells.mjs "$RUNNER_TEMP/donation-pr-generated" .
      - run: node --test tests/donation-main-diff.test.mjs
      - name: Preserve donation visibility and reject unreviewed generated differences
        run: |
          node scripts/check-donation-main-diff.mjs "$RUNNER_TEMP/donation-main-root" "$RUNNER_TEMP/donation-main-generated" . "$RUNNER_TEMP/donation-pr-generated"
      - name: Summary
        if: always()
        run: |
          echo 'This strict differential compares 16 production-style generated additional pages and article/category CSS against this PR base SHA; only pinned reviewed navigation transitions or the historical GX contact transition are allowed. It does not bypass or replace the legacy screenshot check.' >> "$GITHUB_STEP_SUMMARY"
