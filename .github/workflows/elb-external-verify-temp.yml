name: ELB external Preview verification
on:
  push:
    branches:
      - preview-elb-final-20261006

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Verify external Preview in four modes
        env:
          URL: https://preview-elb-final-20261006.denkicontrol-preview.pages.dev/articles/earth-leakage-breaker-basic
        run: |
          mkdir -p proof
          cat > verify.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const url=process.env.URL;
          const modes=[
            ['desktop-light',1440,1000,'light'],
            ['desktop-dark',1440,1000,'dark'],
            ['mobile-light',390,844,'light'],
            ['mobile-dark',390,844,'dark'],
          ];
          const browser=await chromium.launch({headless:true});
          const result={url,modes:{},errors:[]};

          for(const [name,width,height,theme] of modes){
            const context=await browser.newContext({viewport:{width,height}});
            await context.route('**/*', async route => {
              const req=route.request();
              const u=new URL(req.url());
              if(u.hostname.endsWith('denkicontrol-preview.pages.dev') && req.method()==='GET') return route.continue();
              return route.abort();
            });
            const page=await context.newPage();
            const pageErrors=[];
            const badResponses=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('response',r=>{if(r.status()>=400 && new URL(r.url()).hostname.endsWith('denkicontrol-preview.pages.dev')) badResponses.push(r.status()+' '+r.url());});
            const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:90000});
            const errors=[];
            if(!response || !response.ok()) errors.push('HTTP '+(response?.status()??'none'));

            await page.evaluate(async()=>{if(document.fonts?.ready) await document.fonts.ready;});
            await page.waitForTimeout(300);

            const themeButton=page.locator('#dc-theme-toggle');
            const current=await page.evaluate(()=>document.documentElement.dataset.dcTheme||'light');
            if(current!==theme && await themeButton.count()){
              await themeButton.evaluate(el=>el.click());
              await page.waitForTimeout(250);
            }
            const actualTheme=await page.evaluate(()=>document.documentElement.dataset.dcTheme||'light');
            if(actualTheme!==theme) errors.push('theme mismatch '+actualTheme+' != '+theme);

            const header=page.locator('header.site-header').first();
            const headerPos=await header.evaluate(el=>getComputedStyle(el).position);
            const headerRect=await header.boundingBox();
            if(!['fixed','sticky'].includes(headerPos)) errors.push('header position '+headerPos);
            if(!headerRect || Math.abs(headerRect.y)>2) errors.push('header top not fixed');

            const heroBg=await page.locator('.article-hero').evaluate(el=>getComputedStyle(el,'::before').backgroundImage);
            if(!heroBg.includes('earth-leakage-breaker-hero.webp')) errors.push('hero image mismatch');

            const images=page.locator('.article-lightbox-target');
            const bodyCount=await images.count();
            if(bodyCount!==4) errors.push('body image count '+bodyCount);
            const srcs=await images.evaluateAll(xs=>xs.map(x=>x.getAttribute('src')));
            const required=['overview.webp','trip-flow.webp','selection.webp','field-check.webp'];
            for(const suffix of required) if(!srcs.some(x=>x?.endsWith(suffix))) errors.push('missing '+suffix);

            let loaded=true;

            for(let i=0;i<bodyCount;i++){
              const img=images.nth(i);
              await img.scrollIntoViewIfNeeded();
              const handle=await img.elementHandle();
              try{
                await page.waitForFunction(el=>el.complete&&el.naturalWidth>0,handle,{timeout:5000});
              }catch{
                loaded=false;
                errors.push('body image failed to load '+(i+1)+' '+(await img.getAttribute('src')));
              }
              await img.click();
              await page.waitForTimeout(80);
              const overlay=page.locator('.dc-image-lightbox');
              const hidden=await overlay.getAttribute('hidden');
              if(hidden!==null) errors.push('lightbox did not open image '+(i+1));
              await page.keyboard.press('Escape');
              await page.waitForTimeout(60);
              const closed=await overlay.getAttribute('hidden');
              if(closed===null) errors.push('lightbox did not close image '+(i+1));
            }

            const tocButton=page.locator('.dc-toc-button');
            if(await tocButton.count()!==1) errors.push('toc button missing');
            else {
              await tocButton.click();
              await page.waitForTimeout(80);
              const dialog=page.locator('#dc-toc-dialog');
              const open=await dialog.evaluate(el=>el.open);
              if(!open) errors.push('toc did not open');
              const sens=dialog.locator('a[href="#sensitivity"]');
              if(await sens.count()!==1) errors.push('sensitivity TOC missing');
              else {
                await sens.click();
                await page.waitForTimeout(120);
                const hash=await page.evaluate(()=>location.hash);
                if(hash!=='#sensitivity') errors.push('toc jump hash '+hash);
                const heading=page.locator('#sensitivity h2');
                const rect=await heading.boundingBox();
                const hrect=await header.boundingBox();
                if(rect && hrect && rect.y<hrect.height-2) errors.push('toc destination hidden by header');
              }
            }

            const feedback=await page.locator('#articleFeedbackCard').count();
            const votes=await page.locator('[data-feedback-vote]').count();
            if(feedback!==1) errors.push('feedback card count '+feedback);
            if(votes!==2) errors.push('feedback buttons '+votes);

            const related=await page.locator('.article-end-related-card').count();
            if(related!==3) errors.push('related cards '+related);
            const relatedImages=page.locator('.article-end-related-card img');
            for(let i=0;i<await relatedImages.count();i++){
              const img=relatedImages.nth(i);
              await img.scrollIntoViewIfNeeded();
              const handle=await img.elementHandle();
              try{
                await page.waitForFunction(el=>el.complete&&el.naturalWidth>0,handle,{timeout:5000});
              }catch{
                loaded=false;
                errors.push('related image failed to load '+(i+1)+' '+(await img.getAttribute('src')));
              }
            }

            const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);
            if(overflow>1) errors.push('page horizontal overflow '+overflow);

            const table=page.locator('.table-wrap').first();
            let scrollCheck=null;
            if(await table.count()){
              scrollCheck=await table.evaluate(el=>({scrollWidth:el.scrollWidth,clientWidth:el.clientWidth}));
              const hint=table.locator('xpath=preceding-sibling::*[contains(@class,"dc-horizontal-scroll-hint")][1]');
              if(width<=390 && scrollCheck.scrollWidth>scrollCheck.clientWidth+2){
                if(await hint.count()!==1) errors.push('mobile horizontal-scroll hint missing');
                else {
                  const hidden=await hint.getAttribute('hidden');
                  if(hidden!==null) errors.push('mobile horizontal-scroll hint hidden initially');
                  await table.evaluate(el=>el.scrollLeft=60);
                  await page.waitForTimeout(80);
                  const hidden2=await hint.getAttribute('hidden');
                  if(hidden2===null) errors.push('mobile horizontal-scroll hint did not hide after scroll');
                }
              }
            }

            if(pageErrors.length) errors.push(...pageErrors.map(x=>'pageerror '+x));
            if(badResponses.length) errors.push(...badResponses.map(x=>'badresponse '+x));

            await page.evaluate(()=>scrollTo(0,0));
            await page.waitForTimeout(120);
            await page.screenshot({path:'proof/'+name+'-top.png',fullPage:false});
            await page.screenshot({path:'proof/'+name+'-full.png',fullPage:true});
            result.modes[name]={actualTheme,headerPos,heroBg,bodyCount,srcs,loaded,feedback,votes,related,overflow,scrollCheck,errors};
            result.errors.push(...errors.map(e=>name+': '+e));
            await context.close();
          }
          await browser.close();
          result.functionalPass=result.errors.length===0;
          fs.writeFileSync('proof/verification.json',JSON.stringify(result,null,2));
          if(!result.functionalPass) throw new Error(result.errors.join('\n'));
          JS
          node verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earth-leakage-breaker-external-preview-proof
          path: proof/
          if-no-files-found: error
          retention-days: 14
