name: ELB final adopted image replacement
on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  replace:
    if: github.event.pull_request.head.ref == 'preview-earth-leakage-breaker-final2-20261006'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Download adopted final images
        env:
          SHARE_URL: https://firestorage.ai/ja/f/lIEm__nLw7xA
        run: |
          mkdir -p elb-final-images
          cat > elb-final-images/download.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const wanted=[
            ['漏電ブレーカ選定ガイド.png','earth-leakage-breaker-selection.png'],
            ['漏電ブレーカの見方と安全確認.png','earth-leakage-breaker-field-check.png']
          ];
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({acceptDownloads:true});
          await page.goto(process.env.SHARE_URL,{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForTimeout(3000);
          for(const [source,target] of wanted){
            const row=page.locator('li').filter({hasText:source}).first();
            if(await row.count()!==1) throw new Error('row not found: '+source);
            const [download]=await Promise.all([
              page.waitForEvent('download',{timeout:30000}),
              row.getByRole('button',{name:'ダウンロード'}).click()
            ]);
            const dest='elb-final-images/'+target;
            await download.saveAs(dest);
            if(!fs.existsSync(dest)||fs.statSync(dest).size<100000) throw new Error('invalid download: '+target);
          }
          await browser.close();
          JS
          node elb-final-images/download.mjs
          python3 - <<'PY'
          from pathlib import Path
          import struct
          expected={
            'earth-leakage-breaker-selection.png':(1948799,1672,941),
            'earth-leakage-breaker-field-check.png':(2154037,1672,941),
          }
          for name,(size,w,h) in expected.items():
              p=Path('elb-final-images')/name
              data=p.read_bytes()
              assert len(data)==size,(name,len(data),size)
              assert data[:8]==b'\x89PNG\r\n\x1a\n'
              iw,ih=struct.unpack('>II',data[16:24])
              assert (iw,ih)==(w,h),(name,iw,ih)
              print(name,len(data),iw,ih)
          PY
      - name: Atomically replace two adopted images on Preview branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import base64,json,os,urllib.request
          from pathlib import Path
          token=os.environ['GH_TOKEN']; repo=os.environ['REPO']; branch=os.environ['BRANCH']; expected=os.environ['EXPECTED_HEAD']
          files=[
            ('assets/images/earth-leakage-breaker-basic/earth-leakage-breaker-selection.png','elb-final-images/earth-leakage-breaker-selection.png'),
            ('assets/images/earth-leakage-breaker-basic/earth-leakage-breaker-field-check.png','elb-final-images/earth-leakage-breaker-field-check.png'),
          ]
          def api(path,method='GET',payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request('https://api.github.com'+path,data=data,method=method,headers={
                'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json',
                'X-GitHub-Api-Version':'2022-11-28','User-Agent':'elb-final-image-replace'})
              with urllib.request.urlopen(req,timeout=90) as r:
                  body=r.read()
                  return json.loads(body) if body else {}
          ref=api(f'/repos/{repo}/git/ref/heads/{branch}')
          head=ref['object']['sha']
          assert head==expected,f'branch moved: {head} != {expected}'
          commit=api(f'/repos/{repo}/git/commits/{head}')
          base_tree=commit['tree']['sha']
          entries=[]
          for path,local in files:
              content=Path(local).read_bytes()
              blob=api(f'/repos/{repo}/git/blobs','POST',{'content':base64.b64encode(content).decode(),'encoding':'base64'})
              entries.append({'path':path,'mode':'100644','type':'blob','sha':blob['sha']})
          tree=api(f'/repos/{repo}/git/trees','POST',{'base_tree':base_tree,'tree':entries})
          newc=api(f'/repos/{repo}/git/commits','POST',{'message':'Replace final adopted ELB article images 3 and 4','tree':tree['sha'],'parents':[head]})
          api(f'/repos/{repo}/git/refs/heads/{branch}','PATCH',{'sha':newc['sha'],'force':False})
          print(newc['sha'])
          PY
