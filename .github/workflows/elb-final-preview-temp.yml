name: ELB production-equivalent Preview build
on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  build-preview:
    if: github.event.pull_request.head.ref == 'preview-earth-leakage-breaker-final2-20261006'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'

      - name: Build production-equivalent publication
        env:
          REVIEW_COPY_ASSETS: '0'
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm check:shells
          python -m pip install lxml==6.1.1
          BUILD="${RUNNER_TEMP}/integration-build"
          node scripts/build-integrated-review.mjs "$BUILD"
          node scripts/build-additional-shells.mjs "$BUILD/additional-shells"
          python scripts/verify-integrated-source.py "$BUILD"
          python scripts/audit-integrated-links.py "$BUILD"
          python scripts/verify-article-end-preservation.py --oracle .github/article-components/end/all-preservation-oracle.json --candidate "$BUILD/candidate" --assets-source . --output "$BUILD/end-independent-checks.json"
          rsync -a ./ _site/ \
            --exclude '_site/' \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '/docs/rules/catalog.json' \
            --exclude 'node_modules/' \
            --exclude '.netlify/' \
            --exclude '.wrangler/' \
            --exclude '.cache/' \
            --exclude 'tmp/' \
            --exclude 'temp/' \
            --exclude '*.zip' \
            --exclude '*.tar' \
            --exclude '*.tar.gz' \
            --exclude '*.7z' \
            --exclude '*.psd' \
            --exclude '*.ai'
          node scripts/prepare-integrated-publication.mjs "$BUILD" _site
          python scripts/verify-publication-artifact.py snapshot _site "$BUILD"

      - name: Optimize published images to WebP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp
          export IMAGE_COLLISION_SKIP="${RUNNER_TEMP}/integration-build/image-collision-skip.txt"
          find _site/assets/images -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' \) -print0 \
            | xargs -0 -r -P 4 -I{} bash -c '
                src="$1"
                grep -Fxq "$src" "$IMAGE_COLLISION_SKIP" && exit 0
                dst="${src%.*}.webp"
                [ -e "$dst" ] && exit 0
                cwebp -quiet -mt -q 82 -m 4 "$src" -o "$dst"
              ' _ {}
          python3 - <<'PY'
          from pathlib import Path
          import re,json,os
          root=Path('_site'); image_root=root/'assets'/'images'
          build=Path(os.environ['RUNNER_TEMP'])/'integration-build'
          keep=set(json.loads((build/'image-collision-plan.json').read_text())['keepOriginals'])
          mapping={}
          for src in image_root.rglob('*'):
              if not src.is_file() or src.suffix.lower() not in {'.png','.jpg','.jpeg'}:
                  continue
              if src.relative_to(root).as_posix() in keep:
                  continue
              dst=src.with_suffix('.webp')
              if dst.exists() and dst.stat().st_size>0:
                  mapping[src.relative_to(root).as_posix()]=dst.relative_to(root).as_posix()
          (build/'published-image-mapping.json').write_text(json.dumps(mapping),encoding='utf-8')
          exts={'.html','.css','.js','.json','.xml'}
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in exts:
                  continue
              try:
                  text=path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              new=text
              for old,repl in mapping.items():
                  new=new.replace('/'+old,'/'+repl).replace(old,repl)
              if new!=text:
                  path.write_text(new,encoding='utf-8')
          for old in mapping:
              p=root/old
              if p.exists():
                  p.unlink()
          stale=[]
          pat=re.compile(r'assets/images/[^\s"\'<>?#]+\.(?:png|jpe?g)',re.I)
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in exts:
                  continue
              try:
                  text=path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for match in pat.findall(text):
                  if not (root/match.lstrip('/')).exists():
                      stale.append(f'{path}: {match}')
          if stale:
              raise SystemExit('\n'.join(stale[:100]))
          PY
          python scripts/verify-publication-artifact.py verify _site "${RUNNER_TEMP}/integration-build"

      - name: Add Preview manifest
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          p=Path('_site/articles/earth-leakage-breaker-basic.html')
          data=p.read_bytes()
          manifest={
            'kind':'production-equivalent-final-preview',
            'sourceBranch':'preview-earth-leakage-breaker-final2-20261006',
            'sourceCommit':os.environ['SOURCE_SHA'],
            'baseMain':os.environ['BASE_SHA'],
            'target':'articles/earth-leakage-breaker-basic.html',
            'doNotMerge':True,
            'integratedArticleSha256':hashlib.sha256(data).hexdigest(),
            'integratedArticleBytes':len(data)
          }
          Path('_site/elb-preview-manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(manifest,ensure_ascii=False))
          PY

      - name: Push publication to output-only branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          rm -rf /tmp/elb-final-out
          mkdir -p /tmp/elb-final-out
          cp -a _site/. /tmp/elb-final-out/
          cd /tmp/elb-final-out
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Production-equivalent ELB final Preview - DO NOT MERGE"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git push -q --force origin HEAD:preview-elb-final-20261006

      - name: Upload publication proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earth-leakage-breaker-publication-proof
          path: |
            ${{ runner.temp }}/integration-build/publication-checks.json
            ${{ runner.temp }}/integration-build/publication-final-checks.json
            ${{ runner.temp }}/integration-build/published-image-mapping.json
            _site/elb-preview-manifest.json
          if-no-files-found: warn
          retention-days: 14
