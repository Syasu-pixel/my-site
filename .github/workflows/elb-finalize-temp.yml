name: ELB registry finalization
on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'preview-earth-leakage-breaker-final2-20261006'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Update target registry entries via GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HERO_JSON: '[{"sourceSha256":"d36db8e179c825db553aff3c06dee4d0150a99ae30cfcd82d551f452612bc6c9","template":"css/d36db8e179c825db553aff3c06dee4d0150a99ae30cfcd82d551f452612bc6c9.css.njk","urls":[]},{"sourceSha256":"62b6ef7e760f657342758a58cb3f4bd4979fe16d4ea9a6b3c5f6a348a93bb484","template":"css/b3eff4569daa80640b1b7f3f028c79859d806778484375d130b0b4266769f9b2.css.njk","urls":["url(\"../assets/images/earth-leakage-breaker-basic/earth-leakage-breaker-hero.png\")"]},{"sourceSha256":"a13a363391bf37dfc4e3222aca644c0bdbf5b2a94ba235a3c0e3dfa807b94466","template":"css/a13a363391bf37dfc4e3222aca644c0bdbf5b2a94ba235a3c0e3dfa807b94466.css.njk","urls":[]},{"sourceSha256":"aac6a6af2802f01035dcf00425afbe6e3a7c50a2ee4927a3878b0adafad32661","template":"css/aac6a6af2802f01035dcf00425afbe6e3a7c50a2ee4927a3878b0adafad32661.css.njk","urls":[]},{"sourceSha256":"25f88c3543d59a6807fe2838270a9180dd9764143363e49276d21a0c5a42da03","template":"css/25f88c3543d59a6807fe2838270a9180dd9764143363e49276d21a0c5a42da03.css.njk","urls":[]},{"sourceSha256":"21d1a0872fd677347ce6ad6343e01ab43756f4d5fb126dbae5d388cd7f8a4e8e","template":"css/21d1a0872fd677347ce6ad6343e01ab43756f4d5fb126dbae5d388cd7f8a4e8e.css.njk","urls":[]},{"sourceSha256":"fe60eaec0e3d6e92cff5f8af9ebd32c9fb691e0577c65cf16d02a99086c61cc0","template":"css/fe60eaec0e3d6e92cff5f8af9ebd32c9fb691e0577c65cf16d02a99086c61cc0.css.njk","urls":[]},{"sourceSha256":"f712b5cd9ebd6d3e27698cd2489d741fcb59060d8d83a5fc77aba45a2e0f5b9d","template":"css/f712b5cd9ebd6d3e27698cd2489d741fcb59060d8d83a5fc77aba45a2e0f5b9d.css.njk","urls":[]},{"sourceSha256":"a47e309fa8fce4a02d97b38774d287b53d99ac23807ad28a48d4641aede75f5d","template":"css/6725a8d172260b4222b41b5b7cca010833878556c7b38ed423fed45158a47d72.css.njk","urls":["url(\"../assets/images/earth-leakage-breaker-basic/earth-leakage-breaker-hero.png\")"]},{"sourceSha256":"82d7c957a4119d64cb34b1cacbd541faf269ca9cf8800f6020564ad36e802b95","template":"css/82d7c957a4119d64cb34b1cacbd541faf269ca9cf8800f6020564ad36e802b95.css.njk","urls":[]},{"sourceSha256":"a0d10e3737f846524c2fd38b24f3080f5716324ef7fe9d3d326c2e10d8c3a6a2","template":"css/a0d10e3737f846524c2fd38b24f3080f5716324ef7fe9d3d326c2e10d8c3a6a2.css.njk","urls":[]},{"sourceSha256":"ca3163b80a57eab76b1b9d45540b16981c00517d22910d6e249c810d921478a9","template":"css/ca3163b80a57eab76b1b9d45540b16981c00517d22910d6e249c810d921478a9.css.njk","urls":[]},{"sourceSha256":"1cdddbde0ddf6d3f5e553d4e058dd9b1eb5d24134ecaa905300b09bdac4da216","template":"css/1cdddbde0ddf6d3f5e553d4e058dd9b1eb5d24134ecaa905300b09bdac4da216.css.njk","urls":[]},{"sourceSha256":"c89ad411c0fc509d9d300eaff4d809733c41a21733b81d3458e3f831ace686e8","template":"css/8c1cb9bca36cfc57a08230e9c295e6e4b634f756d7ef4da7719865b0d3062eea.css.njk","urls":["url(\"../assets/images/earth-leakage-breaker-basic/earth-leakage-breaker-hero.png\")"]},{"sourceSha256":"07305f32640824912c515fc16ebbc8f2bae460bc3095ccf18a385b3b08f0ffab","template":"css/07305f32640824912c515fc16ebbc8f2bae460bc3095ccf18a385b3b08f0ffab.css.njk","urls":[]},{"sourceSha256":"de73f975ad0066f4e4ec89839f23a81b243539519fdd38e202b252e3ca5a5ae5","template":"css/de73f975ad0066f4e4ec89839f23a81b243539519fdd38e202b252e3ca5a5ae5.css.njk","urls":[]},{"sourceSha256":"28995d6f720ecc7e5dd2737e83b9fb847e07babd02e4a2425ba4f92381617f7f","template":"css/28995d6f720ecc7e5dd2737e83b9fb847e07babd02e4a2425ba4f92381617f7f.css.njk","urls":[]},{"sourceSha256":"e2d74e4ee033b17c6a7b8a6e719da86f1ee17128be931e1735c5e3f8fbf19f14","template":"css/59696b812425ffe9ce26dd6b67dd0b5c7ae72857ee9ec810162c4b183a6da79f.css.njk","urls":["url(\"../assets/images/earth-leakage-breaker-basic/earth-leakage-breaker-hero.png\")"]},{"sourceSha256":"2880e5cdb3c3970079e1e4ad4e77c491636ff15eb5e92cb0f88d867e9ce96848","template":"css/2880e5cdb3c3970079e1e4ad4e77c491636ff15eb5e92cb0f88d867e9ce96848.css.njk","urls":[]}]'
        run: |
          python3 - <<'PY'
          import base64,json,os,urllib.request
          token=os.environ['GH_TOKEN']; repo=os.environ['REPO']; branch=os.environ['BRANCH']; expected=os.environ['EXPECTED_HEAD']
          target='articles/earth-leakage-breaker-basic.html'
          new_baseline='8c118d6ac3c5a297bf1835e26d3074eef4d31199d65bf431cdf3bd276c6e20bb'
          new_gitblob='08057401bebbd73d74ab8ba69b018c8e39234b6f'
          new_hero=json.loads(os.environ['HERO_JSON'])
          paths=[
            '.github/article-components/hero/css-bindings.json',
            '.github/article-components/site-inventory.json',
            '.github/site-shells/manifest.json'
          ]
          def api(path,method='GET',payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request('https://api.github.com'+path,data=data,method=method,headers={
                'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json',
                'X-GitHub-Api-Version':'2022-11-28','User-Agent':'elb-registry-finalizer'})
              with urllib.request.urlopen(req,timeout=60) as r:
                  body=r.read()
                  return json.loads(body) if body else {}
          ref=api(f'/repos/{repo}/git/ref/heads/{branch}')
          head=ref['object']['sha']
          assert head==expected, f'branch moved: {head} != {expected}'
          commit=api(f'/repos/{repo}/git/commits/{head}')
          base_tree=commit['tree']['sha']
          entries=[]
          for path in paths:
              cur=api(f'/repos/{repo}/contents/{path}?ref={branch}')
              raw=base64.b64decode(cur['content']).decode('utf-8')
              obj=json.loads(raw)
              if path.endswith('css-bindings.json'):
                  obj[target]=new_hero
                  out=json.dumps(obj,ensure_ascii=False,indent=2)+'\n'
              elif path.endswith('site-inventory.json'):
                  row=next(x for x in obj['files'] if x['path']==target)
                  row['gitBlob']=new_gitblob
                  out=json.dumps(obj,ensure_ascii=False,indent=2)+'\n'
              else:
                  row=next(x for x in obj['pages'] if x['output']==target)
                  row['baselineSha256']=new_baseline
                  # keep manifest CRLF convention if present
                  out=(json.dumps(obj,ensure_ascii=False,indent=2)+'\n').replace('\n','\r\n') if '\r\n' in raw else json.dumps(obj,ensure_ascii=False,indent=2)+'\n'
              blob=api(f'/repos/{repo}/git/blobs','POST',{'content':base64.b64encode(out.encode()).decode(),'encoding':'base64'})
              entries.append({'path':path,'mode':'100644','type':'blob','sha':blob['sha']})
          tree=api(f'/repos/{repo}/git/trees','POST',{'base_tree':base_tree,'tree':entries})
          newc=api(f'/repos/{repo}/git/commits','POST',{'message':'Update ELB registry baselines','tree':tree['sha'],'parents':[head]})
          api(f'/repos/{repo}/git/refs/heads/{branch}','PATCH',{'sha':newc['sha'],'force':False})
          print(newc['sha'])
          PY
