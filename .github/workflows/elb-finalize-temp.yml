name: ELB registry finalization
on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'preview-earth-leakage-breaker-final-20261006'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Guard registry recursion
        id: guard
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          msg="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/commits/$HEAD_SHA" | python3 -c "import sys,json;print(json.load(sys.stdin)['commit']['message'].splitlines()[0])")"
          echo "head_message=$msg"
          if [ "$msg" = "Update ELB registry baselines" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: '22.16.0'
      - uses: pnpm/action-setup@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          version: 11.19.0
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: '3.12.14'

      - name: Download exact PR head
        if: steps.guard.outputs.skip != 'true'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p work
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/tarball/$HEAD_SHA" -o /tmp/repo.tar.gz
          tar -xzf /tmp/repo.tar.gz -C work --strip-components=1
          cd work
          test "$(git 2>/dev/null rev-parse HEAD || true)" = "" || true

      - name: Install build dependencies
        if: steps.guard.outputs.skip != 'true'
        working-directory: work
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          python -m pip install lxml==6.1.1

      - name: Recalculate target registries
        if: steps.guard.outputs.skip != 'true'
        working-directory: work
        run: |
          TARGET='articles/earth-leakage-breaker-basic.html'
          SCRATCH="${RUNNER_TEMP}/elb-hero-scratch"
          mkdir -p "$SCRATCH"
          rsync -a ./ "$SCRATCH/" --exclude 'node_modules/'
          (
            cd "$SCRATCH"
            python scripts/prepare-article-heroes.py --initialize-css --out "${RUNNER_TEMP}/elb-hero-pages.json"
          )
          python3 - <<'PY'
          import json, os, hashlib
          from pathlib import Path
          target='articles/earth-leakage-breaker-basic.html'
          root=Path('.'); scratch=Path(os.environ['RUNNER_TEMP'])/'elb-hero-scratch'
          cur_path=root/'.github/article-components/hero/css-bindings.json'
          new_path=scratch/'.github/article-components/hero/css-bindings.json'
          cur=json.loads(cur_path.read_text(encoding='utf-8'))
          new=json.loads(new_path.read_text(encoding='utf-8'))
          assert set(cur)==set(new)
          diffs=[k for k in cur if cur[k]!=new[k]]
          assert diffs==[target], f'unexpected hero binding diffs: {diffs}'
          for item in new[target]:
              rel=Path('.github/article-components/hero')/item['template']
              assert (root/rel).exists(), f'new template required: {rel}'
              assert (root/rel).read_bytes()==(scratch/rel).read_bytes(), f'template changed: {rel}'
          cur[target]=new[target]
          cur_path.write_text(json.dumps(cur,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          authored=(root/target).read_bytes()
          baseline=hashlib.sha256(authored).hexdigest()
          gitblob=hashlib.sha1(b'blob '+str(len(authored)).encode()+b'\0'+authored).hexdigest()

          mpath=root/'.github/site-shells/manifest.json'
          with open(mpath,'r',encoding='utf-8',newline='') as fh: raw=fh.read()
          obj=json.loads(raw); page=next(p for p in obj['pages'] if p['output']==target)
          old=page['baselineSha256']; assert raw.count(old)==1
          raw=raw.replace(old,baseline,1)
          with open(mpath,'w',encoding='utf-8',newline='') as fh: fh.write(raw)

          ipath=root/'.github/article-components/site-inventory.json'
          with open(ipath,'r',encoding='utf-8',newline='') as fh: iraw=fh.read()
          inv=json.loads(iraw); row=next(p for p in inv['files'] if p['path']==target)
          oldb=row['gitBlob']; assert iraw.count(oldb)==1
          iraw=iraw.replace(oldb,gitblob,1)
          with open(ipath,'w',encoding='utf-8',newline='') as fh: fh.write(iraw)
          print(json.dumps({'baseline':baseline,'gitBlob':gitblob,'heroBinding':new[target]},ensure_ascii=False))
          PY
          python scripts/prepare-article-heroes.py --out "${RUNNER_TEMP}/elb-hero-check.json"
          pnpm check:shells

      - name: Atomically commit only target registry files
        if: steps.guard.outputs.skip != 'true'
        working-directory: work
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import base64,json,os,urllib.request,urllib.error
          from pathlib import Path
          token=os.environ['GH_TOKEN']; repo=os.environ['REPO']; branch=os.environ['BRANCH']; expected=os.environ['EXPECTED_HEAD']
          files=[
            '.github/article-components/hero/css-bindings.json',
            '.github/article-components/site-inventory.json',
            '.github/site-shells/manifest.json',
          ]
          def api(path,method='GET',payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request('https://api.github.com'+path,data=data,method=method,headers={
                'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json',
                'X-GitHub-Api-Version':'2022-11-28','User-Agent':'elb-registry-finalizer'})
              with urllib.request.urlopen(req,timeout=90) as r:
                  body=r.read()
                  return json.loads(body) if body else {}
          ref=api(f'/repos/{repo}/git/ref/heads/{branch}')
          head=ref['object']['sha']
          assert head==expected, f'branch moved: {head} != {expected}'
          commit=api(f'/repos/{repo}/git/commits/{head}')
          base_tree=commit['tree']['sha']
          entries=[]
          for path in files:
              content=Path(path).read_bytes()
              blob=api(f'/repos/{repo}/git/blobs','POST',{'content':base64.b64encode(content).decode(),'encoding':'base64'})
              entries.append({'path':path,'mode':'100644','type':'blob','sha':blob['sha']})
          tree=api(f'/repos/{repo}/git/trees','POST',{'base_tree':base_tree,'tree':entries})
          newc=api(f'/repos/{repo}/git/commits','POST',{'message':'Update ELB registry baselines','tree':tree['sha'],'parents':[head]})
          api(f'/repos/{repo}/git/refs/heads/{branch}','PATCH',{'sha':newc['sha'],'force':False})
          print(newc['sha'])
          PY
