name: ELB adopted image import
on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  import:
    if: github.event.pull_request.head.ref == 'preview-earth-leakage-breaker-final-20261006'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Download adopted images without modification
        env:
          SHARE_URL: https://firestorage.ai/ja/f/0t5zL9M0txAC
        run: |
          mkdir -p elb-import
          cat > elb-import/download.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const names = [
            'earth-leakage-breaker-hero.png',
            'earth-leakage-breaker-ogp.png',
            'earth-leakage-breaker-overview.png',
            'earth-leakage-breaker-trip-flow.png',
            'earth-leakage-breaker-selection.png',
            'earth-leakage-breaker-field-check.png'
          ];
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({acceptDownloads:true});
          await page.goto(process.env.SHARE_URL,{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForTimeout(3000);
          for (const name of names) {
            const row = page.locator('li').filter({hasText:name}).first();
            if (await row.count() !== 1) throw new Error('row not found: '+name);
            const [download] = await Promise.all([
              page.waitForEvent('download',{timeout:30000}),
              row.getByRole('button',{name:'ダウンロード'}).click()
            ]);
            const target = 'elb-import/'+name;
            await download.saveAs(target);
            if (!fs.existsSync(target) || fs.statSync(target).size < 100000) {
              throw new Error('invalid download: '+name);
            }
          }
          await browser.close();
          JS
          node elb-import/download.mjs
          rm -f package.json package-lock.json
          python3 - <<'PY'
          from pathlib import Path
          import struct
          for p in sorted(Path('elb-import').glob('*.png')):
              data=p.read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', p
              w,h=struct.unpack('>II',data[16:24])
              assert w >= 1600 and h >= 900, (p,w,h)
              print(p.name, len(data), w, h)
          PY
      - name: Put adopted image bytes into Preview branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          cat > elb-import/upload.py <<'PY'
          import base64, json, os, pathlib, urllib.request, urllib.error

          token=os.environ['GH_TOKEN']
          repo=os.environ['REPO']
          branch=os.environ['BRANCH']
          root=pathlib.Path('elb-import')
          names=[
              'earth-leakage-breaker-hero.png',
              'earth-leakage-breaker-ogp.png',
              'earth-leakage-breaker-overview.png',
              'earth-leakage-breaker-trip-flow.png',
              'earth-leakage-breaker-selection.png',
              'earth-leakage-breaker-field-check.png',
          ]
          def req(url, method='GET', payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              r=urllib.request.Request(url,data=data,method=method,headers={
                  'Authorization':f'Bearer {token}',
                  'Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28',
                  'User-Agent':'elb-preview-import'
              })
              try:
                  with urllib.request.urlopen(r,timeout=60) as res:
                      return res.status, json.load(res)
              except urllib.error.HTTPError as e:
                  body=e.read().decode()
                  if e.code==404:
                      return 404, {}
                  raise RuntimeError(f'{e.code} {body}')
          for name in names:
              path=f'assets/images/earth-leakage-breaker-basic/{name}'
              api=f'https://api.github.com/repos/{repo}/contents/{path}?ref={branch}'
              status,current=req(api)
              payload={
                  'message':f'Add adopted ELB image: {name}',
                  'content':base64.b64encode((root/name).read_bytes()).decode(),
                  'branch':branch,
              }
              if status==200:
                  payload['sha']=current['sha']
              put=f'https://api.github.com/repos/{repo}/contents/{path}'
              _,out=req(put,'PUT',payload)
              print(name, out.get('content',{}).get('sha'), out.get('commit',{}).get('sha'))
          PY
          python3 elb-import/upload.py
