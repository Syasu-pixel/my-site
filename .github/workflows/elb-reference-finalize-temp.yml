name: ELB reference registry finalization
on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'preview-earth-leakage-breaker-final2-20261006'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refresh ELB registrations via GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,re,urllib.request
          token=os.environ['GH_TOKEN']; repo=os.environ['REPO']; branch=os.environ['BRANCH']; expected=os.environ['EXPECTED_HEAD']
          target='articles/earth-leakage-breaker-basic.html'

          def api(path,method='GET',payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request('https://api.github.com'+path,data=data,method=method,headers={
                  'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28','User-Agent':'elb-reference-finalizer'})
              with urllib.request.urlopen(req,timeout=60) as r:
                  body=r.read()
                  return json.loads(body) if body else {}

          def get_text(path):
              cur=api(f'/repos/{repo}/contents/{path}?ref={branch}')
              if cur.get('content'):
                  return base64.b64decode(cur['content']).decode('utf-8'),cur['sha']
              blob=api(f"/repos/{repo}/git/blobs/{cur['sha']}")
              return base64.b64decode(blob['content']).decode('utf-8'),cur['sha']

          ref=api(f'/repos/{repo}/git/ref/heads/{branch}')
          head=ref['object']['sha']
          assert head==expected, f'branch moved: {head} != {expected}'
          commit=api(f'/repos/{repo}/git/commits/{head}')
          base_tree=commit['tree']['sha']

          article,_=get_text(target)
          raw_bytes=article.encode('utf-8')
          baseline=hashlib.sha256(raw_bytes).hexdigest()
          gitblob=hashlib.sha1(b'blob '+str(len(raw_bytes)).encode()+b'\0'+raw_bytes).hexdigest()

          toc=[
            {'id':'conclusion','label':'先に結論：漏電ブレーカは「漏れた電気を見て止める役」'},
            {'id':'overview','label':'漏電ブレーカとは？'},
            {'id':'flow','label':'漏電ブレーカの基本の動き'},
            {'id':'sensitivity','label':'漏電ブレーカの種類・定格感度電流・選定のポイント'},
            {'id':'nfb','label':'漏電ブレーカとノーヒューズブレーカの違い'},
            {'id':'attention','label':'現場で見るときの注意点'},
            {'id':'official-sources','label':'メーカー公式資料・技術参照元'},
            {'id':'summary','label':'まとめ：漏電ブレーカは漏電事故から人と設備を守る保護機器'},
          ]

          m=re.search(r'<aside class="side-rail"[^>]*>\s*(<section class="side-card">[\s\S]*?</section>)',article)
          assert m and '記事内メニュー' in m.group(1), 'sidebar menu card not found'
          menu_hash=hashlib.sha256(m.group(1).encode()).hexdigest()

          paths=[
            '.github/article-components/sidebar/all-pages.json',
            '.github/site-shells/manifest.json',
            '.github/article-components/site-inventory.json',
          ]
          entries=[]
          for path in paths:
              raw,_=get_text(path)
              obj=json.loads(raw)
              if path.endswith('all-pages.json'):
                  row=next(x for x in obj['pages'] if x['path']==target)
                  row['tocReference']=toc
                  row['cardsBefore'][0]['sha256']=menu_hash
                  out=json.dumps(obj,ensure_ascii=False,indent=2)+'\n'
              elif path.endswith('manifest.json'):
                  row=next(x for x in obj['pages'] if x['output']==target)
                  row['baselineSha256']=baseline
                  out=json.dumps(obj,ensure_ascii=False,indent=2)+'\n'
                  if '\r\n' in raw: out=out.replace('\n','\r\n')
              else:
                  row=next(x for x in obj['files'] if x['path']==target)
                  row['gitBlob']=gitblob
                  out=json.dumps(obj,ensure_ascii=False,indent=2)+'\n'
              blob=api(f'/repos/{repo}/git/blobs','POST',{'content':base64.b64encode(out.encode()).decode(),'encoding':'base64'})
              entries.append({'path':path,'mode':'100644','type':'blob','sha':blob['sha']})

          tree=api(f'/repos/{repo}/git/trees','POST',{'base_tree':base_tree,'tree':entries})
          newc=api(f'/repos/{repo}/git/commits','POST',{'message':'Refresh ELB registrations after source section','tree':tree['sha'],'parents':[head]})
          api(f'/repos/{repo}/git/refs/heads/{branch}','PATCH',{'sha':newc['sha'],'force':False})
          print(json.dumps({'commit':newc['sha'],'baseline':baseline,'gitBlob':gitblob,'menuSha256':menu_hash,'toc':toc},ensure_ascii=False))
          PY
