name: Emergency Stop Switch Text Refresh

on:
  push:
    branches:
      - preview-emergency-stop-switch-text-refresh-20260916
    paths:
      - .github/workflows/emergency-stop-switch-text-refresh.yml
      - .github/scripts/emergency_stop_switch_refresh.py

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-emergency-stop-switch-text-refresh-20260916
          fetch-depth: 0
      - name: Apply refresh
        run: python .github/scripts/emergency_stop_switch_refresh.py
      - name: Commit result
        run: |
          rm -f .github/workflows/emergency-stop-switch-text-refresh.yml
          rm -f .github/scripts/emergency_stop_switch_refresh.py
          git config user.name denkicontrol-preview-writer
          git config user.email actions@users.noreply.github.com
          git add articles/emergency-stop-switch-basic.html docs/existing-article-improvement-backlog.md .github/workflows/emergency-stop-switch-text-refresh.yml .github/scripts/emergency_stop_switch_refresh.py
          git commit -m "Refresh emergency stop switch article text and related cards"
          git push origin HEAD:preview-emergency-stop-switch-text-refresh-20260916
