name: Encoder Official Sources
on:
  push:
    branches: [preview-encoder-official-sources-20260916]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-encoder-official-sources-20260916
      - name: Apply official source box
        run: python scripts/encoder-official-sources.py
      - name: Clean temporary automation and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/encoder-official-sources.yml scripts/encoder-official-sources.py
          git add articles/encoder-basic.html
          git commit -m "Add official sources to encoder article"
          git push
