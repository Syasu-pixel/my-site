name: Finalize FA Career Service Preview

on:
  push:
    branches:
      - preview-career-service-makersjob-v1
    paths:
      - .github/workflows/fa-career-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: preview-career-service-makersjob-v1
          fetch-depth: 1

      - name: Download approved preview images
        shell: bash
        env:
          SHARE_ID: G7nSdW0TSC4K
        run: |
          set -euo pipefail
          API="https://api.firestorage.ai/dev/file"
          mkdir -p assets/images/fa-engineer-career-service-comparison
          curl --proto '=https' --tlsv1.2 --fail-with-body --silent --show-error \
            "$API/shares/$SHARE_ID/files?maxResults=1000" > /tmp/meta.json

          download_one() {
            local file_id="$1"
            local file_name="$2"
            local expected_sha="$3"
            local target="$4"
            python3 - "$file_id" "$file_name" <<'PY'
import json,sys
fid,name=sys.argv[1:3]
meta=json.load(open('/tmp/meta.json','r',encoding='utf-8'))
files=meta.get('files') or []
hit=next((f for f in files if f.get('fileId')==fid),None)
if not hit: raise SystemExit(f'file id not found: {fid}')
if hit.get('fileName')!=name: raise SystemExit(f'filename mismatch: {hit.get("fileName")} != {name}')
size=hit.get('sizeBytes')
if not isinstance(size,int) or size<1 or size>5*1024*1024: raise SystemExit('file size rejected')
print(f'metadata ok: {name} {size} bytes')
PY
            curl --proto '=https' --tlsv1.2 --fail-with-body --silent --show-error \
              -X POST "$API/shares/$SHARE_ID/files/$file_id/download" > /tmp/download.json
            local url
            url="$(python3 - <<'PY'
import json
u=json.load(open('/tmp/download.json','r',encoding='utf-8')).get('downloadUrl')
if not isinstance(u,str) or not u.startswith('https://'): raise SystemExit('download URL rejected')
print(u)
PY
)"
            curl --proto '=https' --tlsv1.2 --fail-with-body --silent --show-error "$url" -o "$target"
            printf '%s  %s\n' "$expected_sha" "$target" | sha256sum -c -
          }

          download_one 01a0a424f65f73709123a4d69cd7da67 fa-engineer-career-service-comparison-hero.webp a9838b837dfbb0ccb7538bf12c9dba265adeee83407117087ee1256adb2b51c2 assets/images/fa-engineer-career-service-comparison/fa-engineer-career-service-comparison-hero.webp
          download_one 01a0a4251b957193ad8d5c467738b41f fa-engineer-career-service-comparison-ogp.webp a9f905a93232a44acc8e9f09177e677dbda0ace97e0b596569b24d01af384702 assets/images/fa-engineer-career-service-comparison/fa-engineer-career-service-comparison-ogp.webp
          download_one 01a0a42544537286b7b40bf33f2e76f6 fa-engineer-career-service-comparison-select.webp d05c171be2d2dd97c754911e720ef8f066aa970aab57f40b42d1014d890e5625 assets/images/fa-engineer-career-service-comparison/fa-engineer-career-service-comparison-select.webp
          download_one 01a0a425647070e7b6770ea269136588 fa-engineer-career-service-comparison-prepare.webp dea25e01f8d215d514b9fbff0c3d16fe814fb8eae95daec46052d672867964f9 assets/images/fa-engineer-career-service-comparison/fa-engineer-career-service-comparison-prepare.webp

      - name: Finish preview article layout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
from pathlib import Path
p=Path('articles/fa-engineer-career-service-comparison.html')
s=p.read_text(encoding='utf-8')

old='.article-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.97) 0%,rgba(255,255,255,.93) 34%,rgba(255,255,255,.72) 52%,rgba(255,255,255,.22) 75%,rgba(255,255,255,.04) 100%);z-index:1}'
new='.article-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.94) 0%,rgba(255,255,255,.86) 33%,rgba(255,255,255,.54) 52%,rgba(255,255,255,.12) 75%,rgba(255,255,255,.02) 100%);z-index:1}'
if old in s: s=s.replace(old,new,1)

css_marker='.faq-item p{margin:6px 0 0;font-size:13px}'
figure_css='.article-figure{margin:18px 0 0;border:1px solid #dbe7f3;border-radius:18px;overflow:hidden;background:#f8fbff;box-shadow:var(--shadow-soft)}.article-figure img{width:100%;aspect-ratio:16/9;object-fit:cover}.article-figure figcaption{padding:10px 13px;color:#64748b;font-size:12px;line-height:1.7;background:#fff}'
if figure_css not in s:
    if css_marker not in s: raise SystemExit('figure CSS marker missing')
    s=s.replace(css_marker,css_marker+figure_css,1)

mobile_marker='.cta{padding:14px}.support-card-actions'
if '.article-figure{margin-top:14px' not in s:
    if mobile_marker not in s: raise SystemExit('mobile CSS marker missing')
    s=s.replace(mobile_marker,'.cta{padding:14px}.article-figure{margin-top:14px;border-radius:14px}.article-figure figcaption{padding:8px 10px;font-size:11px}.support-card-actions',1)

select_img='../assets/images/fa-engineer-career-service-comparison/fa-engineer-career-service-comparison-select.webp'
if select_img not in s:
    marker='</div><div class="highlight" style="margin-top:16px">特にFA系では、<strong>「何を触ったか」より「どこまで自分で判断・設計・復旧したか」</strong>を整理しておくと、求人との相性を見てもらいやすくなります。</div></section>'
    repl='</div><div class="highlight" style="margin-top:16px">特にFA系では、<strong>「何を触ったか」より「どこまで自分で判断・設計・復旧したか」</strong>を整理しておくと、求人との相性を見てもらいやすくなります。</div><figure class="article-figure"><img src="'+select_img+'" alt="電気・FAエンジニア向け転職サービスを比較するときの考え方を整理したイメージ"><figcaption>転職サービスは、求人数だけでなく、製造業・FAへの理解、経験の伝えやすさ、キャリア支援まで含めて比較します。</figcaption></figure></section>'
    if marker not in s: raise SystemExit('howto section marker missing')
    s=s.replace(marker,repl,1)

prepare_img='../assets/images/fa-engineer-career-service-comparison/fa-engineer-career-service-comparison-prepare.webp'
if prepare_img not in s:
    marker='<div class="caution">「PLCができます」だけでは幅が広すぎます。設備規模や担当工程、どこまで自分で判断していたかまで言えると伝わりやすくなります。</div></section>'
    repl='<div class="caution">「PLCができます」だけでは幅が広すぎます。設備規模や担当工程、どこまで自分で判断していたかまで言えると伝わりやすくなります。</div><figure class="article-figure"><img src="'+prepare_img+'" alt="電気・FAエンジニアが転職前に経験とキャリアを整理するイメージ"><figcaption>面談前は、担当設備・制御経験・担当範囲・働き方・次にやりたいことを整理しておくと、技術経験を伝えやすくなります。</figcaption></figure></section>'
    if marker not in s: raise SystemExit('prepare section marker missing')
    s=s.replace(marker,repl,1)

p.write_text(s,encoding='utf-8')
PY

      - name: Validate finished preview
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/images/fa-engineer-career-service-comparison/fa-engineer-career-service-comparison-hero.webp
          test -s assets/images/fa-engineer-career-service-comparison/fa-engineer-career-service-comparison-ogp.webp
          test -s assets/images/fa-engineer-career-service-comparison/fa-engineer-career-service-comparison-select.webp
          test -s assets/images/fa-engineer-career-service-comparison/fa-engineer-career-service-comparison-prepare.webp
          grep -q 'fa-engineer-career-service-comparison-select.webp' articles/fa-engineer-career-service-comparison.html
          grep -q 'fa-engineer-career-service-comparison-prepare.webp' articles/fa-engineer-career-service-comparison.html
          grep -q 'https://px.a8.net/svt/ejp?a8mat=4BC8N4+EKIWQA+5B0Y+TS3OI' articles/fa-engineer-career-service-comparison.html
          grep -q 'https://www11.a8.net/0.gif?a8mat=4BC8N4+EKIWQA+5B0Y+TS3OI' articles/fa-engineer-career-service-comparison.html
          grep -q 'noindex,nofollow' articles/fa-engineer-career-service-comparison.html
          git diff --check

      - name: Commit final preview and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "denkicontrol-preview-writer"
          git config user.email "actions@users.noreply.github.com"
          git add articles/fa-engineer-career-service-comparison.html assets/images/fa-engineer-career-service-comparison/
          git rm .github/workflows/fa-career-finalize.yml
          git commit -m "Finish career service comparison visual preview"
          git push origin HEAD:preview-career-service-makersjob-v1
