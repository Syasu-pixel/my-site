name: Final integrated area-sensor preview

on:
  push:
    branches:
      - preview-area-sensor-basic-final-integrated-20260925

permissions:
  contents: write

jobs:
  publish-preview:
    if: ${{ !contains(github.event.head_commit.message, '[integrated-preview]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: python -m pip install lxml==6.1.1
      - name: Build integrated publication candidate
        run: |
          pnpm check:shells
          node scripts/build-integrated-review.mjs "${RUNNER_TEMP}/integration-build"
          node scripts/build-additional-shells.mjs "${RUNNER_TEMP}/integration-build/additional-shells"
          python scripts/verify-integrated-source.py "${RUNNER_TEMP}/integration-build"
          python scripts/audit-integrated-links.py "${RUNNER_TEMP}/integration-build"
          python scripts/verify-article-end-preservation.py --oracle .github/article-components/end/all-preservation-oracle.json --candidate "${RUNNER_TEMP}/integration-build/candidate" --assets-source . --output "${RUNNER_TEMP}/integration-build/end-independent-checks.json"
          rsync -a ./ _site/ \
            --exclude '_site/' \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '/docs/rules/catalog.json' \
            --exclude 'node_modules/' \
            --exclude '.netlify/' \
            --exclude '.wrangler/' \
            --exclude '.cache/' \
            --exclude 'tmp/' \
            --exclude 'temp/' \
            --exclude '*.zip' \
            --exclude '*.tar' \
            --exclude '*.tar.gz' \
            --exclude '*.7z' \
            --exclude '*.psd' \
            --exclude '*.ai'
          node scripts/prepare-integrated-publication.mjs "${RUNNER_TEMP}/integration-build" _site
          python scripts/verify-publication-artifact.py snapshot _site "${RUNNER_TEMP}/integration-build"
      - name: Apply production image optimization
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp
          export IMAGE_COLLISION_SKIP="${RUNNER_TEMP}/integration-build/image-collision-skip.txt"
          find _site/assets/images -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' \) -print0 \
            | xargs -0 -r -P 4 -I{} bash -c '
                src="$1"
                grep -Fxq "$src" "$IMAGE_COLLISION_SKIP" && exit 0
                dst="${src%.*}.webp"
                [ -e "$dst" ] && exit 0
                cwebp -quiet -mt -q 82 -m 4 "$src" -o "$dst"
              ' _ {}
          python3 - <<'PY'
          from pathlib import Path
          import json, os
          root=Path('_site'); build=Path(os.environ['RUNNER_TEMP'])/'integration-build'
          keep=set(json.loads((build/'image-collision-plan.json').read_text())['keepOriginals'])
          mapping={}
          for src in (root/'assets/images').rglob('*'):
              if not src.is_file() or src.suffix.lower() not in {'.png','.jpg','.jpeg'}: continue
              if src.relative_to(root).as_posix() in keep: continue
              dst=src.with_suffix('.webp')
              if dst.exists() and dst.stat().st_size:
                  mapping[src.relative_to(root).as_posix()]=dst.relative_to(root).as_posix()
          (build/'published-image-mapping.json').write_text(json.dumps(mapping),encoding='utf-8')
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in {'.html','.css','.js','.json','.xml'}: continue
              try: text=path.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              new=text
              for old,newp in mapping.items():
                  new=new.replace('/'+old,'/'+newp).replace(old,newp)
              if new!=text: path.write_text(new,encoding='utf-8')
          for old in mapping:
              p=root/old
              if p.exists(): p.unlink()
          PY
          python scripts/verify-publication-artifact.py verify _site "${RUNNER_TEMP}/integration-build"
      - name: Materialize only the final reviewed page and its referenced assets
        run: |
          cp _site/articles/area-sensor-basic.html articles/area-sensor-basic.html
          mkdir -p assets/css assets/js assets/images/area-sensor-basic
          cp _site/assets/css/article-toc-v2.css assets/css/article-toc-v2.css
          cp _site/assets/css/article-end-related.css assets/css/article-end-related.css
          cp _site/assets/css/article-end-feedback.css assets/css/article-end-feedback.css
          cp _site/assets/js/article-toc-v2.js assets/js/article-toc-v2.js
          cp _site/assets/js/article-feedback.js assets/js/article-feedback.js
          cp _site/assets/js/site-search.js assets/js/site-search.js
          cp _site/assets/css/article-integration-compat.css assets/css/article-integration-compat.css
          cp _site/assets/js/article-integration-compat.js assets/js/article-integration-compat.js
          mkdir -p assets/images/common assets/images/guide-characters
          cp _site/assets/images/common/site-logo-dcl.webp assets/images/common/
          cp _site/assets/images/common/site-logo-dcl-16.webp assets/images/common/
          cp _site/assets/images/common/site-logo-dcl-32.webp assets/images/common/
          cp _site/assets/images/common/site-logo-dcl-48.webp assets/images/common/
          cp _site/assets/images/common/site-logo-dcl-180.webp assets/images/common/
          cp _site/assets/images/guide-characters/friendly_worker_with_helmet_and_smile.webp assets/images/guide-characters/
          cp _site/assets/images/guide-characters/curious_worker_with_a_cheerful_expression.webp assets/images/guide-characters/
          mkdir -p assets/images/photoelectric-sensor-basic assets/images/light-curtain-basic assets/images/sensor-basic assets/images/plc-io-unit-basic assets/images/npn-pnp-basic assets/images/proximity-sensor-basic
          cp _site/assets/images/photoelectric-sensor-basic/photoelectric-sensor-basic-ogp.webp assets/images/photoelectric-sensor-basic/
          cp _site/assets/images/light-curtain-basic/light-curtain-basic-ogp.webp assets/images/light-curtain-basic/
          cp _site/assets/images/sensor-basic/sensor-basic-ogp.webp assets/images/sensor-basic/
          cp _site/assets/images/plc-io-unit-basic/plc-io-unit-basic-ogp.webp assets/images/plc-io-unit-basic/
          cp _site/assets/images/npn-pnp-basic/npn-pnp-basic-ogp.webp assets/images/npn-pnp-basic/
          cp _site/assets/images/proximity-sensor-basic/proximity-sensor-basic-ogp.webp assets/images/proximity-sensor-basic/
          cp _site/assets/images/area-sensor-basic/area-sensor-basic-hero.webp assets/images/area-sensor-basic/
          cp _site/assets/images/area-sensor-basic/area-sensor-basic-ogp.webp assets/images/area-sensor-basic/
          cp _site/assets/images/area-sensor-basic/area-sensor-basic-01.webp assets/images/area-sensor-basic/
          cp _site/assets/images/area-sensor-basic/area-sensor-basic-02.webp assets/images/area-sensor-basic/
          cp _site/assets/images/area-sensor-basic/area-sensor-basic-03.webp assets/images/area-sensor-basic/
          cp _site/assets/images/area-sensor-basic/area-sensor-basic-04.webp assets/images/area-sensor-basic/
          cp _site/assets/images/area-sensor-basic/area-sensor-basic-05.webp assets/images/area-sensor-basic/
      - name: Commit final integrated Preview surface
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles/area-sensor-basic.html assets
          git commit -m "chore: materialize final integrated Preview [integrated-preview]"
          git push origin HEAD
