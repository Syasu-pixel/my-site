name: Final publication Preview

on:
  push:
    branches:
      - preview-final-area-sensor-publication-20261006
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Build production-equivalent publication
        env:
          REVIEW_COPY_ASSETS: '0'
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts
          python -m pip install lxml==6.1.1
          node scripts/build-integrated-review.mjs "${RUNNER_TEMP}/integration-build"
          node scripts/build-additional-shells.mjs "${RUNNER_TEMP}/integration-build/additional-shells"
          python scripts/verify-integrated-source.py "${RUNNER_TEMP}/integration-build"
          python scripts/audit-integrated-links.py "${RUNNER_TEMP}/integration-build"
          python scripts/verify-article-end-preservation.py --oracle .github/article-components/end/all-preservation-oracle.json --candidate "${RUNNER_TEMP}/integration-build/candidate" --assets-source . --output "${RUNNER_TEMP}/integration-build/end-independent-checks.json"
          rm -rf _final_preview
          mkdir _final_preview
          rsync -a --exclude='_final_preview/' --exclude='_site/' --exclude='.git/' --exclude='.github/' --exclude='/docs/rules/catalog.json' --exclude='node_modules/' --exclude='.netlify/' --exclude='.wrangler/' --exclude='.cache/' --exclude='tmp/' --exclude='temp/' --exclude='*.zip' --exclude='*.tar' --exclude='*.tar.gz' --exclude='*.7z' --exclude='*.psd' --exclude='*.ai' ./ _final_preview/
          node scripts/prepare-integrated-publication.mjs "${RUNNER_TEMP}/integration-build" _final_preview
          python scripts/verify-publication-artifact.py snapshot _final_preview "${RUNNER_TEMP}/integration-build"
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp
          export IMAGE_COLLISION_SKIP="${RUNNER_TEMP}/integration-build/image-collision-skip.txt"
          find _final_preview/assets/images -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' \) -print0 | xargs -0 -r -P 4 -I{} bash -c '
            src="$1"; grep -Fxq "$src" "$IMAGE_COLLISION_SKIP" && exit 0; dst="${src%.*}.webp"; [ -e "$dst" ] && exit 0; cwebp -quiet -mt -q 82 -m 4 "$src" -o "$dst"
          ' _ {}
          python3 - <<'PY'
          from pathlib import Path
          import re, json, os

          root = Path('_final_preview')
          image_root = root / 'assets' / 'images'
          mapping = {}
          build = Path(os.environ['RUNNER_TEMP']) / 'integration-build'
          keep_originals = set(json.loads((build/'image-collision-plan.json').read_text())['keepOriginals'])
          for src in image_root.rglob('*'):
              if not src.is_file() or src.suffix.lower() not in {'.png', '.jpg', '.jpeg'}:
                  continue
              if src.relative_to(root).as_posix() in keep_originals:
                  continue
              dst = src.with_suffix('.webp')
              if dst.exists() and dst.stat().st_size > 0:
                  rel_src = src.relative_to(root).as_posix()
                  rel_dst = dst.relative_to(root).as_posix()
                  mapping[rel_src] = rel_dst
          (build/'published-image-mapping.json').write_text(json.dumps(mapping), encoding='utf-8')

          # Only rewrite files that can affect the published site. Internal Markdown/TXT
          # docs contain example placeholders such as {slug} and must not be treated as
          # live asset references.
          text_exts = {'.html', '.css', '.js', '.json', '.xml'}
          changed = 0
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in text_exts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              new = text
              for old, replacement in mapping.items():
                  new = new.replace('/' + old, '/' + replacement)
                  new = new.replace(old, replacement)
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed += 1

          # Remove originals only from the generated publish copy and only when a
          # valid WebP counterpart exists.
          removed = 0
          for old in mapping:
              src = root / old
              if src.exists():
                  src.unlink()
                  removed += 1

          # Guard against stale references in actual published web files only.
          stale = []
          pattern = re.compile(r'assets/images/[^\s"\'<>?#]+\.(?:png|jpe?g)', re.I)
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in text_exts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for match in pattern.findall(text):
                  candidate = root / match.lstrip('/')
                  if not candidate.exists():
                      stale.append(f'{path}: {match}')

          print(f'Converted images: {len(mapping)}')
          print(f'Updated published files: {changed}')
          print(f'Removed publish-copy originals: {removed}')
          if stale:
              print('Stale image references detected in published files:')
              print('\n'.join(stale[:100]))
              raise SystemExit(1)
          PY

          python scripts/verify-publication-artifact.py verify _final_preview "${RUNNER_TEMP}/integration-build"
      - name: Commit publication Preview artifact
        run: |
          set -euo pipefail
          git config user.name 'denkicontrol-final-preview'
          git config user.email 'actions@users.noreply.github.com'
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name _final_preview -exec rm -rf {} +
          cp -a _final_preview/. .
          rm -rf _final_preview
          touch .nojekyll
          git add -A
          git commit -m 'chore: materialize production-equivalent final preview [skip ci]'
          git push origin HEAD:preview-final-area-sensor-publication-20261006
