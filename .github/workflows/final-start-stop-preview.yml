name: Final integrated start-stop Preview

on:
  push:
    branches:
      - preview-final-start-stop-circuit-basic-20260929

permissions:
  contents: write

concurrency:
  group: final-start-stop-preview-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: ${{ !contains(github.event.head_commit.message, '[final-preview-built]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          python -m pip install lxml==6.1.1

      - name: Verify shared shells and build integrated candidate
        env:
          REVIEW_COPY_ASSETS: '0'
        run: |
          pnpm check:shells
          node scripts/build-integrated-review.mjs "${RUNNER_TEMP}/integration-build"
          node scripts/build-additional-shells.mjs "${RUNNER_TEMP}/integration-build/additional-shells"
          python scripts/verify-integrated-source.py "${RUNNER_TEMP}/integration-build"
          python scripts/audit-integrated-links.py "${RUNNER_TEMP}/integration-build"
          python scripts/verify-article-end-preservation.py --oracle .github/article-components/end/all-preservation-oracle.json --candidate "${RUNNER_TEMP}/integration-build/candidate" --assets-source . --output "${RUNNER_TEMP}/integration-build/end-independent-checks.json"
          node scripts/check-component-regeneration.mjs "${RUNNER_TEMP}/integration-build"
          node scripts/check-integrated-publication.mjs "${RUNNER_TEMP}/integration-build"
          python scripts/test-publication-artifact.py

      - name: Prepare production-equivalent preview site
        run: |
          site="${RUNNER_TEMP}/final-site"
          mkdir -p "$site"
          rsync -a ./ "$site/" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '/docs/rules/catalog.json' \
            --exclude 'node_modules/' \
            --exclude '.netlify/' \
            --exclude '.wrangler/' \
            --exclude '.cache/' \
            --exclude 'tmp/' \
            --exclude 'temp/' \
            --exclude '*.zip' \
            --exclude '*.tar' \
            --exclude '*.tar.gz' \
            --exclude '*.7z' \
            --exclude '*.psd' \
            --exclude '*.ai'

          node scripts/prepare-integrated-publication.mjs "${RUNNER_TEMP}/integration-build" "$site"
          python scripts/verify-publication-artifact.py snapshot "$site" "${RUNNER_TEMP}/integration-build"

      - name: Optimize preview images exactly like production
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp
          site="${RUNNER_TEMP}/final-site"
          export SITE_ROOT="$site"
          export BUILD_ROOT="${RUNNER_TEMP}/integration-build"
          export IMAGE_COLLISION_SKIP="${RUNNER_TEMP}/integration-build/image-collision-skip.txt"

          find "$site/assets/images" -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' \) -print0 \
            | xargs -0 -r -P 4 -I{} bash -c '
                src="$1"
                rel="${src#"$SITE_ROOT"/}"
                grep -Fxq "$rel" "$IMAGE_COLLISION_SKIP" && exit 0
                dst="${src%.*}.webp"
                [ -e "$dst" ] && exit 0
                cwebp -quiet -mt -q 82 -m 4 "$src" -o "$dst"
              ' _ {}

          python3 - <<'PY'
          from pathlib import Path
          import json, os, re

          root = Path(os.environ['SITE_ROOT'])
          build = Path(os.environ['BUILD_ROOT'])
          keep_originals = set(json.loads((build/'image-collision-plan.json').read_text())['keepOriginals'])
          mapping = {}
          image_root = root / 'assets' / 'images'

          for src in image_root.rglob('*'):
              if not src.is_file() or src.suffix.lower() not in {'.png', '.jpg', '.jpeg'}:
                  continue
              rel_src = src.relative_to(root).as_posix()
              if rel_src in keep_originals:
                  continue
              dst = src.with_suffix('.webp')
              if dst.exists() and dst.stat().st_size > 0:
                  mapping[rel_src] = dst.relative_to(root).as_posix()

          (build/'published-image-mapping.json').write_text(json.dumps(mapping), encoding='utf-8')
          text_exts = {'.html', '.css', '.js', '.json', '.xml'}

          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in text_exts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              new = text
              for old, replacement in mapping.items():
                  new = new.replace('/' + old, '/' + replacement)
                  new = new.replace(old, replacement)
              if new != text:
                  path.write_text(new, encoding='utf-8')

          for old in mapping:
              src = root / old
              if src.exists():
                  src.unlink()

          stale = []
          pattern = re.compile(r'assets/images/[^\s"\'<>?#]+\.(?:png|jpe?g)', re.I)
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in text_exts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for match in pattern.findall(text):
                  if not (root / match.lstrip('/')).exists():
                      stale.append(f'{path}: {match}')

          if stale:
              print('\n'.join(stale[:100]))
              raise SystemExit(1)
          PY

          bytes=$(du -sb "$site" | cut -f1)
          limit=$((900 * 1024 * 1024))
          if [ "$bytes" -ge "$limit" ]; then
            echo "ERROR: optimized Preview artifact is >= 900 MiB"
            exit 1
          fi

          python scripts/verify-publication-artifact.py verify "$site" "${RUNNER_TEMP}/integration-build"

      - name: Replace temporary Preview branch with verified publication
        run: |
          site="${RUNNER_TEMP}/final-site"
          git config user.name 'denkicontrol-final-preview'
          git config user.email 'actions@users.noreply.github.com'

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$site"/. .
          git add -A
          git commit -m 'chore: publish integrated final preview [final-preview-built]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
