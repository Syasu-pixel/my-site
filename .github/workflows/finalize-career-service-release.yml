name: Finalize career service release
on:
  push:
    branches:
      - preview-career-service-makersjob-v1
    paths:
      - '.github/workflows/finalize-career-service-release.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-career-service-makersjob-v1
      - name: Prepare production article and clean preview files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('articles/fa-engineer-career-service-comparison.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('  <meta name="robots" content="noindex,nofollow">\n', '')
          s = s.replace('このPreviewでは、提携承認を確認できたサービスだけを掲載しています。', 'このページでは、提携承認を確認できたサービスだけを掲載しています。')
          p.write_text(s, encoding='utf-8')
          for f in [Path('.github/.preview-trigger-1437-final'), Path('preview-refresh-1437.txt'), Path('.github/workflows/finalize-career-service-release.yml')]:
              if f.exists():
                  f.unlink()
          PY
      - name: Commit release cleanup
        shell: bash
        run: |
          git config user.name "denkicontrol-preview-writer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Prepare career service article for production"
          git push origin HEAD:preview-career-service-makersjob-v1
