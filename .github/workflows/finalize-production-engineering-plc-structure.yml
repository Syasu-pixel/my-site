name: Finalize production engineering PLC structure
on:
  push:
    branches: [preview-production-engineering-career]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-production-engineering-career
      - name: Finalize structure
        run: python scripts/finalize_production_engineering_plc_structure.py
      - name: Commit article and cleanup
        run: |
          rm -f scripts/finalize_production_engineering_plc_structure.py
          rm -f .github/workflows/finalize-production-engineering-plc-structure.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles/production-engineering-career.html scripts/finalize_production_engineering_plc_structure.py .github/workflows/finalize-production-engineering-plc-structure.yml
          git commit -m "Align production engineering article to PLC career structure"
          git push origin HEAD:preview-production-engineering-career
