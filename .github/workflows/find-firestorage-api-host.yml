name: Find firestorage API host
on:
  push:
    branches: [preview-career-service-makersjob-v1]
jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - name: Find API host in bundle
        run: |
          python - <<'PY'
          import requests,re
          js=requests.get('https://firestorage.ai/_next/static/chunks/4899-d89df949f2dbd5af.js',timeout=30).text
          print('ABS URLS')
          for x in sorted(set(re.findall(r'https?://[^"\'` )]+',js))): print(x[:500])
          print('HOST-LIKE STRINGS')
          for x in sorted(set(re.findall(r'[A-Za-z0-9.-]+\.(?:ai|com|net|jp)[^"\'` )]*',js))): print(x[:500])
          needle='async function v()'
          i=js.find(needle)
          print('CONTEXT BEFORE v',js[max(0,i-6000):i])
          PY
