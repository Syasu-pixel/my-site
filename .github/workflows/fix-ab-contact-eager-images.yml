name: Fix a-b contact eager images
on:
  push:
    branches: [preview-ab-contact]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-ab-contact
          fetch-depth: 0
      - name: Remove lazy loading
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('articles/a-contact-b-contact-basic.html')
          s=p.read_text(encoding='utf-8')
          p.write_text(s.replace(' loading="lazy"',''),encoding='utf-8')
          PY
      - name: Commit fix and remove temp workflow
        run: |
          rm -f .github/workflows/fix-ab-contact-eager-images.yml
          git config user.name "denkicontrol-preview-writer"
          git config user.email "actions@users.noreply.github.com"
          git add articles/a-contact-b-contact-basic.html .github/workflows/fix-ab-contact-eager-images.yml
          git commit -m "Ensure a-contact b-contact article images load eagerly"
          git push origin HEAD:preview-ab-contact
