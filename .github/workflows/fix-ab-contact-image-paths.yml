name: Fix a-b contact image paths

on:
  push:
    branches:
      - preview-ab-contact
    paths:
      - .github/workflows/fix-ab-contact-image-paths.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: preview-ab-contact
          fetch-depth: 1

      - name: Replace stale image references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('articles/a-contact-b-contact-basic.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              '../assets/images/a-contact-b-contact-basic/a-contact-b-contact-basic-contact-compare.webp': '../assets/images/a-contact-b-contact-basic/a-contact-b-contact-basic-a-b-contact-difference.webp',
              '../assets/images/a-contact-b-contact-basic/a-contact-b-contact-basic-signal-flow.webp': '../assets/images/a-contact-b-contact-basic/a-contact-b-contact-basic-pushbutton-relay-plc-basic-flow.webp',
              '../assets/images/a-contact-b-contact-basic/a-contact-b-contact-basic-hard-vs-plc.webp': '../assets/images/a-contact-b-contact-basic/a-contact-b-contact-basic-physical-vs-plc.webp',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'expected image reference not found: {old}')
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "denkicontrol-preview-writer"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/fix-ab-contact-image-paths.yml
          git add articles/a-contact-b-contact-basic.html .github/workflows/fix-ab-contact-image-paths.yml
          git commit -m "Fix a-contact b-contact article image references"
          git push origin HEAD:preview-ab-contact
