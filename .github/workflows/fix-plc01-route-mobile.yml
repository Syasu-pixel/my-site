name: Fix PLC01 route mobile layout

on:
  push:
    branches:
      - preview-plc-project-01-to-02-route
    paths:
      - .github/workflows/fix-plc01-route-mobile.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Fix mobile layout via GitHub API
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'articles/plc-drilling-line-design-project-01.html';
            const branch = 'preview-plc-project-01-to-02-route';
            const { data } = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
            if (Array.isArray(data) || !data.content) throw new Error('article file not found');
            let text = Buffer.from(data.content, 'base64').toString('utf8');
            const anchor = '@media(max-width:768px){';
            if (!text.includes(anchor)) throw new Error('mobile media anchor missing');
            const mobileCss = '.next-series-link{grid-template-columns:1fr}.next-series-link img{min-height:0;aspect-ratio:16/9}.next-series-copy{padding:18px}';
            if (!text.includes(mobileCss)) {
              text = text.replace(anchor, anchor + mobileCss);
            }
            if (!text.includes(mobileCss)) throw new Error('mobile css not inserted');
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch,
              message: '第1回から第2回導線のスマホ表示を1カラム化',
              content: Buffer.from(text, 'utf8').toString('base64'),
              sha: data.sha
            });
