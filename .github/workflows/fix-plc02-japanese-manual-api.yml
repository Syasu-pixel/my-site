name: Fix PLC02 Japanese manual link via API

on:
  push:
    branches:
      - preview-plc-drilling-project-02-outline
    paths:
      - .github/workflows/fix-plc02-japanese-manual-api.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Update article via GitHub API
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'articles/plc-drilling-line-design-project-02.html';
            const branch = 'preview-plc-drilling-project-02-outline';
            const { data } = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
            if (Array.isArray(data) || !data.content) throw new Error('article file not found');
            let text = Buffer.from(data.content, 'base64').toString('utf8');
            const old = `<div class="source-box"><h3>メーカー公式資料で確認</h3><p>三菱電機「FX3U SERIES USER'S MANUAL - Hardware Edition」の入出力番号割付では、X/Yが8進数で割り付けられることが示されています。<a href="https://dl.mitsubishielectric.com/dl/fa/document/manual/plc_fx/jy997d16501/jy997d16501y.pdf" target="_blank" rel="noopener noreferrer">三菱電機公式マニュアルを見る</a></p></div>`;
            const next = `<div class="source-box"><h3>メーカー公式資料で確認</h3><p>三菱電機「FX3Uシリーズ ユーザーズマニュアル［ハードウェア編］」（Ver.AA / JY997D16101-AA / 2024年6月）の入出力番号割付では、X/Yが8進数で割り付けられることが示されています。<a href="https://www.mitsubishielectric.co.jp/fa/download/search.page?category1=0&category2=0&category3=0&filter_bundled=&filter_discontinued=&filter_readme=1&kisyu=%2Fplc_fx&kisyuid=&lang=1&listView=1&mode=manual&preview=&q=fx3u&sort=0" target="_blank" rel="noopener noreferrer">三菱電機公式・日本語マニュアルを見る</a></p></div>`;
            const count = text.split(old).length - 1;
            if (count === 0 && text.includes('JY997D16101-AA') && text.includes('lang=1')) {
              core.info('already updated');
              return;
            }
            if (count !== 1) throw new Error(`target count=${count}`);
            text = text.replace(old, next);
            if (!text.includes('JY997D16101-AA') || text.includes('jy997d16501y.pdf')) throw new Error('validation failed');
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch,
              message: 'FX3U公式マニュアルを日本語版へ変更',
              content: Buffer.from(text, 'utf8').toString('base64'),
              sha: data.sha
            });
