name: Fix PLC02 Japanese manual link

on:
  push:
    branches:
      - preview-plc-drilling-project-02-outline
    paths:
      - .github/workflows/fix-plc02-japanese-manual.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-plc-drilling-project-02-outline
      - name: Replace English manual with Japanese official manual
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('articles/plc-drilling-line-design-project-02.html')
          s = p.read_text(encoding='utf-8')
          old = '''<div class="source-box"><h3>メーカー公式資料で確認</h3><p>三菱電機「FX3U SERIES USER'S MANUAL - Hardware Edition」の入出力番号割付では、X/Yが8進数で割り付けられることが示されています。<a href="https://dl.mitsubishielectric.com/dl/fa/document/manual/plc_fx/jy997d16501/jy997d16501y.pdf" target="_blank" rel="noopener noreferrer">三菱電機公式マニュアルを見る</a></p></div>'''
          new = '''<div class="source-box"><h3>メーカー公式資料で確認</h3><p>三菱電機「FX3Uシリーズ ユーザーズマニュアル［ハードウェア編］」（Ver.AA / JY997D16101-AA / 2024年6月）の入出力番号割付では、X/Yが8進数で割り付けられることが示されています。<a href="https://www.mitsubishielectric.co.jp/fa/download/search.page?category1=0&category2=0&category3=0&filter_bundled=&filter_discontinued=&filter_readme=1&kisyu=%2Fplc_fx&kisyuid=&lang=1&listView=1&mode=manual&preview=&q=fx3u&sort=0" target="_blank" rel="noopener noreferrer">三菱電機公式・日本語マニュアルを見る</a></p></div>'''
          if s.count(old) != 1:
              raise SystemExit('target manual block mismatch')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate Japanese manual
        run: |
          grep -q 'FX3Uシリーズ ユーザーズマニュアル［ハードウェア編］' articles/plc-drilling-line-design-project-02.html
          grep -q 'JY997D16101-AA' articles/plc-drilling-line-design-project-02.html
          grep -q 'lang=1' articles/plc-drilling-line-design-project-02.html
          ! grep -q 'jy997d16501y.pdf' articles/plc-drilling-line-design-project-02.html
      - name: Commit article update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add articles/plc-drilling-line-design-project-02.html
          git diff --cached --quiet && exit 0
          git commit -m 'FX3U公式マニュアルを日本語版へ変更'
          git push origin HEAD:preview-plc-drilling-project-02-outline
