name: Fix PLC03 review items
on:
  push:
    paths:
      - '.github/workflows/fix-plc03-review.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Apply focused fixes via GitHub API
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'articles/plc-drilling-line-design-project-03.html';
            const branch = context.ref.replace('refs/heads/', '');
            const { data } = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
            let text = Buffer.from(data.content, 'base64').toString('utf8');
            const before = text;
            text = text.replace('<link rel="apple-touch-icon" sizes="180x180" href="../assets/images/common/site-logo-dcl-180.png">\n  <style>', '<link rel="apple-touch-icon" sizes="180x180" href="../assets/images/common/site-logo-dcl-180.png">\n  <link rel="stylesheet" href="../assets/css/gxworks2-service-entry.css">\n  <style>');
            text = text.replace('<li>X0〜X7：存在・通過センサ</li>', '<li>X0〜X6：今回使う存在・通過センサ</li>');
            if (text === before) throw new Error('Expected replacements were not found');
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch,
              message: 'fix: address PLC03 preview review items',
              content: Buffer.from(text, 'utf8').toString('base64'),
              sha: data.sha,
            });