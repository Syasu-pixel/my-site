name: Fix selector switch PR1410

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-selector-switch-pr1410.yml'
      - '.github/scripts/fix-selector-switch-pr1410.py'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tool script
        uses: actions/checkout@v4
        with:
          ref: main
          path: tools
          fetch-depth: 1

      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: preview-selector-switch-audit-20260910
          path: site
          fetch-depth: 0

      - name: Apply fixes
        run: python3 tools/.github/scripts/fix-selector-switch-pr1410.py site

      - name: Verify and push
        run: |
          test -f site/assets/images/selector-switch-basic/selector-switch-overview.png
          test -f site/assets/images/selector-switch-basic/manual-auto-selector-flow.png
          test -f site/assets/images/selector-switch-basic/two-position-vs-three-position-selector.png
          test -f site/assets/images/push-button-switch-basic/push-button-switch-overview.png
          test -f site/assets/images/plc-io-unit-basic/plc-io-unit-basic-hero.png
          test -f site/assets/images/relay-basic/relay-overview.png
          git -C site diff --check
          git -C site config user.name 'denkicontrol-bot'
          git -C site config user.email 'actions@users.noreply.github.com'
          git -C site rm -f .github/workflows/apply-selector-switch-audit-20260910.yml || true
          git -C site add articles/selector-switch-basic.html
          git -C site commit -m 'Refine selector switch article accuracy and sources'
          git -C site push origin HEAD:preview-selector-switch-audit-20260910
