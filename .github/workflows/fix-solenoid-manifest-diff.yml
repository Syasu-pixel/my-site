name: Fix solenoid manifest diff

on:
  push:
    branches:
      - preview-publish-solenoid-valve-20260929
    paths:
      - '.github/workflows/fix-solenoid-manifest-diff.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore main manifest and patch target hash only
        run: |
          set -euo pipefail
          git fetch origin main preview-solenoid-valve-troubleshooting-refresh-20260929
          git checkout origin/main -- .github/site-shells/manifest.json
          rm -f .github/workflows/fix-solenoid-manifest-diff.yml

          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path

          path=Path('.github/site-shells/manifest.json')
          target=b'articles/solenoid-valve-troubleshooting-basic.html'
          data=path.read_bytes()
          source=subprocess.check_output(['git','show','origin/preview-solenoid-valve-troubleshooting-refresh-20260929:.github/site-shells/manifest.json'])

          def get_object(blob):
              pos=blob.find(b'"output": "'+target+b'"')
              if pos < 0: raise SystemExit('target output not found')
              start=blob.rfind(b'{',0,pos)
              # Find the closing brace of this page record.
              m=re.search(br'\r?\n\s*\}',blob[pos:])
              if start < 0 or not m: raise SystemExit('target object bounds missing')
              end=pos+m.end()
              return blob[start:end]

          src_obj=get_object(source)
          m=re.search(br'"baselineSha256"\s*:\s*"([0-9a-f]{64})"',src_obj)
          if not m: raise SystemExit('source hash missing')
          wanted=m.group(1)

          obj=get_object(data)
          new_obj,n=re.subn(
              br'("baselineSha256"\s*:\s*")[0-9a-f]{64}(")',
              lambda x:x.group(1)+wanted+x.group(2),
              obj,
              count=1
          )
          if n!=1: raise SystemExit('target hash replacement failed')
          if obj not in data: raise SystemExit('target object not unique')
          path.write_bytes(data.replace(obj,new_obj,1))
          print('baselineSha256',wanted.decode())
          PY

      - name: Commit target-only manifest update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Keep solenoid shell manifest diff target-only'
          git push
