name: Fix solenoid oracle count

on:
  push:
    branches:
      - preview-publish-solenoid-valve-20260929
    paths:
      - '.github/workflows/fix-solenoid-oracle-count.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recalculate total article-card count from latest main delta
        run: |
          set -euo pipefail
          git fetch origin main
          rm -f .github/workflows/fix-solenoid-oracle-count.yml

          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path

          path=Path('.github/article-components/end/all-preservation-oracle.json')
          target='articles/solenoid-valve-troubleshooting-basic.html'

          current=json.loads(path.read_text(encoding='utf-8'))
          main=json.loads(subprocess.check_output(['git','show','origin/main:'+str(path)]).decode('utf-8'))

          def find_page(obj):
              if isinstance(obj,dict):
                  if obj.get('path')==target:
                      return obj
                  for v in obj.values():
                      r=find_page(v)
                      if r is not None:return r
              elif isinstance(obj,list):
                  for v in obj:
                      r=find_page(v)
                      if r is not None:return r
              return None

          cur_page=find_page(current)
          main_page=find_page(main)
          if cur_page is None or main_page is None:
              raise SystemExit('target oracle page missing')

          cur_cards=len(cur_page.get('cards',[]))
          main_cards=len(main_page.get('cards',[]))
          main_total=int(main['expectedCounts']['articleCards'])
          new_total=main_total+(cur_cards-main_cards)

          current['expectedCounts']['articleCards']=new_total
          path.write_text(json.dumps(current,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          print({
              'main_total':main_total,
              'main_target_cards':main_cards,
              'current_target_cards':cur_cards,
              'new_total':new_total,
          })
          PY

      - name: Commit corrected oracle count
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Update solenoid related-card total in preservation oracle'
          git push
