name: GPT finalize terminal block jumper article

on:
  push:
    branches:
      - preview-terminal-block-jumper-audit-20260911

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-terminal-block-jumper-audit-20260911
          fetch-depth: 0
      - name: Apply final article edits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('articles/terminal-block-jumper-basic.html')
          text = path.read_text(encoding='utf-8')

          # Restore the site's standard blue-marker class for this older article.
          if '.marker-blue{' not in text:
              needle = '''    .mark{\n      background:linear-gradient(transparent 58%, rgba(250,204,21,.45) 58%);\n      font-weight:900;\n    }\n'''
              replacement = needle + '''    .marker-blue{\n      background:linear-gradient(transparent 58%,rgba(147,197,253,.55) 58%);\n      font-weight:900;\n    }\n'''
              if needle not in text:
                  raise SystemExit('marker insertion point not found')
              text = text.replace(needle, replacement, 1)

          # Light emphasis in the introductory section.
          text = text.replace(
              '''            端子台の渡り線とは、隣の端子同士や複数の端子を電気的につなぐための線です。\n            たとえば、DC24Vを複数のセンサーへ分けたいとき、0Vを複数の回路で共通にしたいときなどに使います。''',
              '''            <span class="term">渡り線</span>とは、端子間を電気的につなぐための短い電線です。\n            たとえば、<span class="marker-blue">DC24Vを複数のセンサーへ分けたいとき</span>や、0Vを複数の回路で共通にしたいときなどに使います。''',
              1,
          )
          text = text.replace(
              '''              渡り線・ジャンパーは、端子台で同じ電位を複数端子へ共通化・分岐する方法の一つです。用途や接続範囲は、端子台と回路の仕様に合わせて確認します。''',
              '''              <span class="marker-blue">渡り線・ジャンパーは、同じ電位を複数端子へ共通化・分岐する方法の一つ</span>です。<strong>用途や接続範囲は、端子台と回路の仕様に合わせて確認</strong>します。''',
              1,
          )

          start = text.index('        <section class="section-card" id="comparison">')
          end = text.index('        <section class="section-card" id="flow">', start)
          section = text[start:end]

          old_figure = '''          <figure class="article-figure">\n            <img src="../assets/images/terminal-block-jumper-basic/terminal-block-jumper-basic-comparison.png" alt="短い電線で渡す渡り線と、専用金属バーで渡すジャンパーバーの違いを比較した図">\n            <figcaption>\n              渡り線は短い電線で端子同士をつなぐ方法です。ジャンパーバーは端子台専用部品で、複数端子をまとめて接続しやすい方法です。\n            </figcaption>\n          </figure>'''
          new_figure = '''          <figure class="article-figure">\n            <img src="../assets/images/terminal-block-jumper-basic/terminal-block-jumper-common-bar-comparison.webp" alt="Y端子タイプの絶縁被覆付きコモンバーと、端子台専用ジャンパーの違いを比較した図">\n            <figcaption>\n              現場で見かけるY端子タイプのコモンバーと、端子台シリーズ専用ジャンパーの違いをイメージで整理しています。\n            </figcaption>\n          </figure>'''
          if old_figure not in section:
              raise SystemExit('old comparison figure not found')
          section = section.replace(old_figure, new_figure, 1)

          old_paras = '''          <p>\n            渡り線は、短い電線を使って隣の端子へ電気を渡す方法です。\n            現場で柔軟に作りやすい一方、線が増えると端子周りが混みやすくなります。\n          </p>\n          <p>\n            現場では、一般的なねじ式端子台に、端子へかませる部分がY端子・フォーク端子に似た形の絶縁被覆付きコモンバーを共締めし、DC24V、0V、COMなどを複数端子へ共通化している盤もあります。黒・緑・オレンジなどの被覆色を見かけるタイプです。\n          </p>\n          <p>\n            一方で、Phoenix Contactなどの端子台では、そのシリーズ専用のプラグインブリッジやジャンパーを使う構成もあります。対応する端子台シリーズ、ピッチ、極数、取り付け位置などが決まっているため、メーカーの適合情報を確認して選びます。許容電流もジャンパー単体の代表値だけで判断せず、組み合わせる端子台側の仕様を確認します。\n          </p>'''
          new_paras = '''          <p>\n            <span class="term">渡り線</span>は、<span class="marker-blue">端子間を短い電線で電気的につなぐ方法</span>です。\n            現場で柔軟に作りやすい一方、線が増えると端子周りが混みやすくなります。\n          </p>\n          <p>\n            現場では、一般的なねじ式端子台に、<span class="term">Y端子タイプのコモンバー</span>を共締めして、<span class="marker-blue">DC24V・0V・COMなどの同電位を複数端子へ共通化</span>している盤もあります。端子へかませる部分がY端子・フォーク端子に似た形で、製品によって黒・緑・オレンジなどの絶縁被覆色があります。<strong>色だけで用途や電位を判断せず、図面・線番・仕様で確認</strong>します。\n          </p>\n          <p>\n            一方、端子台によっては<span class="term">シリーズ専用ジャンパー（プラグインブリッジ）</span>を使う構成があります。<strong>対応する端子台シリーズ・ピッチ・極数・取り付け位置</strong>などの適合情報を確認して選びます。許容電流もジャンパー単体の代表値だけで判断せず、<span class="marker-blue">端子台とアクセサリの組み合わせ仕様</span>を確認します。\n          </p>'''
          if old_paras not in section:
              raise SystemExit('comparison paragraphs not found')
          section = section.replace(old_paras, new_paras, 1)

          # Make the comparison table match the three methods explained above.
          table_pattern = re.compile(r'''          <div class="table-wrap">\n            <table>.*?          </div>\n\n          <div class="danger-box">''', re.S)
          new_table = '''          <div class="table-wrap">\n            <table>\n              <thead>\n                <tr>\n                  <th>項目</th>\n                  <th>渡り線</th>\n                  <th>Y端子タイプのコモンバー</th>\n                  <th>端子台専用ジャンパー</th>\n                </tr>\n              </thead>\n              <tbody>\n                <tr>\n                  <td>形</td>\n                  <td class="cell-blue">短い電線で端子間を接続</td>\n                  <td class="cell-green">絶縁被覆付きバーを端子ねじ部へ取り付けるタイプ</td>\n                  <td class="cell-orange">端子台シリーズ専用のブリッジ部品</td>\n                </tr>\n                <tr>\n                  <td>向いている場面</td>\n                  <td>行き先や長さを柔軟に変えたいとき</td>\n                  <td>ねじ式端子台で同電位を複数極へまとめたいとき</td>\n                  <td>専用アクセサリ対応端子台で共通化したいとき</td>\n                </tr>\n                <tr>\n                  <td>確認ポイント</td>\n                  <td>複数導体接続の可否、導体サイズ、締付、線番</td>\n                  <td>ねじサイズ、極数、定格電流、端子台側の使用可否</td>\n                  <td>シリーズ、ピッチ、極数、取り付け位置、組み合わせ定格</td>\n                </tr>\n                <tr>\n                  <td>注意点</td>\n                  <td>線が増えると端子周りが混みやすい</td>\n                  <td>被覆色だけで電位を判断しない</td>\n                  <td class="cell-red">不要な端子まで共通化しない</td>\n                </tr>\n              </tbody>\n            </table>\n          </div>\n\n          <div class="danger-box">'''
          section, n = table_pattern.subn(new_table, section, count=1)
          if n != 1:
              raise SystemExit(f'comparison table replacement count={n}')

          text = text[:start] + section + text[end:]

          # Add light emphasis to the manufacturer-spec section.
          text = text.replace(
              '''            専用ジャンパーは、端子台シリーズやピッチ、極数などの適合条件を確認して使います。\n            また、ジャンパーの電流値は組み合わせる端子台によって変わる場合があるため、ジャンパー単体の代表値だけで決めず、端子台側のアクセサリ仕様まで確認します。''',
              '''            専用ジャンパーは、<strong>端子台シリーズ・ピッチ・極数などの適合条件</strong>を確認して使います。\n            また、ジャンパーの電流値は組み合わせる端子台によって変わる場合があるため、<span class="marker-blue">ジャンパー単体の代表値だけで決めず、端子台側のアクセサリ仕様まで確認</span>します。''',
              1,
          )

          # Guard rails.
          if 'terminal-block-jumper-basic-comparison.png' in text:
              raise SystemExit('old comparison image reference still remains')
          if 'terminal-block-jumper-common-bar-comparison.webp' not in text:
              raise SystemExit('new comparison image reference missing')
          if text.count('class="marker-blue"') < 4:
              raise SystemExit('insufficient blue marker emphasis')

          path.write_text(text, encoding='utf-8')

          # Self-delete this temporary helper so it does not remain in the PR.
          Path('.github/workflows/gpt-finalize-terminal-block-jumper.yml').unlink()
          PY
      - name: Commit directly to PR branch
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles/terminal-block-jumper-basic.html .github/workflows/gpt-finalize-terminal-block-jumper.yml
          git diff --cached --check
          git commit -m "Finalize common bar visual and article emphasis"
          git push origin HEAD:preview-terminal-block-jumper-audit-20260911
