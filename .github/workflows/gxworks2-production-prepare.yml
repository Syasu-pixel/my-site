name: GX Works2 Production Preparation

on:
  push:
    branches: [preview-gxworks2-production-20260917]
    paths:
      - .github/workflows/gxworks2-production-prepare.yml
      - scripts/_gxworks2_prepare_release.py
      - scripts/_gxworks2_test_release.py

permissions:
  contents: write

concurrency:
  group: gxworks2-production-preparation
  cancel-in-progress: false

jobs:
  prepare-and-test:
    if: github.repository == 'Syasu-pixel/my-site' && github.ref == 'refs/heads/preview-gxworks2-production-20260917'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-gxworks2-production-20260917
          fetch-depth: 1
      - name: Install browser test dependency
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Prepare standalone page and test without sending consultations
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/preview-gxworks2-production-20260917
          python -m py_compile scripts/_gxworks2_prepare_release.py scripts/_gxworks2_test_release.py
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/gxworks2-local-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          python scripts/_gxworks2_prepare_release.py
          node --check assets/js/gxworks2-consultation.js
          python scripts/_gxworks2_test_release.py
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gxworks2-production-release-evidence
          path: gxw-release-evidence/
          retention-days: 7
          if-no-files-found: warn
      - name: Commit verified standalone release to review branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/preview-gxworks2-production-20260917
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('gxw-release-evidence/report.json').read_text())
          assert result.get('all_passed') and result.get('live_consultations_created') == 0
          PY
          git config user.name denkicontrol-release
          git config user.email actions@users.noreply.github.com
          git add -- services/gxworks2-online-support.html assets/js/gxworks2-consultation.js assets/css/gxworks2-service-entry.css index.html categories/control-basics.html assets/data/search-index.json sitemap.xml articles/_preview-gxworks2-online-support.html articles/_preview-gxworks2-online-support-live.html
          python - <<'PY'
          import subprocess
          allowed={'services/gxworks2-online-support.html','assets/js/gxworks2-consultation.js','assets/css/gxworks2-service-entry.css','index.html','categories/control-basics.html','assets/data/search-index.json','sitemap.xml','articles/_preview-gxworks2-online-support.html','articles/_preview-gxworks2-online-support-live.html'}
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert changed and changed <= allowed, changed
          PY
          git commit -m "Prepare approved GX Works2 standalone service, intake and navigation"
          git push origin HEAD:preview-gxworks2-production-20260917
