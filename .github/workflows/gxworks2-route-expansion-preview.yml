name: GX Works2 Route Expansion Preview

on:
  push:
    branches: [preview-gxworks2-route-expansion-20260917]
    paths:
      - .github/workflows/gxworks2-route-expansion-preview.yml
      - scripts/_add_gxworks2_routes.py

permissions:
  contents: write

jobs:
  apply-and-check:
    if: github.repository == 'Syasu-pixel/my-site' && github.ref == 'refs/heads/preview-gxworks2-route-expansion-20260917'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-gxworks2-route-expansion-20260917
          fetch-depth: 1
      - name: Apply scoped route additions
        run: python scripts/_add_gxworks2_routes.py
      - name: Validate changed files only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          targets=[
            'categories/circuit-basics.html',
            'articles/plc-io-unit-basic.html',
            'articles/plc-drilling-line-design-project-01.html',
            'articles/plc-drilling-line-design-project-02.html',
          ]
          for f in targets:
              t=Path(f).read_text(encoding='utf-8')
              assert t.count('class="gxw-service-entry"') == 1, f
              assert '/services/gxworks2-online-support.html' in t, f
              assert '/assets/css/gxworks2-service-entry.css' in t, f
              assert 'GX Works2 オンライン相談' in t or 'GX Works2変更' in t, f
          print('Validated 4 route additions.')
          PY
      - name: Commit preview changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name denkicontrol-route-preview
          git config user.email actions@users.noreply.github.com
          git add -- categories/circuit-basics.html articles/plc-io-unit-basic.html articles/plc-drilling-line-design-project-01.html articles/plc-drilling-line-design-project-02.html
          python - <<'PY'
          import subprocess
          allowed={
            'categories/circuit-basics.html',
            'articles/plc-io-unit-basic.html',
            'articles/plc-drilling-line-design-project-01.html',
            'articles/plc-drilling-line-design-project-02.html',
          }
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert changed == allowed, changed
          PY
          git commit -m "Add GX Works2 consultation routes to related PLC and circuit pages"
          git push origin HEAD:preview-gxworks2-route-expansion-20260917
