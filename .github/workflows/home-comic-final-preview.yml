name: Home comic final integrated preview

on:
  push:
    branches:
      - preview-home-instagram-reel-20261004
    paths:
      - index.html
      - .github/workflows/home-comic-final-preview.yml
      - .github/site-shells/**
      - scripts/*additional-shell*
      - assets/**

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    env:
      REVIEW_PORT: '8790'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build production-equivalent additional-page candidate
        run: node scripts/build-additional-shells.mjs "${RUNNER_TEMP}/home-final-preview"
      - name: Verify home candidate in Chromium
        run: |
          node scripts/serve-integrated-review.mjs "${RUNNER_TEMP}/home-final-preview" > "${RUNNER_TEMP}/home-final-preview/server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          sleep 1
          node --input-type=module <<'NODE'
          import { createRequire } from 'node:module';
          import { writeFile } from 'node:fs/promises';
          const require=createRequire(import.meta.url);
          const { chromium }=require('playwright');
          const browser=await chromium.launch({headless:true});
          const results={};
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          for (const spec of [
            {name:'pc-light',width:1440,height:1000,scheme:'light'},
            {name:'pc-dark',width:1440,height:1000,scheme:'dark'},
            {name:'mobile-light',width:390,height:844,scheme:'light'},
            {name:'mobile-dark',width:390,height:844,scheme:'dark'}
          ]) {
            const context=await browser.newContext({viewport:{width:spec.width,height:spec.height},colorScheme:spec.scheme,serviceWorkers:'block'});
            const page=await context.newPage();
            await page.goto('http://127.0.0.1:8790/index.html',{waitUntil:'networkidle'});
            await page.evaluate(async()=>{await document.fonts.ready});
            assert(await page.locator('.dc-shell').count()===1,spec.name+': shared header missing');
            assert(await page.locator('.dc-shared-footer').count()===1,spec.name+': shared footer missing');
            assert(await page.locator('.instagram-comic-feed').count()===1,spec.name+': comic feed missing');
            const theme=await page.evaluate(()=>document.documentElement.dataset.dcTheme||'light');
            if(spec.scheme==='dark') assert(theme==='dark',spec.name+': dark theme not active');
            if(spec.width>=1200){
              const dims=await page.evaluate(()=>{
                const r=document.querySelector('.top-right-rail').getBoundingClientRect();
                const l=document.querySelector('.top-left-flow').getBoundingClientRect();
                const g=document.querySelector('.top-main-layout').getBoundingClientRect();
                return {right:r.width,left:l.width,grid:g.width,gap:r.left-l.right};
              });
              assert(dims.right>=319&&dims.right<=321,spec.name+': right rail width '+dims.right);
              assert(dims.left>=700&&dims.left<=841,spec.name+': left flow width '+dims.left);
              assert(dims.gap>=15&&dims.gap<=17,spec.name+': column gap '+dims.gap);
              results[spec.name]={theme,...dims};
            } else {
              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth);
              assert(overflow<=spec.width,spec.name+': horizontal overflow '+overflow);
              results[spec.name]={theme,scrollWidth:overflow};
            }
            await page.screenshot({path:process.env.RUNNER_TEMP+'/home-final-preview/'+spec.name+'.png',fullPage:true,animations:'disabled'});
            await context.close();
          }

          const context=await browser.newContext({viewport:{width:1440,height:1000},colorScheme:'light',serviceWorkers:'block',reducedMotion:'no-preference'});
          const page=await context.newPage();
          await page.goto('http://127.0.0.1:8790/index.html',{waitUntil:'networkidle'});
          const before=await page.locator('.instagram-comic-track').evaluate(e=>getComputedStyle(e).transform);
          await page.waitForTimeout(7600);
          const after=await page.locator('.instagram-comic-track').evaluate(e=>getComputedStyle(e).transform);
          const active=await page.locator('.instagram-comic-dots i.is-active').evaluate(e=>[...e.parentElement.children].indexOf(e));
          assert(before!==after,'comic auto advance did not move');
          const matrix=after.match(/matrix\([^,]+,[^,]+,[^,]+,[^,]+,[^,]+,\s*([-\d.]+)\)/);
          assert(matrix&&Number(matrix[1])<0,'comic movement is not vertical translateY: '+after);
          assert(active===1,'comic active dot did not advance to second item: '+active);
          results.comicAuto={before,after,active};
          await browser.close();
          await writeFile(process.env.RUNNER_TEMP+'/home-final-preview/browser-verification.json',JSON.stringify(results,null,2));
          console.log(JSON.stringify(results));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: home-final-preview-verification-${{ github.sha }}
          path: |
            ${{ runner.temp }}/home-final-preview/browser-verification.json
            ${{ runner.temp }}/home-final-preview/pc-light.png
            ${{ runner.temp }}/home-final-preview/pc-dark.png
            ${{ runner.temp }}/home-final-preview/mobile-light.png
            ${{ runner.temp }}/home-final-preview/mobile-dark.png
          retention-days: 30
      - name: Materialize generated top page on preview-only branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C preview-home-final-integrated-20261004
          cp "${RUNNER_TEMP}/home-final-preview/candidate/index.html" index.html
          rm -f .github/workflows/home-comic-final-preview.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No generated preview changes."
            exit 0
          fi
          git commit -m "Preview only: materialize integrated home candidate"
          git push --force origin preview-home-final-integrated-20261004
