name: Temporary IAI robocylinder final publication QA
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/iai-robocylinder-final-qa.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node for shared shell verification
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'

      - name: Refuse stale generated headers and footers
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm check:shells

      - name: Detect consultation worker changes
        id: consultation-scope
        shell: bash
        run: |
          run_tests=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            run_tests=true
          else
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              base="${{ github.event.pull_request.base.sha }}"
            else
              base="${{ github.event.before }}"
            fi
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              run_tests=true
            else
              while IFS= read -r file; do
                case "$file" in
                  .github/workers/gxworks2-support-api/worker.js|scripts/test-general-consultation-worker.mjs|scripts/test-admin-case-management-worker.mjs|contact/index.html|services/gxworks2-online-support.html)
                    run_tests=true
                    break
                    ;;
                esac
              done < <(git diff --name-only "$base" HEAD)
            fi
          fi
          echo "run_worker_tests=$run_tests" >> "$GITHUB_OUTPUT"

      - name: Verify temporary consultation pause
        run: node scripts/test-consultation-pause.mjs

      # Ordinary contact remains open while GX Works2 ZIP intake stays paused.
      - name: Verify online consultation mail flow
        run: node scripts/test-general-consultation-worker.mjs

      - name: Verify admin case management API
        # Keep the existing-case regression test active even if a shallow
        # checkout prevents change detection against the PR base SHA.
        run: node scripts/test-admin-case-management-worker.mjs

      - name: Generate and verify approved article components
        env:
          REVIEW_COPY_ASSETS: '0'
        run: |
          python -m pip install lxml==6.1.1
          node scripts/build-integrated-review.mjs "${RUNNER_TEMP}/integration-build"
          node scripts/build-additional-shells.mjs "${RUNNER_TEMP}/integration-build/additional-shells"
          python scripts/verify-integrated-source.py "${RUNNER_TEMP}/integration-build"
          python scripts/audit-integrated-links.py "${RUNNER_TEMP}/integration-build"
          python scripts/verify-article-end-preservation.py --oracle .github/article-components/end/all-preservation-oracle.json --candidate "${RUNNER_TEMP}/integration-build/candidate" --assets-source . --output "${RUNNER_TEMP}/integration-build/end-independent-checks.json"

      - name: Prepare Pages artifact
        run: |
          python scripts/build-admin-article-catalog.py

          rsync -a ./ _site/ \
            --exclude '_site/' \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '/docs/rules/catalog.json' \
            --exclude 'node_modules/' \
            --exclude '.netlify/' \
            --exclude '.wrangler/' \
            --exclude '.cache/' \
            --exclude 'tmp/' \
            --exclude 'temp/' \
            --exclude '*.zip' \
            --exclude '*.tar' \
            --exclude '*.tar.gz' \
            --exclude '*.7z' \
            --exclude '*.psd' \
            --exclude '*.ai'

          node scripts/prepare-integrated-publication.mjs "${RUNNER_TEMP}/integration-build" _site
          python scripts/verify-publication-artifact.py snapshot _site "${RUNNER_TEMP}/integration-build"

          echo 'Before image optimization:'
          du -sh _site _site/assets/images

      - name: Optimize published images to WebP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp
          export IMAGE_COLLISION_SKIP="${RUNNER_TEMP}/integration-build/image-collision-skip.txt"

          # Convert PNG/JPEG assets in the publish copy only. The repository originals
          # remain untouched until the optimized deployment has been verified.
          find _site/assets/images -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' \) -print0 \
            | xargs -0 -r -P 4 -I{} bash -c '
                src="$1"
                grep -Fxq "$src" "$IMAGE_COLLISION_SKIP" && exit 0
                dst="${src%.*}.webp"
                [ -e "$dst" ] && exit 0
                cwebp -quiet -mt -q 82 -m 4 "$src" -o "$dst"
              ' _ {}

          python3 - <<'PY'
          from pathlib import Path
          import re, json, os

          root = Path('_site')
          image_root = root / 'assets' / 'images'
          mapping = {}
          build = Path(os.environ['RUNNER_TEMP']) / 'integration-build'
          keep_originals = set(json.loads((build/'image-collision-plan.json').read_text())['keepOriginals'])
          for src in image_root.rglob('*'):
              if not src.is_file() or src.suffix.lower() not in {'.png', '.jpg', '.jpeg'}:
                  continue
              if src.relative_to(root).as_posix() in keep_originals:
                  continue
              dst = src.with_suffix('.webp')
              if dst.exists() and dst.stat().st_size > 0:
                  rel_src = src.relative_to(root).as_posix()
                  rel_dst = dst.relative_to(root).as_posix()
                  mapping[rel_src] = rel_dst
          (build/'published-image-mapping.json').write_text(json.dumps(mapping), encoding='utf-8')

          # Only rewrite files that can affect the published site. Internal Markdown/TXT
          # docs contain example placeholders such as {slug} and must not be treated as
          # live asset references.
          text_exts = {'.html', '.css', '.js', '.json', '.xml'}
          changed = 0
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in text_exts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              new = text
              for old, replacement in mapping.items():
                  new = new.replace('/' + old, '/' + replacement)
                  new = new.replace(old, replacement)
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed += 1

          # Remove originals only from the generated publish copy and only when a
          # valid WebP counterpart exists.
          removed = 0
          for old in mapping:
              src = root / old
              if src.exists():
                  src.unlink()
                  removed += 1

          # Guard against stale references in actual published web files only.
          stale = []
          pattern = re.compile(r'assets/images/[^\s"\'<>?#]+\.(?:png|jpe?g)', re.I)
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in text_exts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for match in pattern.findall(text):
                  candidate = root / match.lstrip('/')
                  if not candidate.exists():
                      stale.append(f'{path}: {match}')

          print(f'Converted images: {len(mapping)}')
          print(f'Updated published files: {changed}')
          print(f'Removed publish-copy originals: {removed}')
          if stale:
              print('Stale image references detected in published files:')
              print('\n'.join(stale[:100]))
              raise SystemExit(1)
          PY

          echo 'After image optimization:'
          du -sh _site _site/assets/images

          # GitHub Pages published sites must remain below 1 GB. Keep headroom so
          # future articles cannot silently cross the limit.
          bytes=$(du -sb _site | cut -f1)
          limit=$((900 * 1024 * 1024))
          echo "Published artifact bytes: $bytes"
          if [ "$bytes" -ge "$limit" ]; then
            echo "ERROR: optimized Pages artifact is still >= 900 MiB; refusing oversized deploy."
            exit 1
          fi

      - name: Verify final standalone publication
        run: python scripts/verify-publication-artifact.py verify _site "${RUNNER_TEMP}/integration-build"

      # Apply only after all full-page generation and integrity verification passed.
      # In PR runs this also exercises the exact same artifact removal as production.
      - name: Exclude paused PLC design pages from the final publication artifact
        run: |
          set -euo pipefail
          for episode in 01 02 03; do
            page="_site/articles/plc-drilling-line-design-project-${episode}.html"
            if test -f "$page"; then
              rm "$page"
            fi
            test ! -e "$page" || { echo "Paused article still present: $page" >&2; exit 1; }
            echo "Confirmed unpublished: $page"
          done
          if grep -Eq 'plc-drilling-line-design-project-(01|02|03)\.html' _site/sitemap.xml _site/assets/data/search-index.json; then
            echo 'Paused PLC article remains in sitemap or search index' >&2
            exit 1
          fi

      - name: Save publication verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-verification-${{ github.sha }}
          path: |
            ${{ runner.temp }}/integration-build/publication-checks.json
            ${{ runner.temp }}/integration-build/publication-final-checks.json
            ${{ runner.temp }}/integration-build/published-image-mapping.json
            ${{ runner.temp }}/integration-build/image-collision-plan.json
            ${{ runner.temp }}/integration-build/additional-shells/preservation.json
          retention-days: 30

      - name: Install browser for final publication verification
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify final IAI robocylinder publication in four conditions
        run: |
          python3 -m http.server 18765 --bind 127.0.0.1 --directory _site > /tmp/iai-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          cat > final-iai-qa.cjs <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs'),crypto=require('crypto');
          (async()=>{
           const browser=await chromium.launch({headless:true});const results=[];fs.mkdirSync('iai-final-qa',{recursive:true});
           for(const width of [1440,390])for(const theme of ['light','dark']){
            const context=await browser.newContext({viewport:{width,height:width<500?844:1000},colorScheme:theme,isMobile:width<500,hasTouch:width<500,locale:'ja-JP',reducedMotion:'reduce'});const page=await context.newPage(),errors=[];
            await page.route('**/*',route=>{const u=new URL(route.request().url());if(u.hostname!=='127.0.0.1'||!['GET','HEAD'].includes(route.request().method()))return route.abort();return route.continue();});
            page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:18765/articles/iai-robocylinder-basic.html',{waitUntil:'networkidle'});
            await page.evaluate(async()=>{for(const i of document.images)i.loading='eager';await Promise.all([...document.images].filter(i=>i.getAttribute('src')).map(i=>i.decode().catch(()=>{})));});
            const info=await page.evaluate(()=>({theme:document.documentElement.dataset.dcTheme,width:innerWidth,scrollWidth:document.documentElement.scrollWidth,brokenImages:[...document.images].filter(i=>i.getAttribute('src')&&(!i.complete||!i.naturalWidth)).map(i=>i.src),figures:document.querySelectorAll('.article-figure img').length,brokenAnchors:[...document.querySelectorAll('a[href^="#"]')].map(a=>a.getAttribute('href')).filter(h=>h.length>1&&!document.getElementById(decodeURIComponent(h.slice(1)))),noindex:document.querySelector('meta[name="robots"]')?.content||null,canonical:document.querySelector('link[rel="canonical"]')?.href}));
            const figs=page.locator('.article-figure img');const interactions=[];
            for(let i=0;i<await figs.count();i++){
             await (width<500?figs.nth(i).tap():figs.nth(i).click());const overlay=page.locator('.dc-image-lightbox');const opened=await overlay.isVisible(),same=(await overlay.locator('img').getAttribute('src'))===(await figs.nth(i).evaluate(e=>e.currentSrc));
             await (width<500?page.touchscreen.tap(3,3):page.mouse.click(3,3));const backgroundClosed=!(await overlay.isVisible());
             await (width<500?figs.nth(i).tap():figs.nth(i).click());await page.keyboard.press('Escape');const escapeClosed=!(await overlay.isVisible());
             await (width<500?figs.nth(i).tap():figs.nth(i).click());await (width<500?page.locator('.dc-image-lightbox__close').tap():page.locator('.dc-image-lightbox__close').click());const closeButtonClosed=!(await overlay.isVisible());
             interactions.push({i,opened,same,backgroundClosed,escapeClosed,closeButtonClosed});
            }
            await page.evaluate(()=>scrollTo(0,0));await page.screenshot({path:`iai-final-qa/${width}-${theme}-full.png`,fullPage:true});await page.locator('.article-hero').screenshot({path:`iai-final-qa/${width}-${theme}-hero.png`});
            const pass=info.theme===theme&&info.scrollWidth<=info.width&&info.brokenImages.length===0&&info.brokenAnchors.length===0&&info.figures===3&&interactions.every(x=>x.opened&&x.same&&x.backgroundClosed&&x.escapeClosed&&x.closeButtonClosed)&&errors.length===0&&info.noindex==='index,follow'&&info.canonical==='https://denkicontrol.com/articles/iai-robocylinder-basic.html';
            results.push({width,theme,...info,interactions,errors,pass});await context.close();
           }
           await browser.close();const html=fs.readFileSync('_site/articles/iai-robocylinder-basic.html');const evidence={sourceArticleCommit:'d47e03648f599bb2533ca0f7f3e39ee8bf734723',workflowCommit:process.env.GITHUB_SHA,publicationSha256:crypto.createHash('sha256').update(html).digest('hex'),results};fs.writeFileSync('iai-final-qa/results.json',JSON.stringify(evidence,null,2));console.log(JSON.stringify(evidence));if(results.some(x=>!x.pass))process.exitCode=1;
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node final-iai-qa.cjs
      - name: Save final four-condition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iai-robocylinder-final-publication-${{ github.run_id }}
          path: iai-final-qa/
          retention-days: 30
          if-no-files-found: error
      - name: Package unchanged final article and required static assets for private Preview
        run: |
          python3 - <<'PY'
          import pathlib,re,shutil,hashlib,json
          site=pathlib.Path('_site'); out=pathlib.Path('iai-publication-preview'); page='articles/iai-robocylinder-basic.html'
          (out/'articles').mkdir(parents=True,exist_ok=True);shutil.copy2(site/page,out/page)
          for folder in ['css','js','data']:
            if (site/'assets'/folder).exists():shutil.copytree(site/'assets'/folder,out/'assets'/folder,dirs_exist_ok=True)
          documents=[out/page]+list((out/'assets/css').rglob('*.css'))
          assets=set()
          for file in documents:
            for a in re.findall(r'assets/[^\s"\x27()<>?#]+',file.read_text()):
              if (site/a).is_file():assets.add(a)
          for a in assets:
            (out/a).parent.mkdir(parents=True,exist_ok=True);shutil.copy2(site/a,out/a)
          manifest={str(p.relative_to(out)):hashlib.sha256(p.read_bytes()).hexdigest() for p in out.rglob('*') if p.is_file()}
          (out/'preview-file-hashes.json').write_text(json.dumps(manifest,indent=2))
          print('Preview files',len(manifest),'article sha',manifest[page])
          PY
      - name: Save private Preview publication files
        uses: actions/upload-artifact@v4
        with:
          name: iai-private-preview-${{ github.run_id }}
          path: iai-publication-preview/
          retention-days: 30
          if-no-files-found: error
