name: Import Air Cylinder Assets

on:
  push:
    branches:
      - air-cylinder-assets-20260911
    paths:
      - .github/workflows/import-air-cylinder-assets.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Firestorage app API
        shell: bash
        run: |
          set -euo pipefail
          base="https://firestorage.ai"
          chunk="/_next/static/chunks/app/(files)/ja/f/page-4d19ae0a4ce39d79.js"
          curl -L -sS "$base$chunk" -o /tmp/page.js
          echo "-- api-like strings --"
          grep -Eo '.{0,100}(api|download|share|files|objects).{0,140}' /tmp/page.js | head -120 || true
          echo "-- absolute/relative endpoints --"
          grep -Eo 'https?://[^\" ]+|/[A-Za-z0-9_./?=&:-]{6,}' /tmp/page.js | grep -Ei 'api|download|share|file|object' | head -120 || true
