name: Import Air Cylinder Assets

on:
  push:
    branches:
      - air-cylinder-assets-20260911
    paths:
      - .github/workflows/import-air-cylinder-assets.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect transfer links
        shell: bash
        run: |
          set -euo pipefail
          for item in hero:GIPwz47iReLf ogp:qciCYcCK8EoO; do
            name="${item%%:*}"
            id="${item##*:}"
            url="https://firestorage.ai/ja/f/${id}"
            echo "=== ${name} ==="
            curl -L -sS -D "/tmp/${name}.headers" "$url" -o "/tmp/${name}.body"
            echo "-- headers --"
            sed -n '1,40p' "/tmp/${name}.headers"
            echo "-- file --"
            file "/tmp/${name}.body" || true
            echo "-- candidate urls --"
            grep -Eio 'https?://[^\"[:space:]]+' "/tmp/${name}.body" | head -50 || true
            echo "-- webp refs --"
            grep -Eio '[^\"[:space:]]+\.webp[^\"[:space:]]*' "/tmp/${name}.body" | head -50 || true
            echo "-- first bytes --"
            head -c 1200 "/tmp/${name}.body" | tr '\n' ' ' || true
            echo
          done
