name: Import Air Cylinder Assets

on:
  push:
    branches:
      - air-cylinder-assets-20260911
    paths:
      - .github/workflows/import-air-cylinder-assets.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect all Firestorage client chunks
        shell: bash
        run: |
          set -euo pipefail
          base="https://firestorage.ai"
          curl -L -sS "$base/ja/f/GIPwz47iReLf" -o /tmp/page.html
          grep -o 'src="[^"]*\.js"' /tmp/page.html | sed 's/src="//;s/"$//' | sort -u > /tmp/scripts.txt
          cat /tmp/scripts.txt
          mkdir -p /tmp/js
          while read -r src; do
            file="/tmp/js/$(echo "$src" | tr '/()' '___')"
            curl -L -sS "$base$src" -o "$file" || true
          done < /tmp/scripts.txt
          cat /tmp/js/* > /tmp/all.js || true
          echo "-- keywords --"
          grep -Eo '.{0,160}(shareId|publicId|download|presign|signed|object|fileId|files|api).{0,220}' /tmp/all.js | head -300 || true
          echo "-- endpoint-ish --"
          grep -Eo 'https?://[^\" ]+|/[A-Za-z0-9_./?=&:-]{5,}' /tmp/all.js | grep -Ei 'api|download|share|file|object|presign|signed' | sort -u | head -300 || true
