name: Import Air Cylinder Assets

on:
  push:
    branches:
      - air-cylinder-assets-20260911
    paths:
      - .github/workflows/import-air-cylinder-assets.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect embedded Firestorage file data
        shell: bash
        run: |
          set -euo pipefail
          for id in GIPwz47iReLf qciCYcCK8EoO; do
            echo "=== $id ==="
            curl -L -sS "https://firestorage.ai/ja/f/$id" -o /tmp/page.html
            grep -Eo '.{0,180}(publicId|fileName|file_name|download|presign|signed|storage|shareId|object).{0,260}' /tmp/page.html | head -120 || true
            echo "-- next-data --"
            grep -Eo 'self\.__next_f\.push\([^<]+' /tmp/page.html | head -80 || true
          done
