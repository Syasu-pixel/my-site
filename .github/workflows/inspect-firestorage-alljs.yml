name: Inspect firestorage all JS
on:
  push:
    branches: [preview-career-service-makersjob-v1]
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Scan scripts
        run: |
          python - <<'PY'
          import requests,re
          base='https://firestorage.ai'; page=base+'/ja/f/gh7jdPJmJChv'
          t=requests.get(page,timeout=30).text
          scripts=re.findall(r'<script[^>]+src="([^"]+)"',t)
          print('SCRIPTS',len(scripts))
          for s in scripts:
              js=requests.get(base+s,timeout=30).text
              hits=[]
              for pat in [r'/api/[^"\'` ]+',r'[^"\'` ]*download[^"\'` ]*',r'[^"\'` ]*share[^"\'` ]*']:
                  hits += re.findall(pat,js,re.I)
              if hits:
                  print('\n###',s,'LEN',len(js))
                  for h in sorted(set(hits))[:100]: print(h[:500])
          PY
