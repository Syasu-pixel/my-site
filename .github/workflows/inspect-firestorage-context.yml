name: Inspect firestorage context
on:
  push:
    branches: [preview-career-service-makersjob-v1]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Show endpoint context
        run: |
          python - <<'PY'
          import requests
          u='https://firestorage.ai/_next/static/chunks/4899-d89df949f2dbd5af.js'
          js=requests.get(u,timeout=30).text
          for needle in ['files/${e.fileId}/download','/shares/${e[1]}','cushion-sessions']:
              i=js.find(needle)
              print('\nNEEDLE',needle,'AT',i)
              print(js[max(0,i-1800):i+2200])
          PY
