name: Inspect firestorage share
on:
  push:
    branches: [preview-career-service-makersjob-v1]
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect share page
        run: |
          python - <<'PY'
          import re, requests
          u='https://firestorage.ai/ja/f/gh7jdPJmJChv'
          r=requests.get(u,timeout=30)
          print('STATUS',r.status_code,'TYPE',r.headers.get('content-type'),'LEN',len(r.content),'URL',r.url)
          t=r.text
          print(t[:12000])
          print('--- LINKS ---')
          for x in re.findall(r'''(?:href|src)=["']([^"']+)["']''',t):
              if 'gh7jdPJmJChv' in x or 'download' in x.lower() or 'file' in x.lower() or 'api' in x.lower():
                  print(x)
          PY
