name: Limit Switch Official Sources
on:
  push:
    branches:
      - preview-limit-switch-troubleshooting-text-refresh-20260916
    paths:
      - scripts/limit-switch-official-sources.py
      - .github/workflows/limit-switch-official-sources.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-limit-switch-troubleshooting-text-refresh-20260916
      - name: Apply official source box
        run: python scripts/limit-switch-official-sources.py
      - name: Clean temporary automation and commit
        run: |
          rm -f scripts/limit-switch-official-sources.py .github/workflows/limit-switch-official-sources.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles/limit-switch-troubleshooting-basic.html scripts/limit-switch-official-sources.py .github/workflows/limit-switch-official-sources.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add official sources to limit switch troubleshooting article"
          git push
