name: Limit Switch Troubleshooting Text Refresh

on:
  push:
    branches:
      - preview-limit-switch-troubleshooting-text-refresh-20260916
    paths:
      - .github/workflows/limit-switch-troubleshooting-text-refresh.yml
      - .github/scripts/limit_switch_troubleshooting_refresh.py

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-limit-switch-troubleshooting-text-refresh-20260916
          fetch-depth: 0
      - name: Apply refresh
        run: python .github/scripts/limit_switch_troubleshooting_refresh.py
      - name: Commit result
        run: |
          rm -f .github/workflows/limit-switch-troubleshooting-text-refresh.yml
          rm -f .github/scripts/limit_switch_troubleshooting_refresh.py
          git config user.name denkicontrol-preview-writer
          git config user.email actions@users.noreply.github.com
          git add articles/limit-switch-troubleshooting-basic.html docs/existing-article-improvement-backlog.md .github/workflows/limit-switch-troubleshooting-text-refresh.yml .github/scripts/limit_switch_troubleshooting_refresh.py
          git commit -m "Refresh limit switch troubleshooting article text"
          git push origin HEAD:preview-limit-switch-troubleshooting-text-refresh-20260916
