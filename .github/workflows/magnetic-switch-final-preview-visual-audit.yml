name: Magnetic switch final preview visual audit

on:
  push:
    branches:
      - preview-magnetic-switch-refresh-final-20260928
    paths:
      - '.github/workflows/magnetic-switch-final-preview-visual-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium

      - name: Capture and validate final deployed Preview
        run: |
          mkdir -p /tmp/magnetic-preview-shots
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const target='https://7b0d67bd.denkicontrol-preview.pages.dev/articles/magnetic-switch-basic.html';
          const cases=[
            {name:'pc-light',width:1440,height:1000,colorScheme:'light'},
            {name:'pc-dark',width:1440,height:1000,colorScheme:'dark'},
            {name:'mobile-light',width:390,height:844,colorScheme:'light'},
            {name:'mobile-dark',width:390,height:844,colorScheme:'dark'},
          ];
          const browser=await chromium.launch({headless:true});

          for(const item of cases){
            const context=await browser.newContext({
              viewport:{width:item.width,height:item.height},
              colorScheme:item.colorScheme,
              deviceScaleFactor:1,
            });
            const page=await context.newPage();
            const response=await page.goto(target,{waitUntil:'networkidle',timeout:120000});
            if(!response || !response.ok()) throw new Error(item.name+': preview HTTP failed');

            await page.evaluate(async()=>{
              const imgs=[...document.images];
              for(const img of imgs){
                img.scrollIntoView({block:'center'});
                await new Promise(r=>setTimeout(r,25));
              }
              window.scrollTo(0,0);
            });
            await page.waitForTimeout(500);

            const result=await page.evaluate(()=>{
              const root=document.documentElement;
              const figures=[...document.querySelectorAll('.article-figure img')];
              const broken=[...document.images].filter(img=>(img.currentSrc||img.src) && img.complete && img.naturalWidth===0).map(img=>img.currentSrc||img.src);
              const hero=document.querySelector('.article-hero');
              const related=document.querySelector('.article-end-related-grid,.related-grid');
              const feedback=document.querySelector('.article-feedback-card');
              return {
                scrollWidth:root.scrollWidth,
                clientWidth:root.clientWidth,
                figures:figures.length,
                broken,
                hero:!!hero,
                related:!!related,
                feedback:!!feedback,
              };
            });

            if(result.scrollWidth>result.clientWidth+2) throw new Error(item.name+': horizontal overflow '+JSON.stringify(result));
            if(result.figures!==3) throw new Error(item.name+': expected 3 body figures '+JSON.stringify(result));
            if(result.broken.length) throw new Error(item.name+': broken images '+JSON.stringify(result.broken));
            if(!result.hero||!result.related||!result.feedback) throw new Error(item.name+': integrated components missing '+JSON.stringify(result));

            await page.screenshot({
              path:'/tmp/magnetic-preview-shots/'+item.name+'.png',
              fullPage:true,
            });
            console.log(item.name+' passed '+JSON.stringify(result));
            await context.close();
          }
          await browser.close();
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: magnetic-switch-final-preview-screenshots
          path: /tmp/magnetic-preview-shots/*.png
          retention-days: 7
