name: Magnetic switch final publication preview

on:
  push:
    branches:
      - preview-magnetic-switch-final-publication-20260928
    paths:
      - '.github/workflows/magnetic-switch-final-publication-preview.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source preview branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          python -m pip install lxml==6.1.1

      - name: Install browser for final interaction checks
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify current shared shells
        run: pnpm check:shells

      - name: Build integrated publication candidate
        env:
          REVIEW_COPY_ASSETS: '0'
        run: |
          node scripts/build-integrated-review.mjs "${RUNNER_TEMP}/integration-build"
          node scripts/build-additional-shells.mjs "${RUNNER_TEMP}/integration-build/additional-shells"
          python scripts/verify-integrated-source.py "${RUNNER_TEMP}/integration-build"
          python scripts/audit-integrated-links.py "${RUNNER_TEMP}/integration-build"
          python scripts/verify-article-end-preservation.py \
            --oracle .github/article-components/end/all-preservation-oracle.json \
            --candidate "${RUNNER_TEMP}/integration-build/candidate" \
            --assets-source . \
            --output "${RUNNER_TEMP}/integration-build/end-independent-checks.json"

      - name: Prepare standalone publication tree
        run: |
          rsync -a ./ _site/ \
            --exclude '_site/' \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '/docs/rules/catalog.json' \
            --exclude 'node_modules/' \
            --exclude '.netlify/' \
            --exclude '.wrangler/' \
            --exclude '.cache/' \
            --exclude 'tmp/' \
            --exclude 'temp/' \
            --exclude '*.zip' \
            --exclude '*.tar' \
            --exclude '*.tar.gz' \
            --exclude '*.7z' \
            --exclude '*.psd' \
            --exclude '*.ai'

          node scripts/prepare-integrated-publication.mjs "${RUNNER_TEMP}/integration-build" _site
          python scripts/verify-publication-artifact.py snapshot _site "${RUNNER_TEMP}/integration-build"

      - name: Optimize publication images to WebP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp
          export IMAGE_COLLISION_SKIP="${RUNNER_TEMP}/integration-build/image-collision-skip.txt"

          find _site/assets/images -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' \) -print0 \
            | xargs -0 -r -P 4 -I{} bash -c '
                src="$1"
                grep -Fxq "$src" "$IMAGE_COLLISION_SKIP" && exit 0
                dst="${src%.*}.webp"
                [ -e "$dst" ] && exit 0
                cwebp -quiet -mt -q 82 -m 4 "$src" -o "$dst"
              ' _ {}

          python3 - <<'PY'
          from pathlib import Path
          import re, json, os

          root = Path('_site')
          image_root = root / 'assets' / 'images'
          mapping = {}
          build = Path(os.environ['RUNNER_TEMP']) / 'integration-build'
          keep_originals = set(json.loads((build/'image-collision-plan.json').read_text())['keepOriginals'])

          for src in image_root.rglob('*'):
              if not src.is_file() or src.suffix.lower() not in {'.png', '.jpg', '.jpeg'}:
                  continue
              if src.relative_to(root).as_posix() in keep_originals:
                  continue
              dst = src.with_suffix('.webp')
              if dst.exists() and dst.stat().st_size > 0:
                  mapping[src.relative_to(root).as_posix()] = dst.relative_to(root).as_posix()

          (build/'published-image-mapping.json').write_text(json.dumps(mapping), encoding='utf-8')

          text_exts = {'.html', '.css', '.js', '.json', '.xml'}
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in text_exts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              new = text
              for old, replacement in mapping.items():
                  new = new.replace('/' + old, '/' + replacement)
                  new = new.replace(old, replacement)
              if new != text:
                  path.write_text(new, encoding='utf-8')

          for old in mapping:
              src = root / old
              if src.exists():
                  src.unlink()

          stale = []
          pattern = re.compile(r'assets/images/[^\s"\'<>?#]+\.(?:png|jpe?g)', re.I)
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in text_exts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for match in pattern.findall(text):
                  if not (root / match.lstrip('/')).exists():
                      stale.append(f'{path}: {match}')
          if stale:
              print('\n'.join(stale[:100]))
              raise SystemExit(1)
          PY

      - name: Verify final standalone publication
        run: |
          python scripts/verify-publication-artifact.py verify _site "${RUNNER_TEMP}/integration-build"
          test -f _site/articles/magnetic-switch-basic.html
          grep -q 'magnetic-switch-basic-ogp.webp' _site/articles/magnetic-switch-basic.html
          grep -q 'magnetic-switch-basic-hero.webp' _site/articles/magnetic-switch-basic.html
          grep -q 'magnetic-switch-overview.webp' _site/articles/magnetic-switch-basic.html
          grep -q 'magnetic-switch-operation-flow.webp' _site/articles/magnetic-switch-basic.html
          grep -q 'magnetic-switch-coil-contact.webp' _site/articles/magnetic-switch-basic.html
          ! grep -q 'data-review-only' _site/articles/magnetic-switch-basic.html
          ! grep -qi 'noindex' _site/articles/magnetic-switch-basic.html

      - name: Verify magnetic switch image lightbox on PC and mobile
        run: |
          python3 -m http.server 4173 --directory _site > /tmp/magnetic-switch-final-preview-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          sleep 2
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({headless:true});
          const cases = [
            {name:'desktop', viewport:{width:1440,height:1000}},
            {name:'mobile', viewport:{width:390,height:844}},
          ];

          for (const item of cases) {
            const page = await browser.newPage({viewport:item.viewport});
            await page.goto('http://127.0.0.1:4173/articles/magnetic-switch-basic.html', {waitUntil:'networkidle'});

            const targets = page.locator('.article-figure img.dc-zoomable-image');
            if (await targets.count() !== 3) throw new Error(item.name+': expected 3 zoomable article images');

            const hints = page.locator('.dc-image-zoom-hint');
            if (await hints.count() !== 3) throw new Error(item.name+': expected 3 image hints');

            const dialog = page.locator('.dc-image-lightbox');
            const image = page.locator('.dc-image-lightbox__image');
            const close = page.locator('.dc-image-lightbox__close');

            await targets.nth(0).click();
            if (await dialog.getAttribute('hidden') !== null) throw new Error(item.name+': lightbox did not open');

            const box = await image.boundingBox();
            if (!box) throw new Error(item.name+': expanded image has no layout box');
            if (box.width > item.viewport.width || box.height > item.viewport.height) {
              throw new Error(item.name+': expanded image exceeds viewport');
            }

            await close.click();
            if (await dialog.getAttribute('hidden') === null) throw new Error(item.name+': close button did not close');

            await targets.nth(1).click();
            await page.keyboard.press('Escape');
            if (await dialog.getAttribute('hidden') === null) throw new Error(item.name+': Escape did not close');

            await targets.nth(2).click();
            await dialog.click({position:{x:5,y:5}});
            if (await dialog.getAttribute('hidden') === null) throw new Error(item.name+': backdrop click/tap did not close');

            await page.close();
          }

          await browser.close();
          console.log('Magnetic switch lightbox PC/mobile interaction checks passed.');
          NODE

      - name: Save verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: magnetic-switch-final-publication-verification
          path: |
            ${{ runner.temp }}/integration-build/publication-checks.json
            ${{ runner.temp }}/integration-build/publication-final-checks.json
            ${{ runner.temp }}/integration-build/published-image-mapping.json
            ${{ runner.temp }}/integration-build/image-collision-plan.json
            ${{ runner.temp }}/integration-build/end-independent-checks.json
          retention-days: 30

      - name: Materialize publication on this temporary branch
        run: |
          tempdir="$(mktemp -d)"
          cp -a _site/. "$tempdir/"
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a "$tempdir"/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: materialize magnetic switch final publication preview [skip ci]"
          git push origin HEAD:preview-magnetic-switch-final-publication-20260928
