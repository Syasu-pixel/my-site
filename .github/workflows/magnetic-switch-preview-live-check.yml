name: Magnetic switch final Preview live check

on:
  push:
    branches:
      - preview-magnetic-switch-refresh-final-20260928
    paths:
      - '.github/workflows/magnetic-switch-preview-live-check.yml'

permissions:
  contents: read

jobs:
  validate-live-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for production-equivalent Cloudflare Preview
        shell: bash
        env:
          PREVIEW_URL: https://preview-magnetic-switch-publication-final-20260928.denkicontrol-preview.pages.dev/articles/magnetic-switch-basic.html
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 30); do
            if curl -fsSL --max-time 20 "$PREVIEW_URL" -o /tmp/magnetic-switch-preview.html; then
              if grep -Fq 'magnetic-switch-basic-hero.webp' /tmp/magnetic-switch-preview.html                 && grep -Fq 'magnetic-switch-basic-ogp.webp' /tmp/magnetic-switch-preview.html                 && grep -Fq 'magnetic-switch-overview.webp' /tmp/magnetic-switch-preview.html                 && grep -Fq 'magnetic-switch-operation-flow.webp' /tmp/magnetic-switch-preview.html                 && grep -Fq 'magnetic-switch-coil-contact.webp' /tmp/magnetic-switch-preview.html                 && grep -Fq 'id="dc-toc-data"' /tmp/magnetic-switch-preview.html                 && grep -Fq 'site-header dc-shell' /tmp/magnetic-switch-preview.html; then
                  ok=1
                  break
              fi
            fi
            sleep 10
          done
          if [ "$ok" -ne 1 ]; then
            echo "Production-equivalent external Preview did not become ready or returned raw/stale HTML." >&2
            exit 1
          fi
          echo "Validated external production-equivalent Preview: $PREVIEW_URL"
