name: Materialize final home Preview

on:
  push:
    branches:
      - preview-final-home-comic-20261004

permissions:
  contents: write

jobs:
  materialize:
    if: "!contains(github.event.head_commit.message, '[home-final-preview]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'

      - name: Build production-equivalent publication
        env:
          REVIEW_COPY_ASSETS: '0'
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          python -m pip install lxml==6.1.1
          node scripts/build-integrated-review.mjs "${RUNNER_TEMP}/integration-build"
          node scripts/build-additional-shells.mjs "${RUNNER_TEMP}/integration-build/additional-shells"
          python scripts/verify-integrated-source.py "${RUNNER_TEMP}/integration-build"
          python scripts/audit-integrated-links.py "${RUNNER_TEMP}/integration-build"

          rm -rf "${RUNNER_TEMP}/publication"
          mkdir -p "${RUNNER_TEMP}/publication"
          rsync -a ./ "${RUNNER_TEMP}/publication/" \
            --exclude '.git/' --exclude '.github/' --exclude 'node_modules/' \
            --exclude '.netlify/' --exclude '.wrangler/' --exclude '.cache/' \
            --exclude 'tmp/' --exclude 'temp/'
          node scripts/prepare-integrated-publication.mjs "${RUNNER_TEMP}/integration-build" "${RUNNER_TEMP}/publication"
          python scripts/verify-publication-artifact.py snapshot "${RUNNER_TEMP}/publication" "${RUNNER_TEMP}/integration-build"

      - name: Materialize final homepage only
        run: |
          cp "${RUNNER_TEMP}/publication/index.html" index.html
          cat > _headers <<'EOF'
          /*
            X-Robots-Tag: noindex, noarchive
          EOF
          cat > robots.txt <<'EOF'
          User-agent: *
          Disallow: /
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html _headers robots.txt
          git commit -m "[home-final-preview] materialize production-equivalent homepage"
          git push
