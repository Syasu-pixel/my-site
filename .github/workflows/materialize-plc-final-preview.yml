name: Materialize PLC final publication Preview

on:
  push:
    branches:
      - preview-final-plc-basic-publication-20261007

permissions:
  contents: write

jobs:
  materialize:
    if: "!contains(github.event.head_commit.message, '[final-preview-materialized]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Build production-equivalent integrated publication
        env:
          REVIEW_COPY_ASSETS: '0'
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          python -m pip install lxml==6.1.1
          node scripts/build-integrated-review.mjs "${RUNNER_TEMP}/integration-build"
          node scripts/build-additional-shells.mjs "${RUNNER_TEMP}/integration-build/additional-shells"
          python scripts/verify-integrated-source.py "${RUNNER_TEMP}/integration-build"
          python scripts/audit-integrated-links.py "${RUNNER_TEMP}/integration-build"
          python scripts/verify-article-end-preservation.py --oracle .github/article-components/end/all-preservation-oracle.json --candidate "${RUNNER_TEMP}/integration-build/candidate" --assets-source . --output "${RUNNER_TEMP}/integration-build/end-independent-checks.json"
          rm -rf "${RUNNER_TEMP}/publication"
          mkdir -p "${RUNNER_TEMP}/publication"
          rsync -a ./ "${RUNNER_TEMP}/publication/" --exclude '.git/' --exclude '.github/' --exclude 'node_modules/' --exclude '.netlify/' --exclude '.wrangler/' --exclude '.cache/' --exclude 'tmp/' --exclude 'temp/'
          node scripts/prepare-integrated-publication.mjs "${RUNNER_TEMP}/integration-build" "${RUNNER_TEMP}/publication"
          python scripts/verify-publication-artifact.py snapshot "${RUNNER_TEMP}/publication" "${RUNNER_TEMP}/integration-build"
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp
          export IMAGE_COLLISION_SKIP="${RUNNER_TEMP}/integration-build/image-collision-skip.txt"
          find "${RUNNER_TEMP}/publication/assets/images" -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' \) -print0 | xargs -0 -r -P 4 -I{} bash -c '
            src="$1"; grep -Fxq "$src" "$IMAGE_COLLISION_SKIP" && exit 0
            dst="${src%.*}.webp"; [ -e "$dst" ] && exit 0
            cwebp -quiet -mt -q 82 -m 4 "$src" -o "$dst"
          ' _ {}
          python scripts/verify-publication-artifact.py verify "${RUNNER_TEMP}/publication" "${RUNNER_TEMP}/integration-build"
      - name: Materialize publication output for Cloudflare Preview
        run: |
          rsync -a --include='*/' --include='*.html' --exclude='*' "${RUNNER_TEMP}/publication/" ./
          for file in assets/css/article-toc-v2.css assets/js/article-toc-v2.js assets/css/article-end-related.css assets/css/article-end-feedback.css assets/css/article-integration-compat.css assets/js/article-integration-compat.js; do
            mkdir -p "$(dirname "$file")"
            cp "${RUNNER_TEMP}/publication/$file" "$file"
          done
          cp "${RUNNER_TEMP}/publication/articles/plc-basic.html" articles/plc-basic.html
          printf '/*\n  X-Robots-Tag: noindex, noarchive\n' > _headers
          printf 'User-agent: *\nDisallow: /\n' > robots.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' 'articles/*.html' 'en/**/*.html' assets/css/article-toc-v2.css assets/js/article-toc-v2.js assets/css/article-end-related.css assets/css/article-end-feedback.css assets/css/article-integration-compat.css assets/js/article-integration-compat.js '_headers' 'robots.txt' || true
          git commit -m "[final-preview-materialized] production-equivalent PLC publication"
          git push

# trigger publication materialization
