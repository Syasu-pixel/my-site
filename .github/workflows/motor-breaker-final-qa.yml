name: Temporary motor footer diagnostic
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/motor-breaker-final-qa.yml']
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - name: Investigate raster phase without changing source or threshold
        run: |
          cat > "$RUNNER_TEMP/footer-diagnostic.mjs" <<'DIAGNOSTIC'
          // Diagnostic only. Does not alter production files, thresholds, or CI verdicts.
          // Run from repository root: node /path/footer-phase-diagnostic.mjs OUTPUT_DIR
          import {createRequire} from 'node:module';
          import {resolve} from 'node:path';
          import {pathToFileURL} from 'node:url';
          import {readFile,writeFile,mkdir} from 'node:fs/promises';
          const require=createRequire(resolve('package.json'));
          const {chromium}=require('playwright'),{PNG}=require('pngjs');
          const pixelmatch=(await import(pathToFileURL(require.resolve('pixelmatch')))).default;
          const out=resolve(process.argv[2]||'/tmp/footer-phase-diagnostic');await mkdir(out,{recursive:true});
          const modulePath=resolve('scripts/site-shell-phase.mjs');
          const original=await readFile(modulePath,'utf8');
          const needle="bytes=await locator.screenshot({...options,animations:'disabled'});";
          if(original.split(needle).length!==2)throw Error('Unknown source; review instrumentation manually');
          const instrumented=original.replace(needle,"await page.evaluate(()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r))));\n    "+needle);
          await writeFile(resolve(out,'phase-two-frames.mjs'),instrumented);
          const current=await import(pathToFileURL(modulePath));
          const delayed=await import(pathToFileURL(resolve(out,'phase-two-frames.mjs')));
          const heights=[9299.59375,11476.671875,11221.953125];
          const modes=['raw-first','fresh-no-raw','two-frames','initial-inline'];
          const defects=['none','color','position','spacing','clipping','text','link'];
          const footer=`<footer class="site-footer"><div class="container"><p>現場で使う工具と、制御の基本を、迷いにくく整理してまとめています。<br><a href="/privacy-policy/">プライバシーポリシー</a> | <a href="/contact/">お問い合わせ</a></p></div><nav><a href="/profile/">運営者・編集方針</a></nav><p class="disclosure">当サイトはアフィリエイト広告を利用しています。</p></footer>`;
          const css=`*{box-sizing:border-box}body{margin:0;background:linear-gradient(#f8fbff,#f4f7fb);color:#1e293b}footer{padding:26px 0 36px;border-top:1px solid #dae6f4;color:#607691;font:700 12px/1.8 'Hiragino Sans','Yu Gothic',Meiryo,sans-serif;text-align:center}footer .container{width:calc(100% - 20px);margin:auto}footer p{margin:12px 0}footer a{color:blue;text-decoration:none}footer .disclosure{margin:12px auto 0;padding:0 16px;font-size:13px;font-weight:400;line-height:1.7}`;
          function html(height,defect,early){const extra={none:'',color:'footer{color:#ff0000}',position:'footer p{position:relative;left:1px}',spacing:'footer{padding-top:27px}',clipping:'footer{height:80px;overflow:hidden}',text:'',link:''}[defect];let f=footer;if(defect==='text')f=f.replace('迷いにくく','不正な本文');if(defect==='link')f=f.replace('/profile/','/wrong/');return `<!doctype html><meta charset="utf-8"><style>${css}main{height:${height}px}${extra}</style><body><main></main>${f}${early?`<script>const e=document.querySelector('footer');const y=e.getBoundingClientRect().y+scrollY;document.body.style.paddingTop=(Math.ceil(y)-y)+'px';</script>`:''}</body>`;}
          function comparison(a,b){a=PNG.sync.read(a);b=PNG.sync.read(b);if(a.width!==b.width||a.height!==b.height)return {sizeChanged:true,pixels:null};return {sizeChanged:false,pixels:pixelmatch(a.data,b.data,null,a.width,a.height,{threshold:.1,includeAA:false}),exactPixels:pixelmatch(a.data,b.data,null,a.width,a.height,{threshold:0,includeAA:true})};}
          const browser=await chromium.launch({headless:true});const results=[];let undetected=0;
          try{for(const width of [390,1440])for(const mode of modes){let base;
           for(const height of heights)for(const defect of (height===heights[1]?defects:['none'])){
            // Each trial has a brand-new context: no shared raster, font or storage state.
            const c=await browser.newContext({viewport:{width,height:844},deviceScaleFactor:1,locale:'ja-JP',reducedMotion:'reduce'});let page=await c.newPage();await page.route('**/*',r=>r.abort());
            await page.setContent(html(height,defect,false));await page.evaluate(()=>document.fonts.ready);await page.evaluate(()=>scrollTo(0,document.documentElement.scrollHeight));
            const untouched=await current.shellContract(page,'footer.site-footer');
            const key=`${width}-${mode}-${height}-${defect}`;let capture;
            try{
             if(mode==='initial-inline'){
              // Experimental initial-layout capture, not a production replacement. Original
              // contract is retained independently, so content/style defects cannot hide.
              await page.close();page=await c.newPage();await page.route('**/*',r=>r.abort());
              await page.setContent(html(height,defect,true));await page.evaluate(()=>document.fonts.ready);await page.evaluate(()=>scrollTo(0,document.documentElement.scrollHeight));
              capture=await current.capturePhaseStableFooter(page);
              await page.evaluate(()=>document.body.removeAttribute('style'));
              const restored=await current.shellContract(page,'footer.site-footer');
              if(JSON.stringify(restored)!==JSON.stringify(untouched))throw Error('Initial-inline restoration contract mismatch');
              capture.contract=untouched;
             }else{
              if(mode!=='fresh-no-raw')await page.locator('footer').screenshot({path:resolve(out,key+'-raw.png')});
              capture=await(mode==='two-frames'?delayed:current).capturePhaseStableFooter(page);
             }
             await writeFile(resolve(out,key+'.png'),capture.bytes);
             if(!base)base=capture;
             const diff=comparison(base.bytes,capture.bytes),contractChanged=JSON.stringify(base.contract)!==JSON.stringify(capture.contract);
             const detected=contractChanged||diff.sizeChanged||diff.pixels>0;
             if(defect!=='none'&&!detected)undetected++;
             results.push({width,mode,height,defect,...diff,contractChanged,negativeDetected:defect==='none'?null:detected,translationY:capture.translationY});
            }catch(e){results.push({width,mode,height,defect,error:String(e),negativeDetected:defect==='none'?null:true});}
            await c.close();
           }
          }}finally{await browser.close();}
          await writeFile(resolve(out,'results.json'),JSON.stringify({diagnosticOnly:true,threshold:.1,includeAA:false,sourceModule:modulePath,results,undetected},null,2));
          console.log(JSON.stringify({output:out,trials:results.length,undetected}));
          // A nonzero exit means a known negative was hidden. Positive mismatches are
          // observations, never a reason to relax production thresholds in this script.
          if(undetected)process.exitCode=1;
          
          DIAGNOSTIC
          node "$RUNNER_TEMP/footer-diagnostic.mjs" "$RUNNER_TEMP/footer-diagnostic"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motor-footer-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/footer-diagnostic
          retention-days: 30
          if-no-files-found: error
