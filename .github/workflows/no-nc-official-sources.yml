name: NO NC Official Sources
on:
  push:
    branches:
      - preview-no-nc-text-refresh-20260916
    paths:
      - scripts/no-nc-official-sources.py
      - .github/workflows/no-nc-official-sources.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-no-nc-text-refresh-20260916
      - name: Apply official source box
        run: python scripts/no-nc-official-sources.py
      - name: Clean temporary automation and commit
        run: |
          rm -f scripts/no-nc-official-sources.py .github/workflows/no-nc-official-sources.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles/no-nc-basic.html scripts/no-nc-official-sources.py .github/workflows/no-nc-official-sources.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add official sources to NO NC article"
          git push
