name: NO NC Text Refresh

on:
  push:
    branches:
      - preview-no-nc-text-refresh-20260916
    paths:
      - .github/workflows/no-nc-text-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-no-nc-text-refresh-20260916
          fetch-depth: 0
      - name: Apply refresh
        run: python .github/scripts/no-nc-text-refresh.py
      - name: Commit result and remove one-shot files
        run: |
          rm -f .github/scripts/no-nc-text-refresh.py .github/workflows/no-nc-text-refresh.yml
          git config user.name denkicontrol-preview-writer
          git config user.email actions@users.noreply.github.com
          git add articles/no-nc-basic.html docs/existing-article-improvement-backlog.md .github/scripts/no-nc-text-refresh.py .github/workflows/no-nc-text-refresh.yml
          git commit -m "Refresh NO NC article text and related cards"
          git push origin HEAD:preview-no-nc-text-refresh-20260916
