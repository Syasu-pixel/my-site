name: NPN PNP final browser audit

on:
  push:
    branches:
      - preview-npn-pnp-publication-final
    paths:
      - .github/workflows/npn-pnp-final-browser-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-npn-pnp-publication-final

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Audit final Preview
        run: |
          cat > .final-audit.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const url='https://preview-npn-pnp-publication.denkicontrol-preview.pages.dev/articles/npn-pnp-basic.html';
          const browser=await chromium.launch({headless:true});
          const cases=[
            {name:'desktop-light',viewport:{width:1440,height:1000},dark:false},
            {name:'desktop-dark', viewport:{width:1440,height:1000},dark:true},
            {name:'mobile-light', viewport:{width:390,height:844},dark:false},
            {name:'mobile-dark',  viewport:{width:390,height:844},dark:true}
          ];
          const report={url,cases:[]};

          for(const c of cases){
            const context=await browser.newContext({viewport:c.viewport,colorScheme:c.dark?'dark':'light'});
            const page=await context.newPage();
            const requestFailures=[];
            page.on('requestfailed',r=>requestFailures.push({url:r.url(),error:r.failure()?.errorText||''}));

            const res=await page.goto(url,{waitUntil:'networkidle',timeout:90000});
            await page.evaluate(async dark=>{
              localStorage.removeItem('dc-theme-explicit-v2');
              localStorage.removeItem('dc-theme');
              if(dark){
                document.documentElement.dataset.dcTheme='dark';
              }else{
                document.documentElement.dataset.dcTheme='light';
              }
              window.dispatchEvent(new Event('resize'));
              await new Promise(r=>setTimeout(r,600));
            },c.dark);

            const targetImgs=page.locator('img');
            for(let i=0;i<await targetImgs.count();i++){
              const img=targetImgs.nth(i);
              try{
                await img.scrollIntoViewIfNeeded();
                await page.waitForTimeout(80);
              }catch{}
            }
            await page.evaluate(()=>window.scrollTo(0,0));
            await page.waitForTimeout(500);

            const data=await page.evaluate(()=>{
              const allImgs=[...document.images];
              const broken=allImgs.filter(i=>i.complete && i.naturalWidth===0).map(i=>i.src);
              const unloaded=allImgs.filter(i=>!i.complete).map(i=>i.src);
              const html=document.documentElement;
              const body=document.body;
              const header=document.querySelector('.site-header.dc-shell');
              const hero=document.querySelector('.article-hero');
              const figures=[...document.querySelectorAll('.article-figure img')].map(i=>({
                src:i.src,
                naturalWidth:i.naturalWidth,
                naturalHeight:i.naturalHeight,
                rect:{w:i.getBoundingClientRect().width,h:i.getBoundingClientRect().height}
              }));
              const related=[...document.querySelectorAll('.related-card img')].map(i=>({
                src:i.src,
                naturalWidth:i.naturalWidth,
                naturalHeight:i.naturalHeight
              }));
              const avatars=[...document.querySelectorAll('.talk-avatar img')].map(i=>({
                src:i.src,
                naturalWidth:i.naturalWidth,
                naturalHeight:i.naturalHeight
              }));
              const feedback=document.querySelector('#articleFeedbackCard, [id*="articleFeedback"], .article-feedback');
              const support=document.querySelector('.support-card');
              const footer=document.querySelector('.site-footer');
              const toc=document.querySelector('.article-toc-v2, [data-article-toc], .side-rail');
              const overflow=Math.max(html.scrollWidth,body.scrollWidth)-window.innerWidth;
              const hs=header?getComputedStyle(header):null;
              const heroStyle=hero?getComputedStyle(hero,'::before'):null;
              const theme=document.documentElement.dataset.dcTheme||'';
              return {
                title:document.title,
                theme,
                viewport:{w:innerWidth,h:innerHeight},
                overflow,
                header:{
                  exists:!!header,
                  position:hs?.position||null,
                  top:hs?.top||null,
                  zIndex:hs?.zIndex||null,
                  gx:!!document.querySelector('.dc-consult'),
                  search:!!document.querySelector('#dc-search-toggle'),
                  menu:!!document.querySelector('#dc-menu-toggle'),
                  themeToggle:!!document.querySelector('#dc-theme-toggle')
                },
                hero:{
                  exists:!!hero,
                  backgroundImage:heroStyle?.backgroundImage||null,
                  rect:hero?{w:hero.getBoundingClientRect().width,h:hero.getBoundingClientRect().height}:null
                },
                figures,related,avatars,
                broken,unloaded,
                feedback:!!feedback,
                support:!!support,
                footer:!!footer,
                toc:!!toc
              };
            });

            report.cases.push({
              ...c,
              status:res?.status()||0,
              requestFailures,
              ...data
            });
            await context.close();
          }

          fs.writeFileSync('.github/npn-pnp-final-browser-audit.json',JSON.stringify(report,null,2));
          await browser.close();
          JS
          node .final-audit.mjs

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/npn-pnp-final-browser-audit.json
          git commit -m "Preview-only: record NPN PNP final browser audit"
          git push origin HEAD:preview-npn-pnp-publication-final
