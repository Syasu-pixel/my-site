name: NPN PNP preview image diagnostic

on:
  push:
    branches:
      - preview-npn-pnp-publication-final
    paths:
      - .github/workflows/npn-pnp-preview-image-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-npn-pnp-publication-final
      - name: Probe preview image URLs
        shell: bash
        run: |
          set -euo pipefail
          base="https://preview-npn-pnp-publication.denkicontrol-preview.pages.dev"
          report=".github/npn-pnp-preview-image-diagnostic.txt"
          : > "$report"
          for path in             "/articles/npn-pnp-basic.html"             "/assets/images/npn-pnp-basic/npn-pnp-basic-hero.webp"             "/assets/images/npn-pnp-basic/npn-pnp-basic-overview.webp"             "/assets/images/npn-pnp-basic/npn-pnp-basic-comparison.webp"             "/assets/images/npn-pnp-basic/npn-pnp-basic-check-flow.webp"             "/assets/images/npn-pnp-basic/npn-pnp-basic-ogp.webp"
          do
            code="$(curl -L -sS -o /tmp/body -w '%{http_code}' "$base$path" || true)"
            type="$(curl -L -sSI "$base$path" | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type"{print $2}' | tail -1)"
            bytes="$(wc -c </tmp/body | tr -d ' ')"
            printf '%s\t%s\t%s\t%s\n' "$code" "$bytes" "$type" "$path" >> "$report"
          done
      - name: Commit diagnostic report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/npn-pnp-preview-image-diagnostic.txt
          git commit -m "Preview-only: record NPN PNP image probe"
          git push origin HEAD:preview-npn-pnp-publication-final
