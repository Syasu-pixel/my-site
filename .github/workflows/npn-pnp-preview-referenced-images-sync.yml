name: NPN PNP preview referenced images sync

on:
  push:
    branches:
      - preview-npn-pnp-publication-final
    paths:
      - .github/workflows/npn-pnp-preview-referenced-images-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      REVIEW_COPY_ASSETS: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-npn-pnp-publication-final
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          python -m pip install lxml==6.1.1

      - name: Build production-equivalent publication
        run: |
          pnpm check:shells
          node scripts/build-integrated-review.mjs "${RUNNER_TEMP}/integration-build"
          node scripts/build-additional-shells.mjs "${RUNNER_TEMP}/integration-build/additional-shells"
          python scripts/verify-integrated-source.py "${RUNNER_TEMP}/integration-build"
          python scripts/audit-integrated-links.py "${RUNNER_TEMP}/integration-build"
          python scripts/verify-article-end-preservation.py --oracle .github/article-components/end/all-preservation-oracle.json --candidate "${RUNNER_TEMP}/integration-build/candidate" --assets-source . --output "${RUNNER_TEMP}/integration-build/end-independent-checks.json"

          rsync -a ./ _site/             --exclude '_site/'             --exclude '.git/'             --exclude '.github/'             --exclude '/docs/rules/catalog.json'             --exclude 'node_modules/'             --exclude '.netlify/'             --exclude '.wrangler/'             --exclude '.cache/'             --exclude 'tmp/'             --exclude 'temp/'             --exclude '*.zip'             --exclude '*.tar'             --exclude '*.tar.gz'             --exclude '*.7z'             --exclude '*.psd'             --exclude '*.ai'

          node scripts/prepare-integrated-publication.mjs "${RUNNER_TEMP}/integration-build" _site
          python scripts/verify-publication-artifact.py snapshot _site "${RUNNER_TEMP}/integration-build"

      - name: Optimize publication images exactly like production
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp
          export IMAGE_COLLISION_SKIP="${RUNNER_TEMP}/integration-build/image-collision-skip.txt"

          find _site/assets/images -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' \) -print0             | xargs -0 -r -P 4 -I{} bash -c '
                src="$1"
                grep -Fxq "$src" "$IMAGE_COLLISION_SKIP" && exit 0
                dst="${src%.*}.webp"
                [ -e "$dst" ] && exit 0
                cwebp -quiet -mt -q 82 -m 4 "$src" -o "$dst"
              ' _ {}

          python3 - <<'PY'
          from pathlib import Path
          import re, json, os

          root = Path('_site')
          image_root = root / 'assets' / 'images'
          build = Path(os.environ['RUNNER_TEMP']) / 'integration-build'
          keep_originals = set(json.loads((build/'image-collision-plan.json').read_text())['keepOriginals'])
          mapping = {}

          for src in image_root.rglob('*'):
              if not src.is_file() or src.suffix.lower() not in {'.png', '.jpg', '.jpeg'}:
                  continue
              if src.relative_to(root).as_posix() in keep_originals:
                  continue
              dst = src.with_suffix('.webp')
              if dst.exists() and dst.stat().st_size > 0:
                  mapping[src.relative_to(root).as_posix()] = dst.relative_to(root).as_posix()

          text_exts = {'.html', '.css', '.js', '.json', '.xml'}
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in text_exts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              new = text
              for old, replacement in mapping.items():
                  new = new.replace('/' + old, '/' + replacement)
                  new = new.replace(old, replacement)
              if new != text:
                  path.write_text(new, encoding='utf-8')

          for old in mapping:
              src = root / old
              if src.exists():
                  src.unlink()

          (build/'published-image-mapping.json').write_text(json.dumps(mapping), encoding='utf-8')
          PY

          python scripts/verify-publication-artifact.py verify _site "${RUNNER_TEMP}/integration-build"

      - name: Sync only images referenced by final NPN PNP article
        run: |
          cp _site/articles/npn-pnp-basic.html articles/npn-pnp-basic.html
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil

          root = Path('_site')
          article = root / 'articles/npn-pnp-basic.html'
          text = article.read_text(encoding='utf-8')

          refs = sorted(set(re.findall(r'assets/images/[^\s"\'()<>?#]+', text)))
          copied = []
          missing = []

          for rel in refs:
              rel = rel.lstrip('/')
              src = root / rel
              if not src.is_file():
                  missing.append(rel)
                  continue
              dst = Path(rel)
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)
              copied.append(rel)

          if missing:
              print('Missing referenced images:')
              print('\n'.join(missing))
              raise SystemExit(1)

          print('Copied referenced images:')
          print('\n'.join(copied))
          PY

      - name: Verify no local image reference is missing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path('articles/npn-pnp-basic.html').read_text(encoding='utf-8')
          refs = sorted(set(re.findall(r'assets/images/[^\s"\'()<>?#]+', text)))
          missing = [r for r in refs if not Path(r.lstrip('/')).is_file()]
          if missing:
              print('\n'.join(missing))
              raise SystemExit(1)
          print(f'All {len(refs)} referenced images exist in preview branch.')
          PY

      - name: Commit preview-only referenced images and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles/npn-pnp-basic.html assets/images
          git rm .github/workflows/npn-pnp-preview-referenced-images-sync.yml
          git commit -m "Preview-only: sync NPN PNP referenced publication images"
          git push origin HEAD:preview-npn-pnp-publication-final
