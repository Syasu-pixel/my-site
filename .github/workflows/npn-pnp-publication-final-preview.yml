name: NPN PNP publication final preview

on:
  push:
    branches:
      - preview-npn-pnp-publication-final
    paths:
      - .github/workflows/npn-pnp-publication-final-preview.yml

permissions:
  contents: write

jobs:
  build-and-materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      REVIEW_COPY_ASSETS: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-npn-pnp-publication-final
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          python -m pip install lxml==6.1.1

      - name: Verify current shared shells
        run: pnpm check:shells

      - name: Build integrated review
        run: |
          node scripts/build-integrated-review.mjs "${RUNNER_TEMP}/integration-build"
          node scripts/build-additional-shells.mjs "${RUNNER_TEMP}/integration-build/additional-shells"
          python scripts/verify-integrated-source.py "${RUNNER_TEMP}/integration-build"
          python scripts/audit-integrated-links.py "${RUNNER_TEMP}/integration-build"
          python scripts/verify-article-end-preservation.py --oracle .github/article-components/end/all-preservation-oracle.json --candidate "${RUNNER_TEMP}/integration-build/candidate" --assets-source . --output "${RUNNER_TEMP}/integration-build/end-independent-checks.json"
          node scripts/check-component-regeneration.mjs "${RUNNER_TEMP}/integration-build"
          node scripts/check-integrated-publication.mjs "${RUNNER_TEMP}/integration-build"
          python scripts/test-publication-artifact.py

      - name: Prepare standalone publication
        run: |
          rsync -a ./ _site/             --exclude '_site/'             --exclude '.git/'             --exclude '.github/'             --exclude '/docs/rules/catalog.json'             --exclude 'node_modules/'             --exclude '.netlify/'             --exclude '.wrangler/'             --exclude '.cache/'             --exclude 'tmp/'             --exclude 'temp/'             --exclude '*.zip'             --exclude '*.tar'             --exclude '*.tar.gz'             --exclude '*.7z'             --exclude '*.psd'             --exclude '*.ai'
          node scripts/prepare-integrated-publication.mjs "${RUNNER_TEMP}/integration-build" _site
          python scripts/verify-publication-artifact.py snapshot _site "${RUNNER_TEMP}/integration-build"

      - name: Optimize publication images to WebP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp
          export IMAGE_COLLISION_SKIP="${RUNNER_TEMP}/integration-build/image-collision-skip.txt"

          find _site/assets/images -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' \) -print0             | xargs -0 -r -P 4 -I{} bash -c '
                src="$1"
                grep -Fxq "$src" "$IMAGE_COLLISION_SKIP" && exit 0
                dst="${src%.*}.webp"
                [ -e "$dst" ] && exit 0
                cwebp -quiet -mt -q 82 -m 4 "$src" -o "$dst"
              ' _ {}

          python3 - <<'PY'
          from pathlib import Path
          import re, json, os

          root = Path('_site')
          image_root = root / 'assets' / 'images'
          mapping = {}
          build = Path(os.environ['RUNNER_TEMP']) / 'integration-build'
          keep_originals = set(json.loads((build/'image-collision-plan.json').read_text())['keepOriginals'])

          for src in image_root.rglob('*'):
              if not src.is_file() or src.suffix.lower() not in {'.png', '.jpg', '.jpeg'}:
                  continue
              if src.relative_to(root).as_posix() in keep_originals:
                  continue
              dst = src.with_suffix('.webp')
              if dst.exists() and dst.stat().st_size > 0:
                  mapping[src.relative_to(root).as_posix()] = dst.relative_to(root).as_posix()

          (build/'published-image-mapping.json').write_text(json.dumps(mapping), encoding='utf-8')
          text_exts = {'.html', '.css', '.js', '.json', '.xml'}
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in text_exts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              new = text
              for old, replacement in mapping.items():
                  new = new.replace('/' + old, '/' + replacement)
                  new = new.replace(old, replacement)
              if new != text:
                  path.write_text(new, encoding='utf-8')

          for old in mapping:
              src = root / old
              if src.exists():
                  src.unlink()

          stale = []
          pattern = re.compile(r'assets/images/[^\s"\'<>?#]+\.(?:png|jpe?g)', re.I)
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in text_exts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for match in pattern.findall(text):
                  if not (root / match.lstrip('/')).exists():
                      stale.append(f'{path}: {match}')
          if stale:
              print('\n'.join(stale[:100]))
              raise SystemExit(1)
          PY

      - name: Verify final publication
        run: python scripts/verify-publication-artifact.py verify _site "${RUNNER_TEMP}/integration-build"

      - name: Materialize production-equivalent preview files
        run: |
          cp _site/articles/npn-pnp-basic.html articles/npn-pnp-basic.html

          mkdir -p assets/css assets/js assets/images/npn-pnp-basic
          cp _site/assets/css/article-toc-v2.css assets/css/article-toc-v2.css
          cp _site/assets/js/article-toc-v2.js assets/js/article-toc-v2.js
          cp _site/assets/css/article-end-related.css assets/css/article-end-related.css
          cp _site/assets/css/article-end-feedback.css assets/css/article-end-feedback.css
          cp _site/assets/css/article-integration-compat.css assets/css/article-integration-compat.css
          cp _site/assets/js/article-integration-compat.js assets/js/article-integration-compat.js

          rm -rf assets/images/npn-pnp-basic
          cp -a _site/assets/images/npn-pnp-basic assets/images/npn-pnp-basic

      - name: Verify integrated markers
        run: |
          grep -q 'class="site-header dc-shell"' articles/npn-pnp-basic.html
          grep -q 'id="dc-search-toggle"' articles/npn-pnp-basic.html
          grep -q 'id="dc-menu-toggle"' articles/npn-pnp-basic.html
          grep -q 'GX Works2' articles/npn-pnp-basic.html
          grep -q 'article-end-feedback.css' articles/npn-pnp-basic.html
          grep -q 'article-end-related.css' articles/npn-pnp-basic.html
          grep -q 'articleFeedbackCard' articles/npn-pnp-basic.html
          grep -q 'article-toc-v2.css' articles/npn-pnp-basic.html
          grep -q 'npn-pnp-basic-hero.webp' articles/npn-pnp-basic.html

      - name: Commit preview-only publication and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles/npn-pnp-basic.html assets/css/article-toc-v2.css assets/js/article-toc-v2.js assets/css/article-end-related.css assets/css/article-end-feedback.css assets/css/article-integration-compat.css assets/js/article-integration-compat.js assets/images/npn-pnp-basic
          git rm .github/workflows/npn-pnp-publication-final-preview.yml
          git commit -m "Preview-only: materialize NPN PNP publication [publication-final]"
          git push origin HEAD:preview-npn-pnp-publication-final
