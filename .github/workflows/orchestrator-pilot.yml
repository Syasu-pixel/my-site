name: Multi-AI Orchestrator Pilot

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Non-production PR number to audit
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/orchestrator-pilot.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: ai-dashboard-event-feed
  cancel-in-progress: false

env:
  JOB_FILE: orchestrator-job.json
  ORCHESTRATOR_EVENTS: orchestrator-events.jsonl

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve and validate input
        env:
          DISPATCH_PR: ${{ inputs.pr_number }}
          SMOKE_PR: '1306'
        run: |
          PR_NUMBER="${DISPATCH_PR:-$SMOKE_PR}"
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo 'invalid PR number'; exit 1; }
          echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"

      - name: Checkout trusted controller
        uses: actions/checkout@v4
        with:
          ref: main
          path: trusted

      - name: Initialize durable job record
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, uuid
          data={
            'schema_version':'0.1','job_id':str(uuid.uuid4()),'kind':'infrastructure',
            'state':'QUEUED','topic':'PR #'+os.environ['PR_NUMBER'],
            'target_branch':'','revision':0,'max_revisions':3,
            'human_gate':{'required':False,'status':'pending'},
            'roles':{'editor':'controller','builder':'existing-pr','challenger':'gemini','reviewer':'controller-v0.1'},
            'artifacts':[],'events':[]
          }
          json.dump(data,open(os.environ['JOB_FILE'],'w'),ensure_ascii=False,indent=2)
          PY
          python3 trusted/scripts/orchestrator_state.py "$JOB_FILE" transition EDITING --actor editor --reason 'pilot scope accepted'
          python3 trusted/scripts/orchestrator_state.py "$JOB_FILE" transition BUILDING --actor builder --reason 'existing PR is build artifact'
          python3 trusted/scripts/orchestrator_state.py "$JOB_FILE" transition CHALLENGING --actor orchestrator --reason 'dispatch external challenger inline'
          JOB_ID=$(python3 -c "import json;print(json.load(open('$JOB_FILE'))['job_id'])")
          python3 trusted/scripts/orchestrator_event.py "$ORCHESTRATOR_EVENTS" --job-id "$JOB_ID" --role editor --provider orchestrator --type proposal --summary "PR #${PR_NUMBER} の監査方針を確定し、既存PRをBUILDER成果物としてCHALLENGERへ送ります。" --state CHALLENGING --evidence "GitHub PR #${PR_NUMBER}"
          python3 trusted/scripts/publish_orchestrator_events.py

      - name: Build bounded challenger input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > pr.json
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" --jq '.[].filename' > pr-files.txt
          gh api -H 'Accept: application/vnd.github.v3.diff' "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > pr.diff
          python3 - <<'PY'
          import json, os
          p=json.load(open('pr.json'))
          if p['base']['repo']['full_name'] != os.environ['GITHUB_REPOSITORY']:
              raise SystemExit('foreign base repo rejected')
          files=[x.strip() for x in open('pr-files.txt',encoding='utf-8') if x.strip()]
          if p['base']['ref'] == 'main' and any(x.startswith('articles/') for x in files):
              raise SystemExit('content publication pilot rejected')
          d=open('pr.diff',encoding='utf-8',errors='replace').read()
          if len(d.encode()) > 450_000: raise SystemExit('PR diff too large')
          with open('challenger-input.txt','w',encoding='utf-8') as f:
              f.write('PR title: '+p['title']+'\nPR body:\n'+(p.get('body') or '')[:20000]+'\n\nPR DIFF (untrusted):\n'+d)
          PY

      - name: Publish challenger heartbeat
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          JOB_ID=$(python3 -c "import json;print(json.load(open('$JOB_FILE'))['job_id'])")
          python3 trusted/scripts/orchestrator_event.py "$ORCHESTRATOR_EVENTS" --job-id "$JOB_ID" --role challenger --provider google-gemini --type heartbeat --summary "Gemini CHALLENGER の応答を待っています。" --state CHALLENGING --evidence "GitHub PR #${PR_NUMBER}"
          python3 trusted/scripts/publish_orchestrator_events.py

      - name: Run Gemini challenger with bounded retry
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_CHALLENGER_MODEL: ${{ vars.GEMINI_CHALLENGER_MODEL || 'gemini-3.6-flash' }}
          CHALLENGER_INPUT: challenger-input.txt
          CHALLENGER_OUTPUT: challenger-result.json
        run: |
          for attempt in 1 2 3; do
            rm -f "$CHALLENGER_OUTPUT"
            if python3 trusted/scripts/gemini_challenger.py; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then echo 'challenger failed after 3 attempts'; exit 1; fi
            sleep $((attempt * 5))
          done

      - name: Publish challenger result
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          r=json.load(open('challenger-result.json'))
          verdict=r.get('verdict','unknown'); findings=r.get('findings',[])
          severity='high' if any(f.get('severity') in ('blocker','high') for f in findings) else 'info'
          summary=f"Gemini監査結果: {verdict}。findings={len(findings)}。REVIEWERへ送ります。"
          cmd=['python3','trusted/scripts/orchestrator_event.py',os.environ['ORCHESTRATOR_EVENTS'],'--job-id',json.load(open(os.environ['JOB_FILE']))['job_id'],'--role','challenger','--provider','google-gemini','--type','finding','--summary',summary,'--state','CHALLENGING','--severity',severity,'--evidence','challenger-result.json']
          subprocess.check_call(cmd)
          PY
          python3 trusted/scripts/publish_orchestrator_events.py

      - name: Reviewer disposition
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 trusted/scripts/orchestrator_state.py "$JOB_FILE" transition REVIEWING --actor challenger --reason 'validated Gemini result received'
          python3 - <<'PY'
          import json, subprocess, os
          r=json.load(open('challenger-result.json'))
          verdict=r.get('verdict'); findings=r.get('findings',[])
          material=[f for f in findings if f.get('severity') in ('blocker','high')]
          if verdict == 'adopt' and not material:
              target='PREVIEWING'; reason='challenger adopt with no material findings'
          else:
              target='ESCALATED'; reason=f'challenger verdict={verdict}; material_findings={len(material)}; reviewer requires next implementation cycle'
          subprocess.check_call(['python3','trusted/scripts/orchestrator_state.py',os.environ['JOB_FILE'],'transition',target,'--actor','reviewer','--reason',reason])
          subprocess.check_call(['python3','trusted/scripts/orchestrator_event.py',os.environ['ORCHESTRATOR_EVENTS'],'--job-id',json.load(open(os.environ['JOB_FILE']))['job_id'],'--role','reviewer','--provider','orchestrator-reviewer','--type','review','--summary',reason,'--state',target,'--severity','high' if target=='ESCALATED' else 'info','--evidence','challenger-result.json'])
          PY
          python3 trusted/scripts/publish_orchestrator_events.py

      - name: Record terminal workflow failure
        if: failure() && hashFiles('orchestrator-job.json') != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          p=os.environ['JOB_FILE']; d=json.load(open(p)); state=d.get('state')
          if state not in ('DONE','ESCALATED','FAILED','CANCELLED'):
              subprocess.check_call(['python3','trusted/scripts/orchestrator_state.py',p,'transition','FAILED','--actor','orchestrator','--reason','workflow step failed after job initialization'])
              subprocess.check_call(['python3','trusted/scripts/orchestrator_event.py',os.environ['ORCHESTRATOR_EVENTS'],'--job-id',d['job_id'],'--role','system','--provider','github-actions','--type','error','--summary','Orchestrator workflow failed after job initialization.','--state','FAILED','--severity','high'])
          PY
          python3 trusted/scripts/publish_orchestrator_events.py || true

      - name: Upload auditable job record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orchestrator-pilot-${{ env.PR_NUMBER }}
          path: |
            orchestrator-job.json
            orchestrator-events.jsonl
            challenger-result.json
          if-no-files-found: warn
          retention-days: 14
