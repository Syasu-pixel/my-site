name: Orchestrator state tests

on:
  pull_request:
    paths:
      - 'scripts/orchestrator_state.py'
      - 'scripts/test_orchestrator_state.py'
      - '.github/workflows/orchestrator-state-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run state-machine tests
        run: python3 -m unittest scripts/test_orchestrator_state.py -v
