name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages artifact
        run: |
          rsync -a ./ _site/ \
            --exclude '_site/' \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude '.netlify/' \
            --exclude '.wrangler/' \
            --exclude '.cache/' \
            --exclude 'tmp/' \
            --exclude 'temp/' \
            --exclude '*.zip' \
            --exclude '*.tar' \
            --exclude '*.tar.gz' \
            --exclude '*.7z' \
            --exclude '*.psd' \
            --exclude '*.ai'
          echo 'Prepared Pages artifact:'
          du -sh _site

          echo 'Largest top-level paths:'
          du -sh _site/* _site/.[!.]* 2>/dev/null | sort -hr | head -40 || true

          echo 'Largest files:'
          find _site -type f -printf '%s\t%p\n' 2>/dev/null | sort -nr | head -60 | numfmt --field=1 --to=iec-i --suffix=B || true

          echo 'Largest asset subdirectories:'
          find _site/assets -mindepth 1 -maxdepth 3 -type d -print0 2>/dev/null \
            | xargs -0 -r du -sh 2>/dev/null \
            | sort -hr | head -60 || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
