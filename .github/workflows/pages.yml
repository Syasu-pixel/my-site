name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node for shared shell verification
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'

      - name: Refuse stale generated headers and footers
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm check:shells

      - name: Generate and verify approved article components
        env:
          REVIEW_COPY_ASSETS: '0'
        run: |
          python -m pip install lxml==6.1.1
          node scripts/build-integrated-review.mjs "${RUNNER_TEMP}/integration-build"
          python scripts/verify-integrated-source.py "${RUNNER_TEMP}/integration-build"
          python scripts/audit-integrated-links.py "${RUNNER_TEMP}/integration-build"
          python scripts/verify-article-end-preservation.py --oracle .github/article-components/end/all-preservation-oracle.json --candidate "${RUNNER_TEMP}/integration-build/candidate" --assets-source . --output "${RUNNER_TEMP}/integration-build/end-independent-checks.json"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages artifact
        run: |
          rsync -a ./ _site/ \
            --exclude '_site/' \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude '.netlify/' \
            --exclude '.wrangler/' \
            --exclude '.cache/' \
            --exclude 'tmp/' \
            --exclude 'temp/' \
            --exclude '*.zip' \
            --exclude '*.tar' \
            --exclude '*.tar.gz' \
            --exclude '*.7z' \
            --exclude '*.psd' \
            --exclude '*.ai'

          node scripts/prepare-integrated-publication.mjs "${RUNNER_TEMP}/integration-build" _site
          python scripts/verify-publication-artifact.py snapshot _site "${RUNNER_TEMP}/integration-build"

          echo 'Before image optimization:'
          du -sh _site _site/assets/images

      - name: Optimize published images to WebP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp
          export IMAGE_COLLISION_SKIP="${RUNNER_TEMP}/integration-build/image-collision-skip.txt"

          # Convert PNG/JPEG assets in the publish copy only. The repository originals
          # remain untouched until the optimized deployment has been verified.
          find _site/assets/images -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' \) -print0 \
            | xargs -0 -r -P 4 -I{} bash -c '
                src="$1"
                grep -Fxq "$src" "$IMAGE_COLLISION_SKIP" && exit 0
                dst="${src%.*}.webp"
                [ -e "$dst" ] && exit 0
                cwebp -quiet -mt -q 82 -m 4 "$src" -o "$dst"
              ' _ {}

          python3 - <<'PY'
          from pathlib import Path
          import re, json, os

          root = Path('_site')
          image_root = root / 'assets' / 'images'
          mapping = {}
          build = Path(os.environ['RUNNER_TEMP']) / 'integration-build'
          keep_originals = set(json.loads((build/'image-collision-plan.json').read_text())['keepOriginals'])
          for src in image_root.rglob('*'):
              if not src.is_file() or src.suffix.lower() not in {'.png', '.jpg', '.jpeg'}:
                  continue
              if src.relative_to(root).as_posix() in keep_originals:
                  continue
              dst = src.with_suffix('.webp')
              if dst.exists() and dst.stat().st_size > 0:
                  rel_src = src.relative_to(root).as_posix()
                  rel_dst = dst.relative_to(root).as_posix()
                  mapping[rel_src] = rel_dst
          (build/'published-image-mapping.json').write_text(json.dumps(mapping), encoding='utf-8')

          # Only rewrite files that can affect the published site. Internal Markdown/TXT
          # docs contain example placeholders such as {slug} and must not be treated as
          # live asset references.
          text_exts = {'.html', '.css', '.js', '.json', '.xml'}
          changed = 0
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in text_exts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              new = text
              for old, replacement in mapping.items():
                  new = new.replace('/' + old, '/' + replacement)
                  new = new.replace(old, replacement)
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed += 1

          # Remove originals only from the generated publish copy and only when a
          # valid WebP counterpart exists.
          removed = 0
          for old in mapping:
              src = root / old
              if src.exists():
                  src.unlink()
                  removed += 1

          # Guard against stale references in actual published web files only.
          stale = []
          pattern = re.compile(r'assets/images/[^\s"\'<>?#]+\.(?:png|jpe?g)', re.I)
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in text_exts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for match in pattern.findall(text):
                  candidate = root / match.lstrip('/')
                  if not candidate.exists():
                      stale.append(f'{path}: {match}')

          print(f'Converted images: {len(mapping)}')
          print(f'Updated published files: {changed}')
          print(f'Removed publish-copy originals: {removed}')
          if stale:
              print('Stale image references detected in published files:')
              print('\n'.join(stale[:100]))
              raise SystemExit(1)
          PY

          echo 'After image optimization:'
          du -sh _site _site/assets/images

          # GitHub Pages published sites must remain below 1 GB. Keep headroom so
          # future articles cannot silently cross the limit.
          bytes=$(du -sb _site | cut -f1)
          limit=$((900 * 1024 * 1024))
          echo "Published artifact bytes: $bytes"
          if [ "$bytes" -ge "$limit" ]; then
            echo "ERROR: optimized Pages artifact is still >= 900 MiB; refusing oversized deploy."
            exit 1
          fi

      - name: Verify final standalone publication
        run: python scripts/verify-publication-artifact.py verify _site "${RUNNER_TEMP}/integration-build"

      - name: Save publication verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-verification-${{ github.sha }}
          path: |
            ${{ runner.temp }}/integration-build/publication-checks.json
            ${{ runner.temp }}/integration-build/publication-final-checks.json
            ${{ runner.temp }}/integration-build/published-image-mapping.json
            ${{ runner.temp }}/integration-build/image-collision-plan.json
          retention-days: 30

      - name: Upload artifact
        # The deploy step is unreachable unless the standalone artifact passes.
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
