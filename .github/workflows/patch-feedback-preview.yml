name: Patch feedback preview
on:
  push:
    branches: [preview-article-feedback-rollout]
    paths: ['.github/workflows/patch-feedback-preview.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-article-feedback-rollout
      - name: Apply narrow feedback-only patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('assets/js/site-search.js')
          s = p.read_text(encoding='utf-8')
          old = "script.src = '/assets/js/article-feedback.js?v=20260916-5';"
          new = "script.src = '/assets/js/article-feedback.js?v=20260916-6';"
          if old not in s:
              raise SystemExit('site-search feedback loader marker not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('articles/plc-drilling-line-design-project-01.html')
          s = p.read_text(encoding='utf-8')
          old = '../assets/js/article-feedback.js?v=20260916-5'
          new = '../assets/js/article-feedback.js?v=20260916-6'
          if old not in s:
              raise SystemExit('PLC feedback script marker not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('articles/fa-engineer-skill-map-career.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script src="../assets/js/article-feedback.js?v=20260916-6" defer></script>'
          if marker not in s:
              if '</body>' not in s:
                  raise SystemExit('skill-map closing body not found')
              s = s.replace('</body>', f'{marker}\n</body>', 1)
              p.write_text(s, encoding='utf-8')

          Path('.github/workflows/patch-feedback-preview.yml').unlink()
          PY
      - name: Verify scope
        run: |
          git diff --name-only
          test "$(git diff --name-only | sort | tr '\n' ' ')" = ".github/workflows/patch-feedback-preview.yml articles/fa-engineer-skill-map-career.html articles/plc-drilling-line-design-project-01.html assets/js/site-search.js "
      - name: Commit patch
        run: |
          git config user.name 'Syasu-pixel'
          git config user.email 'syasuta0819@gmail.com'
          git add -A
          git commit -m 'Preview: cover feedback loader edge cases'
          git push origin HEAD:preview-article-feedback-rollout
