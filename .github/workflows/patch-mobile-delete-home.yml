name: Patch mobile delete home transition
on:
  push:
    branches: [fix/mobile-delete-return-home]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-delete-return-home
      - name: Patch delete success flow
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ai-editorial-dashboard/command-center.js')
          s=p.read_text()
          old="manualSelection=false;await refresh();selectedJob=null;manualSelection=false;if(typeof window.render==='function')window.render()"
          new="selectedJob=null;manualSelection=false;try{const box=document.querySelector('#events');if(box){box.dataset.job='__home__'}}catch(_){};await refresh();selectedJob=null;manualSelection=false;if(typeof window.render==='function')window.render();requestAnimationFrame(()=>{selectedJob=null;manualSelection=false;try{if(typeof window.render==='function')window.render()}catch(_){}})"
          if old not in s:
              raise SystemExit('target delete flow not found')
          s=s.replace(old,new,1)
          s=s.replace("version.textContent='chat v0.7.10'","version.textContent='chat v0.7.13'",1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ai-editorial-dashboard/command-center.js
          git commit -m "fix: return to editorial home immediately after queue deletion"
          git push
