name: Patch terminal block jumper PR 1411

on:
  push:
    branches:
      - preview-terminal-block-jumper-audit-20260911

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused article audit fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          article_path = Path('articles/terminal-block-jumper-basic.html')
          text = article_path.read_text(encoding='utf-8')

          replacements = {
              'これは「同じ電源や同じコモンを分けている」ことが多いです。': 'これは、電源やコモンなどの同じ電位を分岐している場合があります。実際の用途は、図面・端子番号・機器仕様と合わせて確認します。',
              '渡り線・ジャンパーは、端子台で電源やコモンを分けるためのつなぎです。1つの電源を複数の端子へ配るときに使う、と考えると分かりやすいです。': '渡り線・ジャンパーは、端子台で同じ電位を複数端子へ共通化・分岐する方法の一つです。用途や接続範囲は、端子台と回路の仕様に合わせて確認します。',
              '端子台で隣同士がつながっている時は、だいたい電源やコモンを分けていることが多いよ。どこからどこまで同じ電位かを見るのが大事だね。': '端子台で隣同士がつながっている時は、電源やコモンの分岐に使われている場合があるよ。どこからどこまで同じ電位かを図面と実物で確認するのが大事だね。',
              'ジャンパーバーやショートバーは、端子台専用の部品で複数端子をまとめて接続します。\n            見た目がすっきりしやすく、同じ端子台シリーズでは扱いやすいことがあります。': 'ジャンパーバーやショートバーは、端子台専用の部品で複数端子をまとめて接続します。\n            対応する端子台シリーズ、ピッチ、極数などが決まっているため、メーカーの適合情報を確認して選びます。許容電流もジャンパー単体の代表値だけで判断せず、組み合わせる端子台側の仕様を確認します。',
              '<td>端子への入れすぎ、締付、線番に注意</td>': '<td>1端子への複数導体接続の可否、締付、線番を製品仕様で確認</td>',
              '基本の流れは、電源、保護機器、端子台、渡り線・ジャンパー、各負荷の順です。\n            まずどこから電源が入っているかを確認し、そこからどの端子へ渡っているかを追います。': '代表的な見方の一例として、電源、保護機器、端子台、渡り線・ジャンパー、各負荷の順に追うと整理しやすい場合があります。\n            実際の回路構成は盤や機器によって異なるため、まず図面で電源の入り口と保護範囲を確認し、そこからどの端子へ渡っているかを追います。',
              '<h3>端子の締付</h3>\n              <p>渡り線が緩んでいないか、端子に正しく入っているかを見ます。</p>': '<h3>端子の接続条件</h3>\n              <p>渡り線が緩んでいないかに加え、1端子に複数導体を接続できる製品か、指定された導体本数・サイズ・締付条件に合っているかを確認します。</p>',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected text not found: {old[:80]}')
              text = text.replace(old, new, 1)

          related_marker = '        <section class="section-card" id="related">\n'
          sources = '''        <section class="section-card" id="sources">\n          <h2>メーカー公式資料で確認するポイント</h2>\n          <p>\n            専用ジャンパーは、端子台シリーズやピッチ、極数などの適合条件を確認して使います。\n            また、ジャンパーの電流値は組み合わせる端子台によって変わる場合があるため、ジャンパー単体の代表値だけで決めず、端子台側のアクセサリ仕様まで確認します。\n          </p>\n          <ul class="simple-list">\n            <li><a href="https://www.phoenixcontact.com/en-us/products/jumper-fbs-135-8-3032389" target="_blank" rel="noopener noreferrer">Phoenix Contact：FBS 1/3/5-8 Plug-in bridge（公式製品情報）</a></li>\n            <li><a href="https://www.wago.com/global/industries/building-technology/electrical-installers/helpful-tips/application-tips-rail-mount-terminal-blocks" target="_blank" rel="noopener noreferrer">WAGO：Tips and Responsibilities for Using Rail-Mount Terminal Blocks（公式）</a></li>\n          </ul>\n          <div class="field-highlight">\n            <h3>型式ごとの仕様を優先</h3>\n            <p>\n              実際の選定では、端子台本体とジャンパーの最新カタログ・製品ページ・取扱説明書を優先してください。型式固有の適合条件や電流値を、別シリーズへそのまま一般化しないことが重要です。\n            </p>\n          </div>\n        </section>\n\n'''
          if related_marker not in text:
              raise SystemExit('Related section marker not found')
          text = text.replace(related_marker, sources + related_marker, 1)

          article_path.write_text(text, encoding='utf-8')

          audit_path = Path('docs/terminal-block-jumper-audit-2026-09-11.md')
          audit = audit_path.read_text(encoding='utf-8')
          note = '''\n## 実装修正\n- 端子台の用途を一律化しない表現へ調整。\n- 専用ジャンパーは端子台シリーズ・ピッチ・極数などの適合確認を明記。\n- 許容電流はジャンパー単体の代表値だけで一般化せず、組み合わせる端子台側の仕様確認を明記。\n- 1端子への複数導体接続は製品仕様で可否・導体本数・サイズ・締付条件を確認する表現へ調整。\n- 「電源→保護機器→端子台→ジャンパー→負荷」は代表的な見方の一例へ弱めた。\n- Phoenix Contact / WAGO の公式一次資料導線を記事内に追加。\n- 固定ヘッダー、3カラム/右レール、先輩・後輩会話、支援導線、既存画像構成は維持。\n\nPreview確認前のため safe to merge: NO\n'''
          if '## 実装修正' not in audit:
              audit_path.write_text(audit.rstrip() + '\n' + note, encoding='utf-8')
          PY

      - name: Sanity checks
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('articles/terminal-block-jumper-basic.html')
          t = p.read_text(encoding='utf-8')
          required = [
            'https://denkicontrol.com/articles/terminal-block-jumper-basic.html',
            'terminal-block-jumper-basic-overview.png',
            'terminal-block-jumper-basic-comparison.png',
            'terminal-block-jumper-basic-branch-flow.png',
            'https://buymeacoffee.com/denkicontrol',
            'https://www.paypal.com/paypalme/denkicontrol',
            'id="sources"',
            '代表的な見方の一例として',
            '1端子への複数導体接続の可否',
          ]
          missing = [x for x in required if x not in t]
          if missing:
              raise SystemExit('Missing required markers: ' + repr(missing))
          if 'https://denki-control.com' in t or 'syasu-pixel.github.io/my-site' in t:
              raise SystemExit('Forbidden production domain found')
          print('sanity checks passed')
          PY

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-terminal-block-jumper-pr1411.yml
          git add articles/terminal-block-jumper-basic.html docs/terminal-block-jumper-audit-2026-09-11.md
          git commit -m "Refine terminal block jumper article audit"
          git push
