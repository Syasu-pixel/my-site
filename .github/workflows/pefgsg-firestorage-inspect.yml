name: PE FG SG asset transfer inspect
on:
  push:
    branches: [preview-pe-fg-sg-20260910]
    paths:
      - '.github/workflows/pefgsg-firestorage-inspect.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect firestorage client chunks
        shell: bash
        run: |
          set -euxo pipefail
          base='https://firestorage.ai'
          curl -LfsS "$base/ja/f/s5coTINZYIVD" -o page.html
          grep -Eo '/_next/static/chunks/[^" ]+\.js' page.html | sort -u > chunks.txt
          : > all.js
          while IFS= read -r c; do curl -LfsS "$base$c" >> all.js || true; echo >> all.js; done < chunks.txt
          echo '--- interesting strings ---'
          python - <<'PY'
import re
s=open('all.js',encoding='utf-8',errors='ignore').read()
for pat in [r'.{0,180}/api/.{0,260}',r'.{0,180}download.{0,260}',r'.{0,180}shareId.{0,260}',r'.{0,180}publicId.{0,260}',r'.{0,180}presign.{0,260}',r'.{0,180}signed.{0,260}']:
  print('\nPAT',pat)
  for m in list(re.finditer(pat,s,re.I))[:100]: print(m.group(0))
PY