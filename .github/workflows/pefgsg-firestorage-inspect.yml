name: PE FG SG asset transfer inspect
on:
  push:
    branches: [preview-pe-fg-sg-20260910]
    paths:
      - '.github/workflows/pefgsg-firestorage-inspect.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect firestorage app bundle
        shell: bash
        run: |
          set -euxo pipefail
          base='https://firestorage.ai'
          curl -LfsS "$base/ja/f/s5coTINZYIVD" -o page.html
          chunk=$(grep -Eo '/_next/static/chunks/app/[^" ]+\.js' page.html | grep '/ja/f/' | head -1)
          echo "chunk=$chunk"
          curl -LfsS "$base$chunk" -o app.js
          echo '--- endpoints and download strings ---'
          grep -Eo '.{0,140}(download|shareId|publicId|fileId|presign|signed|api/).{0,220}' app.js | head -300 || true
          echo '--- URL-like paths ---'
          grep -Eo '["'"'"'][^"'"'"']*(api|download|share|file)[^"'"'"']*["'"'"']' app.js | head -300 || true