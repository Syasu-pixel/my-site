name: PE FG SG related card images
on:
  push:
    branches: [preview-pe-fg-sg-20260910]
    paths:
      - '.github/workflows/pefgsg-related-card-images.yml'
permissions:
  contents: write
jobs:
  update-related-cards:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-pe-fg-sg-20260910
      - name: Add image thumbnails to related article cards
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p=Path('articles/pe-fg-sg-difference-basic.html')
          s=p.read_text(encoding='utf-8')
          start=s.index('<section class="section-card" aria-labelledby="related-title">')
          end=s.index('</section>', start)+len('</section>')
          new=(
              '<section class="section-card" aria-labelledby="related-title">\n'
              '        <h2 id="related-title">あわせて読みたい記事</h2>\n'
              '        <div class="related-grid related-grid--visual">\n'
              '          <a class="related-card related-card--visual" href="control-panel-grounding-basic.html">\n'
              '            <span class="related-card-media"><img src="../assets/images/control-panel-grounding-basic/control-panel-grounding-basic-ogp.png" alt="制御盤の接地・アースの基礎記事" loading="lazy" decoding="async"></span>\n'
              '            <span class="related-card-body"><span class="related-card-tag">接地・アース</span><h3>制御盤の接地（アース）の基礎</h3><p>制御盤全体で接地をどう整理するかを確認できます。</p></span>\n'
              '          </a>\n'
              '          <a class="related-card related-card--visual" href="shielded-cable-basic.html">\n'
              '            <span class="related-card-media"><img src="../assets/images/shielded-cable-basic/shielded-cable-basic-ogp.png" alt="シールド線とノイズ対策の基礎記事" loading="lazy" decoding="async"></span>\n'
              '            <span class="related-card-body"><span class="related-card-tag">ノイズ対策</span><h3>シールド線の基礎</h3><p>シールドとノイズ対策の考え方を整理できます。</p></span>\n'
              '          </a>\n'
              '          <a class="related-card related-card--visual" href="power-signal-wiring-separation-basic.html">\n'
              '            <span class="related-card-media"><img src="../assets/images/power-signal-wiring-separation-basic/power-signal-wiring-separation-basic-ogp.png" alt="動力線と信号線の配線分離の記事" loading="lazy" decoding="async"></span>\n'
              '            <span class="related-card-body"><span class="related-card-tag">配線・ノイズ</span><h3>動力線と信号線の分け方</h3><p>ノイズを減らすための配線分離の基本を確認できます。</p></span>\n'
              '          </a>\n'
              '        </div>\n'
              '      </section>'
          )
          s=s[:start]+new+s[end:]
          css='    .related-grid--visual{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.related-card--visual{display:flex;flex-direction:column;overflow:hidden;padding:0!important;background:#fff;border:1px solid var(--line);border-radius:20px;transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}.related-card--visual:hover{transform:translateY(-3px);border-color:#bfdbfe;box-shadow:0 14px 28px rgba(15,23,42,.10);text-decoration:none}.related-card-media{display:block;aspect-ratio:1.91/1;overflow:hidden;background:#f8fbff;border-bottom:1px solid var(--line)}.related-card-media img{width:100%;height:100%;object-fit:cover}.related-card-body{display:block;padding:15px 16px 17px}.related-card-tag{display:inline-flex;align-items:center;min-height:25px;padding:0 9px;margin-bottom:8px;border-radius:999px;background:#eff6ff;border:1px solid #bfdbfe;color:#1d4ed8;font-size:11px;font-weight:900}.related-card--visual h3{margin:0 0 7px;font-size:16px;line-height:1.45;color:#0f172a}.related-card--visual p{margin:0;color:var(--muted);font-size:13px;line-height:1.65}@media(max-width:760px){.related-grid--visual{grid-template-columns:1fr}.related-card--visual{display:grid;grid-template-columns:138px minmax(0,1fr);align-items:stretch}.related-card-media{aspect-ratio:auto;border-bottom:0;border-right:1px solid var(--line)}.related-card-media img{height:100%;min-height:132px}.related-card-body{padding:13px 14px}.related-card--visual h3{font-size:15px}.related-card--visual p{font-size:12px}}@media(max-width:430px){.related-card--visual{grid-template-columns:112px minmax(0,1fr)}.related-card-media img{min-height:120px}.related-card-tag{font-size:10px}.related-card-body{padding:11px 12px}}\n'
          if '.related-grid--visual{' not in s:
              s=s.replace('</style>',css+'</style>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit article and remove helper workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add articles/pe-fg-sg-difference-basic.html
          git rm .github/workflows/pefgsg-related-card-images.yml
          git commit -m 'Add images to PE FG SG related article cards'
          git push origin HEAD:preview-pe-fg-sg-20260910