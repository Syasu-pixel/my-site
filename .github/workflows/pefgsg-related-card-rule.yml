name: PE FG SG related article card rule
on:
  push:
    branches: [preview-pe-fg-sg-20260910]
    paths:
      - '.github/workflows/pefgsg-related-card-rule.yml'
permissions:
  contents: write
jobs:
  update-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-pe-fg-sg-20260910
      - name: Add related article image rules
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          additions = {
            'docs/image-generation-rules.md': '''\n\n### 5.7) 「あわせて読みたい」関連記事カードの画像ルール\n- 記事末尾の「あわせて読みたい」「関連記事」カードは、画像付きカードを標準とする。\n- 関連記事カードの画像は、対象記事の **OGP画像を第一候補** とする。\n- OGP画像がカード表示に不向きな場合のみ、対象記事のhero画像を使用してよい。\n- heroを使用する場合は、縮小表示でも記事テーマが判別できることを確認する。\n- 新規記事では、OGP画像を関連記事カードにも流用できるよう、縮小時の視認性を意識して設計する。\n- 関連記事カードの画像内文字が小さすぎる、情報量が多すぎる、主要要素がトリミングで欠ける場合は使用しない。\n- 関連記事カード用に新しい別画像を必須とはしない。原則は OGP → hero の順で既存採用画像を再利用する。\n- 画像がない既存記事は、当面テキストカードでもよい。無理に低品質画像を追加しない。\n- 関連記事画像は遅延読み込み（`loading="lazy"`）を基本とし、レイアウト崩れ防止のため可能な限り `width` / `height` または `aspect-ratio` を指定する。\n- PC・スマホの両方で、画像・記事タイトル・短い説明が読みやすいことをPreviewで確認する。\n''',
            'docs/new-article-checklist.md': '''\n\n## 関連記事カード画像チェック\n- [ ] 「あわせて読みたい」「関連記事」は、原則として画像付きカードになっている\n- [ ] 関連記事画像は対象記事のOGPを第一候補にしている\n- [ ] OGPが不向きな場合だけheroを使用している\n- [ ] 縮小表示で記事テーマが判別できる\n- [ ] 画像内文字や主要要素がカードのトリミングで欠けていない\n- [ ] `loading="lazy"` を設定している\n- [ ] PC・スマホPreviewで画像・タイトル・説明のバランスを確認している\n- [ ] 画像がない既存記事に低品質な仮画像を無理に追加していない\n''',
            'docs/article-workflow.md': '''\n\n## 「あわせて読みたい」画像付きカードの標準運用\n- 記事末尾の「あわせて読みたい」「関連記事」は、画像付きカードを標準とする。\n- 画像は関連記事先の記事のOGPを優先し、OGPが不向きな場合のみheroを使う。\n- 新規記事のOGPは、SNS共有だけでなく関連記事カードでの再利用も想定して、縮小時の視認性を確保する。\n- 画像が存在しない既存記事はテキストカードでもよく、低品質な仮画像を追加して埋めない。\n- 関連記事カード変更後は、PC・スマホPreviewでトリミング、文字サイズ、カード高さ、回遊導線を確認する。\n'''
          }

          markers = {
            'docs/image-generation-rules.md': '### 5.7) 「あわせて読みたい」関連記事カードの画像ルール',
            'docs/new-article-checklist.md': '## 関連記事カード画像チェック',
            'docs/article-workflow.md': '## 「あわせて読みたい」画像付きカードの標準運用',
          }

          for file, text in additions.items():
              p = Path(file)
              current = p.read_text(encoding='utf-8')
              if markers[file] not in current:
                  p.write_text(current.rstrip() + text + '\n', encoding='utf-8')
          PY
      - name: Commit rules and remove helper workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/image-generation-rules.md docs/new-article-checklist.md docs/article-workflow.md
          git rm .github/workflows/pefgsg-related-card-rule.yml
          git commit -m 'Document related article image card rules'
          git push origin HEAD:preview-pe-fg-sg-20260910