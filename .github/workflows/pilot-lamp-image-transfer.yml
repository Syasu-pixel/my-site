name: Pilot lamp image transfer

on:
  push:
    branches:
      - preview-pilot-lamp-refresh
    paths:
      - '.github/workflows/pilot-lamp-image-transfer.yml'

permissions:
  contents: write

jobs:
  inspect-share:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-pilot-lamp-refresh
      - name: Inspect firestorage client API
        shell: bash
        run: |
          set -euo pipefail
          base='https://firestorage.ai'
          js='/_next/static/chunks/app/(files)/ja/f/page-4d19ae0a4ce39d79.js'
          curl -LfsS -A 'Mozilla/5.0' "${base}${js}" -o /tmp/page.js
          echo "js bytes: $(wc -c < /tmp/page.js)"
          python3 - <<'PY'
          import re
          s=open('/tmp/page.js',encoding='utf-8').read()
          terms=['fetch(','/api/','download','share','publicId','shareId','presign','signed','object']
          for term in terms:
              print('\n===',term,'===')
              pos=0
              n=0
              while True:
                  i=s.find(term,pos)
                  if i<0 or n>=30: break
                  print(s[max(0,i-220):min(len(s),i+520)].replace('\n',' '))
                  pos=i+len(term); n+=1
          PY
