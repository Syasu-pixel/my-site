name: Pilot lamp quality fix temporary

on:
  push:
    branches:
      - preview-pilot-lamp-refresh
    paths:
      - .github/workflows/pilot-lamp-quality-fix-temp.yml

permissions:
  contents: write

jobs:
  restore-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-pilot-lamp-refresh
          fetch-depth: 0

      - name: Install browser helper
        run: |
          python -m pip install --quiet playwright
          python -m playwright install chromium

      - name: Download approved Hero and OGP
        env:
          HERO_SHARE: https://firestorage.ai/ja/f/ttbpUkcrYZnC
          OGP_SHARE: https://firestorage.ai/ja/f/y6084b3ypP9m
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          targets = [
              (os.environ['HERO_SHARE'], Path('assets/images/pilot-lamp-basic/pilot-lamp-basic-hero.webp')),
              (os.environ['OGP_SHARE'], Path('assets/images/pilot-lamp-basic/pilot-lamp-basic-ogp.webp')),
          ]

          def download_share(page, url, out):
              page.goto(url, wait_until='networkidle', timeout=120000)
              # Prefer explicit download links/buttons.
              candidates = page.locator('a,button').all()
              for el in candidates:
                  try:
                      text = (el.inner_text() or '').strip().lower()
                      href = el.get_attribute('href') or ''
                      if ('download' in text or 'ダウンロード' in text or 'download' in href.lower()):
                          try:
                              with page.expect_download(timeout=15000) as info:
                                  el.click()
                              dl = info.value
                              out.parent.mkdir(parents=True, exist_ok=True)
                              dl.save_as(str(out))
                              return
                          except Exception:
                              pass
                  except Exception:
                      pass

              # Some share pages expose the file itself through a clickable filename.
              for el in page.locator('a').all():
                  try:
                      href = el.get_attribute('href') or ''
                      text = (el.inner_text() or '').strip().lower()
                      if '.webp' in href.lower() or '.webp' in text:
                          try:
                              with page.expect_download(timeout=15000) as info:
                                  el.click()
                              dl = info.value
                              out.parent.mkdir(parents=True, exist_ok=True)
                              dl.save_as(str(out))
                              return
                          except Exception:
                              pass
                  except Exception:
                      pass
              raise RuntimeError(f'Could not locate download control on {url}')

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(accept_downloads=True)
              for url, out in targets:
                  download_share(page, url, out)
              browser.close()

          for _, out in targets:
              data = out.read_bytes()
              if len(data) < 50000:
                  raise RuntimeError(f'{out} unexpectedly small: {len(data)} bytes')
              if not (data.startswith(b'RIFF') and data[8:12] == b'WEBP'):
                  raise RuntimeError(f'{out} is not a valid WebP')
              print(out, len(data))
          PY

      - name: Restore Hero visibility without changing article layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('articles/pilot-lamp-basic.html')
          s = p.read_text(encoding='utf-8')
          old = 'opacity:.32;\n      pointer-events:none;\n      z-index:0;'
          new = 'opacity:.82;\n      pointer-events:none;\n      z-index:0;'
          if old not in s:
              raise SystemExit('Expected Hero opacity rule not found; refusing broad edit')
          s2 = s.replace(old, new, 1)
          if s2.count('opacity:.82;') != 1:
              raise SystemExit('Unexpected opacity replacement count')
          p.write_text(s2, encoding='utf-8')
          PY

      - name: Commit only approved final changes and remove temporary workflow
        run: |
          git config user.name 'Syasu-pixel'
          git config user.email 'syasuta0819@gmail.com'
          git rm .github/workflows/pilot-lamp-quality-fix-temp.yml
          git add articles/pilot-lamp-basic.html \
                  assets/images/pilot-lamp-basic/pilot-lamp-basic-hero.webp \
                  assets/images/pilot-lamp-basic/pilot-lamp-basic-ogp.webp
          git status --short
          git commit -m 'Restore approved pilot lamp Hero and OGP quality'
          git push origin HEAD:preview-pilot-lamp-refresh
