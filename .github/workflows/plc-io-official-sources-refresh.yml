name: PLC IO Official Sources Refresh

on:
  push:
    branches:
      - preview-plc-io-unit-text-refresh-20260916
    paths:
      - '.github/scripts/plc_io_official_sources_refresh.py'
      - '.github/workflows/plc-io-official-sources-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply official source box
        run: python .github/scripts/plc_io_official_sources_refresh.py
      - name: Clean temporary automation and commit
        run: |
          rm -f .github/scripts/plc_io_official_sources_refresh.py
          rm -f .github/workflows/plc-io-official-sources-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles/plc-io-unit-basic.html .github/scripts/plc_io_official_sources_refresh.py .github/workflows/plc-io-official-sources-refresh.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add official manufacturer references to PLC I/O article"
          git push
