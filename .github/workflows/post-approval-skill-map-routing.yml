name: Post Approval Skill Map Routing

on:
  push:
    branches:
      - publish-career-step3-skill-map-routing
    paths:
      - .github/workflows/post-approval-skill-map-routing.yml

permissions:
  contents: write

jobs:
  route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publish-career-step3-skill-map-routing
          fetch-depth: 1

      - name: Update routing, search index and sitemap
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          article_url = "/articles/fa-engineer-skill-map-career.html"

          # Search index
          p = Path("assets/data/search-index.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          if not any(item.get("url") == article_url for item in data):
              data.append({
                  "title": "電気・FAエンジニアの資格・スキルマップ｜未経験から何を学ぶ？",
                  "url": article_url,
                  "category": "キャリア・転職",
                  "description": "未経験から電気・FAエンジニアを目指す人向けに、電気の基礎、第二種電気工事士、機械保全技能士、PLC・シーケンス制御、安全、図面読解などを、仕事につながる順番で整理します。",
                  "keywords": [
                      "FAエンジニア 資格",
                      "FAエンジニア スキル",
                      "電気 資格",
                      "第二種電気工事士",
                      "機械保全技能士",
                      "PLC スキル",
                      "シーケンス制御",
                      "設備保全 資格",
                      "生産技術 資格",
                      "制御設計 資格",
                      "fa-engineer-skill-map-career"
                  ],
                  "synonyms": [
                      "FA 資格",
                      "FA スキルマップ",
                      "電気エンジニア 資格",
                      "制御エンジニア 資格",
                      "設備保全 スキル",
                      "生産技術 スキル"
                  ]
              })
              p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          # Sitemap
          p = Path("sitemap.xml")
          text = p.read_text(encoding="utf-8")
          loc = "https://denkicontrol.com/articles/fa-engineer-skill-map-career.html"
          if loc not in text:
              entry = (
                  "  <url>\n"
                  f"    <loc>{loc}</loc>\n"
                  "    <lastmod>2026-09-15</lastmod>\n"
                  "  </url>\n"
              )
              text = text.replace("</urlset>", entry + "</urlset>")
              p.write_text(text, encoding="utf-8")

          # Inbound related link from the beginner career article.
          p = Path("articles/fa-engineer-beginner-career.html")
          text = p.read_text(encoding="utf-8")
          if "fa-engineer-skill-map-career.html" not in text:
              needle = '<a class="internal-link" href="production-engineering-career.html"><strong>生産技術とは？</strong><span>工程・設備・品質・改善をつなぐ仕事を知る</span></a></div></section>'
              replacement = '<a class="internal-link" href="production-engineering-career.html"><strong>生産技術とは？</strong><span>工程・設備・品質・改善をつなぐ仕事を知る</span></a><a class="internal-link" href="fa-engineer-skill-map-career.html"><strong>電気・FAエンジニアの資格・スキルマップ</strong><span>資格と実務スキルを、仕事につながる順番で整理する</span></a></div></section>'
              if needle not in text:
                  raise SystemExit("related-career insertion point not found")
              p.write_text(text.replace(needle, replacement, 1), encoding="utf-8")

          # Self-delete this one-shot workflow.
          Path(".github/workflows/post-approval-skill-map-routing.yml").unlink()
          PY

      - name: Commit updates
        shell: bash
        run: |
          git config user.name "denkicontrol-routing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add categories/career.html assets/data/search-index.json sitemap.xml articles/fa-engineer-beginner-career.html .github/workflows/post-approval-skill-map-routing.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Publish skill map routing and SEO data"
          git push origin HEAD:publish-career-step3-skill-map-routing
