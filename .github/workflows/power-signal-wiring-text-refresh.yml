name: Power Signal Wiring Text Refresh

on:
  push:
    branches:
      - preview-power-signal-wiring-separation-text-refresh-20260916

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-power-signal-wiring-separation-text-refresh-20260916
          fetch-depth: 0
      - name: Apply refresh
        run: python .github/scripts/power_signal_wiring_refresh.py
      - name: Commit result
        run: |
          rm -f .github/workflows/power-signal-wiring-text-refresh.yml
          rm -f .github/scripts/power_signal_wiring_refresh.py
          git config user.name denkicontrol-preview-writer
          git config user.email actions@users.noreply.github.com
          git add articles/power-signal-wiring-separation-basic.html docs/existing-article-improvement-backlog.md .github/workflows/power-signal-wiring-text-refresh.yml .github/scripts/power_signal_wiring_refresh.py
          git commit -m "Refresh power signal wiring separation article text and related cards"
          git push origin HEAD:preview-power-signal-wiring-separation-text-refresh-20260916
