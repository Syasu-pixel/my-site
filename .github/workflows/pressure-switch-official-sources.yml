name: Pressure Switch Official Sources
on:
  push:
    branches:
      - preview-pressure-switch-official-sources-20260916
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-pressure-switch-official-sources-20260916
      - name: Apply official source box
        run: python scripts/pressure-switch-official-sources.py
      - name: Clean temporary automation and commit
        run: |
          rm -f scripts/pressure-switch-official-sources.py .github/workflows/pressure-switch-official-sources.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add official sources to pressure switch article" || exit 0
          git push
