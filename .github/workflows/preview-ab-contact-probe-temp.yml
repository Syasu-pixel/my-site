name: Probe Cloudflare preview ab-contact

on:
  push:
    branches:
      - preview-ab-contact

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare Preview
        shell: bash
        run: |
          set -u
          URL="https://preview-ab-contact.denkicontrol-preview.pages.dev/articles/a-contact-b-contact-basic.html"
          for i in $(seq 1 12); do
            echo "Attempt $i: $URL"
            code=$(curl -L -sS -o /tmp/page.html -w "%{http_code}" --max-time 20 "$URL" || true)
            echo "HTTP $code"
            if [ "$code" = "200" ]; then
              grep -q "a接点・b接点" /tmp/page.html
              echo "Preview is live and contains expected article text."
              exit 0
            fi
            sleep 10
          done
          echo "Preview did not become ready within the probe window."
          exit 1
