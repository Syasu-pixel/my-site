name: Proximity Sensor Official Sources
on:
  push:
    branches: [preview-proximity-sensor-official-sources-20260916]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-proximity-sensor-official-sources-20260916
      - name: Apply official source box
        run: python scripts/proximity-sensor-official-sources.py
      - name: Clean temporary automation and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/proximity-sensor-official-sources.yml scripts/proximity-sensor-official-sources.py
          git add articles/proximity-sensor-basic.html
          git commit -m "Add official sources to proximity sensor article"
          git push
