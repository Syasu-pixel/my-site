name: Rebase servo refresh onto latest main

on:
  push:
    paths:
      - '.github/workflows/rebase-servo-refresh.yml'

permissions:
  contents: write

jobs:
  rebase-servo:
    if: ${{ github.ref_name == 'preview-servo-motor-refresh-rebased-20260925' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bring approved servo assets and article onto latest main
        run: |
          set -euo pipefail
          git fetch origin preview-servo-motor-refresh-20260924

          # Approved source HTML and formally transferred images from the old preview branch.
          git checkout origin/preview-servo-motor-refresh-20260924 --             articles/servo-motor-basic.html             assets/images/servo-motor-basic/servo-motor-basic-hero.png             assets/images/servo-motor-basic/servo-motor-basic-ogp.png             assets/images/servo-motor-basic/servo-motor-basic-system-overview.png             assets/images/servo-motor-basic/servo-motor-basic-positioning-applications.png

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess

          article = Path('articles/servo-motor-basic.html')
          article_bytes = article.read_bytes()
          article_sha256 = hashlib.sha256(article_bytes).hexdigest()
          article_blob = subprocess.check_output(['git','hash-object',str(article)], text=True).strip()

          # site inventory: update only the servo article blob.
          p = Path('.github/article-components/site-inventory.json')
          data = json.loads(p.read_text())
          changed = 0
          def walk(obj):
              global changed
              if isinstance(obj, dict):
                  if obj.get('path') == 'articles/servo-motor-basic.html' and 'gitBlob' in obj:
                      obj['gitBlob'] = article_blob
                      changed += 1
                  for v in obj.values(): walk(v)
              elif isinstance(obj, list):
                  for v in obj: walk(v)
          walk(data)
          if changed != 1:
              raise SystemExit(f'expected one site-inventory servo entry, got {changed}')
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          # shell manifest: update only the source baseline for this article.
          p = Path('.github/site-shells/manifest.json')
          data = json.loads(p.read_text())
          hits = 0
          for row in data.get('pages', data if isinstance(data, list) else []):
              if isinstance(row, dict) and row.get('output') == 'articles/servo-motor-basic.html':
                  row['baselineSha256'] = article_sha256
                  hits += 1
          if hits != 1:
              raise SystemExit(f'expected one manifest servo entry, got {hits}')
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          # preservation oracle: update only servo source fingerprint and OGP fields.
          p = Path('.github/article-components/end/all-preservation-oracle.json')
          data = json.loads(p.read_text())
          source_hits = 0
          ogp_hits = 0
          def patch(obj):
              global source_hits, ogp_hits
              if isinstance(obj, dict):
                  # Entries are nested in several views; constrain by article identity.
                  identity = ' '.join(str(obj.get(k,'')) for k in ('path','output','source','article','articlePath'))
                  is_servo = 'servo-motor-basic' in identity
                  if is_servo:
                      for k in ('sourceSha256','sourceSHA256','sourceHash'):
                          if k in obj:
                              obj[k] = article_sha256
                              source_hits += 1
                      if 'ogp' in obj and isinstance(obj['ogp'], list):
                          obj['ogp'] = ['https://denkicontrol.com/assets/images/servo-motor-basic/servo-motor-basic-ogp.png']
                          ogp_hits += 1
                      if 'ogpPath' in obj:
                          obj['ogpPath'] = 'assets/images/servo-motor-basic/servo-motor-basic-ogp.png'
                          ogp_hits += 1
                  for v in obj.values(): patch(v)
              elif isinstance(obj, list):
                  for v in obj: patch(v)
          patch(data)

          # Fallback for structures where servo identity sits in an ancestor.
          raw = json.dumps(data, ensure_ascii=False)
          raw = raw.replace(
              'https://denkicontrol.com/assets/images/servo-motor-basic/servo-motor-basic-hero.png',
              'https://denkicontrol.com/assets/images/servo-motor-basic/servo-motor-basic-ogp.png'
          ).replace(
              'assets/images/servo-motor-basic/servo-motor-basic-hero.png',
              'assets/images/servo-motor-basic/servo-motor-basic-ogp.png'
          )
          data = json.loads(raw)
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          print(json.dumps({
              'articleSha256': article_sha256,
              'articleGitBlob': article_blob,
              'inventoryUpdated': changed,
              'manifestUpdated': hits,
              'oracleSourceHits': source_hits,
              'oracleOgpHits': ogp_hits,
          }))
          PY

          git status --short
          git config user.name 'denkicontrol-servo-rebase'
          git config user.email 'actions@users.noreply.github.com'
          git add articles/servo-motor-basic.html             assets/images/servo-motor-basic/servo-motor-basic-hero.png             assets/images/servo-motor-basic/servo-motor-basic-ogp.png             assets/images/servo-motor-basic/servo-motor-basic-system-overview.png             assets/images/servo-motor-basic/servo-motor-basic-positioning-applications.png             .github/article-components/site-inventory.json             .github/site-shells/manifest.json             .github/article-components/end/all-preservation-oracle.json
          git commit -m 'feat: refresh servo motor article images on latest main'
          git push origin "HEAD:${GITHUB_REF_NAME}"
