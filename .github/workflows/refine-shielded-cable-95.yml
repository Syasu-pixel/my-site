name: Refine shielded cable to 9.5

on:
  push:
    branches:
      - preview-shielded-cable-20260910

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: preview-shielded-cable-20260910
          fetch-depth: 0

      - name: Apply narrow quality fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('articles/shielded-cable-basic.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
            'シールドは、信号線のまわりにある「ノイズを受け止める外側の層」と考えると分かりやすいです。':
            'シールドは、信号線のまわりにある「電磁的な干渉を抑えるための外側の遮蔽層」と考えると分かりやすいです。',
            '../assets/images/power-signal-wiring-separation-basic/power-signal-wiring-separation-basic-ogp.png':
            '../assets/images/power-signal-wiring-separation-basic/power-signal-wiring-separation-basic-hero.png',
          }
          for old, new in replacements.items():
            if old not in s:
              raise SystemExit(f'missing expected text: {old}')
            s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify only intended article changes
        run: |
          git diff --check
          git diff -- articles/shielded-cable-basic.html

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles/shielded-cable-basic.html
          git commit -m "Polish shielded cable article visuals and wording"
          git push origin HEAD:preview-shielded-cable-20260910
