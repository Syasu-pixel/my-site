name: Refresh single hero binding

on:
  push:
    branches:
      - preview-while-pressed-final-20261001
    paths:
      - '.github/workflows/refresh-single-hero-binding.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Re-import only the changed hero binding
        run: |
          set -euo pipefail
          cp .github/article-components/hero/css-bindings.json /tmp/css-bindings-before.json
          python scripts/prepare-article-heroes.py --initialize-css --out /tmp/hero-plan.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          target = 'articles/while-pressed-circuit-basic.html'
          old = json.loads(Path('/tmp/css-bindings-before.json').read_text(encoding='utf-8'))
          new = json.loads(Path('.github/article-components/hero/css-bindings.json').read_text(encoding='utf-8'))
          changed = sorted(k for k in set(old) | set(new) if old.get(k) != new.get(k))
          print('changed bindings:', changed)
          if changed != [target]:
              raise SystemExit(f'refusing unexpected binding changes: {changed}')
          print(json.dumps(new[target], ensure_ascii=False, indent=2))
          PY
          changed_files="$(git diff --name-only)"
          printf '%s\n' "$changed_files"
          unexpected="$(printf '%s\n' "$changed_files" | grep -v '^\.github/article-components/hero/css-bindings\.json$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected generated file changes:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
      - name: Commit binding and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name 'denkicontrol-preview-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/article-components/hero/css-bindings.json
          git rm .github/workflows/refresh-single-hero-binding.yml
          git commit -m 'Refresh while-pressed hero CSS binding'
          git push origin "HEAD:${GITHUB_REF_NAME}"
