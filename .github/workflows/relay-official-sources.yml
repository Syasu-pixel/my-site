name: Relay Official Sources
on:
  push:
    branches: [preview-relay-official-sources-20260916]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-relay-official-sources-20260916
      - name: Apply official source box
        run: python scripts/relay-official-sources.py
      - name: Clean temporary automation and commit
        run: |
          rm -f .github/workflows/relay-official-sources.yml scripts/relay-official-sources.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add official sources to relay article"
          git push origin HEAD:preview-relay-official-sources-20260916
