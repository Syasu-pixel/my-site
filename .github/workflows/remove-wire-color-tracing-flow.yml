name: Remove Wire Color Tracing Flow

on:
  push:
    branches:
      - remove-wire-color-tracing-flow-20260916
    paths:
      - .github/workflows/remove-wire-color-tracing-flow.yml

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: remove-wire-color-tracing-flow-20260916
          fetch-depth: 1

      - name: Remove tracing-flow figure and asset
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('articles/control-panel-wire-color-basic.html')
          text = p.read_text(encoding='utf-8')
          pattern = re.compile(r'\s*<figure class="article-figure">\s*<img[^>]*control-panel-wire-color-basic-tracing-flow\.png[^>]*>\s*(?:<figcaption>.*?</figcaption>\s*)?</figure>', re.S)
          new, n = pattern.subn('', text, count=1)
          if n != 1:
              raise SystemExit(f'expected exactly one tracing-flow figure, found {n}')
          p.write_text(new, encoding='utf-8')
          asset = Path('assets/images/control-panel-wire-color-basic/control-panel-wire-color-basic-tracing-flow.png')
          if asset.exists():
              asset.unlink()
          PY

      - name: Commit removal and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/remove-wire-color-tracing-flow.yml
          git config user.name "denkicontrol-preview-writer"
          git config user.email "actions@users.noreply.github.com"
          git add -A articles/control-panel-wire-color-basic.html assets/images/control-panel-wire-color-basic/control-panel-wire-color-basic-tracing-flow.png .github/workflows/remove-wire-color-tracing-flow.yml
          git diff --cached --check
          git commit -m "Remove obsolete tracing flow image"
          git push origin HEAD:remove-wire-color-tracing-flow-20260916
