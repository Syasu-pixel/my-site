name: Rendered Cloudflare Preview 1536

on:
  push:
    branches:
      - preview-auto-theme-follow-system-20260920

permissions:
  contents: write

concurrency:
  group: rendered-preview-1536
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'

      - name: Build production-equivalent HTML
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          python -m pip install lxml==6.1.1
          rm -rf "${RUNNER_TEMP}/integration-build"
          node scripts/build-integrated-review.mjs "${RUNNER_TEMP}/integration-build"
          node scripts/build-additional-shells.mjs "${RUNNER_TEMP}/integration-build/additional-shells"
          python scripts/verify-integrated-source.py "${RUNNER_TEMP}/integration-build"
          python scripts/audit-integrated-links.py "${RUNNER_TEMP}/integration-build"

      - name: Overlay generated HTML for visual preview
        run: |
          cp -a "${RUNNER_TEMP}/integration-build/candidate/articles/." articles/
          cp -a "${RUNNER_TEMP}/integration-build/candidate/en/articles/." en/articles/
          cp -a "${RUNNER_TEMP}/integration-build/candidate/assets/." assets/
          node - <<'NODE'
          const fs=require('fs'),path=require('path');
          const manifest=JSON.parse(fs.readFileSync('.github/site-shells/additional/manifest.json','utf8'));
          const root=process.env.RUNNER_TEMP+'/integration-build/additional-shells/candidate';
          for(const row of manifest.pages){
            fs.mkdirSync(path.dirname(row.path),{recursive:true});
            fs.copyFileSync(path.join(root,row.path),row.path);
          }
          NODE
          rm -f .github/workflows/rendered-cloudflare-preview-1536.yml

      - name: Publish visual-only branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B visual-theme-1536
          git add -A
          git commit -m "Rendered preview for PR #1536" || true
          git push --force origin HEAD:refs/heads/visual-theme-1536
