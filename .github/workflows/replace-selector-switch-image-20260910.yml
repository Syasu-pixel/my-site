name: Replace selector switch comparison image

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/replace-selector-switch-image-20260910.yml'

permissions:
  contents: write

jobs:
  replace-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: preview-selector-switch-audit-20260910
          fetch-depth: 0

      - name: Import adopted image through artifact broker
        id: broker
        shell: bash
        env:
          BROKER_URL: ${{ vars.ARTIFACT_BROKER_URL }}
          BROKER_TOKEN: ${{ secrets.ARTIFACT_BROKER_TOKEN }}
          SHARE_ID: xbhg8BJvoS_f
          FILE_ID: 01a08bb9dbf775e6b660e2ad947bd954
          FILE_NAME: selector-switch-two-vs-three.png
          EXPECTED_SHA256: 61ae7e1150332b25a661e5c92017e30a4e7b7c37f774df89d5baa6c5621dd1cc
        run: |
          if [ -z "$BROKER_URL" ]; then echo 'ARTIFACT_BROKER_URL is missing' >&2; exit 1; fi
          if [ -z "$BROKER_TOKEN" ]; then echo 'ARTIFACT_BROKER_TOKEN is missing' >&2; exit 1; fi
          payload="$(python3 - <<'PY'
          import json, os
          print(json.dumps({
              'action':'import_firestorage',
              'share_id':os.environ['SHARE_ID'],
              'file_id':os.environ['FILE_ID'],
              'file_name':os.environ['FILE_NAME'],
              'sha256':os.environ['EXPECTED_SHA256'],
          }))
          PY
          )"
          response="$(curl --proto '=https' --tlsv1.2 --fail-with-body --silent --show-error --max-time 60 \
            -X POST -H 'content-type: application/json' \
            -H "x-artifact-broker-token: $BROKER_TOKEN" \
            --data "$payload" "$BROKER_URL")"
          python3 - "$response" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          d=json.loads(sys.argv[1])
          print('download_url='+d['download_url'])
          print('object_path='+d['object_path'])
          print('sha256='+d['sha256'])
          PY

      - name: Download, verify, and replace image
        shell: bash
        env:
          DOWNLOAD_URL: ${{ steps.broker.outputs.download_url }}
          EXPECTED_SHA256: 61ae7e1150332b25a661e5c92017e30a4e7b7c37f774df89d5baa6c5621dd1cc
          TARGET: assets/images/selector-switch-basic/two-position-vs-three-position-selector.png
        run: |
          curl --proto '=https' --tlsv1.2 --fail-with-body --silent --show-error --max-time 60 \
            -o "$TARGET" "$DOWNLOAD_URL"
          echo "$EXPECTED_SHA256  $TARGET" | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/images/selector-switch-basic/two-position-vs-three-position-selector.png')
          b=p.read_bytes()
          assert b[:8] == b'\x89PNG\r\n\x1a\n'
          assert len(b) > 100000
          print('PNG verified:', len(b), 'bytes')
          PY

      - name: Commit adopted image to preview branch
        shell: bash
        run: |
          git diff --check
          git config user.name 'denkicontrol-ai-writer'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/images/selector-switch-basic/two-position-vs-three-position-selector.png
          git commit -m 'Replace selector switch comparison image with character version'
          git push origin HEAD:preview-selector-switch-audit-20260910

      - name: Cleanup broker object
        if: ${{ success() }}
        shell: bash
        env:
          BROKER_URL: ${{ vars.ARTIFACT_BROKER_URL }}
          CLEANUP_TOKEN: ${{ secrets.ARTIFACT_CLEANUP_TOKEN }}
          BROKER_TOKEN: ${{ secrets.ARTIFACT_BROKER_TOKEN }}
          OBJECT_PATH: ${{ steps.broker.outputs.object_path }}
        run: |
          token="$CLEANUP_TOKEN"
          if [ -z "$token" ]; then token="$BROKER_TOKEN"; fi
          payload="$(python3 - <<'PY'
          import json, os
          print(json.dumps({'action':'delete','object_path':os.environ['OBJECT_PATH']}))
          PY
          )"
          curl --proto '=https' --tlsv1.2 --fail-with-body --silent --show-error --max-time 30 \
            -X POST -H 'content-type: application/json' \
            -H "x-artifact-broker-token: $token" \
            --data "$payload" "$BROKER_URL"
