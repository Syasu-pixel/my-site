name: Replace selector switch comparison image

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/replace-selector-switch-image-20260910.yml'

permissions:
  contents: write

jobs:
  replace-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: preview-selector-switch-audit-20260910
          fetch-depth: 0

      - name: Resolve adopted image from firestorage API
        id: firestorage
        shell: bash
        env:
          SHARE_ID: xbhg8BJvoS_f
          FILE_ID: 01a08bb9dbf775e6b660e2ad947bd954
          FILE_NAME: selector-switch-two-vs-three.png
        run: |
          meta="$(curl --proto '=https' --tlsv1.2 --fail-with-body --silent --show-error --max-time 30 \
            "https://api.firestorage.ai/dev/file/shares/$SHARE_ID/files?maxResults=1000")"
          python3 - "$meta" <<'PY'
          import json, os, sys
          d=json.loads(sys.argv[1])
          matches=[f for f in d.get('files',[]) if f.get('fileId')==os.environ['FILE_ID']]
          if len(matches)!=1:
              raise SystemExit('firestorage metadata did not contain requested file')
          f=matches[0]
          if f.get('fileName')!=os.environ['FILE_NAME']:
              raise SystemExit('firestorage filename mismatch')
          print('metadata verified:', f.get('fileName'), f.get('sizeBytes'))
          PY
          dl="$(curl --proto '=https' --tlsv1.2 --fail-with-body --silent --show-error --max-time 30 \
            -X POST "https://api.firestorage.ai/dev/file/shares/$SHARE_ID/files/$FILE_ID/download")"
          python3 - "$dl" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys, urllib.parse
          d=json.loads(sys.argv[1])
          u=d.get('downloadUrl','')
          p=urllib.parse.urlparse(u)
          if p.scheme!='https' or p.username or p.password or p.port or p.hostname!='s3.ap-northeast-1.wasabisys.com':
              raise SystemExit('unexpected download host')
          print('download_url='+u)
          PY

      - name: Download, verify, and replace image
        shell: bash
        env:
          DOWNLOAD_URL: ${{ steps.firestorage.outputs.download_url }}
          EXPECTED_SHA256: 61ae7e1150332b25a661e5c92017e30a4e7b7c37f774df89d5baa6c5621dd1cc
          TARGET: assets/images/selector-switch-basic/two-position-vs-three-position-selector.png
        run: |
          curl --proto '=https' --tlsv1.2 --fail-with-body --silent --show-error --max-time 60 \
            -o "$TARGET" "$DOWNLOAD_URL"
          echo "$EXPECTED_SHA256  $TARGET" | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/images/selector-switch-basic/two-position-vs-three-position-selector.png')
          b=p.read_bytes()
          assert b[:8] == b'\x89PNG\r\n\x1a\n'
          assert len(b) == 1853186
          print('PNG verified:', len(b), 'bytes')
          PY

      - name: Commit adopted image to preview branch
        shell: bash
        run: |
          git diff --check
          git config user.name 'denkicontrol-ai-writer'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/images/selector-switch-basic/two-position-vs-three-position-selector.png
          git commit -m 'Replace selector switch comparison image with character version'
          git push origin HEAD:preview-selector-switch-audit-20260910
