name: Restore Original Wire Color Tracing Flow

on:
  push:
    branches:
      - restore-wire-color-tracing-flow-20260916
    paths:
      - .github/workflows/restore-original-wire-color-tracing-flow.yml

permissions:
  contents: write

jobs:
  restore-original:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: restore-wire-color-tracing-flow-20260916
          fetch-depth: 0

      - name: Restore originally approved image from history
        shell: bash
        run: |
          set -euo pipefail
          git checkout 0f8b6a0b92d7988d168cd5e3b2c1de194ae99756 -- assets/images/control-panel-wire-color-basic/control-panel-wire-color-basic-tracing-flow.png
          git config user.name "denkicontrol-preview-writer"
          git config user.email "actions@users.noreply.github.com"
          rm -f .github/workflows/restore-original-wire-color-tracing-flow.yml
          git add -A assets/images/control-panel-wire-color-basic/control-panel-wire-color-basic-tracing-flow.png .github/workflows/restore-original-wire-color-tracing-flow.yml
          git diff --cached --check
          git commit -m "Restore originally approved wire color tracing image"
          git push origin HEAD:restore-wire-color-tracing-flow-20260916
