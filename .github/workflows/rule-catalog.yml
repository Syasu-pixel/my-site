name: Rule catalog structure
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Catalog checker regression cases
        run: python scripts/test-rule-catalog.py
      - name: Registration and local reference checks
        run: python scripts/check-rule-catalog.py --report rule-catalog-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rule-catalog-report
          path: rule-catalog-report.json
          retention-days: 30
