name: Rule catalog structure
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate rule catalog index
        if: github.event_name == 'pull_request'
        run: |
          python scripts/check-rule-catalog.py --write-index
          if ! git diff --quiet -- docs/rules/index.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/rules/index.md
            git commit -m "chore: regenerate rule catalog index"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Catalog checker regression cases
        run: python scripts/test-rule-catalog.py
      - name: Registration and local reference checks
        run: python scripts/check-rule-catalog.py --report rule-catalog-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rule-catalog-report
          path: rule-catalog-report.json
          retention-days: 30
