name: Search data 60-day backfill

on:
  push:
    branches:
      - test-search-data-api-dry-run-20260917
    paths:
      - ".github/workflows/search-data-sync.yml"

permissions:
  contents: read

concurrency:
  group: search-data-60-day-backfill
  cancel-in-progress: false

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: true
      - name: Compile and test
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/search_data_sync.py \
            scripts/search_data_entrypoint.py \
            scripts/test_search_data_sync.py \
            scripts/test_search_data_entrypoint.py
          PYTHONPATH=scripts python scripts/test_search_data_sync.py
          PYTHONPATH=scripts python scripts/test_search_data_entrypoint.py

  backfill:
    name: Backfill Google + Bing 60 days
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SEARCH_DATA_SUPABASE_URL: ${{ vars.SEARCH_DATA_SUPABASE_URL }}
      SEARCH_DATA_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SEARCH_DATA_SUPABASE_SERVICE_ROLE_KEY }}
      GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
      GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
      GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
      GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
      BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
      BING_WEBMASTER_SITE_URL: ${{ vars.BING_WEBMASTER_SITE_URL }}
      SEARCH_DATA_LAG_DAYS: "3"
      SEARCH_DATA_LOOKBACK_DAYS: "60"
      BING_DATA_LAG_DAYS: "1"
      BING_DATA_LOOKBACK_DAYS: "60"
      SEARCH_ENABLE_FINE_GRAIN: "false"
      SEARCH_FINE_GRAIN_RETENTION_DAYS: "90"
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: true
      - name: Backfill verified providers
        run: |
          set -euo pipefail
          python scripts/search_data_entrypoint.py --provider all
