name: Search data API dry-run

on:
  push:
    branches:
      - test-search-data-api-dry-run-20260917
    paths:
      - ".github/workflows/search-data-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: search-data-api-dry-run
  cancel-in-progress: false

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: true
      - name: Compile and test
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/search_data_sync.py \
            scripts/search_data_entrypoint.py \
            scripts/test_search_data_sync.py \
            scripts/test_search_data_entrypoint.py
          PYTHONPATH=scripts python scripts/test_search_data_sync.py
          PYTHONPATH=scripts python scripts/test_search_data_entrypoint.py

  dry_run:
    name: Google + Bing API dry-run
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
      GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
      GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
      GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
      BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
      BING_WEBMASTER_SITE_URL: ${{ vars.BING_WEBMASTER_SITE_URL }}
      SEARCH_DATA_LAG_DAYS: "3"
      SEARCH_DATA_LOOKBACK_DAYS: "4"
      BING_DATA_LAG_DAYS: "1"
      BING_DATA_LOOKBACK_DAYS: "14"
      SEARCH_ENABLE_FINE_GRAIN: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: true
      - name: Validate Google credential shapes without printing secrets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          cid = os.getenv("GSC_CLIENT_ID", "")
          secret = os.getenv("GSC_CLIENT_SECRET", "")
          refresh = os.getenv("GSC_REFRESH_TOKEN", "")
          print("gsc_client_id_present=", bool(cid))
          print("gsc_client_id_suffix_ok=", cid.endswith(".apps.googleusercontent.com"))
          print("gsc_client_secret_present=", bool(secret))
          print("gsc_client_secret_prefix_ok=", secret.startswith("GOCSPX-"))
          print("gsc_refresh_token_present=", bool(refresh))
          print("gsc_refresh_token_shape_ok=", len(refresh) > 20)
          PY
      - name: Read provider APIs without writing Supabase
        run: |
          set -euo pipefail
          python scripts/search_data_entrypoint.py --provider all --dry-run
