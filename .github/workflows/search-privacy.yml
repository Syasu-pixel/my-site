name: Search data privacy guard
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline synthetic regression tests
        run: python scripts/test-search-privacy.py
      - name: Scan every added commit and current PR text without echoing inputs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          python - <<'PY'
          import json, os
          from pathlib import Path
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          pr = event['pull_request']
          Path(os.environ['RUNNER_TEMP'], 'privacy-pr-text.txt').write_text(
              (pr.get('title') or '') + '\n' + (pr.get('body') or ''), encoding='utf-8')
          PY
          python scripts/check-search-privacy.py --base "$base" --head "$HEAD_SHA" "$RUNNER_TEMP/privacy-pr-text.txt"
