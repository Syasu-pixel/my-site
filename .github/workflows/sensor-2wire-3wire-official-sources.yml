name: Sensor 2 Wire 3 Wire Official Sources
on:
  push:
    branches:
      - preview-sensor-2wire-3wire-official-sources-20260916
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-sensor-2wire-3wire-official-sources-20260916
      - name: Apply official source box
        run: python scripts/sensor-2wire-3wire-official-sources.py
      - name: Clean temporary automation and commit
        run: |
          rm -f scripts/sensor-2wire-3wire-official-sources.py .github/workflows/sensor-2wire-3wire-official-sources.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add official sources to sensor 2-wire 3-wire article" || exit 0
          git push
