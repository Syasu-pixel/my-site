name: Sensor basic integrated final preview

on:
  push:
    branches:
      - preview-sensor-basic-integrated-final
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit:
    if: ${{ !contains(github.event.head_commit.message || '', '[integrated-final]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REVIEW_COPY_ASSETS: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-sensor-basic-integrated-final
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: python -m pip install lxml==6.1.1
      - name: Build integrated publication source
        run: |
          node scripts/build-integrated-review.mjs "${RUNNER_TEMP}/integration-build"
          python scripts/verify-integrated-source.py "${RUNNER_TEMP}/integration-build"
          python scripts/audit-integrated-links.py "${RUNNER_TEMP}/integration-build"
          python scripts/verify-article-end-preservation.py --oracle .github/article-components/end/all-preservation-oracle.json --candidate "${RUNNER_TEMP}/integration-build/candidate" --assets-source . --output "${RUNNER_TEMP}/integration-build/end-independent-checks.json"
          node scripts/check-component-regeneration.mjs "${RUNNER_TEMP}/integration-build"
          node scripts/check-integrated-publication.mjs "${RUNNER_TEMP}/integration-build"
          python scripts/test-publication-artifact.py
      - name: Replace only sensor-basic with integrated candidate
        run: |
          cp "${RUNNER_TEMP}/integration-build/candidate/articles/sensor-basic.html" articles/sensor-basic.html
      - name: Verify integrated markers
        run: |
          grep -q 'class="site-header dc-shell"' articles/sensor-basic.html
          grep -q 'GX Works2' articles/sensor-basic.html
          grep -q 'article-feedback-card' articles/sensor-basic.html
          grep -q 'article-toc-v2.js' articles/sensor-basic.html
      - name: Commit preview-only generated article
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles/sensor-basic.html
          if git diff --cached --quiet; then
            echo "No generated difference to commit."
            exit 0
          fi
          git commit -m "Preview-only: materialize integrated sensor-basic [integrated-final]"
          git push origin HEAD:preview-sensor-basic-integrated-final
