name: Reconcile article branch with latest main
on:
  push:
    branches:
      - preview-refresh-series-parallel-circuit-20261025
    paths:
      - .github/workflows/series-parallel-merge-current-main.yml
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-refresh-series-parallel-circuit-20261025
          fetch-depth: 0
      - name: Require clean merge against latest main
        run: |
          set -euo pipefail
          git fetch origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          before=$(git rev-parse HEAD)
          git merge --no-edit origin/main
          test "$(git rev-parse HEAD)" != "$before"
          git diff --exit-code HEAD^1 HEAD -- articles/series-parallel-circuit-basic.html assets/images/series-parallel-circuit-basic/
          git push origin HEAD:preview-refresh-series-parallel-circuit-20261025
