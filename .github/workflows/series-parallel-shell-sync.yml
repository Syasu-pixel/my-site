name: Regenerate verified shared shell for series parallel
on:
  push:
    branches: [preview-refresh-series-parallel-circuit-20261025]
    paths: [.github/workflows/series-parallel-shell-sync.yml]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-refresh-series-parallel-circuit-20261025
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - name: Regenerate shell using source of truth and sync target-only integrity
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm build:shells
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          p='articles/series-parallel-circuit-basic.html'
          data=Path(p).read_bytes()
          html=data.decode('utf-8')
          nav='<nav class="dc-footer-profile-link" aria-label="サイト運営情報"><a href="/profile/">運営者・編集方針</a></nav>'
          assert html.count(nav)==1
          shell=Path('.github/site-shells/manifest.json')
          obj=json.loads(shell.read_text())
          entries=[x for x in obj['pages'] if x['output']==p]
          assert len(entries)==1
          entries[0]['baselineSha256']=hashlib.sha256(html.replace(nav,'').encode()).hexdigest()
          shell.write_text(json.dumps(obj,ensure_ascii=False,indent=2)+'\n')
          inventory=Path('.github/article-components/site-inventory.json')
          spec=json.loads(inventory.read_text())
          matches=[]
          def walk(x):
              if isinstance(x,dict):
                  if x.get('path')==p and 'gitBlob' in x:matches.append(x)
                  for y in x.values():walk(y)
              elif isinstance(x,list):
                  for y in x:walk(y)
          walk(spec)
          assert len(matches)==1
          matches[0]['gitBlob']=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          inventory.write_text(json.dumps(spec,ensure_ascii=False,indent=2)+'\n')
          PY
          pnpm check:shells
      - name: Save scoped corrections
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add articles/series-parallel-circuit-basic.html .github/site-shells/manifest.json .github/article-components/site-inventory.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: rebuild canonical site shell for series-parallel article'
            git push origin HEAD:preview-refresh-series-parallel-circuit-20261025
          fi
