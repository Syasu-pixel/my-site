name: Sync series parallel Hero source records
on:
  push:
    branches: [preview-refresh-series-parallel-circuit-20261025]
    paths: [.github/workflows/series-parallel-sync-hero.yml]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-refresh-series-parallel-circuit-20261025
      - name: Reconcile only target Hero and source integrity
        run: |
          python3 - <<'PY'
          import sys,re,json,hashlib
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import importlib.util
          spec=importlib.util.spec_from_file_location('hero_prepare','scripts/prepare-article-heroes.py')
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          slug='articles/series-parallel-circuit-basic.html'
          root=Path('.')
          data=(root/slug).read_bytes()
          source=data.decode('utf-8')
          assert 'series-parallel-hero-responsive-preview' not in source
          assert source.count('opacity:1;') >= 3
          assert source.count('series-parallel-circuit-basic-hero.png') >= 3
          config=Path('.github/article-components/hero/css-bindings.json')
          bindings=json.loads(config.read_text(encoding='utf-8'))
          styles=mod.css_slots(source)
          planned=[]
          for style in styles:
              for slot in style['slots']:
                  raw=slot['raw'];urls=[]
                  def replace(match):
                      urls.append(match.group(0))
                      return '{{ urls['+str(len(urls)-1)+'] | safe }}'
                  template=re.sub(r'url\(\s*(?:"[^"]*"|\x27[^\x27]*\x27|[^)]*)\s*\)',replace,raw)
                  name='css/'+mod.sha(template)+'.css.njk'
                  path=Path('.github/article-components/hero')/name
                  if path.exists():
                      assert path.read_text(encoding='utf-8')==template
                  else:
                      path.write_text(template,encoding='utf-8')
                  planned.append({'sourceSha256':mod.sha(raw),'template':name,'urls':urls})
          assert slug in bindings and len(planned)>=len(bindings[slug]) and len(planned)<=len(bindings[slug])+2,'Unexpected Hero CSS slot count'
          bindings[slug]=planned
          config.write_text(json.dumps(bindings,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          site=Path('.github/site-shells/manifest.json')
          manifest=json.loads(site.read_text(encoding='utf-8'))
          entries=[p for p in manifest['pages'] if p['output']==slug]
          assert len(entries)==1
          nav='<nav class="dc-footer-profile-link" aria-label="サイト運営情報"><a href="/profile/">運営者・編集方針</a></nav>'
          assert source.count(nav)==1
          entries[0]['baselineSha256']=hashlib.sha256(source.replace(nav,'').encode()).hexdigest()
          site.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          inventory=Path('.github/article-components/site-inventory.json')
          obj=json.loads(inventory.read_text(encoding='utf-8'))
          matches=[]
          def walk(x):
              if isinstance(x,dict):
                  if x.get('path')==slug and isinstance(x.get('gitBlob'),str):matches.append(x)
                  for v in x.values():walk(v)
              elif isinstance(x,list):
                  for v in x:walk(v)
          walk(obj)
          assert len(matches)==1
          gitdata=b'blob '+str(len(data)).encode()+b'\0'+data
          matches[0]['gitBlob']=hashlib.sha1(gitdata).hexdigest()
          inventory.write_text(json.dumps(obj,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('Hero slots:',len(planned),'shell:',entries[0]['baselineSha256'],'source blob:',matches[0]['gitBlob'])
          PY
      - name: Verify Hero extraction uses canonical bindings
        run: |
          python3 scripts/prepare-article-heroes.py --out /tmp/series-parallel-hero-plan.json
      - name: Commit target records
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/article-components/hero/css-bindings.json .github/article-components/hero/css .github/site-shells/manifest.json .github/article-components/site-inventory.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: reconcile canonical Hero CSS bindings and target source hashes'
            git push origin HEAD:preview-refresh-series-parallel-circuit-20261025
          fi
