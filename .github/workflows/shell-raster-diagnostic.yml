name: Shell raster diagnostic (non-deploying)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/shell-raster-diagnostic.yml'
      - 'scripts/diagnostics/shell-raster-diagnostic.sh'
permissions:
  contents: read
concurrency:
  group: shell-raster-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  investigate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - name: Compare exact snapshots in isolated browser modes
        run: bash scripts/diagnostics/shell-raster-diagnostic.sh
      - name: Save limited public-fixture diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shell-raster-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/shell-raster-public-evidence/
          retention-days: 3
          if-no-files-found: warn
