name: Signal Tower Light Text Refresh

on:
  push:
    branches:
      - preview-signal-tower-light-text-refresh-20260916
    paths:
      - .github/workflows/signal-tower-light-text-refresh.yml
      - .github/scripts/signal_tower_light_refresh.py

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-signal-tower-light-text-refresh-20260916
          fetch-depth: 0
      - name: Apply refresh
        run: python .github/scripts/signal_tower_light_refresh.py
      - name: Commit result
        run: |
          rm -f .github/workflows/signal-tower-light-text-refresh.yml
          rm -f .github/scripts/signal_tower_light_refresh.py
          git config user.name denkicontrol-preview-writer
          git config user.email actions@users.noreply.github.com
          git add articles/signal-tower-light-basic.html docs/existing-article-improvement-backlog.md .github/workflows/signal-tower-light-text-refresh.yml .github/scripts/signal_tower_light_refresh.py
          git commit -m "Refresh signal tower light article text and related cards"
          git push origin HEAD:preview-signal-tower-light-text-refresh-20260916
