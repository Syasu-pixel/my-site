name: Site health snapshot
on:
  push:
    branches: [main]
    paths:
      - 'assets/css/**'
      - 'assets/js/**'
      - '.github/site-shells/**'
      - '.github/article-components/**'
      - 'scripts/*integrat*'
      - 'scripts/*dark-mode*'
      - 'scripts/*site-shell*'
      - 'scripts/check-site-static-integrity.mjs'
      - 'scripts/build-site-health-snapshot.mjs'
      - 'scripts/check-production-http.mjs'
      - 'scripts/check-ogp-images.mjs'
      - 'scripts/check-sitemap-integrity.mjs'
      - 'scripts/check-canonical-integrity.mjs'
      - 'scripts/check-search-index-integrity.mjs'
      - 'assets/data/search-index.json'
      - 'sitemap.xml'
      - '.github/workflows/pages.yml'
      - '.github/workflows/site-health-snapshot.yml'
  schedule:
    - cron: '15 18 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: site-health-snapshot
  cancel-in-progress: true
jobs:
  health:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.16.0' }
      - uses: pnpm/action-setup@v4
        with: { version: 11.19.0 }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build current integrated site
        run: |
          python -m pip install lxml==6.1.1
          node scripts/build-integrated-review.mjs "${RUNNER_TEMP}/health-build"
          node scripts/serve-integrated-review.mjs "${RUNNER_TEMP}/health-build" > "${RUNNER_TEMP}/health-build/server.log" 2>&1 &
      - name: Run six dark/browser shards
        continue-on-error: true
        run: |
          for shard in 0 1 2 3 4 5; do
            REVIEW_SHARD_COUNT=6 REVIEW_SHARD_INDEX=$shard node scripts/check-article-dark-mode.mjs "${RUNNER_TEMP}/health-build" || true
          done
      - name: Scan broken images and internal links
        run: node scripts/check-site-static-integrity.mjs "${RUNNER_TEMP}/health-build/candidate" "${RUNNER_TEMP}/health-build/site-static-integrity.json"
      - name: Check production HTTP reachability
        run: node scripts/check-production-http.mjs . "${RUNNER_TEMP}/health-build/site-production-http.json"
      - name: Check OGP images
        run: node scripts/check-ogp-images.mjs . "${RUNNER_TEMP}/health-build/site-ogp-health.json"
      - name: Check sitemap integrity
        run: node scripts/check-sitemap-integrity.mjs . "${RUNNER_TEMP}/health-build/site-sitemap-health.json"
      - name: Check canonical URLs
        run: node scripts/check-canonical-integrity.mjs . "${RUNNER_TEMP}/health-build/site-canonical-health.json"
      - name: Check search index integrity
        run: node scripts/check-search-index-integrity.mjs . "${RUNNER_TEMP}/health-build/site-search-index-health.json"
      - name: Build public health snapshot
        run: node scripts/build-site-health-snapshot.mjs "${RUNNER_TEMP}/health-build" assets/data/site-health.json
      - name: Commit snapshot when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          snapshot="$(mktemp)"
          cp assets/data/site-health.json "$snapshot"
          git fetch origin main
          git checkout -B main origin/main
          cp "$snapshot" assets/data/site-health.json
          git add assets/data/site-health.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(health): refresh site health snapshot"
          git push origin HEAD:main
      - name: Publish refreshed snapshot through Pages
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff HEAD^ --quiet -- assets/data/site-health.json; then
            exit 0
          fi
          gh workflow run pages.yml --ref main
