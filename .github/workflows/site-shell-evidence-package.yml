name: Downloadable shell evidence package
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/site-shell-evidence-package.yml'
      - 'scripts/package-shell-evidence.mjs'
  workflow_dispatch:
    inputs:
      comparison_run_id:
        description: Successful Header footer visual comparison run ID
        required: true
        default: '35325768247'
permissions:
  contents: read
  actions: read
jobs:
  package:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Download existing successful comparison without recapturing
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.comparison_run_id || '35325768247' }}
          pattern: shell-comparison-*
          merge-multiple: true
          path: .downloaded-evidence
      - run: node scripts/package-shell-evidence.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: shell-review-package-${{ github.run_id }}
          path: .review-evidence/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
