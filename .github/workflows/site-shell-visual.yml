name: Header footer visual comparison
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/site-shells/**'
      - '.github/site-shell-visual.json'
      - '.github/workflows/site-shell-visual.yml'
      - 'scripts/*site-shell*'
      - 'tests/site-shells.test.mjs'
      - 'articles/**'
      - 'en/articles/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
permissions:
  contents: read
concurrency:
  group: site-shell-visual-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false
jobs:
  compare:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - name: Materialize immutable baseline
        run: |
          BASE=$(node -p "require('./.github/site-shell-visual.json').baselineCommit")
          git fetch --depth=1 origin "$BASE"
          mkdir .visual-base
          git archive "$BASE" | tar -x -C .visual-base
      - name: Save baseline before generation
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/site-shell-visual.mjs --phase=baseline --root=.visual-base --out=.visual-evidence
      - name: Upload immutable baseline evidence
        uses: actions/upload-artifact@v4
        with:
          name: shell-baseline-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .visual-evidence/before/
            .visual-evidence/baseline.json
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
      - name: Verify and generate registered shells
        run: |
          if [ -f scripts/build-site-shells.mjs ]; then
            pnpm check:shells
            pnpm test:shells
            pnpm build:shells
          fi
      - name: Compare after generation
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/site-shell-visual.mjs --phase=compare --root=. --out=.visual-evidence
      - name: Upload browsable comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shell-comparison-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .visual-evidence/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
      - name: Evidence navigation
        if: always()
        run: |
          echo 'Download shell-comparison from this run, extract, and open index.html. Each entry links Before / After / Diff PNGs and report.json preserves provenance.' >> "$GITHUB_STEP_SUMMARY"
          echo "Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "$GITHUB_STEP_SUMMARY"
