name: Skill Map Adopted Assets Transfer v2
on:
  push:
    branches: [preview-career-step3-skill-map]
    paths: [.github/workflows/skill-map-adopted-assets-transfer-v2.yml]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-career-step3-skill-map
          fetch-depth: 1
      - name: Download verified adopted PNGs
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.firestorage.ai/dev/file"
          SHARE_ID="du58Lt6JhZmn"
          mkdir -p /tmp/skillmap assets/images/fa-engineer-skill-map
          curl --proto '=https' --tlsv1.2 --fail-with-body --silent --show-error "$API/shares/$SHARE_ID/files?maxResults=1000" > /tmp/meta.json
          python3 - <<'PY'
          import json, subprocess, hashlib, struct
          from pathlib import Path
          API='https://api.firestorage.ai/dev/file'
          SHARE='du58Lt6JhZmn'
          items=[
            ('01a0a464773b765abf90f969d87291a8','未経験から学ぶfa資格スキルマップ.png',1954716,'ccd53326c4a711f8dfec567aebc8815eb13a26d2c2f80f1bab17422fb5389d9d','ogp'),
            ('01a0a464bdd672f3a217e4ff47eabe93','資格と実務スキルの成長ステップ.png',1739075,'a5aae91f28897b781f96de69e7caf4d2a6c6fff78e326705751fafd0fd3e1de8','relation'),
            ('01a0a464f3e87547955c5aaa91c631b7','電気_制御資格のキャリアガイド.png',1826098,'4de44d05a80caef6d48acd08da3cbb2ce17ca0e939b4fa937cd8d89ac71ec993','priority'),
          ]
          meta=json.load(open('/tmp/meta.json',encoding='utf-8'))
          files={f['fileId']:f for f in (meta.get('files') or [])}
          for fid,name,size,sha,key in items:
              f=files.get(fid)
              if not f or f.get('fileName')!=name or f.get('sizeBytes')!=size:
                  raise SystemExit(f'metadata mismatch: {name}')
              out=Path(f'/tmp/skillmap/{key}.png')
              j=Path('/tmp/download.json')
              subprocess.run(['curl','--proto','=https','--tlsv1.2','--fail-with-body','--silent','--show-error','-X','POST',f'{API}/shares/{SHARE}/files/{fid}/download','-o',str(j)],check=True)
              d=json.load(open(j,encoding='utf-8'))
              url=d.get('downloadUrl','')
              if not url.startswith('https://s3.ap-northeast-1.wasabisys.com/'):
                  raise SystemExit('download URL rejected')
              subprocess.run(['curl','--proto','=https','--tlsv1.2','--fail-with-body','--silent','--show-error',url,'-o',str(out)],check=True)
              data=out.read_bytes()
              if len(data)!=size or hashlib.sha256(data).hexdigest()!=sha:
                  raise SystemExit(f'checksum mismatch: {name}')
              if not data.startswith(b'\x89PNG\r\n\x1a\n') or data[12:16]!=b'IHDR':
                  raise SystemExit(f'PNG invalid: {name}')
              w,h=struct.unpack('>II',data[16:24])
              if (w,h)!=(1672,941):
                  raise SystemExit(f'dimensions mismatch: {name} {w}x{h}')
              print('verified',name,size,sha)
          PY
          cp /tmp/skillmap/ogp.png assets/images/fa-engineer-skill-map/fa-engineer-skill-map-ogp.png
          cp /tmp/skillmap/relation.png assets/images/fa-engineer-skill-map/fa-engineer-skill-map-relation.png
          cp /tmp/skillmap/priority.png assets/images/fa-engineer-skill-map/fa-engineer-skill-map-priority.png
          python3 - <<'PY'
          from pathlib import Path
          p=Path('articles/fa-engineer-skill-map-career.html')
          s=p.read_text(encoding='utf-8')
          for a,b in [
            ('fa-engineer-skill-map-ogp.webp','fa-engineer-skill-map-ogp.png'),
            ('fa-engineer-skill-map-relation.webp','fa-engineer-skill-map-relation.png'),
            ('fa-engineer-skill-map-priority.webp','fa-engineer-skill-map-priority.png')]: s=s.replace(a,b)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and clean one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/skill-map-adopted-assets-transfer.yml .github/workflows/skill-map-adopted-assets-transfer-v2.yml
          git config user.name "denkicontrol-preview-writer"
          git config user.email "actions@users.noreply.github.com"
          git add -A articles/fa-engineer-skill-map-career.html assets/images/fa-engineer-skill-map .github/workflows
          git commit -m "Add adopted skill map article images at native quality"
          git push origin HEAD:preview-career-step3-skill-map
