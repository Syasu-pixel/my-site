name: Skill Map Header Link Fix

on:
  push:
    branches:
      - preview-career-step3-skill-map
    paths:
      - .github/workflows/skill-map-header-link-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-career-step3-skill-map
          fetch-depth: 1
      - name: Fix current-page language link only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('articles/fa-engineer-skill-map-career.html')
          s=p.read_text(encoding='utf-8')
          old='href="./plc-control-engineer-career.html" class="language-menu-item is-active"'
          new='href="./fa-engineer-skill-map-career.html" class="language-menu-item is-active"'
          if old not in s:
              raise SystemExit('expected canonical language link not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          rm .github/workflows/skill-map-header-link-fix.yml
          git config user.name "denkicontrol-preview-writer"
          git config user.email "actions@users.noreply.github.com"
          git add articles/fa-engineer-skill-map-career.html .github/workflows/skill-map-header-link-fix.yml
          git commit -m "Fix skill map current-page header link"
          git push origin HEAD:preview-career-step3-skill-map
