name: Skill Map Hero HQ Transfer

on:
  push:
    branches:
      - preview-career-step3-skill-map
    paths:
      - .github/workflows/skill-map-hero-hq-transfer.yml

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: preview-career-step3-skill-map
          fetch-depth: 1

      - name: Download and verify approved hero source
        shell: bash
        env:
          SHARE_ID: KIifCi2cQCkZ
          FILE_ID: 01a0a4524b7370f3aba0a7a364d2dbf2
          FILE_NAME: a_bright_clean_anime_style_illustration_of_a_mode.png
          EXPECTED_SHA256: c1ea588ee641199b42ef1afd5c429ad3466f3374ee6364d90a30a5c7eace9458
          EXPECTED_SIZE: '1754354'
        run: |
          set -euo pipefail
          API="https://api.firestorage.ai/dev/file"

          curl --proto '=https' --tlsv1.2 --fail-with-body --silent --show-error \
            "$API/shares/$SHARE_ID/files?maxResults=1000" > /tmp/meta.json

          python3 - <<'PY'
          import json, os
          meta=json.load(open('/tmp/meta.json','r',encoding='utf-8'))
          file_id=os.environ['FILE_ID']
          file_name=os.environ['FILE_NAME']
          expected_size=int(os.environ['EXPECTED_SIZE'])
          files=meta.get('files') or []
          hit=next((f for f in files if f.get('fileId')==file_id), None)
          if not hit:
              raise SystemExit('firestorage file id not found')
          if hit.get('fileName') != file_name:
              raise SystemExit('firestorage filename mismatch')
          if hit.get('sizeBytes') != expected_size:
              raise SystemExit(f"firestorage size mismatch: {hit.get('sizeBytes')} != {expected_size}")
          print(f"metadata ok: {file_name} {expected_size} bytes")
          PY

          curl --proto '=https' --tlsv1.2 --fail-with-body --silent --show-error \
            -X POST "$API/shares/$SHARE_ID/files/$FILE_ID/download" > /tmp/download.json

          DOWNLOAD_URL="$(python3 - <<'PY'
          import json
          d=json.load(open('/tmp/download.json','r',encoding='utf-8'))
          u=d.get('downloadUrl')
          if not isinstance(u,str) or not u.startswith('https://s3.ap-northeast-1.wasabisys.com/'):
              raise SystemExit('download URL rejected')
          print(u)
          PY
          )"

          curl --proto '=https' --tlsv1.2 --fail-with-body --silent --show-error \
            "$DOWNLOAD_URL" -o /tmp/fa-engineer-skill-map-hero.png

          test "$(wc -c < /tmp/fa-engineer-skill-map-hero.png)" = "$EXPECTED_SIZE"
          printf '%s  %s\n' "$EXPECTED_SHA256" /tmp/fa-engineer-skill-map-hero.png | sha256sum -c -

          python3 - <<'PY'
          from pathlib import Path
          import struct
          p=Path('/tmp/fa-engineer-skill-map-hero.png')
          data=p.read_bytes()
          if not data.startswith(b'\x89PNG\r\n\x1a\n'):
              raise SystemExit('PNG signature mismatch')
          if data[12:16] != b'IHDR':
              raise SystemExit('PNG IHDR missing')
          width,height=struct.unpack('>II',data[16:24])
          if (width,height)!=(1672,941):
              raise SystemExit(f'PNG dimensions mismatch: {width}x{height}')
          print(f'PNG verified: {width}x{height}, {len(data)} bytes')
          PY

          mkdir -p assets/images/fa-engineer-skill-map
          cp /tmp/fa-engineer-skill-map-hero.png assets/images/fa-engineer-skill-map/fa-engineer-skill-map-hero.png

      - name: Commit native hero and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/skill-map-hero-hq-transfer.yml
          git config user.name "denkicontrol-preview-writer"
          git config user.email "actions@users.noreply.github.com"
          git add -A assets/images/fa-engineer-skill-map/fa-engineer-skill-map-hero.png .github/workflows/skill-map-hero-hq-transfer.yml
          git commit -m "Restore adopted skill map hero at native quality"
          git push origin HEAD:preview-career-step3-skill-map
