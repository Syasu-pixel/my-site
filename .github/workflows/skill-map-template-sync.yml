name: Skill Map Template Sync

on:
  push:
    branches:
      - preview-career-step3-skill-map
    paths:
      - .github/workflows/skill-map-template-sync.yml

permissions:
  contents: write

jobs:
  sync-template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: preview-career-step3-skill-map
          fetch-depth: 1

      - name: Rebuild article shell from canonical career template
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          target_path = Path('articles/fa-engineer-skill-map-career.html')
          template_path = Path('articles/plc-control-engineer-career.html')
          target = target_path.read_text(encoding='utf-8')
          template = template_path.read_text(encoding='utf-8')

          def one(pattern, text, label):
              m = re.search(pattern, text, re.S)
              if not m:
                  raise SystemExit(f'could not extract {label}')
              return m.group(1)

          def section(text, start_token, end_token, label):
              s = text.find(start_token)
              if s < 0:
                  raise SystemExit(f'could not find start of {label}')
              e = text.find(end_token, s)
              if e < 0:
                  raise SystemExit(f'could not find end of {label}')
              return text[s:e]

          # Keep article metadata, but copy the canonical CSS exactly except for this article's hero image path.
          target_head_prefix = one(r'\A(.*?)(?=\s*<style>)', target, 'target head prefix')
          canonical_style = one(r'(<style>.*?</style>)', template, 'canonical style')
          canonical_style = canonical_style.replace(
              '../assets/images/plc-control-engineer-career/plc-control-engineer-career-hero.webp',
              '../assets/images/fa-engineer-skill-map/fa-engineer-skill-map-hero.png'
          )

          # Copy common shell directly from the canonical career article.
          canonical_header = one(r'(<header class="site-header">.*?</header>)', template, 'canonical header')
          canonical_footer = one(r'(<footer class="site-footer">.*?</footer>)', template, 'canonical footer')
          canonical_script = one(r'(<script>.*?</script>)', template, 'canonical script')

          # Preserve only article-specific content from the draft.
          breadcrumb = one(r'(<nav class="breadcrumb".*?</nav>)', target, 'breadcrumb')
          hero = section(target, '<section class="article-hero"', '</section>', 'hero') + '</section>'
          top_summary = section(target, '<div class="top-summary"', '<div class="layout">', 'top summary').strip()

          if '<div class="layout"><article class="main">' in target:
              article_start = target.index('<div class="layout"><article class="main">') + len('<div class="layout"><article class="main">')
          elif '<main class="main"><article>' in target:
              article_start = target.index('<main class="main"><article>') + len('<main class="main"><article>')
          else:
              raise SystemExit('could not locate draft article body')
          article_end = target.index('</article>', article_start)
          article_inner = target[article_start:article_end]

          aside_start_token = '<aside class="side">'
          aside_start = target.index(aside_start_token, article_end) + len(aside_start_token)
          aside_end = target.index('</aside>', aside_start)
          aside_inner = target[aside_start:aside_end]

          rebuilt = (
              target_head_prefix.rstrip() + '\n' + canonical_style + '\n</head>\n<body>\n' +
              canonical_header + '\n' +
              '  <div class="container">\n' +
              '    ' + breadcrumb + '\n\n' +
              '    ' + hero + '\n\n' +
              '    ' + top_summary + '\n\n' +
              '    <div class="layout">\n' +
              '      <main class="main"><article>' + article_inner + '</article></main>\n' +
              '      <aside class="side">' + aside_inner + '</aside>\n' +
              '    </div>\n' +
              '  </div>\n' +
              canonical_footer + '\n' + canonical_script + '\n</body>\n</html>\n'
          )

          checks = [
              '<header class="site-header">',
              '<div class="site-header-inner">',
              '<div class="layout">',
              '<main class="main"><article>',
              '</article></main>',
              '<aside class="side">',
              '<footer class="site-footer">',
              'position:fixed;top:0;left:0;width:100%;z-index:999',
              'grid-template-columns:minmax(0,1fr) 300px',
              'right center / auto 100% no-repeat',
          ]
          for token in checks:
              if token not in rebuilt:
                  raise SystemExit(f'structural guardrail missing: {token}')

          # Reject the two draft-only structures that caused the mismatch.
          if '<main class="container">' in rebuilt:
              raise SystemExit('draft container structure survived unexpectedly')
          if '<div class="layout"><article class="main">' in rebuilt:
              raise SystemExit('draft layout structure survived unexpectedly')

          target_path.write_text(rebuilt, encoding='utf-8')
          PY

      - name: Commit synced template and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/skill-map-template-sync.yml
          git config user.name "denkicontrol-preview-writer"
          git config user.email "actions@users.noreply.github.com"
          git add articles/fa-engineer-skill-map-career.html .github/workflows/skill-map-template-sync.yml
          git commit -m "Sync skill map article to canonical career template"
          git push origin HEAD:preview-career-step3-skill-map
