name: Noise guide Step2 diff cleanup
on:
  push:
    branches: [ai-noise-guide-step2]
    paths: [.github/workflows/step2-noise-diff-cleanup.yml]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-noise-guide-step2
          fetch-depth: 1
      - name: Normalize only Step2 formatting noise
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files=[
            'control-panel-grounding-basic.html','shielded-cable-basic.html',
            'power-signal-wiring-separation-basic.html','noise-filter-basic.html',
            'surge-protection-basic.html','analog-input-basic.html','analog-output-basic.html'
          ]
          heading='ノイズ対策を全体から切り分けたいとき'
          hub='control-panel-noise-troubleshooting-guide.html'
          for name in files:
              p=Path('articles')/name
              s=p.read_text()
              assert s.count(heading)==1, name
              h=s.index(heading)
              block_start=s.rfind('<div class="key-highlight">',0,h)
              block_end=s.find('</div>',h)
              assert block_start>=0 and block_end>=0, name
              block_end += len('</div>')
              # Derive the article indentation from its opening tag so each legacy template keeps its own style.
              article_open=s.rfind('<article',0,block_start)
              article_close=s.find('</article>',block_end)
              assert article_open>=0 and article_close>=0, name
              line_start=s.rfind('\n',0,article_open)+1
              article_indent=s[line_start:article_open]
              assert article_indent.strip()==''
              i=article_indent+'  '
              j=i+'  '
              clean=(f'{i}<div class="key-highlight">\n'
                     f'{j}<h3>{heading}</h3>\n'
                     f'{j}<p>この項目だけで原因を決めず、<a href="{hub}"><strong>制御盤のノイズ対策・誤動作の切り分けガイド</strong></a>で、発生源・伝搬経路・影響を受ける機器の順に整理できます。</p>\n'
                     f'{i}</div>\n\n'
                     f'{article_indent}</article>')
              # Replace injected callout plus closing article tag in one operation.
              s=s[:block_start]+clean+s[article_close+len('</article>'):]
              # Remove unrelated formatting noise introduced by the previous automation.
              s=s.replace('            </main>','  </main>')
              # Structural assertions.
              h=s.index(heading)
              close=s.find('</article>',h)
              aside=s.find('<aside',close)
              link=s.find(hub,h)
              assert h<link<close and aside>close, name
              assert s.count(heading)==1, name
              p.write_text(s)
          PY
          git diff --check
          python3 -m json.tool assets/data/search-index.json >/dev/null
          rm .github/workflows/step2-noise-diff-cleanup.yml
      - name: Commit cleanup
        run: |
          git config user.name "denkicontrol-ai-step2"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Clean Step2 formatting noise"
          git push origin HEAD
