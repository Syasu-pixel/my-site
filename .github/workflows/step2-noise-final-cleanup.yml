name: Noise guide Step2 final cleanup
on:
  push:
    branches: [ai-noise-guide-step2]
    paths: [.github/workflows/step2-noise-final-cleanup.yml]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-noise-guide-step2
          fetch-depth: 1
      - name: Fix category component and validate reverse-link placement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('categories/control-basics.html'); s=p.read_text()
          target='../articles/control-panel-noise-troubleshooting-guide.html'
          s=s.replace(f'class="troubleshooting-hub-card" href="{target}"', f'class="troubleshooting-hub" href="{target}"')
          # Only rename the copy span belonging to the new noise hub; its title wording differs from the earlier assertion.
          anchor=s.find(f'class="troubleshooting-hub" href="{target}"')
          assert anchor >= 0
          copy=s.find('class="troubleshooting-hub-copy"', anchor)
          end=s.find('</a>', anchor)
          assert anchor < copy < end
          s=s[:copy] + s[copy:].replace('class="troubleshooting-hub-copy"', 'class="troubleshooting-hub-body"', 1)
          assert 'troubleshooting-hub-card' not in s and 'troubleshooting-hub-copy' not in s
          assert s.count(f'class="troubleshooting-hub" href="{target}"') == 1
          p.write_text(s)

          files=['control-panel-grounding-basic.html','shielded-cable-basic.html','power-signal-wiring-separation-basic.html','noise-filter-basic.html','surge-protection-basic.html','analog-input-basic.html','analog-output-basic.html']
          heading='ノイズ対策を全体から切り分けたいとき'
          hub='control-panel-noise-troubleshooting-guide.html'
          for name in files:
              p=Path('articles')/name; s=p.read_text()
              h=s.find(heading); assert h>=0, name
              article_open=s.rfind('<article',0,h); article_close=s.find('</article>',h)
              aside=s.find('<aside', article_close)
              link=s.find(hub,h)
              assert article_open>=0 and h<link<article_close, name
              assert aside>article_close, name
              assert s.count(heading)==1, name
          PY
          git diff --check
          python3 -m json.tool assets/data/search-index.json >/dev/null
          rm .github/workflows/step2-noise-final-cleanup.yml
      - name: Commit final cleanup
        run: |
          git config user.name "denkicontrol-ai-step2"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Clean up noise guide Step2 layout"
          git push origin HEAD
