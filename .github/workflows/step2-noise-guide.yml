name: Noise guide Step2 integration fix

on:
  push:
    branches: [ai-noise-guide-step2]
    paths: [.github/workflows/step2-noise-guide.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-noise-guide-step2
          fetch-depth: 1
      - name: Move reverse links into article content
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files=[
            'articles/control-panel-grounding-basic.html',
            'articles/shielded-cable-basic.html',
            'articles/power-signal-wiring-separation-basic.html',
            'articles/noise-filter-basic.html',
            'articles/surge-protection-basic.html',
            'articles/analog-input-basic.html',
            'articles/analog-output-basic.html',
          ]
          hub='control-panel-noise-troubleshooting-guide.html'
          start='<div class="key-highlight">\n            <h3>ノイズ対策を全体から切り分けたいとき</h3>'
          end='          </div>\n'
          block='''          <div class="key-highlight">\n            <h3>ノイズ対策を全体から切り分けたいとき</h3>\n            <p>この項目だけで原因を決めず、<a href="control-panel-noise-troubleshooting-guide.html"><strong>制御盤のノイズ対策・誤動作の切り分けガイド</strong></a>で、発生源・伝搬経路・影響を受ける機器の順に整理できます。</p>\n          </div>\n\n'''
          for fn in files:
              p=Path(fn); s=p.read_text()
              # Locate the exact injected callout by its unique heading, independent of indentation.
              h=s.find('ノイズ対策を全体から切り分けたいとき')
              assert h>=0, fn
              b=s.rfind('<div class="key-highlight">',0,h)
              e=s.find('</div>',h)
              assert b>=0 and e>=0, fn
              e+=len('</div>')
              while e < len(s) and s[e] in '\r\n': e+=1
              s=s[:b]+s[e:]
              # Insert before the actual closing article tag; indentation is deliberately ignored.
              article_close=s.find('</article>')
              assert article_close>=0, fn
              s=s[:article_close]+block+s[article_close:]
              # Structural QA uses the unique heading so pre-existing related-card links cannot fool it.
              h=s.find('ノイズ対策を全体から切り分けたいとき')
              linkpos=s.find(hub,h)
              article_close=s.find('</article>',h)
              aside=s.find('<aside',article_close)
              assert 0 <= h < linkpos < article_close, fn
              assert aside > article_close, fn
              assert s.count('ノイズ対策を全体から切り分けたいとき')==1, fn
              p.write_text(s)
          PY
      - name: QA and remove one-shot workflow
        run: |
          git diff --check
          python3 -m json.tool assets/data/search-index.json >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import json, xml.etree.ElementTree as ET
          hub='control-panel-noise-troubleshooting-guide.html'
          ET.parse('sitemap.xml')
          data=json.loads(Path('assets/data/search-index.json').read_text())
          assert sum(x.get('url')=='/articles/'+hub for x in data)==1
          assert 'https://denkicontrol.com/articles/'+hub in Path('sitemap.xml').read_text()
          assert '[x] **制御盤ノイズ対策ハブ' in Path('docs/article-backlog.md').read_text()
          assert '../articles/'+hub in Path('categories/control-basics.html').read_text()
          assert 'articles/'+hub in Path('index.html').read_text()
          PY
          rm .github/workflows/step2-noise-guide.yml
      - name: Commit reviewed fix
        run: |
          git config user.name "denkicontrol-ai-step2"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix noise guide Step2 integration placement"
          git push origin HEAD
