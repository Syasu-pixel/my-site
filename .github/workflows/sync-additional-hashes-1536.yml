name: Sync Additional Hashes 1536

on:
  push:
    branches:
      - preview-auto-theme-follow-system-20260920

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-auto-theme-follow-system-20260920
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build and sync accepted candidate hashes
        run: |
          rm -rf "${RUNNER_TEMP}/additional-shells"
          node scripts/build-additional-shells.mjs "${RUNNER_TEMP}/additional-shells"
          node - <<'NODE'
          const fs=require('fs');
          const manifestPath='.github/site-shells/additional/manifest.json';
          const preservation=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/additional-shells/preservation.json','utf8'));
          const manifest=JSON.parse(fs.readFileSync(manifestPath,'utf8'));
          const byPath=new Map(preservation.pages.map(p=>[p.path,p]));
          for(const page of manifest.pages){
            const row=byPath.get(page.path);
            if(!row) throw new Error('Missing generated row: '+page.path);
            if(row.sourceSha256!==page.sourceSha256) throw new Error('Source hash changed: '+page.path);
            page.candidateSha256=row.candidateSha256;
          }
          manifest.revision.purpose='Fix dark mobile top hero overlay while preserving hero image; bookmark/PLC dynamic-card fixes retained; browser/system theme follow retained; preview only';
          fs.writeFileSync(manifestPath,JSON.stringify(manifest,null,2)+'\n');
          NODE
          rm -f .github/workflows/sync-additional-hashes-1536.yml
      - name: Commit synced hashes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/site-shells/additional/manifest.json .github/workflows/sync-additional-hashes-1536.yml
          git commit -m "Sync mobile hero dark candidate hashes"
          git push origin HEAD:preview-auto-theme-follow-system-20260920
