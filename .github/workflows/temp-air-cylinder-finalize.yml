name: Temp Air Cylinder Finalize

on:
  push:
    branches:
      - air-cylinder-finalize-20260911

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: air-cylinder-finalize-20260911

      - name: Inspect and download adopted images
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/fs assets/images/air-cylinder-basic
          curl -L -A 'Mozilla/5.0' 'https://firestorage.ai/ja/f/LtQ0sPvgbgTF' -o /tmp/fs/hero-page.html
          curl -L -A 'Mozilla/5.0' 'https://firestorage.ai/ja/f/TG8nolmxavP7' -o /tmp/fs/ogp-page.html
          echo '--- hero candidate URLs ---'
          grep -Eo 'https?[^"'"'"'<> ]+' /tmp/fs/hero-page.html | grep -Ei 'download|file|webp|api' | head -100 || true
          echo '--- ogp candidate URLs ---'
          grep -Eo 'https?[^"'"'"'<> ]+' /tmp/fs/ogp-page.html | grep -Ei 'download|file|webp|api' | head -100 || true
          python - <<'PY'
          import re, html, pathlib
          for name in ['hero','ogp']:
              text=pathlib.Path(f'/tmp/fs/{name}-page.html').read_text(errors='ignore')
              print(name, 'size', len(text))
              for pat in [r'href=["\']([^"\']+)', r'src=["\']([^"\']+)', r'"(https:[^" ]+\.webp[^" ]*)"']:
                  vals=re.findall(pat,text,re.I)
                  print(pat, vals[:40])
          PY

      - name: Stop after inspection
        run: exit 0
