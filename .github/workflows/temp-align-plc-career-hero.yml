name: Temp align PLC career hero

on:
  push:
    branches: [preview-career-hero-binary-fix]
    paths:
      - '.github/workflows/temp-align-plc-career-hero.yml'

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-career-hero-binary-fix
          fetch-depth: 0
      - name: Align hero structure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('articles/plc-control-engineer-career.html')
          s = p.read_text(encoding='utf-8')

          hero_old = re.compile(r'''          <header class="hero">.*?          </header>\n''', re.S)
          hero_new = '''          <section class="article-hero" id="top">
            <div class="article-hero-copy">
              <span class="hero-label">キャリア・転職｜仕事を知る</span>
              <h1>PLC・制御設計エンジニアとは？<br>仕事内容・必要スキル・キャリアを解説</h1>
              <p class="hero-lead">PLC・制御設計の仕事は<span class="marker-blue">「PLCのプログラムを書くこと」だけではありません。</span> センサやモータ、電磁弁、安全機器、配線、試運転、トラブル対応まで含めて、<strong>設備を狙いどおりに動かすための仕事</strong>です。</p>
              <div class="hero-actions">
                <a class="btn btn-primary" href="#overview">仕事の全体像を見る</a>
                <a class="btn btn-secondary" href="#skills">必要スキルを見る</a>
              </div>
            </div>
          </section>

          <section class="top-summary" aria-label="この記事の要点">
            <div class="summary-card"><strong>仕事内容</strong><span>設計・PLC・試運転・改善まで</span></div>
            <div class="summary-card"><strong>必要スキル</strong><span>電気＋制御＋現場での切り分け</span></div>
            <div class="summary-card"><strong>キャリア</strong><span>担当範囲が広がるほど選択肢も増える</span></div>
          </section>
'''
          s, n = hero_old.subn(hero_new, s, count=1)
          if n != 1:
              raise SystemExit(f'hero replacement count={n}')

          css = r'''

    /* standard article hero alignment */
    .article-hero{
      position:relative;
      overflow:hidden;
      border:1px solid var(--line);
      border-radius:30px;
      background:linear-gradient(90deg,rgba(255,255,255,.98) 0%,rgba(255,255,255,.95) 36%,rgba(255,255,255,.82) 54%,rgba(255,255,255,.45) 72%,rgba(255,255,255,.12) 100%),#f8fbff;
      box-shadow:var(--shadow);
      min-height:400px;
      isolation:isolate;
    }
    .article-hero::before{
      content:"";
      position:absolute;
      inset:0;
      background:url("../assets/images/plc-control-engineer-career/plc-control-engineer-career-hero.webp") right center / auto 100% no-repeat;
      opacity:.34;
      pointer-events:none;
      z-index:0;
    }
    .article-hero::after{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(90deg,rgba(255,255,255,.72) 0%,rgba(255,255,255,.50) 38%,rgba(255,255,255,.20) 64%,rgba(255,255,255,0) 100%);
      pointer-events:none;
      z-index:1;
    }
    .article-hero-copy{
      width:min(100%,620px);
      min-height:400px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:flex-start;
      padding:46px 40px;
      position:relative;
      z-index:2;
    }
    .article-hero h1{
      margin:0 0 14px;
      font-size:40px;
      line-height:1.22;
      letter-spacing:.01em;
    }
    .article-hero .hero-label{margin-bottom:16px}
    .article-hero .hero-lead{margin:0;max-width:37ch;font-size:15px;color:#334155}
    .hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:10px 16px;border-radius:14px;font-size:14px;font-weight:900;line-height:1.4;text-decoration:none;border:1px solid transparent}
    .btn:hover{text-decoration:none}
    .btn-primary{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;box-shadow:0 12px 24px rgba(37,99,235,.18)}
    .btn-secondary{background:#fff;color:#1d4ed8;border-color:#bfdbfe}
    .top-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:18px 0 22px}
    .summary-card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:var(--shadow-soft)}
    .summary-card strong{display:block;font-size:14px;color:#0f172a}
    .summary-card span{display:block;margin-top:5px;font-size:12px;line-height:1.6;color:#64748b}

    @media(max-width:900px){
      .article-hero{min-height:auto;border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.98) 0%,rgba(255,255,255,.95) 52%,rgba(255,255,255,.72) 100%),#f8fbff}
      .article-hero::before{background:url("../assets/images/plc-control-engineer-career/plc-control-engineer-career-hero.webp") right -28px bottom -14px / 162% auto no-repeat;opacity:.20}
      .article-hero::after{background:linear-gradient(170deg,rgba(255,255,255,.78) 0%,rgba(255,255,255,.58) 42%,rgba(255,255,255,.22) 72%,rgba(255,255,255,0) 100%)}
      .article-hero-copy{min-height:360px;padding:34px 22px;justify-content:flex-start}
      .article-hero h1{font-size:30px}
      .article-hero .hero-lead{font-size:14px;max-width:32ch}
      .top-summary{grid-template-columns:1fr}
    }
    @media(max-width:640px){
      .article-hero{border-radius:20px}
      .article-hero::before{background:url("../assets/images/plc-control-engineer-career/plc-control-engineer-career-hero.webp") right -40px bottom -20px / 178% auto no-repeat;opacity:.14}
      .article-hero-copy{min-height:350px;padding:28px 18px}
      .article-hero h1{font-size:28px;line-height:1.28}
      .article-hero .hero-label{margin-bottom:12px}
      .article-hero .hero-lead{font-size:13px;line-height:1.75;max-width:31ch}
      .hero-actions{margin-top:20px;width:100%;gap:8px}
      .hero-actions .btn{width:100%;min-height:44px;font-size:13px}
      .top-summary{gap:8px;margin:12px 0 16px}
      .summary-card{padding:13px 14px;border-radius:16px}
      .summary-card strong{font-size:13px}
      .summary-card span{font-size:11px;margin-top:2px}
    }
'''
          s = s.replace('</style>', css + '\n  </style>', 1)
          p.write_text(s, encoding='utf-8')
          PY

          git config user.name "denkicontrol-preview-writer"
          git config user.email "actions@users.noreply.github.com"
          git add articles/plc-control-engineer-career.html
          git commit -m "Align PLC career hero with standard article structure"
          git push origin HEAD:preview-career-hero-binary-fix
