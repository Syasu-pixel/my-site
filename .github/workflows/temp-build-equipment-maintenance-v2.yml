name: Temp build equipment maintenance v2
on:
  push:
    branches:
      - preview-equipment-maintenance-career-v2
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build article
        run: python .github/scripts/temp_build_equipment_v2.py
      - name: Commit and clean temporary files
        run: |
          rm -f .github/workflows/temp-build-equipment-maintenance-v2.yml
          rm -f .github/scripts/temp_build_equipment_v2.py
          rm -f .preview-trigger-equipment-v2
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Preview: rebuild equipment maintenance article from career template [skip ci]"
          git pull --rebase origin preview-equipment-maintenance-career-v2
          git push origin preview-equipment-maintenance-career-v2
