name: Temp build production engineering career
on:
  push:
    branches:
      - preview-production-engineering-career
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-production-engineering-career
      - name: Build article
        run: python scripts/temp_build_production_engineering.py
      - name: Commit article and cleanup
        run: |
          rm .github/workflows/temp-build-production-engineering-career.yml
          rm scripts/temp_build_production_engineering.py
          git config user.name denkicontrol-builder
          git config user.email actions@users.noreply.github.com
          git add articles/production-engineering-career.html .github/workflows/temp-build-production-engineering-career.yml scripts/temp_build_production_engineering.py
          git commit -m "Draft production engineering career article"
          git push origin preview-production-engineering-career
