name: Temp capture PLC career mobile v2

on:
  push:
    branches:
      - preview-career-hero-binary-fix

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-career-hero-binary-fix
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/server.log
          exit 1
      - name: Capture article
        run: |
          mkdir -p preview-mobile-v2
          cat > capture.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
          const r = await page.goto('http://127.0.0.1:4173/articles/plc-control-engineer-career.html',{waitUntil:'networkidle',timeout:90000});
          if (!r || !r.ok()) throw new Error('render failed');
          await page.screenshot({path:'preview-mobile-v2/mobile.png',fullPage:true});
          await browser.close();
          JS
          node capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: plc-career-mobile-v2
          path: preview-mobile-v2/mobile.png
          retention-days: 2
