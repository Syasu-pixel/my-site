name: Temp Career Crosslinks Preview

on:
  push:
    branches:
      - preview-career-crosslinks

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-career-crosslinks
      - name: Add career cross-links
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          configs = {
            'articles/plc-control-engineer-career.html': {
              'career_note': '<p class="highlight">仕事の方向性を比べるなら、<a href="equipment-maintenance-career.html"><strong>設備保全</strong></a>は設備を安定稼働させる側、<a href="production-engineering-career.html"><strong>生産技術</strong></a>は工程・設備・改善をつないで生産の仕組みをつくる側として整理すると違いが見えやすくなります。</p>',
              'cards': [
                ('equipment-maintenance-career.html','設備保全とは？','点検・予防保全・故障対応を中心に、設備を止めない仕事を知る'),
                ('production-engineering-career.html','生産技術とは？','工程設計・設備導入・量産立上げ・改善までの仕事を知る'),
              ],
            },
            'articles/equipment-maintenance-career.html': {
              'career_note': '<p class="highlight">近い職種も比較しておくと役割が整理しやすくなります。<a href="plc-control-engineer-career.html"><strong>PLC・制御設計</strong></a>は設備を動かす制御をつくる側、<a href="production-engineering-career.html"><strong>生産技術</strong></a>は工程や設備を含めて生産の仕組みをつくる側です。</p>',
              'cards': [
                ('plc-control-engineer-career.html','PLC・制御設計エンジニアとは？','PLC・電気設計・試運転など、設備を動かす制御側の仕事を知る'),
                ('production-engineering-career.html','生産技術とは？','工程設計・設備導入・量産立上げ・改善までの仕事を知る'),
              ],
            },
            'articles/production-engineering-career.html': {
              'career_note': '<p class="highlight">生産技術と近い仕事を比べるなら、<a href="plc-control-engineer-career.html"><strong>PLC・制御設計</strong></a>は設備を動かす制御の専門、<a href="equipment-maintenance-career.html"><strong>設備保全</strong></a>は設備を安定稼働させる専門として見ると、担当範囲の違いを整理しやすくなります。</p>',
              'cards': [
                ('plc-control-engineer-career.html','PLC・制御設計エンジニアとは？','PLC・電気設計・試運転など、設備を動かす制御側の仕事を知る'),
                ('equipment-maintenance-career.html','設備保全とは？','点検・予防保全・故障対応を中心に、設備を止めない仕事を知る'),
              ],
            },
          }

          for filename, cfg in configs.items():
            p = Path(filename)
            text = p.read_text(encoding='utf-8')

            # Add one natural comparison link block inside the career section.
            if cfg['career_note'] not in text:
              pattern = r'(<section class="article-card" id="career">.*?)(</section>)'
              m = re.search(pattern, text, flags=re.S)
              if not m:
                raise SystemExit(f'career section not found: {filename}')
              text = text[:m.start()] + m.group(1) + cfg['career_note'] + m.group(2) + text[m.end():]

            # Add a compact two-card cross-link section immediately before summary.
            if 'id="related-career"' not in text:
              cards = ''.join(
                f'<a class="internal-link" href="{href}"><strong>{title}</strong><span>{desc}</span></a>'
                for href, title, desc in cfg['cards']
              )
              block = (
                '<section class="article-card" id="related-career">'
                '<h2>関連する仕事を比較する</h2>'
                '<p>職種名だけで判断せず、担当する範囲や現場での役割を比べると、自分が伸ばしたい方向を整理しやすくなります。</p>'
                f'<div class="internal-grid">{cards}</div>'
                '</section>'
              )
              marker = '<section class="article-card" id="summary">'
              if marker not in text:
                raise SystemExit(f'summary marker not found: {filename}')
              text = text.replace(marker, block + marker, 1)

            p.write_text(text, encoding='utf-8')
          PY
      - name: Verify intended files only
        run: |
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "articles/equipment-maintenance-career.html articles/plc-control-engineer-career.html articles/production-engineering-career.html "
          grep -q 'id="related-career"' articles/plc-control-engineer-career.html
          grep -q 'id="related-career"' articles/equipment-maintenance-career.html
          grep -q 'id="related-career"' articles/production-engineering-career.html
      - name: Commit preview changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add articles/plc-control-engineer-career.html articles/equipment-maintenance-career.html articles/production-engineering-career.html
          git commit -m 'Add career article cross-links'
          git push origin HEAD:preview-career-crosslinks
