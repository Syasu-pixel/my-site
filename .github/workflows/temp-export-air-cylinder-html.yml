name: Temp Export Air Cylinder Preview Assets

on:
  push:
    branches:
      - air-cylinder-finalize-20260911

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: air-cylinder-finalize-20260911
      - uses: actions/upload-artifact@v4
        with:
          name: air-cylinder-preview-site
          path: |
            articles/air-cylinder-basic.html
            assets
            scripts
          if-no-files-found: error
