name: Temp Export Air Cylinder HTML

on:
  push:
    branches:
      - air-cylinder-finalize-20260911

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: air-cylinder-finalize-20260911
      - uses: actions/upload-artifact@v4
        with:
          name: air-cylinder-current-html
          path: articles/air-cylinder-basic.html
          if-no-files-found: error
