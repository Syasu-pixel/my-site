name: Temp Export Air Cylinder Preview Assets

on:
  push:
    branches:
      - air-cylinder-finalize-20260911

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: air-cylinder-finalize-20260911
      - uses: actions/upload-artifact@v4
        with:
          name: air-cylinder-preview-minimal
          path: |
            articles/air-cylinder-basic.html
            assets/images/common/site-logo-dcl.png
            assets/images/common/site-logo-dcl-16.png
            assets/images/common/site-logo-dcl-32.png
            assets/images/common/site-logo-dcl-48.png
            assets/images/common/site-logo-dcl-180.png
            assets/images/air-cylinder-basic/air-cylinder-basic-01.png
            assets/images/air-cylinder-basic/air-cylinder-basic-02.png
            assets/images/guide-characters/friendly_worker_with_helmet_and_smile.png
            assets/images/guide-characters/curious_worker_with_a_cheerful_expression.png
            assets/js/site-search.js
          if-no-files-found: error
