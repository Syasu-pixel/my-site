name: Temp fetch drilling hero

on:
  push:
    branches:
      - docs-sample-line-drilling
    paths:
      - '.github/workflows/temp-fetch-drilling-hero.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect firestorage download route
        shell: bash
        run: |
          set -euxo pipefail
          BASE='https://firestorage.ai'
          JS="$BASE/_next/static/chunks/4899-d89df949f2dbd5af.js"
          curl -L --fail --silent --show-error -o /tmp/page.js "$JS"
          python - <<'PY'
          from pathlib import Path
          s=Path('/tmp/page.js').read_text(errors='ignore')
          for needle in ['async function v()', '/download', 'files?maxResults=1000', 'window.location.pathname.match', 'let f=', 'const f=']:
              print('\n===== '+needle+' =====')
              start=0
              hits=0
              while True:
                  i=s.find(needle,start)
                  if i<0 or hits>=8: break
                  print(s[max(0,i-1800):min(len(s),i+3200)])
                  start=i+len(needle)
                  hits+=1
          PY
