name: temp-firestorage-probe

on:
  push:
    branches:
      - preview-production-engineering-career
    paths:
      - .github/workflows/temp-firestorage-probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect firestorage share API
        run: |
          python - <<'PY'
          import requests,json
          u='https://api.firestorage.ai/dev/file/shares/GSXLCJ4iva7T/files?maxResults=1000'
          r=requests.get(u,timeout=30)
          print('STATUS',r.status_code)
          print(r.text[:20000])
          PY
