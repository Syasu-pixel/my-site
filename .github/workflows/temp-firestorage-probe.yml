name: temp-firestorage-probe

on:
  push:
    branches:
      - preview-production-engineering-career
    paths:
      - .github/workflows/temp-firestorage-probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Render firestorage share page
        run: |
          set -euxo pipefail
          SHARE='https://firestorage.ai/ja/f/GSXLCJ4iva7T'
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=15000 --dump-dom "$SHARE" > /tmp/rendered.html
          python - <<'PY'
          import re
          text=open('/tmp/rendered.html',encoding='utf-8',errors='ignore').read()
          print('DOM_LEN',len(text))
          for pat in [r'href="([^"]+)"',r'src="([^"]+)"']:
            for m in re.findall(pat,text,re.I):
              if any(k in m.lower() for k in ['download','file','api','zip','production-engineering']): print('LINK',m)
          print('TEXT_EXCERPT')
          clean=re.sub(r'<[^>]+>',' ',text)
          print(re.sub(r'\s+',' ',clean)[-5000:])
          PY
