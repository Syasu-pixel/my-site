name: temp-production-engineering-asset-transfer

on:
  push:
    branches:
      - preview-production-engineering-career
    paths:
      - .github/workflows/temp-firestorage-probe.yml

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-production-engineering-career
          fetch-depth: 0
      - name: Download adopted image bundle
        run: |
          python - <<'PY'
          import requests, pathlib, zipfile
          api='https://api.firestorage.ai/dev/file/shares/GSXLCJ4iva7T/files/01a09a50a19a744d862450390824251f/download'
          r=requests.post(api,timeout=30)
          r.raise_for_status()
          url=r.json()['downloadUrl']
          q=requests.get(url,timeout=120)
          q.raise_for_status()
          p=pathlib.Path('/tmp/production-engineering-assets.zip')
          p.write_bytes(q.content)
          with zipfile.ZipFile(p) as z:
            names=set(z.namelist())
            expected={
              'production-engineering-career-hero.webp',
              'production-engineering-career-ogp.webp',
              'production-engineering-career-overview.webp',
              'production-engineering-career-skills.webp',
              'production-engineering-career-career.webp',
            }
            if names != expected:
              raise SystemExit(f'unexpected archive contents: {sorted(names)}')
            out=pathlib.Path('assets/images/production-engineering-career')
            out.mkdir(parents=True,exist_ok=True)
            z.extractall(out)
          print('downloaded',len(q.content),'bytes')
          PY
      - name: Commit adopted assets and remove temporary workflow
        run: |
          rm -f .github/workflows/temp-firestorage-probe.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/production-engineering-career .github/workflows/temp-firestorage-probe.yml
          git commit -m "Add adopted production engineering article images"
          git push origin HEAD:preview-production-engineering-career
