name: TEMP import air-cylinder preview bundle

on:
  push:
    branches:
      - preview/air-cylinder-final-20260912
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/air-cylinder-final-20260912
          fetch-depth: 0

      - name: Download approved article bundle
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.firestorage.ai/dev/file/shares/uTwrONsoMsxc'
          curl -fsSL "$API/files?maxResults=1000" -o /tmp/files.json
          FILE_ID=$(jq -r '.files[] | select(.fileName == "air-cylinder-preview-repo-bundle.zip") | .fileId' /tmp/files.json | head -1)
          test -n "$FILE_ID" && test "$FILE_ID" != "null"
          curl -fsSL -X POST "$API/files/$FILE_ID/download" -o /tmp/download.json
          DOWNLOAD_URL=$(jq -r '.downloadUrl' /tmp/download.json)
          test -n "$DOWNLOAD_URL" && test "$DOWNLOAD_URL" != "null"
          curl -fsSL "$DOWNLOAD_URL" -o /tmp/air-cylinder-preview-repo-bundle.zip
          echo 'f91af5e437398c9affcdda96abeacf6516f8e23374d7ea8fd482f6128e579f01  /tmp/air-cylinder-preview-repo-bundle.zip' | sha256sum -c -
          unzip -o /tmp/air-cylinder-preview-repo-bundle.zip -d .

      - name: Enable Netlify only on this review branch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('netlify.toml')
          s=p.read_text()
          s=s.replace('  ignore = "exit 0"\n','')
          s=s.replace('ignore = "exit 0"\n','')
          p.write_text(s)
          PY

      - name: Remove temporary preview plumbing
        shell: bash
        run: |
          rm -f \
            .github/workflows/temp-inspect-firestorage-preview.yml \
            .github/workflows/temp-inspect-firestorage-api.yml \
            .github/workflows/temp-inspect-firestorage-chunks.yml \
            .github/workflows/temp-inspect-firestorage-route.yml \
            .github/workflows/temp-import-air-cylinder-preview.yml \
            preview/air-cylinder-final-20260912/preview-check.txt
          rmdir preview/air-cylinder-final-20260912 2>/dev/null || true

      - name: Verify preview article files
        shell: bash
        run: |
          set -euo pipefail
          test -f articles/air-cylinder-basic.html
          for f in hero ogp structure types forward reverse auto-switch maintenance; do
            test -f "assets/images/air-cylinder-basic/air-cylinder-basic-$f.webp"
          done
          grep -q 'air-cylinder-basic-structure.webp' articles/air-cylinder-basic.html
          grep -q 'air-cylinder-basic-maintenance.webp' articles/air-cylinder-basic.html
          ! grep -q 'ignore = "exit 0"' netlify.toml
          git status --short

      - name: Commit completed preview
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Preview: render completed air-cylinder article'
          git push origin HEAD:preview/air-cylinder-final-20260912
