name: Temp import approved drilling hero

on:
  push:
    branches:
      - docs-sample-line-drilling
    paths:
      - '.github/workflows/temp-import-approved-drilling-hero.yml'

permissions:
  contents: write

jobs:
  import-hero:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: docs-sample-line-drilling

      - name: Download approved hero
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.firestorage.ai/dev/file/shares/abJwspnCFDV0'
          TARGET='assets/images/articles/plc-drilling-line-design-project-01-hero.webp'
          curl -fsSL "$API/files?maxResults=1000" -o /tmp/files.json
          FILE_ID="$(python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/files.json').read_text())
          expected='plc-drilling-line-design-project-01-hero-approved.webp'
          files=data.get('files') or []
          match=next((f for f in files if f.get('fileName')==expected), None)
          if not match:
              raise SystemExit(f'expected file not found; got {[f.get("fileName") for f in files]}')
          print(match['fileId'])
          PY
          )"
          curl -fsSL -X POST "$API/files/$FILE_ID/download" -o /tmp/download.json
          DOWNLOAD_URL="$(python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/download.json').read_text())
          url=data.get('downloadUrl')
          if not url:
              raise SystemExit('downloadUrl missing')
          print(url)
          PY
          )"
          curl -fL --silent --show-error "$DOWNLOAD_URL" -o "$TARGET"
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/images/articles/plc-drilling-line-design-project-01-hero.webp')
          data=p.read_bytes()
          assert data[:4] == b'RIFF' and data[8:12] == b'WEBP', data[:16]
          print(f'valid WebP: {p} ({len(data)} bytes)')
          PY

      - name: Commit approved hero
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images/articles/plc-drilling-line-design-project-01-hero.webp
          if git diff --cached --quiet; then
            echo 'No hero change needed.'
            exit 0
          fi
          git commit -m 'fix: use approved drilling line hero'
          git push origin HEAD:docs-sample-line-drilling
