name: TEMP inspect firestorage chunks

on:
  push:
    branches:
      - preview/air-cylinder-final-20260912
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch supporting chunks
        run: |
          set -euxo pipefail
          base='https://firestorage.ai/_next/static/chunks'
          for f in \
            '8500-f4d7bfbe7500f274.js' \
            '8437-d65cc193dc908afa.js' \
            '5841-1160578ba9bb4f3e.js' \
            '4899-d89df949f2dbd5af.js' \
            '3794-56f19dc9e2f95fcd.js'; do
            curl -L --fail -o "$f" "$base/$f"
          done
          cat *.js > all.js
          python - <<'PY'
          import re
          s=open('all.js',encoding='utf-8',errors='ignore').read()
          needles=['api','download','shareId','publicId','signed','presign','object','attachment','file_id','fileId']
          hits=[]
          for n in needles:
              for m in re.finditer(n,s,re.I):
                  a=max(0,m.start()-350); b=min(len(s),m.end()+650)
                  hits.append(s[a:b])
          txt='\n\n===== HIT =====\n\n'.join(hits)
          open('hits.txt','w').write(txt)
          print(txt[:40000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: temp-firestorage-chunk-inspection
          path: hits.txt
          retention-days: 1
