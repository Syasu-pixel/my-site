name: TEMP inspect firestorage route

on:
  push:
    branches:
      - preview/air-cylinder-final-20260912
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Extract route builder
        run: |
          set -euxo pipefail
          base='https://firestorage.ai/_next/static/chunks'
          for f in '8500-f4d7bfbe7500f274.js' '8437-d65cc193dc908afa.js' '5841-1160578ba9bb4f3e.js' '4899-d89df949f2dbd5af.js' '3794-56f19dc9e2f95fcd.js'; do curl -L --fail -o "$f" "$base/$f"; done
          cat *.js > all.js
          python - <<'PY'
          s=open('all.js',encoding='utf-8',errors='ignore').read()
          terms=['shareEndpoint:null','async function v','function v()','requiresCushion','maxResults=1000']
          out=[]
          for term in terms:
              pos=0
              while True:
                  i=s.find(term,pos)
                  if i<0: break
                  out.append(f'### {term}\n'+s[max(0,i-2500):i+3500])
                  pos=i+1
          open('route.txt','w').write('\n\n'.join(out))
          print(open('route.txt').read()[:50000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: temp-firestorage-route
          path: route.txt
          retention-days: 1
