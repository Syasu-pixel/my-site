name: Temp inspect firestorage

on:
  push:
    branches:
      - preview-career-hero-binary-fix

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch share page
        run: |
          curl -L -sS https://firestorage.ai/ja/f/ncTOrNLYMb6L -o page.html
          wc -c page.html
      - name: Upload page source
        uses: actions/upload-artifact@v4
        with:
          name: firestorage-share-source
          path: page.html
          retention-days: 1
