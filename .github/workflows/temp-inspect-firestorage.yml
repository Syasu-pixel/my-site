name: Temp inspect firestorage

on:
  push:
    branches:
      - preview-career-hero-binary-fix

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch share page
        run: |
          curl -L -sS https://firestorage.ai/ja/f/ncTOrNLYMb6L -o page.html
          echo SIZE
          wc -c page.html
          echo NAMES
          grep -o 'plc-control-engineer-career-[^"< ]*' page.html || true
          echo URLS
          grep -o 'https[^"< ]*' page.html | head -50 || true
