name: Temp inspect firestorage share

on:
  push:
    branches: [preview-career-hero-binary-fix]
    paths:
      - '.github/workflows/temp-inspect-firestorage.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect share client chunks
        shell: bash
        run: |
          set -euxo pipefail
          base='https://firestorage.ai'
          share='https://firestorage.ai/ja/f/f1NhZnXUBM1O'
          curl -fsSL "$share" -o /tmp/page.html
          grep -Eo '/_next/static/chunks/[^" ]+\.js' /tmp/page.html | sort -u > /tmp/chunks.txt
          cat /tmp/chunks.txt
          rm -f /tmp/all.js
          while IFS= read -r chunk; do
            echo "===== $chunk =====" >> /tmp/all.js
            curl -fsSL "$base$chunk" >> /tmp/all.js || true
            printf '\n' >> /tmp/all.js
          done < /tmp/chunks.txt
          python3 - <<'PY'
          import re
          s=open('/tmp/all.js',encoding='utf-8',errors='replace').read()
          pats=[r'.{0,220}fetch\(.{0,500}',r'.{0,220}/api/.{0,500}',r'.{0,220}(presign|signed|download|fileId|public_id|shareId|storage).{0,500}']
          for pat in pats:
              print('\nPATTERN',pat)
              seen=set()
              for m in re.finditer(pat,s,re.I|re.S):
                  x=m.group(0)[:1000].replace('\n',' ')
                  if x not in seen:
                      seen.add(x); print(x)
          PY
