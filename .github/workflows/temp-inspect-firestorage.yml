name: Temp inspect firestorage

on:
  push:
    branches:
      - preview-career-hero-binary-fix

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect firestorage client chunks
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://firestorage.ai'
          curl -L -sS "$BASE/ja/f/ncTOrNLYMb6L" -o page.html
          mkdir -p chunks
          grep -o 'src="[^"]*\.js"' page.html | sed 's/^src="//;s/"$//' | sort -u > js-paths.txt
          while IFS= read -r p; do
            f=$(basename "$p")
            curl -L -sS "$BASE$p" -o "chunks/$f" || true
          done < js-paths.txt
          echo '--- API / download matches ---'
          grep -RniE 'api/|download|presign|signed|shareId|publicId|file_id|fileId|objects' chunks | head -300 || true
      - name: Upload sources
        uses: actions/upload-artifact@v4
        with:
          name: firestorage-client-all
          path: |
            page.html
            js-paths.txt
            chunks/
          retention-days: 1
