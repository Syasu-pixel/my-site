name: Temp inspect PLC career template
on:
  push:
    branches:
      - preview-equipment-maintenance-career-v2
jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Print article structure
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('articles/plc-control-engineer-career.html').read_text(encoding='utf-8')
          for tag in ['h1','h2','h3']:
              print(f'--- {tag.upper()} ---')
              for x in re.findall(fr'<{tag}[^>]*>(.*?)</{tag}>',s,re.S):
                  print(re.sub('<[^>]+>','',x).strip())
          print('--- IDS ---')
          for x in re.findall(r'id="([^"]+)"',s): print(x)
          print('--- IMAGES ---')
          for x in re.findall(r'<img[^>]+src="([^"]+)"[^>]*alt="([^"]*)"',s): print(x)
          PY
      - name: Remove temporary workflow
        run: |
          rm .github/workflows/temp-inspect-plc-career-template.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Remove temporary template inspection workflow" || exit 0
          git push
