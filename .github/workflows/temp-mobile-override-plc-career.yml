name: Temp PLC career mobile override

on:
  push:
    branches:
      - preview-career-hero-binary-fix

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-career-hero-binary-fix
      - name: Add mobile override CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('articles/plc-control-engineer-career.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* plc-career-mobile-polish-v1 */'
          if marker in s:
              raise SystemExit(0)
          css = r'''
          /* plc-career-mobile-polish-v1 */
          @media(max-width:640px){
            body{padding-top:62px;line-height:1.72}
            .site-header{padding:6px 7px}
            .brand-logo{height:34px}
            .brand-title{font-size:13px}
            .brand-sub{display:none}
            .header-actions{gap:5px}
            .header-link{min-height:32px;padding:4px 8px;font-size:10px}
            .container{padding-left:8px;padding-right:8px;padding-bottom:30px}
            .breadcrumb{margin:10px 2px 9px;gap:5px;font-size:10px;line-height:1.45}
            .hero{border-radius:18px}
            .hero-media{height:168px;aspect-ratio:auto}
            .hero-media img{object-position:center center}
            .hero-copy{padding:15px 14px 16px}
            .hero-label{min-height:24px;padding:0 9px;font-size:10px}
            .hero h1{margin:9px 0 8px;font-size:22px;line-height:1.38}
            .hero-lead{font-size:13px;line-height:1.7}
            .key-points{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:12px}
            .key-point{padding:8px 6px;border-radius:10px;text-align:center}
            .key-point strong{font-size:11px;line-height:1.35}
            .key-point span{margin-top:2px;font-size:9px;line-height:1.35}
            .article-card{margin-top:12px;padding:15px;border-radius:18px}
            .article-card h2{margin-bottom:11px;padding-left:9px;border-left-width:5px;font-size:19px;line-height:1.45}
            .article-card h3{margin:18px 0 6px;font-size:16px}
            .article-card p{margin-bottom:11px;font-size:14px;line-height:1.75}
            .article-card ul,.article-card ol{margin:6px 0 12px;padding-left:1.2em}
            .article-card li{margin:4px 0;font-size:14px;line-height:1.65}
            .highlight,.caution{padding:12px;border-radius:12px;font-size:13px;line-height:1.65}
            .skill-grid,.internal-grid{grid-template-columns:1fr;gap:8px}
            .skill{padding:12px;border-radius:12px}
            .skill h3{font-size:15px}
            .skill p{font-size:12px}
            .article-figure{margin:14px -7px 6px;overflow-x:auto;overscroll-behavior-x:contain;padding-bottom:4px;-webkit-overflow-scrolling:touch}
            .article-figure img{width:680px;max-width:none;border-radius:12px}
            .article-figure figcaption{padding:0 12px;margin-top:5px;font-size:10px;line-height:1.45;text-align:left}
            .figure-note{margin-top:7px;padding:9px 10px;border-radius:10px;font-size:11px;line-height:1.55}
            .talk-thread{gap:9px;margin-top:12px}
            .talk-row{gap:8px}
            .talk-avatar{flex-basis:46px;width:46px}
            .talk-avatar img{width:44px}
            .talk-bubble{padding:10px 11px;border-radius:14px;font-size:13px;line-height:1.6}
            .talk-name{font-size:10px}
            .flow{gap:8px}
            .flow-item{grid-template-columns:34px minmax(0,1fr);gap:9px}
            .flow-no{width:34px;height:34px;border-radius:9px;font-size:12px}
            .cta{grid-template-columns:1fr;gap:10px;padding:14px;border-radius:14px}
            .cta h3{font-size:16px}
            .cta p{font-size:13px;line-height:1.6}
            .cta a{justify-self:stretch;min-height:40px}
            .side{gap:10px}
            .side-card{padding:13px;border-radius:16px}
            .side-card h3{font-size:14px}
            .side-card p{font-size:12px}
            .side-list{gap:6px;margin-top:7px}
            .side-list a{padding:8px;font-size:11px}
            footer{margin-top:18px;padding-top:14px;font-size:11px}
          }
          '''
          s = s.replace('</style>', css + '\n  </style>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add articles/plc-control-engineer-career.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'style: optimize PLC career article for mobile'
          git push origin HEAD:preview-career-hero-binary-fix
