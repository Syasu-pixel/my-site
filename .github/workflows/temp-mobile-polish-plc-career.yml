name: Temp PLC Career Preview Capture

on:
  push:
    branches:
      - preview-career-hero-binary-fix

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local render server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/preview-server.log 2>&1 &
          echo $! >/tmp/preview-server.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/preview-server.log || true
          exit 1

      - name: Capture PLC career desktop and mobile
        env:
          ARTICLE_PATH: articles/plc-control-engineer-career.html
          HEAD_SHA: ${{ github.sha }}
        run: |
          OUT="preview-capture/plc-career"
          mkdir -p "$OUT"
          cat > .temp-plc-capture.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const articlePath = process.env.ARTICLE_PATH;
          const renderUrl = `http://127.0.0.1:4173/${articlePath}`;
          const out = 'preview-capture/plc-career';
          const browser = await chromium.launch({ headless: true });

          async function capture(name, viewport) {
            const page = await browser.newPage({ viewport, deviceScaleFactor: 1 });
            const response = await page.goto(renderUrl, { waitUntil: 'networkidle', timeout: 90000 });
            if (!response || !response.ok()) throw new Error(`render failed: ${response?.status() ?? 'no response'} ${renderUrl}`);
            await page.evaluate(async () => {
              if (document.fonts?.ready) await document.fonts.ready;
              const step = Math.max(500, window.innerHeight * 0.8);
              for (let y = 0; y < document.documentElement.scrollHeight; y += step) {
                window.scrollTo(0, y);
                await new Promise(r => setTimeout(r, 90));
              }
              window.scrollTo(0, document.documentElement.scrollHeight);
              await new Promise(r => setTimeout(r, 500));
              window.scrollTo(0, 0);
              await Promise.all([...document.images].map(img => img.complete ? Promise.resolve() : new Promise(resolve => {
                img.addEventListener('load', resolve, { once: true });
                img.addEventListener('error', resolve, { once: true });
              })));
              await new Promise(r => setTimeout(r, 500));
            });
            await page.screenshot({ path: `${out}/${name}.png`, fullPage: true });
            if (name === 'desktop') fs.writeFileSync(`${out}/rendered.html`, await page.content(), 'utf8');
            await page.close();
          }

          await capture('desktop', { width: 1440, height: 1000 });
          await capture('mobile', { width: 390, height: 844 });
          await browser.close();

          fs.writeFileSync(`${out}/manifest.json`, JSON.stringify({
            article_path: articlePath,
            render_source: 'local-branch-head',
            head_sha: process.env.HEAD_SHA,
            captured_at: new Date().toISOString(),
            desktop: 'desktop.png',
            mobile: 'mobile.png',
            html: 'rendered.html'
          }, null, 2));
          JS
          node .temp-plc-capture.mjs
          rm -f .temp-plc-capture.mjs

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/preview-server.pid ]; then
            kill "$(cat /tmp/preview-server.pid)" || true
          fi

      - name: Upload PLC career preview
        uses: actions/upload-artifact@v4
        with:
          name: temp-plc-career-preview
          path: preview-capture/plc-career/
          if-no-files-found: error
          retention-days: 7
