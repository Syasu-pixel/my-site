name: Temp preview career freeze audit

on:
  push:
    branches:
      - preview-career-freeze-audit-v2
    paths:
      - '.github/workflows/temp-preview-career-freeze.yml'

permissions:
  contents: write

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: preview-career-freeze-audit-v2

      - name: Standardize career category shell
        shell: python {0}
        run: |
          from pathlib import Path
          p = Path('categories/career.html')
          s = p.read_text(encoding='utf-8')

          support_css = '''\n    .support-card{border-color:#dbeafe}.support-card-title{margin:0 0 8px;padding-bottom:8px;border-bottom:1px solid #dbeafe;font-size:15px;line-height:1.5;font-weight:900;color:#1e3a8a}.support-card-text{margin:0;font-size:13px;line-height:1.75;color:#334155}.support-card-actions{margin-top:12px;display:grid;gap:10px}.support-link{display:flex;align-items:center;justify-content:center;width:100%;min-height:38px;padding:8px 10px;border-radius:12px;font-size:12px;font-weight:900;text-align:center}.support-link--coffee{border:1px solid #facc15;background:#fff7cc;color:#854d0e}.support-link--paypal{border:1px solid #93c5fd;background:#eff6ff;color:#1d4ed8}.site-footer{margin-top:28px;padding:20px 0 14px;border-top:1px solid #dbe7f3;text-align:center;color:#64748b;font-size:13px}.site-footer p{margin:0}.site-footer-links{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 14px;margin-top:6px}.site-footer-links a{color:#475569;font-weight:700}.site-footer-links a:hover{color:#1d4ed8}\n'''

          old_footer_css = 'footer{margin-top:28px;padding:18px 0 12px;border-top:1px solid #dbe7f3;text-align:center;color:#64748b;font-size:13px}'
          if old_footer_css not in s:
              raise SystemExit('footer css anchor missing')
          s = s.replace(old_footer_css, support_css, 1)

          aside_close = '      </aside>'
          support_html = '''        <section class="side-card support-card">\n          <h3 class="support-card-title">このサイトを応援する</h3>\n          <p class="support-card-text">記事づくりとサイト運営の励みになります。無理のない範囲で応援いただけるとうれしいです。</p>\n          <div class="support-card-actions">\n            <a class="support-link support-link--coffee" href="https://buymeacoffee.com/denkicontrol" target="_blank" rel="noopener noreferrer">Buy Me a Coffeeで応援</a>\n            <a class="support-link support-link--paypal" href="https://www.paypal.com/paypalme/denkicontrol" target="_blank" rel="noopener noreferrer">PayPalで応援</a>\n          </div>\n        </section>\n'''
          if 'Buy Me a Coffeeで応援' not in s:
              if aside_close not in s:
                  raise SystemExit('aside anchor missing')
              s = s.replace(aside_close, support_html + aside_close, 1)

          old_footer = '    <footer>© 電気と制御の実務メモ</footer>'
          new_footer = '''    <footer class="site-footer">\n      <p>現場で使う工具と、制御の基本を、迷いにくく整理してまとめています。</p>\n      <div class="site-footer-links">\n        <a href="../privacy-policy/">プライバシーポリシー</a>\n        <a href="../contact/">お問い合わせ</a>\n      </div>\n      <p>© 電気と制御の実務メモ</p>\n    </footer>'''
          if old_footer not in s:
              raise SystemExit('footer html anchor missing')
          s = s.replace(old_footer, new_footer, 1)

          # Add a tablet breakpoint matching the site's standard behavior while keeping mobile rules intact.
          tablet_css = '''\n    @media(max-width:1100px) and (min-width:641px){.layout{grid-template-columns:1fr}.side{position:static;grid-template-columns:repeat(2,minmax(0,1fr))}.support-card{grid-column:1/-1}}\n'''
          marker = '    @media(max-width:1100px){.language-menu-current{display:none}'
          if tablet_css.strip() not in s:
              if marker not in s:
                  raise SystemExit('responsive anchor missing')
              s = s.replace(marker, tablet_css + marker, 1)

          p.write_text(s, encoding='utf-8')

      - name: Remove temporary workflow and commit preview
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp-preview-career-freeze.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add categories/career.html .github/workflows/temp-preview-career-freeze.yml
          git commit -m 'Preview: standardize career category shell before freeze'
          git push origin HEAD:preview-career-freeze-audit-v2
