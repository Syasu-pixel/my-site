name: Temp Production Engineering Step2

on:
  push:
    branches:
      - post-publish-production-engineering

permissions:
  contents: write

jobs:
  step2:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: post-publish-production-engineering
      - name: Update career route, search index, sitemap
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          # 1) Career category route
          career = Path('categories/career.html')
          text = career.read_text(encoding='utf-8')
          old = '<span>生産技術の記事は準備中</span>'
          new = '<a href="../articles/production-engineering-career.html">生産技術とは？</a>'
          if new not in text:
              if old not in text:
                  raise SystemExit('career placeholder not found')
              text = text.replace(old, new, 1)
              career.write_text(text, encoding='utf-8')

          # 2) Search index
          idx_path = Path('assets/data/search-index.json')
          data = json.loads(idx_path.read_text(encoding='utf-8'))
          url = '/articles/production-engineering-career.html'
          if not any(item.get('url') == url for item in data):
              data.append({
                  'title': '生産技術とは？仕事内容・必要スキル・キャリアを現場目線で解説',
                  'url': url,
                  'category': 'キャリア・転職',
                  'description': '生産技術の仕事内容、工程設計・設備導入・立上げ・改善、必要な電気・機械・制御の基礎、未経験からの学び方、キャリアの広げ方を現場目線で整理します。',
                  'keywords': [
                      '生産技術','工程設計','設備導入','量産立上げ','工程改善','設備改善','自動化','FA','PLC','センサ','CAD','品質','生産性','キャリア','転職','production engineering','production-engineering-career'
                  ],
                  'synonyms': [
                      '生産技術とは','生産技術 仕事内容','生産技術 必要スキル','生産技術 キャリア','生産技術 転職'
                  ]
              })
              idx_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # 3) Sitemap
          sm_path = Path('sitemap.xml')
          sm = sm_path.read_text(encoding='utf-8')
          loc = 'https://denkicontrol.com/articles/production-engineering-career.html'
          if loc not in sm:
              entry = '  <url>\n    <loc>' + loc + '</loc>\n  </url>\n'
              if '</urlset>' not in sm:
                  raise SystemExit('sitemap closing tag not found')
              sm = sm.replace('</urlset>', entry + '</urlset>', 1)
              sm_path.write_text(sm, encoding='utf-8')
          PY
      - name: Verify intended changes
        run: |
          grep -q '../articles/production-engineering-career.html' categories/career.html
          grep -q '/articles/production-engineering-career.html' assets/data/search-index.json
          grep -q 'https://denkicontrol.com/articles/production-engineering-career.html' sitemap.xml
          git diff --check
          git diff -- categories/career.html assets/data/search-index.json sitemap.xml
      - name: Commit Step2 changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add categories/career.html assets/data/search-index.json sitemap.xml
          if git diff --cached --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git commit -m 'Add production engineering post-publish routes'
          git push origin HEAD:post-publish-production-engineering
