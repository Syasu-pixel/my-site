name: Temp release approved PLC career article

on:
  push:
    branches:
      - release-plc-control-engineer-career
    paths:
      - '.github/workflows/temp-release-plc-career.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release-plc-control-engineer-career
          fetch-depth: 0

      - name: Copy approved PLC article and images from Preview
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin preview-career-hero-binary-fix
          git checkout origin/preview-career-hero-binary-fix -- \
            articles/plc-control-engineer-career.html \
            assets/images/plc-control-engineer-career/plc-control-engineer-career-career.webp \
            assets/images/plc-control-engineer-career/plc-control-engineer-career-hero.webp \
            assets/images/plc-control-engineer-career/plc-control-engineer-career-ogp.webp \
            assets/images/plc-control-engineer-career/plc-control-engineer-career-overview.webp \
            assets/images/plc-control-engineer-career/plc-control-engineer-career-skills.webp

      - name: Make production-safe comparison CTAs
        shell: python
        run: |
          from pathlib import Path
          p = Path('articles/plc-control-engineer-career.html')
          s = p.read_text(encoding='utf-8')
          target = 'href="fa-engineer-career-service-comparison.html"'
          if s.count(target) != 2:
              raise SystemExit(f'Expected 2 preview-only comparison links, found {s.count(target)}')
          s = s.replace('<h3>転職先を探す段階なら、サービス比較はこちら</h3><p>正社員転職・スカウト・技術者派遣は役割が違います。自分に合う探し方を先に分けて確認できます。</p></div><a href="fa-engineer-career-service-comparison.html">転職サービスの比較を見る →</a>', '<h3>転職サービス比較は準備中です</h3><p>比較記事は現在準備中です。仕事・必要スキル・キャリアはカテゴリトップから確認できます。</p></div><a href="../categories/career.html">キャリア・転職トップへ →</a>')
          s = s.replace('<h3>転職サービスの選び方・比較</h3><p>正社員転職、スカウト、技術者派遣を同じ土俵で比べず、目的別に整理しています。</p></div><a href="fa-engineer-career-service-comparison.html">比較記事を見る →</a>', '<h3>転職サービス比較は準備中です</h3><p>比較記事は現在準備中です。公開まではキャリア・転職トップから関連記事を確認できます。</p></div><a href="../categories/career.html">キャリア・転職トップへ →</a>')
          if target in s:
              raise SystemExit('Preview-only comparison link remains')
          p.write_text(s, encoding='utf-8')

      - name: Remove temporary workflow and commit clean release
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp-release-plc-career.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add articles/plc-control-engineer-career.html assets/images/plc-control-engineer-career .github/workflows/temp-release-plc-career.yml
          git commit -m 'Prepare approved PLC career article for production'
          git push origin HEAD:release-plc-control-engineer-career
