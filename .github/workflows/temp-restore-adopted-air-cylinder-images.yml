name: TEMP restore adopted air-cylinder images
on:
  push:
    branches:
      - preview-air-cylinder-final-20260912
    paths:
      - .github/workflows/temp-restore-adopted-air-cylinder-images.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-air-cylinder-final-20260912
          fetch-depth: 0
      - name: Patch only adopted image placements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('articles/air-cylinder-basic.html')
          s = p.read_text(encoding='utf-8')

          # Replace existing structure figure only.
          s, n1 = re.subn(
              r'<figure class="article-figure">\s*<img src="\.\./assets/images/air-cylinder-basic/air-cylinder-basic-01\.png"[^>]*>\s*<figcaption>.*?</figcaption>\s*</figure>',
              '''<figure class="article-figure">\n              <img src="../assets/images/air-cylinder-basic/air-cylinder-basic-structure.webp" alt="複動形エアシリンダの基本構造をロッド、ピストン、ポート、パッキンで示した図">\n              <figcaption>複動形エアシリンダの基本構造。ロッド・ピストン・ポート・パッキンの位置関係を確認できます。</figcaption>\n            </figure>''',
              s, count=1, flags=re.S)

          # Add adopted type overview right after the existing types heading.
          types_anchor = '          <section class="section-card" id="types">\n            <h2>単動・複動と、最初に見る基本仕様</h2>'
          types_fig = '''\n            <figure class="article-figure">\n              <img src="../assets/images/air-cylinder-basic/air-cylinder-basic-types.webp" alt="標準形、薄形、ガイド付き、ロッドレスの主なエアシリンダ種類を比較した図">\n              <figcaption>代表的なエアシリンダの種類。目的・スペース・荷重条件に合わせて形状を選びます。</figcaption>\n            </figure>'''
          if 'air-cylinder-basic-types.webp' not in s:
              assert types_anchor in s
              s = s.replace(types_anchor, types_anchor + types_fig, 1)

          # Replace old combined movement figure with adopted forward/reverse pair.
          movement_pair = '''<figure class="article-figure">\n              <img src="../assets/images/air-cylinder-basic/air-cylinder-basic-forward.webp" alt="PLC出力からソレノイドバルブが切り替わりエアシリンダが前進する流れを説明した図">\n              <figcaption>前進時の代表例。PLC出力、ソレノイド、バルブ切替、給排気、シリンダ前進の順で見ます。</figcaption>\n            </figure>\n            <figure class="article-figure">\n              <img src="../assets/images/air-cylinder-basic/air-cylinder-basic-reverse.webp" alt="バルブが復帰してエアシリンダが後退する代表的な流れを説明した図">\n              <figcaption>後退時の代表例。実際のON/OFF動作は使用するバルブ回路・配線条件によって異なります。</figcaption>\n            </figure>'''
          s, n2 = re.subn(
              r'<figure class="article-figure">\s*<img src="\.\./assets/images/air-cylinder-basic/air-cylinder-basic-02\.png"[^>]*>\s*<figcaption>.*?</figcaption>\s*</figure>',
              movement_pair, s, count=1, flags=re.S)

          # Add adopted auto-switch visual in the existing reed-switch section.
          reed_anchor = '          <section class="section-card" id="reed-switch">\n            <h2>リードスイッチとの関係</h2>'
          reed_fig = '''\n            <figure class="article-figure">\n              <img src="../assets/images/air-cylinder-basic/air-cylinder-basic-auto-switch.webp" alt="シリンダ内部のマグネットを外側のオートスイッチで検出する仕組みを説明した図">\n              <figcaption>オートスイッチはシリンダ内部のマグネットを検出し、位置情報を電気信号として取り出します。</figcaption>\n            </figure>'''
          if 'air-cylinder-basic-auto-switch.webp' not in s:
              assert reed_anchor in s
              s = s.replace(reed_anchor, reed_anchor + reed_fig, 1)

          # Add maintenance visual as its own section immediately before field checks.
          field_anchor = '          <section class="section-card" id="field-view">\n            <h2>現場で見るポイント</h2>'
          maintenance = '''          <section class="section-card" id="maintenance">\n            <h2>分解・メンテナンスの基本</h2>\n            <p>機種によって、分解できる範囲や交換できるパッキン類は異なります。交換部品や作業方法は、必ず対象型式のメーカー資料で確認します。</p>\n            <figure class="article-figure">\n              <img src="../assets/images/air-cylinder-basic/air-cylinder-basic-maintenance.webp" alt="エアシリンダのロッドパッキンやピストンパッキンなどメンテナンス対象部品を示した図">\n              <figcaption>パッキン類は代表的な消耗部品です。分解可否や交換部品の設定はシリーズ・型式ごとに確認します。</figcaption>\n            </figure>\n          </section>\n\n'''
          if 'id="maintenance"' not in s:
              assert field_anchor in s
              s = s.replace(field_anchor, maintenance + field_anchor, 1)

          # Guardrails: all adopted visuals must now be referenced once or more.
          required = [
              'air-cylinder-basic-structure.webp',
              'air-cylinder-basic-types.webp',
              'air-cylinder-basic-forward.webp',
              'air-cylinder-basic-reverse.webp',
              'air-cylinder-basic-auto-switch.webp',
              'air-cylinder-basic-maintenance.webp',
          ]
          for x in required:
              assert x in s, x
          p.write_text(s, encoding='utf-8')
          print('structure replaced', n1, 'movement replaced', n2)
          PY
      - name: Remove this temporary workflow and commit
        run: |
          rm .github/workflows/temp-restore-adopted-air-cylinder-images.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles/air-cylinder-basic.html .github/workflows/temp-restore-adopted-air-cylinder-images.yml
          git diff --check
          git commit -m "Restore adopted air-cylinder visuals to original layout"
          git push origin HEAD:preview-air-cylinder-final-20260912
