name: Temporary profile-footer shell regeneration
on:
  push:
    branches:
      - preview/sitewide-profile-footer-20261022
permissions:
  contents: write
jobs:
  regenerate:
    if: "!contains(github.event.head_commit.message, '[generated-shells]')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Prove only one intended footer link differs, regenerate article HTML and hashes
        run: |
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import {renderShells} from './scripts/build-site-shells.mjs';
          const {results}=await renderShells();
          const file='.github/site-shells/manifest.json';
          const manifest=JSON.parse(await readFile(file,'utf8'));
          const hash=b=>createHash('sha256').update(b).digest('hex');
          let checked=0;
          for(const p of manifest.pages){
            const original=await readFile(p.output,'utf8');
            const candidate=results.get(p.output)?.toString('utf8');
            if(!candidate)throw Error('Missing generated article: '+p.output);
            const lang=p.output.startsWith('en/')?'en':'ja';
            const expected='<nav class="dc-footer-profile-link" aria-label="'+(lang==='en'?'About this site':'サイト運営情報')+'"><a href="/profile/">'+(lang==='en'?'About the operator &amp; editorial policy':'運営者・編集方針')+'</a></nav>';
            if(candidate.split(expected).length!==2 || candidate.replace(expected,'')!==original)throw Error('Unexpected difference beyond footer profile link: '+p.output);
            await writeFile(p.output,candidate);
            p.baselineSha256=hash(Buffer.from(candidate));
            checked++;
          }
          if(checked!==288)throw Error('Expected 288 article pages; actual '+checked);
          await writeFile(file,JSON.stringify(manifest,null,2)+'\n');
          console.log('Generated 288 article pages; every difference is one shared-footer profile link.');
          NODE
      - name: Commit generated articles to preview branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles en/articles .github/site-shells/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "Generate 288 article footers from approved shared shell [generated-shells]"
          test "$(git branch --show-current)" = "preview/sitewide-profile-footer-20261022"
          git push origin HEAD:preview/sitewide-profile-footer-20261022
