name: Temporary air cylinder safety fix

on:
  push:
    branches:
      - preview-air-cylinder-troubleshooting-official-sources-20260916

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-air-cylinder-troubleshooting-official-sources-20260916
      - name: Apply safety wording fixes
        shell: python
        run: |
          from pathlib import Path
          p = Path('articles/air-cylinder-troubleshooting-basic.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
'''          <li>次に手動操作でシリンダが動くかを確認します。</li>''': '''          <li>次に図面・設備状態表示・外観から、空圧系と機械側の状態を切り分けます。</li>''',
'''            確認順は、空気が来ているか、電磁弁を手動で動かせるか、シリンダが物理的に動ける状態か、検出信号が正しいかの順で見ると整理しやすいです。''': '''            確認順は、まず図面・設備状態表示・メーカー資料・安全状態を確認し、そのうえで空気供給、機械側の状態、検出信号を順に切り分けると整理しやすいです。''',
'''            <li><strong>手動操作を見る：</strong>電磁弁の手動操作でシリンダが動くか確認します。</li>''': '''            <li><strong>設備状態と図面を見る：</strong>バルブ状態表示、配管系統、対象機器の形式を確認し、手動操作が必要な場合は設備の安全手順とメーカー資料を優先します。</li>''',
'''          <h2>4. 電磁弁の手動操作で動くか見る</h2>''': '''          <h2>4. 設備状態表示・図面から切り分ける</h2>''',
'''            電磁弁に手動操作がある場合は、仕様と安全を確認したうえで、手動操作でシリンダが出るか戻るかを確認します。\n            手動操作で動くなら、空圧・機械側はある程度動ける状態で、電気信号側に原因がある可能性があります。''': '''            電磁弁やシリンダ周辺を確認する時は、まず設備状態表示、配管図、電磁弁の表示、対象形式のメーカー資料から状態を整理します。\n            手動操作は予期せぬ機械動作につながる可能性があるため、この記事では操作手順を案内しません。必要な場合は設備の安全手順、メーカー資料、担当者の指示を優先してください。''',
'''            手動操作でも動かない場合は、エア供給、スピコン、シリンダ本体、機械干渉、配管の向きなどを疑います。''': '''            状態表示や図面から空圧供給が成立していると判断できても動作しない場合は、スピコン、シリンダ本体、機械干渉、配管条件などを候補として整理します。''',
'''            <figcaption>手動操作で動くかどうかを見ると、電気側と空圧・機械側を切り分けやすくなります。</figcaption>''': '''            <figcaption>手動操作の有無だけで判断せず、設備状態表示・図面・メーカー資料と合わせて電気側と空圧・機械側を切り分けます。</figcaption>''',
'''            <h3>手動操作は周囲確認をしてから</h3>\n            <p>\n              手動操作でシリンダが急に動くと、挟まれや破損につながることがあります。\n              動作範囲に人や工具がないことを確認し、設備ルールに従って操作してください。\n            </p>''': '''            <h3>手動操作は安易に行わない</h3>\n            <p>\n              手動操作ではシリンダや連結機構が予期せず動く可能性があります。ガードを外す、インターロックを無効化する、可動範囲へ手を入れるといった行為は避け、設備の安全手順・メーカー資料・担当者の指示を優先してください。\n            </p>''',
'''            ロッドの曲がり、取付芯ずれ、摺動部の汚れ、ガイドの重さ、ワークの噛み込みなども原因になります。\n            エアを抜いた状態で安全を確保し、手で動く範囲を確認することもあります。''': '''            ロッドの曲がり、取付芯ずれ、摺動部の汚れ、ガイドの重さ、ワークの噛み込みなども原因になります。\n            可動部へ手を入れたり、シリンダを手で無理に動かしたりせず、まず外観・図面・取付状態から異常の有無を確認します。分解や機械側の処置が必要な場合は、残圧がない安全状態を設備手順に沿って確立したうえで担当者が対応してください。''',
'''            <li>手動操作でシリンダが動くか確認する</li>''': '''            <li>設備状態表示・図面・メーカー資料から空圧系と機械側の状態を整理する</li>'''
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Expected text not found: {old[:80]}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Remove temporary workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-air-cylinder-safety-fix.yml
          git add articles/air-cylinder-troubleshooting-basic.html
          git commit -m "Tighten air cylinder troubleshooting safety wording"
          git push origin HEAD:preview-air-cylinder-troubleshooting-official-sources-20260916
