name: Export terminal jumper images once
on:
  push:
    branches:
      - tmp-audit-terminal-jumper-images-20260911
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: terminal-jumper-image-audit
          path: |
            assets/images/terminal-block-jumper-basic/terminal-block-jumper-basic-hero.png
            assets/images/terminal-block-jumper-basic/terminal-block-jumper-basic-ogp.png
