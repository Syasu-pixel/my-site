name: tmp-final-preview-review-ux
on:
  push:
    branches: [ai-editorial/final-preview-review-ux]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch preview readiness and final review UX
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ai-editorial-dashboard/queue-preview-media.js')
          s=p.read_text()
          old="""  function previewReady(){return eventsForSelected().some(ev=>{const d=ev&&ev.discussion&&typeof ev.discussion==='object'?ev.discussion:{};const stage=String(d.stage||ev?.event_type||'').toLowerCase();const verifiedBy=String(d.preview_verified_by||'').toLowerCase();return stage==='preview-ready'||d.preview_verified===true||verifiedBy.includes('preview-probe')||verifiedBy.includes('http-preview-probe')})}\n"""
          new="""  function previewReady(){return eventsForSelected().some(ev=>{const d=ev&&ev.discussion&&typeof ev.discussion==='object'?ev.discussion:{};const stage=String(d.stage||ev?.event_type||'').toLowerCase();const state=String(ev?.state||'').toUpperCase();const verifiedBy=String(d.preview_verified_by||'').toLowerCase();const score=Number(d.score??d.gpt_visual_audit_score??0);const finalAuditPassed=stage==='gpt-preview-audit'&&state==='NEEDS_HUMAN'&&score>=95;return stage==='preview-ready'||d.preview_verified===true||verifiedBy.includes('preview-probe')||verifiedBy.includes('http-preview-probe')||finalAuditPassed})}\n  function finalReviewInfo(){const ev=[...eventsForSelected()].reverse().find(x=>{const d=x&&x.discussion&&typeof x.discussion==='object'?x.discussion:{};const stage=String(d.stage||x?.event_type||'').toLowerCase(),state=String(x?.state||'').toUpperCase();return stage==='gpt-preview-audit'&&state==='NEEDS_HUMAN'});if(!ev)return null;const d=ev.discussion||{},score=Number(d.score??d.gpt_visual_audit_score??0);return score>=95?{score}:null}\n  function polishFinalReview(){const info=finalReviewInfo();if(!info)return;const card=document.querySelector('#gateCard');if(!card)return;const heading=card.previousElementSibling;if(heading&&heading.tagName==='H2')heading.textContent='最終確認';const gate=document.querySelector('#gate');if(gate){gate.innerHTML=`<strong>自動監査 ${Math.round(info.score)}点で合格しました。</strong><br>最終Previewを確認して、公開判断をしてください。<div style=\"margin-top:7px;font-size:10px;color:#697386;font-weight:700\">この確認が人間による唯一の最終確認です。</div>`}for(const b of card.querySelectorAll('button')){const t=(b.textContent||'').trim();if(t.includes('採用'))b.textContent='✓ 採用して公開へ進む';else if(t.includes('修正'))b.textContent='✎ 修正を依頼する';else if(t.includes('不採用')||t.includes('却下'))b.textContent='✕ 今回は公開しない'}card.classList.add('alert')}\n"""
          if old not in s: raise SystemExit('previewReady target not found')
          s=s.replace(old,new)
          old2="""    moveArtifactsOut();const root=document.querySelector('#events');const id=currentJob();if(!root||!id||id==='__home__')return;\n"""
          new2="""    moveArtifactsOut();polishFinalReview();const root=document.querySelector('#events');const id=currentJob();if(!root||!id||id==='__home__')return;\n"""
          if old2 not in s: raise SystemExit('render target not found')
          s=s.replace(old2,new2)
          p.write_text(s)
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/tmp-final-preview-review-ux.yml
          git config user.name "Syasu-pixel"
          git config user.email "actions@users.noreply.github.com"
          git add ai-editorial-dashboard/queue-preview-media.js .github/workflows/tmp-final-preview-review-ux.yml
          git commit -m "fix: show verified final preview and clarify final review"
          git push
