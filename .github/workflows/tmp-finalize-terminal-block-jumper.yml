name: Inspect firestorage share

on:
  push:
    branches:
      - preview-terminal-block-jumper-audit-20260911

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect share page
        run: |
          set -euo pipefail
          curl -L --fail -A 'Mozilla/5.0' 'https://firestorage.ai/ja/f/ky_eCRiYEaAs' -o /tmp/share.html
          echo '=== MIME ==='
          file --mime-type -b /tmp/share.html
          echo '=== URL-like tokens ==='
          python - <<'PY'
          from pathlib import Path
          import re, html
          s=Path('/tmp/share.html').read_text(encoding='utf-8', errors='ignore')
          vals=[]
          for pat in [r'https?://[^"\'<> ]+', r'href=["\']([^"\']+)', r'src=["\']([^"\']+)']:
              vals.extend(re.findall(pat,s,re.I))
          for x in vals:
              if isinstance(x,tuple): x=x[0]
              x=html.unescape(x)
              if any(k in x.lower() for k in ['api','download','file','storage','share','webp','object','public']):
                  print(x)
          print('=== HTML START ===')
          print(s)
          print('=== HTML END ===')
          PY
