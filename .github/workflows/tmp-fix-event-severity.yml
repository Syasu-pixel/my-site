name: tmp-fix-event-severity
on:
  push:
    branches: [ai-editorial/event-severity-resilience]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-editorial/event-severity-resilience
      - name: Patch event severity and logging resilience
        shell: python
        run: |
          from pathlib import Path
          p=Path('supabase/functions/ai-editorial-article-builder-v4/index.ts')
          s=p.read_text()
          old='''async function event(raw:string,id:string,stage:string,summary:string,state="BUILDING",severity="info",evidence:any[]=[]){return add(raw,id,[{event_id:crypto.randomUUID(),job_id:`command-${id}`,role:"system",provider:"article-builder-v4",event_type:"status",summary,evidence,severity,state,created_at:new Date().toISOString(),discussion:{command_id:id,stage},availability:{primary_provider:"article-builder-v4",status:state==="NEEDS_HUMAN"?"waiting-human":"online"}}])}'''
          new='''async function event(raw:string,id:string,stage:string,summary:string,state="BUILDING",severity="info",evidence:any[]=[]){const allowed=new Set(["info","low","medium","high","blocker"]);const normalized=severity==="warning"?"medium":allowed.has(severity)?severity:"medium";try{return await add(raw,id,[{event_id:crypto.randomUUID(),job_id:`command-${id}`,role:"system",provider:"article-builder-v4",event_type:"status",summary,evidence,severity:normalized,state,created_at:new Date().toISOString(),discussion:{command_id:id,stage},availability:{primary_provider:"article-builder-v4",status:state==="NEEDS_HUMAN"?"waiting-human":"online"}}])}catch(e){console.error("article-builder event log failed",{id,stage,severity:normalized,error:e instanceof Error?e.message:String(e)});return null}}'''
          if old not in s: raise SystemExit('event helper anchor not found')
          s=s.replace(old,new,1)
          s=s.replace('?"info":"warning"','?"info":"medium"')
          p.write_text(s)
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/tmp-fix-event-severity.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: harden Article Builder event logging"
          git push origin HEAD:ai-editorial/event-severity-resilience
