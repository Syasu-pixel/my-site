name: tmp-pause-ai-editorial-auto
on:
  push:
    branches: [ai-editorial/pause-auto-workflows]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-editorial/pause-auto-workflows
      - name: Pause automatic AI editorial workflows
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('.github/workflows/editorial-discussion-auto.yml')
          s=p.read_text()
          s2=re.sub(r'(?ms)^on:\n  pull_request:\n    types: \[opened, ready_for_review, synchronize\]\n    paths:\n      - \'docs/decisions/\*\*/\*\*\'\n      - \'docs/ai-\*\.md\'\n      - \'docs/multi-ai-\*\.md\'\n', "on:\n  workflow_dispatch:\n", s, count=1)
          if s2==s:
              raise SystemExit('trigger block not found')
          p.write_text(s2)
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/tmp-pause-ai-editorial-auto.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/editorial-discussion-auto.yml .github/workflows/tmp-pause-ai-editorial-auto.yml
          git commit -m 'chore: pause automatic AI editorial discussion'
          git push origin HEAD:ai-editorial/pause-auto-workflows
