name: Temporary terminal block jumper polish

on:
  push:
    branches:
      - preview-terminal-block-jumper-audit-20260911

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply article and related-card improvements
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('articles/terminal-block-jumper-basic.html')
          text = p.read_text(encoding='utf-8')

          replacements = {
            '端子台の渡り線・ジャンパーの基本を初心者向けに整理。電源やコモンを分岐する理由、渡り線とジャンパーバーの違い、図面での見方、現場で確認するポイントまでやさしく解説します。':
            '端子台の渡り線・ジャンパーの基本を初心者向けに整理。渡り線、Y端子タイプのコモンバー、端子台専用ジャンパーの違いと、DC24V・0V・コモンを分岐するときの確認ポイントをやさしく解説します。',
            '<a href="#comparison">渡り線/ジャンパー</a>':
            '<a href="#comparison">渡り線/コモンバー/ジャンパー</a>',
            '<h2>渡り線とジャンパーバーの違い</h2>':
            '<h2>渡り線・コモンバー・端子台専用ジャンパーの違い</h2>',
            'ジャンパーバーやショートバーは、端子台専用の部品で複数端子をまとめて接続します。\n            対応する端子台シリーズ、ピッチ、極数などが決まっているため、メーカーの適合情報を確認して選びます。許容電流もジャンパー単体の代表値だけで判断せず、組み合わせる端子台側の仕様を確認します。':
            '現場では、一般的なねじ式端子台に、端子へかませる部分がY端子・フォーク端子に似た形の絶縁被覆付きコモンバーを共締めし、DC24V、0V、COMなどを複数端子へ共通化している盤もあります。黒・緑・オレンジなどの被覆色を見かけるタイプです。\n          </p>\n          <p>\n            一方で、Phoenix Contactなどの端子台では、そのシリーズ専用のプラグインブリッジやジャンパーを使う構成もあります。対応する端子台シリーズ、ピッチ、極数、取り付け位置などが決まっているため、メーカーの適合情報を確認して選びます。許容電流もジャンパー単体の代表値だけで判断せず、組み合わせる端子台側の仕様を確認します。'
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit('Expected marker missing: ' + old[:80])
              text = text.replace(old, new, 1)

          marker = '''          <div class="table-wrap">\n            <table>\n              <thead>\n                <tr>\n                  <th>項目</th>\n                  <th>渡り線</th>\n                  <th>ジャンパーバー</th>'''
          cards = '''          <div class="check-grid">\n            <div class="check-item check-item--blue">\n              <h3>渡り線</h3>\n              <p>端子間を短い電線で接続。行き先を柔軟に変えやすい方法です。</p>\n            </div>\n            <div class="check-item check-item--green">\n              <h3>Y端子タイプのコモンバー</h3>\n              <p>ねじ式端子台で同電位をまとめるときに見かけるタイプ。ねじサイズ、極数、定格電流、端子台側の使用可否を確認します。</p>\n            </div>\n            <div class="check-item check-item--orange">\n              <h3>端子台専用ジャンパー</h3>\n              <p>シリーズ専用アクセサリで共通化。ピッチや極数、端子台との組み合わせ仕様を確認します。</p>\n            </div>\n          </div>\n\n'''
          if marker not in text:
              raise SystemExit('Comparison table marker missing')
          text = text.replace(marker, cards + marker, 1)

          css_marker = '''    .article-footer-nav{\n      display:flex;'''
          css = '''    .related-card-image{\n      width:calc(100% + 32px);\n      max-width:none;\n      aspect-ratio:16 / 9;\n      object-fit:cover;\n      margin:-16px -16px 14px;\n      border-bottom:1px solid #d7e4f3;\n      background:#eef4ff;\n    }\n    .article-footer-nav{\n      display:flex;'''
          if css_marker not in text:
              raise SystemExit('Related CSS marker missing')
          text = text.replace(css_marker, css, 1)

          related = {
            'terminal-block-basic.html': ('../assets/images/terminal-block-basic/terminal-block-hero.png', '端子台の基本を解説する記事イメージ'),
            'dc24v-power-supply-basic.html': ('../assets/images/dc24v-power-supply-basic/dc24v-power-supply-hero.png', 'DC24V電源の基本を解説する記事イメージ'),
            'plc-io-unit-basic.html': ('../assets/images/plc-io-unit-basic/plc-io-unit-basic-hero.png', 'PLC入力ユニット・出力ユニットを解説する記事イメージ'),
            'wire-number-marker-basic.html': ('../assets/images/wire-number-marker-basic/wire-number-marker-basic-hero.png', '線番・マークチューブを解説する記事イメージ'),
            'circuit-protector-basic.html': ('../assets/images/circuit-protector-basic/circuit-protector-hero.png', 'サーキットプロテクタを解説する記事イメージ'),
            'wiring-duct-basic.html': ('../assets/images/wiring-duct-basic/wiring-duct-basic-hero.png', '配線ダクトを解説する記事イメージ'),
          }
          for href, (src, alt) in related.items():
              old = f'<a class="related-card" href="{href}">\n              <h3>'
              new = f'<a class="related-card" href="{href}">\n              <img class="related-card-image" src="{src}" alt="{alt}" loading="lazy" decoding="async">\n              <h3>'
              if old not in text:
                  raise SystemExit('Related card marker missing: ' + href)
              text = text.replace(old, new, 1)

          text = text.replace('.related-card{padding:14px}', '.related-card{padding:14px;overflow:hidden}\n      .related-card-image{width:calc(100% + 28px);margin:-14px -14px 12px}')

          p.write_text(text, encoding='utf-8')
          PY

      - name: Sanity checks
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('articles/terminal-block-jumper-basic.html')
          s=p.read_text(encoding='utf-8')
          required=[
            'Y端子タイプのコモンバー',
            '渡り線/コモンバー/ジャンパー',
            'related-card-image',
            '../assets/images/terminal-block-basic/terminal-block-hero.png',
            '../assets/images/wiring-duct-basic/wiring-duct-basic-hero.png'
          ]
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit('Missing markers: '+repr(missing))
          print('sanity checks passed')
          PY

      - name: Commit article update and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-polish-terminal-block-jumper.yml
          git add articles/terminal-block-jumper-basic.html
          git diff --cached --check
          git commit -m "Add common bar guidance and visual related cards"
          git push
