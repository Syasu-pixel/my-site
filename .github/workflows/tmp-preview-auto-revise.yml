name: tmp-preview-auto-revise
on:
  push:
    branches: ["ai-editorial/preview-auto-revise"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-editorial/preview-auto-revise
      - name: Apply patch
        run: python .github/scripts/patch_preview_auto_revise.py
      - name: Remove temporary files and commit
        run: |
          rm .github/workflows/tmp-preview-auto-revise.yml
          rm .github/scripts/patch_preview_auto_revise.py
          git config user.name "ai-editorial-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "AI編集部: Preview監査の自動修正ループを追加"
          git push origin ai-editorial/preview-auto-revise
