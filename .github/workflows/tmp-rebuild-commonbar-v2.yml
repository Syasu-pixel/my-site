name: Rebuild commonbar image once

on:
  push:
    branches:
      - preview-terminal-block-jumper-audit-20260911
    paths:
      - '.github/workflows/tmp-rebuild-commonbar-v2.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-terminal-block-jumper-audit-20260911
          fetch-depth: 0

      - name: Rebuild and validate image
        shell: bash
        run: |
          set -euo pipefail
          target='assets/images/terminal-block-jumper-basic/terminal-block-jumper-common-bar-comparison.webp'
          cat .tmp/commonbar-v2/chunk*.txt > /tmp/commonbar.b64
          base64 -d /tmp/commonbar.b64 > "$target"
          python3 - <<'PY'
          p='assets/images/terminal-block-jumper-basic/terminal-block-jumper-common-bar-comparison.webp'
          b=open(p,'rb').read(16)
          assert b[:4] == b'RIFF' and b[8:12] == b'WEBP', b
          print('valid WebP header')
          PY
          test "$(stat -c%s "$target")" -eq 32042
          echo "size=$(stat -c%s "$target")"

      - name: Commit repaired image and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf .tmp/commonbar-v2
          rm .github/workflows/tmp-rebuild-commonbar-v2.yml
          git add -A
          git commit -m 'Repair common bar comparison image binary'
          git push origin HEAD:preview-terminal-block-jumper-audit-20260911
