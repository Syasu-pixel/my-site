name: Repair commonbar image once

on:
  push:
    branches:
      - preview-terminal-block-jumper-audit-20260911
    paths:
      - '.github/workflows/tmp-repair-commonbar-image.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-terminal-block-jumper-audit-20260911
          fetch-depth: 0

      - name: Download approved image from firestorage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re, sys, subprocess
          from urllib.parse import urljoin
          import requests

          share_url = 'https://firestorage.ai/ja/f/dRvTboGkukth'
          filename = 'terminal-block-jumper-common-bar-comparison-fixed.webp'
          out = 'assets/images/terminal-block-jumper-basic/terminal-block-jumper-common-bar-comparison.webp'
          s = requests.Session()
          s.headers['User-Agent'] = 'Mozilla/5.0'
          r = s.get(share_url, timeout=30)
          r.raise_for_status()
          html = r.text

          candidates = []
          for pat in [
              r'''href=["']([^"']+)["']''',
              r'''src=["']([^"']+)["']''',
              r'''https?://[^"'<>\\s]+'''
          ]:
              for m in re.findall(pat, html, flags=re.I):
                  u = m if isinstance(m, str) else m[0]
                  if filename in u or 'download' in u.lower() or '.webp' in u.lower():
                      candidates.append(urljoin(share_url, u))

          def try_url(u):
              try:
                  rr = s.get(u, timeout=45, allow_redirects=True)
                  ctype = rr.headers.get('content-type','').lower()
                  data = rr.content
                  if len(data) > 10000 and (data[:4] == b'RIFF' or 'image/webp' in ctype):
                      os.makedirs(os.path.dirname(out), exist_ok=True)
                      open(out,'wb').write(data)
                      print('downloaded', u, len(data), ctype)
                      return True
              except Exception as e:
                  print('candidate failed', u, e)
              return False

          for u in dict.fromkeys(candidates):
              if try_url(u):
                  sys.exit(0)

          print('Static HTML did not expose a direct image URL; using browser fallback.')
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--quiet', 'playwright'])
          subprocess.check_call([sys.executable, '-m', 'playwright', 'install', 'chromium'])
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(accept_downloads=True)
              captured = {'ok': False}
              def on_response(resp):
                  if captured['ok']:
                      return
                  try:
                      ctype = (resp.headers.get('content-type') or '').lower()
                      if 'image/webp' in ctype or filename in resp.url:
                          body = resp.body()
                          if len(body) > 10000 and body[:4] == b'RIFF':
                              os.makedirs(os.path.dirname(out), exist_ok=True)
                              open(out,'wb').write(body)
                              captured['ok'] = True
                              print('captured response', resp.url, len(body), ctype)
                  except Exception:
                      pass
              page.on('response', on_response)
              page.goto(share_url, wait_until='networkidle', timeout=90000)
              page.wait_for_timeout(3000)
              if not captured['ok']:
                  links = page.locator('a').evaluate_all("els => els.map(a => ({t:(a.innerText||'').trim(), h:a.href}))")
                  for item in links:
                      u = item.get('h','')
                      t = item.get('t','')
                      if filename in u or filename in t or 'download' in u.lower() or 'ダウンロード' in t:
                          print('browser candidate', t, u)
                          if u and try_url(u):
                              captured['ok'] = True
                              break
              if not captured['ok']:
                  locator = page.get_by_text(filename, exact=False)
                  if locator.count():
                      try:
                          with page.expect_download(timeout=20000) as di:
                              locator.first.click()
                          dl = di.value
                          dl.save_as(out)
                          captured['ok'] = True
                          print('download event', dl.suggested_filename)
                      except Exception as e:
                          print('click download failed', e)
              browser.close()
              if not captured['ok']:
                  raise SystemExit('Could not retrieve approved image from share page')
          PY

      - name: Validate WebP
        run: |
          python - <<'PY'
          from PIL import Image
          p='assets/images/terminal-block-jumper-basic/terminal-block-jumper-common-bar-comparison.webp'
          im=Image.open(p)
          im.verify()
          print('validated', p, im.format)
          PY
          file assets/images/terminal-block-jumper-basic/terminal-block-jumper-common-bar-comparison.webp
          test $(stat -c%s assets/images/terminal-block-jumper-basic/terminal-block-jumper-common-bar-comparison.webp) -gt 100000

      - name: Commit repaired image and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-repair-commonbar-image.yml
          git add assets/images/terminal-block-jumper-basic/terminal-block-jumper-common-bar-comparison.webp
          git commit -m 'Repair common bar comparison image binary'
          git push origin HEAD:preview-terminal-block-jumper-audit-20260911
