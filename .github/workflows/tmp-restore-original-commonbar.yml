name: Restore original commonbar image once

on:
  push:
    branches:
      - preview-terminal-block-jumper-audit-20260911
    paths:
      - '.github/workflows/tmp-restore-original-commonbar.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-terminal-block-jumper-audit-20260911
          fetch-depth: 0

      - name: Restore exact adopted image bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/restore-venv
          /tmp/restore-venv/bin/pip install --quiet requests pillow playwright
          /tmp/restore-venv/bin/python -m playwright install chromium
          /tmp/restore-venv/bin/python - <<'PY'
          import hashlib, os, sys, requests
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          from PIL import Image

          share_url = 'https://firestorage.ai/ja/f/zwRz54UE3xDW'
          expected_name = 'terminal-block-jumper-common-bar-comparison-final.webp'
          expected_sha256 = '1da1144d5e65eeef4f97dce24a65a236323347655ff4c9974c7569c92715dd5b'
          expected_size = 123686
          target = Path('assets/images/terminal-block-jumper-basic/terminal-block-jumper-common-bar-comparison.webp')
          temp = Path('/tmp/original-commonbar.webp')

          def valid_bytes(data):
              return (
                  len(data) == expected_size
                  and data[:4] == b'RIFF'
                  and hashlib.sha256(data).hexdigest() == expected_sha256
              )

          def save_if_valid(data, source):
              if valid_bytes(data):
                  temp.write_bytes(data)
                  print('verified exact original from', source)
                  return True
              return False

          s = requests.Session()
          s.headers['User-Agent'] = 'Mozilla/5.0'
          r = s.get(share_url, timeout=30)
          r.raise_for_status()

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(accept_downloads=True)
              found = {'ok': False}

              def on_response(resp):
                  if found['ok']:
                      return
                  try:
                      ctype = (resp.headers.get('content-type') or '').lower()
                      dispo = (resp.headers.get('content-disposition') or '').lower()
                      if 'webp' in ctype or expected_name in resp.url or 'attachment' in dispo:
                          body = resp.body()
                          if save_if_valid(body, resp.url):
                              found['ok'] = True
                  except Exception:
                      pass

              page.on('response', on_response)
              page.goto(share_url, wait_until='networkidle', timeout=90000)
              page.wait_for_timeout(2500)

              # Try obvious anchors first.
              links = page.locator('a').evaluate_all("els => els.map(a => ({t:(a.innerText||'').trim(), h:a.href, d:a.getAttribute('download')}))")
              for item in links:
                  if found['ok']:
                      break
                  text = item.get('t','')
                  href = item.get('h','')
                  dl = item.get('d')
                  if expected_name in text or expected_name in href or dl or 'ダウンロード' in text or 'download' in text.lower() or 'download' in href.lower():
                      try:
                          rr = s.get(href, timeout=45, allow_redirects=True)
                          if save_if_valid(rr.content, href):
                              found['ok'] = True
                              break
                      except Exception:
                          pass

              # Then try clickable controls and capture an actual browser download.
              if not found['ok']:
                  controls = page.locator('a,button')
                  for i in range(min(controls.count(), 80)):
                      if found['ok']:
                          break
                      el = controls.nth(i)
                      try:
                          text = (el.inner_text(timeout=1000) or '').strip()
                      except Exception:
                          text = ''
                      if expected_name in text or 'ダウンロード' in text or 'download' in text.lower():
                          try:
                              with page.expect_download(timeout=12000) as di:
                                  el.click(timeout=5000)
                              dl = di.value
                              dl.save_as(str(temp))
                              data = temp.read_bytes()
                              if valid_bytes(data):
                                  found['ok'] = True
                                  print('verified exact original from browser download', dl.suggested_filename)
                                  break
                          except Exception:
                              pass

              browser.close()

          if not found['ok'] or not temp.exists():
              raise SystemExit('Exact adopted original could not be retrieved; refusing to modify image')

          # Final exact-byte validation before touching repository file.
          data = temp.read_bytes()
          assert hashlib.sha256(data).hexdigest() == expected_sha256
          assert len(data) == expected_size
          im = Image.open(temp)
          assert im.size == (1200, 675)
          assert im.format == 'WEBP'
          im.verify()

          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(data)
          print('restored', target, 'sha256=', expected_sha256, 'bytes=', len(data), 'dimensions=1200x675')
          PY

      - name: Commit exact original and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum assets/images/terminal-block-jumper-basic/terminal-block-jumper-common-bar-comparison.webp | cut -d' ' -f1)" = "1da1144d5e65eeef4f97dce24a65a236323347655ff4c9974c7569c92715dd5b"
          test "$(stat -c%s assets/images/terminal-block-jumper-basic/terminal-block-jumper-common-bar-comparison.webp)" = "123686"
          git config user.name 'ChatGPT'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-restore-original-commonbar.yml
          git add assets/images/terminal-block-jumper-basic/terminal-block-jumper-common-bar-comparison.webp
          git commit -m 'Restore adopted common bar image at original quality'
          git push origin HEAD:preview-terminal-block-jumper-audit-20260911
