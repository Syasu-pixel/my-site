name: Update a-b contact Hero preview

on:
  push:
    branches: [preview-ab-contact]
    paths:
      - '.github/workflows/update-ab-contact-hero-preview-20260914.yml'

permissions:
  contents: write

jobs:
  update-hero:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: preview-ab-contact
          fetch-depth: 0

      - name: Download adopted Hero from firestorage
        shell: bash
        run: |
          python3 - <<'PY'
          import json, subprocess, urllib.parse
          from pathlib import Path
          share='2cbIK21HH-iD'
          file_id='01a09f10b45e753095c39f730f09c8d1'
          name='a-contact-b-contact-basic-hero.webp'
          target='assets/images/a-contact-b-contact-basic/a-contact-b-contact-basic-hero.webp'
          meta_url=f'https://api.firestorage.ai/dev/file/shares/{share}/files?maxResults=1000'
          meta=json.loads(subprocess.check_output(['curl','--proto','=https','--tlsv1.2','--fail-with-body','--silent','--show-error','--max-time','30',meta_url], text=True))
          matches=[f for f in meta.get('files',[]) if f.get('fileId')==file_id]
          if len(matches)!=1 or matches[0].get('fileName')!=name:
              raise SystemExit('firestorage metadata mismatch')
          dl_url=f'https://api.firestorage.ai/dev/file/shares/{share}/files/{file_id}/download'
          dl=json.loads(subprocess.check_output(['curl','--proto','=https','--tlsv1.2','--fail-with-body','--silent','--show-error','--max-time','30','-X','POST',dl_url], text=True))
          u=dl.get('downloadUrl','')
          p=urllib.parse.urlparse(u)
          if p.scheme!='https' or p.username or p.password or p.hostname!='s3.ap-northeast-1.wasabisys.com':
              raise SystemExit('unexpected download host')
          Path(target).parent.mkdir(parents=True, exist_ok=True)
          subprocess.check_call(['curl','--proto','=https','--tlsv1.2','--fail-with-body','--silent','--show-error','--max-time','60','-o',target,u])
          PY

      - name: Verify and commit preview Hero
        shell: bash
        run: |
          echo '304dc26d566fe41b7deae6cc15a3e5e3ce044160de79938c2ddcc69f84fb997d  assets/images/a-contact-b-contact-basic/a-contact-b-contact-basic-hero.webp' | sha256sum -c -
          git config user.name 'denkicontrol-preview-writer'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/images/a-contact-b-contact-basic/a-contact-b-contact-basic-hero.webp
          git rm .github/workflows/update-ab-contact-hero-preview-20260914.yml
          git diff --cached --check
          git commit -m 'Fix a-contact b-contact Hero preview image'
          git push origin HEAD:preview-ab-contact
