name: Update a-b contact OGP preview

on:
  push:
    branches: [preview-ab-contact]
    paths:
      - '.github/workflows/update-ab-contact-ogp-preview-20260914.yml'

permissions:
  contents: write

jobs:
  update-ogp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: preview-ab-contact
          fetch-depth: 0

      - name: Download adopted OGP from firestorage
        shell: bash
        run: |
          python3 - <<'PY'
          import json, subprocess, urllib.parse
          from pathlib import Path
          share='0ZG8nXtnEQrs'
          file_id='01a09f08542f77b4b8a75ed7613dab8f'
          file_name='a-contact-b-contact-basic-ogp.webp'
          target=Path('assets/images/a-contact-b-contact-basic/a-contact-b-contact-basic-ogp.webp')
          meta_url=f'https://api.firestorage.ai/dev/file/shares/{share}/files?maxResults=1000'
          meta=json.loads(subprocess.check_output(['curl','--proto','=https','--tlsv1.2','--fail-with-body','--silent','--show-error','--max-time','30',meta_url], text=True))
          matches=[f for f in meta.get('files',[]) if f.get('fileId')==file_id]
          if len(matches)!=1 or matches[0].get('fileName')!=file_name:
              raise SystemExit('firestorage metadata mismatch')
          dl_url=f'https://api.firestorage.ai/dev/file/shares/{share}/files/{file_id}/download'
          dl=json.loads(subprocess.check_output(['curl','--proto','=https','--tlsv1.2','--fail-with-body','--silent','--show-error','--max-time','30','-X','POST',dl_url], text=True))
          u=dl.get('downloadUrl','')
          p=urllib.parse.urlparse(u)
          if p.scheme!='https' or p.username or p.password or p.hostname!='s3.ap-northeast-1.wasabisys.com':
              raise SystemExit('unexpected download host')
          target.parent.mkdir(parents=True, exist_ok=True)
          subprocess.check_call(['curl','--proto','=https','--tlsv1.2','--fail-with-body','--silent','--show-error','--max-time','60','-o',str(target),u])
          PY

      - name: Verify and commit preview OGP
        shell: bash
        run: |
          echo 'ea59bd1674ba8d7035840f3f644f0d846f5feb083e2ea6d4776cc91b632a4cd8  assets/images/a-contact-b-contact-basic/a-contact-b-contact-basic-ogp.webp' | sha256sum -c -
          git config user.name 'denkicontrol-preview-writer'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/images/a-contact-b-contact-basic/a-contact-b-contact-basic-ogp.webp
          git rm .github/workflows/update-ab-contact-ogp-preview-20260914.yml
          git diff --cached --check
          git commit -m 'Update a-contact b-contact OGP preview'
          git push origin HEAD:preview-ab-contact
