name: Update latest articles rule to 7
on:
  push:
    branches: [update-latest-rule-to-7-20260910]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: update-latest-rule-to-7-20260910
      - name: Update latest article count rules
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          paths = [
              Path('docs/codex-update-rules.md'),
              Path('docs/new-article-checklist.md'),
              Path('docs/article-workflow.md'),
          ]
          for p in paths:
              s = p.read_text(encoding='utf-8')
              s = s.replace('6件固定', '7件固定')
              s = s.replace('**必ず6件表示**', '**必ず7件表示**')
              s = s.replace('7件以上にしない', '8件以上にしない')
              s = s.replace('5件・7件・10件など可変運用にしない', '5件・6件・10件など可変運用にしない')
              p.write_text(s, encoding='utf-8')
          combined = '\n'.join(p.read_text(encoding='utf-8') for p in paths)
          if '6件固定' in combined or '**必ず6件表示**' in combined:
              raise SystemExit('Old 6-item latest rule remains')
          print('Latest articles rule updated to 7')
          PY
      - name: Commit docs and remove helper workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/codex-update-rules.md docs/new-article-checklist.md docs/article-workflow.md
          git rm .github/workflows/update-latest-rule-7.yml
          git commit -m 'Set top latest articles rule to 7 items'
          git push origin HEAD:update-latest-rule-to-7-20260910
