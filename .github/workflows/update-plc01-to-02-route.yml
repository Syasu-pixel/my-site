name: Update PLC01 to PLC02 route

on:
  push:
    branches:
      - preview-plc-project-01-to-02-route
    paths:
      - .github/workflows/update-plc01-to-02-route.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Update article via GitHub API
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'articles/plc-drilling-line-design-project-01.html';
            const branch = 'preview-plc-project-01-to-02-route';
            const { data } = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
            if (Array.isArray(data) || !data.content) throw new Error('article file not found');
            let text = Buffer.from(data.content, 'base64').toString('utf8');

            const oldBlock = `      <section class="section-card next-article-card">\n        <span class="hero-label">NEXT｜第2回</span><h2>PLCとI/Oをもう一段具体化する</h2><div class="status-strip"><span class="status-chip">準備中</span></div><p>現在、第2回を準備しています。次回は、この設備に必要な入力と出力を整理し、信号名と役割を正本にしてからデバイスへ落とし込んでいきます。</p>\n      </section>`;
            const newBlock = `      <section class="section-card next-article-card">\n        <span class="hero-label">NEXT｜第2回</span>\n        <h2>I/O設計編へ進む</h2>\n        <a class="next-series-link" href="./plc-drilling-line-design-project-02.html" aria-label="第2回 I/O設計編を読む">\n          <img src="../assets/images/articles/plc-drilling-line-design-project-02-ogp.webp" alt="PLCで設備を1から設計する 第2回 I/O設計編" loading="lazy" decoding="async">\n          <span class="next-series-copy">\n            <strong>第2回｜PLC・I/O構成を決める</strong>\n            <small>入力・出力を整理し、X/Y割付と予備点まで具体化します。</small>\n            <span class="btn btn-primary next-series-button">第2回へ進む</span>\n          </span>\n        </a>\n      </section>`;
            if (text.split(oldBlock).length - 1 !== 1) throw new Error('next block mismatch');
            text = text.replace(oldBlock, newBlock);

            const cssAnchor = `    .next-article-card{border-color:#bfd5ff;background:linear-gradient(180deg,#f5f9ff,#fff)}`;
            const cssAdd = `    .next-article-card{border-color:#bfd5ff;background:linear-gradient(180deg,#f5f9ff,#fff)}\n    .next-series-link{display:grid;grid-template-columns:minmax(260px,380px) minmax(0,1fr);gap:22px;align-items:center;margin-top:16px;border:1px solid #cfe0f5;border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 10px 24px rgba(37,99,235,.08);color:inherit;text-decoration:none}\n    .next-series-link:hover{text-decoration:none;box-shadow:0 14px 30px rgba(37,99,235,.13);transform:translateY(-1px)}\n    .next-series-link img{width:100%;height:100%;min-height:200px;object-fit:cover}\n    .next-series-copy{display:block;padding:22px 24px 22px 0}\n    .next-series-copy strong{display:block;color:#1d4ed8;font-size:18px;line-height:1.5}\n    .next-series-copy small{display:block;margin-top:8px;color:#64748b;font-size:13px;line-height:1.7}\n    .next-series-button{margin-top:16px}`;
            if (!text.includes('.next-series-link{')) {
              if (!text.includes(cssAnchor)) throw new Error('css anchor missing');
              text = text.replace(cssAnchor, cssAdd);
            }

            const mobileAnchor = `.top-summary{grid-template-columns:1fr}`;
            if (!text.includes('.next-series-link{grid-template-columns:1fr}')) {
              const mediaRe = /@media\(max-width:768px\)\{([\s\S]*?)\}/;
              const m = text.match(mediaRe);
              if (!m) throw new Error('mobile media missing');
              const updated = m[0].replace(mobileAnchor, `${mobileAnchor}.next-series-link{grid-template-columns:1fr}.next-series-link img{min-height:0;aspect-ratio:16/9}.next-series-copy{padding:18px}`);
              text = text.replace(m[0], updated);
            }

            if (!text.includes('plc-drilling-line-design-project-02.html')) throw new Error('target link missing');
            if (!text.includes('plc-drilling-line-design-project-02-ogp.webp')) throw new Error('ogp missing');
            if (text.includes('現在、第2回を準備しています')) throw new Error('old prepared text remains');

            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch,
              message: '第1回から第2回へのOGP付き導線を追加',
              content: Buffer.from(text, 'utf8').toString('base64'),
              sha: data.sha
            });