name: Update popular articles 2026-09-10

on:
  push:
    paths:
      - '.github/workflows/update-popular-20260910.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Japanese popular articles list
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          new_items = '''
                <li><a href="articles/star-delta-start-basic.html">スターデルタ始動とは？</a></li>
                <li><a href="articles/pilot-lamp-basic.html">パイロットランプ・表示灯とは？</a></li>
                <li><a href="articles/control-panel-grounding-basic.html">制御盤のアース・接地とは？</a></li>
                <li><a href="articles/shielded-cable-basic.html">シールドケーブルの基本</a></li>
                <li><a href="articles/selector-switch-basic.html">セレクタスイッチとは？</a></li>
                <li><a href="articles/terminal-block-jumper-basic.html">端子台ジャンパの基本</a></li>
                <li><a href="articles/air-cylinder-basic.html">エアシリンダの基本</a></li>
                <li><a href="articles/a-contact-b-contact-basic.html">a接点・b接点の違い</a></li>
                <li><a href="articles/control-panel-wire-color-basic.html">制御盤の電線色の基本</a></li>
                <li><a href="articles/dc24v-common-basic.html">DC24Vコモンの基本</a></li>
'''
          pattern = re.compile(r'(<section class="info-box">\s*<h3>人気記事</h3>\s*<ol class="ranked-list">)(.*?)(\s*</ol>)', re.S)
          replacement = r'\1' + new_items.rstrip('\n') + r'\3'
          text2, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Popular articles block not found uniquely: {count}')
          path.write_text(text2, encoding='utf-8')
      - name: Commit update
        run: |
          if git diff --quiet -- index.html; then
            echo "No change"
            exit 0
          fi
          git config user.name "denkicontrol-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Update weekly popular articles from Google Search Console"
          git push
