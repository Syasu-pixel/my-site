name: Upgrade shielded cable audit 2026-09-10

on:
  push:
    branches: [audit-shielded-cable-20260910]
    paths:
      - '.github/workflows/upgrade-shielded-cable-audit-20260910.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-shielded-cable-20260910
          fetch-depth: 0
      - name: Apply article and rule refinements
        run: |
          python3 - <<'PY'
          from pathlib import Path

          article = Path('articles/shielded-cable-basic.html')
          text = article.read_text(encoding='utf-8')

          pairs = [
            ('そのシールドをどこで接地するかによって、ノイズの逃がし方が変わります。',
             'そのシールドをどこへ、どの方法で接続するかによって、ノイズ対策の考え方が変わります。'),
            ('シールド線は、弱い信号をノイズから守るための電線です。シールド部分は、ノイズを受けて逃がすための外側の層として見ます。',
             'シールド線は、弱い信号をノイズの影響から守りやすくするための電線です。シールド部分は、電磁的な干渉を抑えるための外側の遮蔽層として見ます。'),
            ('シールド線は、信号を通す芯線の外側にシールド層があり、その外側を外被で保護しています。シールド層を接地することでノイズを逃がします。',
             'シールド線は、信号を通す芯線の外側にシールド層があり、その外側を外被で保護しています。シールド層は、機器やメーカーが指定する方法で筐体・接地系などへ接続して使います。'),
            ('このシールド層がノイズを受け止め、接地側へ逃がすことで、芯線の信号を守りやすくします。',
             'このシールド層は電磁的な干渉を抑える役割を持ち、適切な終端・接続と組み合わせて芯線の信号を守りやすくします。'),
          ]
          for old, new in pairs:
            if old in text:
              text = text.replace(old, new, 1)

          css_anchor = '''    .related-card p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}\n'''
          css_add = '''    .related-card--visual{padding:0;overflow:hidden;background:#fff}\n    .related-card-media{display:block;aspect-ratio:1200/630;overflow:hidden;background:#eef4ff;border-bottom:1px solid #d7e4f3}\n    .related-card-media img{width:100%;height:100%;object-fit:cover}\n    .related-card-body{display:block;padding:15px 16px 16px}\n    .related-card-tag{display:inline-flex;margin-bottom:7px;font-size:11px;font-weight:900;color:#1d4ed8}\n    .source-list{margin:0;padding-left:20px}\n    .source-list li{margin:10px 0 0}\n    .source-list a{font-weight:800}\n'''
          if css_add.strip() not in text:
            if css_anchor not in text:
              raise SystemExit('related card CSS anchor not found')
            text = text.replace(css_anchor, css_anchor + css_add, 1)

          old_related = '''        <section class="section-card" id="related">\n          <h2>関連記事</h2>\n          <p>シールド線は、ノイズ対策、接地、配線ルート、アナログ信号と一緒に見ると理解しやすくなります。</p>\n          <div class="related-grid">\n            <a class="related-card" href="power-signal-wiring-separation-basic.html">\n              <h3>動力線と信号線の分け方とは？</h3>\n              <p>ノイズを避けるための配線ルートの基本を整理します。</p>\n            </a>\n            <a class="related-card" href="noise-filter-basic.html">\n              <h3>ノイズフィルタとは？</h3>\n              <p>制御盤のノイズ対策で使うノイズフィルタの基本を整理します。</p>\n            </a>\n            <a class="related-card" href="control-panel-grounding-basic.html">\n              <h3>制御盤のアース・接地とは？</h3>\n              <p>安全とノイズ対策に関わる接地の基本を整理します。</p>\n            </a>\n            <a class="related-card" href="analog-input-basic.html">\n              <h3>アナログ入力とは？</h3>\n              <p>PLCで扱うアナログ信号の基本を初心者向けに解説します。</p>\n            </a>\n            <a class="related-card" href="encoder-basic.html">\n              <h3>エンコーダとは？</h3>\n              <p>位置や回転を検出するエンコーダの基本を整理します。</p>\n            </a>\n            <a class="related-card" href="load-cell-basic.html">\n              <h3>ロードセルとは？</h3>\n              <p>重さを電気信号に変えるロードセルの基本を整理します。</p>\n            </a>\n          </div>\n        </section>'''

          new_related = '''        <section class="section-card" id="sources">\n          <h2>参考にした公式資料</h2>\n          <p>この記事では、シールドの接続方法を一律に決めつけず、機器・信号・メーカーの指定を優先するため、次の一次資料を確認しています。</p>\n          <ul class="source-list">\n            <li><a href="https://www.fa.omron.co.jp/products/family/3773/specification/" target="_blank" rel="noopener noreferrer">オムロン CK3W-AD□100 アナログ入力ユニット 定格/性能</a> — 対象機種のアナログ入力配線で、シールド線の使用と両側接地を指定。</li>\n            <li><a href="https://cache.industry.siemens.com/dl/files/610/103704610/att_1277149/v1/EMC_configuration_manual_202403_en-US.pdf" target="_blank" rel="noopener noreferrer">Siemens EMC Configuration Manual (03/2024)</a> — EMC対策としてシールド付きケーブルと、用途に応じたシールドの大面積接続を説明。</li>\n          </ul>\n          <div class="note-box">\n            <h3>資料の読み方</h3>\n            <p>上記は個別製品・設計条件を含む公式資料です。この記事では「片側接地が常に正解」「両側接地が常に正解」と一般化せず、実際の設備では対象機器の取扱説明書・配線図・仕様を優先します。</p>\n          </div>\n        </section>\n\n        <section class="section-card" id="related">\n          <h2>あわせて読みたい記事</h2>\n          <p>シールド線は、配線分離・接地・信号機器とセットで見ると理解しやすくなります。</p>\n          <div class="related-grid">\n            <a class="related-card related-card--visual" href="power-signal-wiring-separation-basic.html">\n              <span class="related-card-media"><img src="../assets/images/power-signal-wiring-separation-basic/power-signal-wiring-separation-basic-ogp.png" alt="動力線と信号線の配線分離の記事" loading="lazy" decoding="async"></span>\n              <span class="related-card-body"><span class="related-card-tag">配線・ノイズ</span><h3>動力線と信号線の分け方</h3><p>ノイズを減らすための配線ルートと分離の考え方を確認できます。</p></span>\n            </a>\n            <a class="related-card related-card--visual" href="control-panel-grounding-basic.html">\n              <span class="related-card-media"><img src="../assets/images/control-panel-grounding-basic/control-panel-grounding-basic-ogp.png" alt="制御盤の接地とアースの基礎記事" loading="lazy" decoding="async"></span>\n              <span class="related-card-body"><span class="related-card-tag">接地・アース</span><h3>制御盤の接地（アース）の基礎</h3><p>保護接地とノイズ対策を混同せずに整理できます。</p></span>\n            </a>\n            <a class="related-card related-card--visual" href="pe-fg-sg-difference-basic.html">\n              <span class="related-card-media"><img src="../assets/images/pe-fg-sg-difference-basic/pe-fg-sg-difference-basic-ogp.jpg" alt="PE・FG・SGの違いを整理する記事" loading="lazy" decoding="async"></span>\n              <span class="related-card-body"><span class="related-card-tag">グランド</span><h3>PE・FG・SGの違い</h3><p>端子名だけで接続先を決めず、公式資料で確認する考え方を整理します。</p></span>\n            </a>\n          </div>\n        </section>'''
          if old_related not in text:
            raise SystemExit('related section anchor not found')
          text = text.replace(old_related, new_related, 1)
          article.write_text(text, encoding='utf-8')

          workflow = Path('docs/article-workflow.md')
          w = workflow.read_text(encoding='utf-8')
          marker = '## 技術的資料・仕様確認の公式参照ルール\n'
          addition = '''## 検索上位記事の品質監査 5点セット\n- 検索流入上位記事を改善する場合は、本文の技術内容だけでなく、次の5点を必ず確認する。\n  1. 技術内容：一次資料と整合し、条件依存事項を一般化していないか。\n  2. 記事構造：固定ヘッダー、本文構造、キャラクター会話、右カラム、支援導線を維持しているか。\n  3. 画像品質：hero・本文図解・比較図・確認フローが内容を正確に補助し、文字潰れや誤解を招く図になっていないか。\n  4. 公式資料欄：実際に監査で参照したメーカー公式資料・FAQ・マニュアル等を記事末尾付近に掲載できるか。\n  5. 関連記事カード：あわせて読みたい記事を画像付きカードで表示できるか。OGPを第一候補、必要時のみheroを使う。\n- 検索実績が強い記事は、上記を理由に全面改稿しない。誤り・条件不足・画像品質・導線不足を必要最小限で改善する。\n\n'''
          if addition.strip() not in w:
            if marker not in w:
              raise SystemExit('article-workflow marker not found')
            w = w.replace(marker, addition + marker, 1)
            workflow.write_text(w, encoding='utf-8')

          image_rules = Path('docs/image-generation-rules.md')
          i = image_rules.read_text(encoding='utf-8')
          marker2 = '### 5.7) 「あわせて読みたい」関連記事カードの画像ルール\n'
          addition2 = '''### 5.6-a) 既存上位記事の画像再監査\n- GSC上位記事の監査では、既存画像を「あるから維持」ではなく、技術的正確性・情報密度・モバイル可読性・キャラクター整合性で再評価する。\n- 低品質と判断した画像は、記事構造を崩さず同じ役割の高品質画像へ差し替える。\n- ただし技術図は、公式資料で確認できない端子・配線・接続関係を想像で描かない。\n- 画像差し替えは本文の意味変更とは分離して管理し、PreviewでPC/スマホ双方を確認する。\n\n'''
          if addition2.strip() not in i:
            if marker2 not in i:
              raise SystemExit('image rules marker not found')
            i = i.replace(marker2, addition2 + marker2, 1)
            image_rules.write_text(i, encoding='utf-8')
          PY
      - name: Commit changes and remove helper
        run: |
          git config user.name 'denkicontrol-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/upgrade-shielded-cable-audit-20260910.yml
          git add articles/shielded-cable-basic.html docs/article-workflow.md docs/image-generation-rules.md
          git commit -m 'Upgrade shielded cable audit quality'
          git push origin HEAD:audit-shielded-cable-20260910
