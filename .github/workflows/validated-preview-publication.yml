name: Validated Cloudflare Preview publication
'on':
  push:
    branches:
    - preview-*
    - '!preview-publication-*'
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: validated-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.repository == 'Syasu-pixel/my-site' && startsWith(github.ref, 'refs/heads/preview-') && !startsWith(github.ref, 'refs/heads/preview-publication-')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - name: Refuse production and delivery branches
      run: |-
        case "$GITHUB_REF_NAME" in
          preview-publication-*|main) exit 1 ;;
          preview-*) ;;
          *) exit 1 ;;
        esac
    - name: Checkout
      uses: actions/checkout@v4
    - name: Select browser scope from source changes
      id: scope
      env:
        BEFORE_SHA: ${{ github.event.before }}
        GH_TOKEN: ${{ github.token }}
        SOURCE_BRANCH: ${{ github.ref_name }}
      run: |-
        set -euo pipefail
        FULL=true
        if [[ "$BEFORE_SHA" =~ ^[a-f0-9]{40}$ ]] && [ "$BEFORE_SHA" != 0000000000000000000000000000000000000000 ]; then
          git fetch --depth=1 origin "$BEFORE_SHA"
          git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" > "$RUNNER_TEMP/preview-changed-paths.txt"
        else
          printf '.github/workflows/validated-preview-publication.yml\n' > "$RUNNER_TEMP/preview-changed-paths.txt"
        fi
        python - <<'PYCODE'
        import json,os,base64,urllib.request,urllib.parse
        from pathlib import Path
        config=json.loads(Path('.github/article-components/integration.json').read_text())
        changed=Path(os.environ['RUNNER_TEMP']+'/preview-changed-paths.txt').read_text().splitlines()
        # Narrow only against the last publication that actually passed the gates.
        # A failed/interrupted shared change must not become an untested baseline.
        previous_source=None
        try:
         branch=os.environ['SOURCE_BRANCH'];delivery='preview-publication-'+branch.removeprefix('preview-')
         url='https://api.github.com/repos/Syasu-pixel/my-site/contents/preview-source.json?ref='+urllib.parse.quote(delivery,safe='')
         request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
         with urllib.request.urlopen(request,timeout=20) as response:payload=json.load(response)
         proof=json.loads(base64.b64decode(payload['content']))
         if proof.get('sourceBranch')==branch:previous_source=proof.get('sourceCommit')
        except Exception:
         pass
        full=previous_source!=os.environ.get('BEFORE_SHA') or any(p.startswith(('.github/article-components/','.github/site-shells/','scripts/','.github/workflows/','assets/images/')) or p in ('package.json','pnpm-lock.yaml') or p.startswith('assets/css/') or p.startswith('assets/js/') for p in changed)
        targets=config['targets'] if full else list(dict.fromkeys([p for p in changed if p in config['targets']]+config['representatives']))
        with open(os.environ['GITHUB_OUTPUT'],'a') as f:
         f.write('full='+str(full).lower()+'\n')
         f.write('targets='+json.dumps(targets,separators=(',',':'))+'\n')
        print(json.dumps({'full':full,'browserTargets':len(targets),'changes':changed}))
        PYCODE
    - name: Setup Node for shared shell verification
      uses: actions/setup-node@v4
      with:
        node-version: 22.16.0
    - uses: pnpm/action-setup@v4
      with:
        version: 11.19.0
    - uses: actions/setup-python@v5
      with:
        python-version: 3.12.14
    - name: Refuse stale generated headers and footers
      run: |
        pnpm install --frozen-lockfile --ignore-scripts
        pnpm check:shells
    - name: Generate and verify approved article components
      env:
        REVIEW_COPY_ASSETS: '0'
      run: |
        python -m pip install lxml==6.1.1
        node scripts/build-integrated-review.mjs "${RUNNER_TEMP}/integration-build"
        node scripts/build-additional-shells.mjs "${RUNNER_TEMP}/integration-build/additional-shells"
        python scripts/verify-integrated-source.py "${RUNNER_TEMP}/integration-build"
        python scripts/audit-integrated-links.py "${RUNNER_TEMP}/integration-build"
        python scripts/verify-article-end-preservation.py --oracle .github/article-components/end/all-preservation-oracle.json --candidate "${RUNNER_TEMP}/integration-build/candidate" --assets-source . --output "${RUNNER_TEMP}/integration-build/end-independent-checks.json"
    - run: pnpm exec playwright install --with-deps chromium
    - name: Verify regeneration and additional page browsers
      env:
        REVIEW_PORT: '8790'
        REVIEW_BEFORE_PORT: '8791'
      run: |-
        node scripts/check-component-regeneration.mjs "${RUNNER_TEMP}/integration-build"
        node scripts/check-integrated-publication.mjs "${RUNNER_TEMP}/integration-build"
        node scripts/check-additional-shell-regeneration.mjs "${RUNNER_TEMP}/integration-build/additional-shells"
        node scripts/serve-integrated-review.mjs "${RUNNER_TEMP}/integration-build/additional-shells" > "${RUNNER_TEMP}/additional-server.log" 2>&1 &
        REVIEW_PID=$!
        trap 'kill "$REVIEW_PID" || true' EXIT
        node scripts/check-additional-shell-browser.mjs "${RUNNER_TEMP}/integration-build/additional-shells"
    - name: Prepare Pages artifact
      run: |
        python scripts/build-admin-article-catalog.py

        rsync -a ./ _site/ \
          --exclude '_site/' \
          --exclude '.git/' \
          --exclude '.github/' \
          --exclude '/docs/rules/catalog.json' \
          --exclude 'node_modules/' \
          --exclude '.netlify/' \
          --exclude '.wrangler/' \
          --exclude '.cache/' \
          --exclude 'tmp/' \
          --exclude 'temp/' \
          --exclude '*.zip' \
          --exclude '*.tar' \
          --exclude '*.tar.gz' \
          --exclude '*.7z' \
          --exclude '*.psd' \
          --exclude '*.ai'

        node scripts/prepare-integrated-publication.mjs "${RUNNER_TEMP}/integration-build" _site
        python scripts/verify-publication-artifact.py snapshot _site "${RUNNER_TEMP}/integration-build"

        echo 'Before image optimization:'
        du -sh _site _site/assets/images
    - name: Optimize published images to WebP
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq webp
        export IMAGE_COLLISION_SKIP="${RUNNER_TEMP}/integration-build/image-collision-skip.txt"

        # Convert PNG/JPEG assets in the publish copy only. The repository originals
        # remain untouched until the optimized deployment has been verified.
        find _site/assets/images -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' \) -print0 \
          | xargs -0 -r -P 4 -I{} bash -c '
              src="$1"
              grep -Fxq "$src" "$IMAGE_COLLISION_SKIP" && exit 0
              dst="${src%.*}.webp"
              [ -e "$dst" ] && exit 0
              cwebp -quiet -mt -q 82 -m 4 "$src" -o "$dst"
            ' _ {}

        python3 - <<'PY'
        from pathlib import Path
        import re, json, os

        root = Path('_site')
        image_root = root / 'assets' / 'images'
        mapping = {}
        build = Path(os.environ['RUNNER_TEMP']) / 'integration-build'
        keep_originals = set(json.loads((build/'image-collision-plan.json').read_text())['keepOriginals'])
        for src in image_root.rglob('*'):
            if not src.is_file() or src.suffix.lower() not in {'.png', '.jpg', '.jpeg'}:
                continue
            if src.relative_to(root).as_posix() in keep_originals:
                continue
            dst = src.with_suffix('.webp')
            if dst.exists() and dst.stat().st_size > 0:
                rel_src = src.relative_to(root).as_posix()
                rel_dst = dst.relative_to(root).as_posix()
                mapping[rel_src] = rel_dst
        (build/'published-image-mapping.json').write_text(json.dumps(mapping), encoding='utf-8')

        # Only rewrite files that can affect the published site. Internal Markdown/TXT
        # docs contain example placeholders such as {slug} and must not be treated as
        # live asset references.
        text_exts = {'.html', '.css', '.js', '.json', '.xml'}
        changed = 0
        for path in root.rglob('*'):
            if not path.is_file() or path.suffix.lower() not in text_exts:
                continue
            try:
                text = path.read_text(encoding='utf-8')
            except UnicodeDecodeError:
                continue
            new = text
            for old, replacement in mapping.items():
                new = new.replace('/' + old, '/' + replacement)
                new = new.replace(old, replacement)
            if new != text:
                path.write_text(new, encoding='utf-8')
                changed += 1

        # Remove originals only from the generated publish copy and only when a
        # valid WebP counterpart exists.
        removed = 0
        for old in mapping:
            src = root / old
            if src.exists():
                src.unlink()
                removed += 1

        # Guard against stale references in actual published web files only.
        stale = []
        pattern = re.compile(r'assets/images/[^\s"\'<>?#]+\.(?:png|jpe?g)', re.I)
        for path in root.rglob('*'):
            if not path.is_file() or path.suffix.lower() not in text_exts:
                continue
            try:
                text = path.read_text(encoding='utf-8')
            except UnicodeDecodeError:
                continue
            for match in pattern.findall(text):
                candidate = root / match.lstrip('/')
                if not candidate.exists():
                    stale.append(f'{path}: {match}')

        print(f'Converted images: {len(mapping)}')
        print(f'Updated published files: {changed}')
        print(f'Removed publish-copy originals: {removed}')
        if stale:
            print('Stale image references detected in published files:')
            print('\n'.join(stale[:100]))
            raise SystemExit(1)
        PY

        echo 'After image optimization:'
        du -sh _site _site/assets/images

        # GitHub Pages published sites must remain below 1 GB. Keep headroom so
        # future articles cannot silently cross the limit.
        bytes=$(du -sb _site | cut -f1)
        limit=$((900 * 1024 * 1024))
        echo "Published artifact bytes: $bytes"
        if [ "$bytes" -ge "$limit" ]; then
          echo "ERROR: optimized Pages artifact is still >= 900 MiB; refusing oversized deploy."
          exit 1
        fi
    - name: Verify final standalone publication
      run: python scripts/verify-publication-artifact.py verify _site "${RUNNER_TEMP}/integration-build"
    - name: Save publication verification
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: publication-verification-${{ github.sha }}
        path: |
          ${{ runner.temp }}/integration-build/publication-checks.json
          ${{ runner.temp }}/integration-build/publication-final-checks.json
          ${{ runner.temp }}/integration-build/published-image-mapping.json
          ${{ runner.temp }}/integration-build/image-collision-plan.json
          ${{ runner.temp }}/integration-build/additional-shells/preservation.json
        retention-days: 30
    - name: Package validated Preview evidence
      run: |-
        cp "${RUNNER_TEMP}/integration-build/publication-final-checks.json" _site/preview-publication-verification.json
        python - <<'PYCODE'
        import hashlib,json,os
        from pathlib import Path
        site=Path('_site')
        # Provider headers isolate search without altering publication HTML.
        with (site/'_headers').open('a') as f:f.write('\n/*\n  X-Robots-Tag: noindex, noarchive\n  Referrer-Policy: no-referrer\n')
        files={p.relative_to(site).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in site.rglob('*') if p.is_file() and p.suffix.lower() in {'.html','.css','.js'}}
        (site/'preview-source.json').write_text(json.dumps({'sourceCommit':os.environ['GITHUB_SHA'],'sourceBranch':os.environ['GITHUB_REF_NAME'],'runId':os.environ['GITHUB_RUN_ID'],'files':files},indent=2))
        PYCODE
        node scripts/check-preview-publication.mjs _site "${RUNNER_TEMP}/preview-smoke"
    - uses: actions/upload-artifact@v4
      with:
        name: preview-publication-${{ github.sha }}
        path: _site/
        retention-days: 14
        include-hidden-files: true
    - uses: actions/upload-artifact@v4
      with:
        name: preview-integration-${{ github.run_id }}
        path: ${{ runner.temp }}/integration-build/
        retention-days: 7
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: preview-smoke-${{ github.run_id }}
        path: ${{ runner.temp }}/preview-smoke/
        retention-days: 14
    outputs:
      full: ${{ steps.scope.outputs.full }}
      targets: ${{ steps.scope.outputs.targets }}
  browser:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard:
        - 0
        - 1
        - 2
        - 3
        - 4
        - 5
    env:
      REVIEW_SHARD_COUNT: '6'
      REVIEW_SHARD_INDEX: ${{ matrix.shard }}
      REVIEW_TARGETS: ${{ needs.build.outputs.targets }}
      FULL_REVIEW: ${{ needs.build.outputs.full }}
    steps:
    - uses: actions/checkout@v4
    - name: Apply selected test scope
      run: |-
        python - <<'PYCODE'
        import json,os
        from pathlib import Path
        p=Path('.github/article-components/integration.json');c=json.loads(p.read_text());targets=json.loads(os.environ['REVIEW_TARGETS'])
        if not targets or any(t not in c['targets'] for t in targets):raise SystemExit('Invalid review scope')
        c['targets']=targets;c['representatives']=[t for t in c['representatives'] if t in targets];p.write_text(json.dumps(c))
        PYCODE
    - uses: actions/setup-node@v4
      with:
        node-version: 22.16.0
    - uses: pnpm/action-setup@v4
      with:
        version: 11.19.0
    - run: pnpm install --frozen-lockfile --ignore-scripts
    - run: pnpm exec playwright install --with-deps chromium
    - uses: actions/download-artifact@v4
      with:
        name: preview-integration-${{ github.run_id }}
        path: ${{ runner.temp }}/integration-build
    - name: Selected article viewport, dark-mode and isolated-vote checks
      run: |
        node scripts/serve-integrated-review.mjs ${{ runner.temp }}/integration-build > ${{ runner.temp }}/integration-build/server.log 2>&1 &
        REVIEW_PID=$!
        trap 'kill "$REVIEW_PID" || true' EXIT
        node scripts/check-integrated-review.mjs ${{ runner.temp }}/integration-build
        node scripts/check-article-dark-mode.mjs ${{ runner.temp }}/integration-build
    - name: Common-change boundary and risk cases
      if: matrix.shard == 0 && needs.build.outputs.full == 'true'
      run: |-
        node scripts/serve-integrated-review.mjs "${RUNNER_TEMP}/integration-build" > "${RUNNER_TEMP}/integration-build/risk-server.log" 2>&1 &
        REVIEW_PID=$!
        trap 'kill "$REVIEW_PID" || true' EXIT
        node scripts/check-integration-boundaries.mjs "${RUNNER_TEMP}/integration-build"
        node scripts/check-integration-risk-cases.mjs "${RUNNER_TEMP}/integration-build"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: integrated-shard-${{ matrix.shard }}-${{ github.run_id }}
        path: |
          ${{ runner.temp }}/integration-build/evidence-shard-${{ matrix.shard }}/
          ${{ runner.temp }}/integration-build/browser-checks-shard-${{ matrix.shard }}.json
          ${{ runner.temp }}/integration-build/article-dark-checks-shard-${{ matrix.shard }}.json
        retention-days: 30
        if-no-files-found: error
  publish:
    needs:
    - build
    - browser
    - reconcile
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - uses: actions/download-artifact@v4
      with:
        name: preview-publication-${{ github.sha }}
        path: ${{ runner.temp }}/publication
    - name: Push verified files to isolated delivery branch
      env:
        SOURCE_BRANCH: ${{ github.ref_name }}
        SOURCE_COMMIT: ${{ github.sha }}
      run: |-
        set -euo pipefail
        case "$SOURCE_BRANCH" in preview-publication-*|main) exit 1;; preview-*) ;; *) exit 1;; esac
        DELIVERY_BRANCH="preview-publication-${SOURCE_BRANCH#preview-}"
        git check-ref-format --branch "$DELIVERY_BRANCH"
        # Do not let a slower build replace a newer source revision.
        CURRENT_SOURCE=$(git ls-remote origin "refs/heads/$SOURCE_BRANCH" | cut -f1)
        [ "$CURRENT_SOURCE" = "$SOURCE_COMMIT" ] || { echo 'Source advanced; refusing stale publication'; exit 1; }
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        if git ls-remote --exit-code origin "refs/heads/$DELIVERY_BRANCH" > "$RUNNER_TEMP/delivery-ref"; then
          git fetch --depth=1 origin "$DELIVERY_BRANCH"
          git switch --detach FETCH_HEAD
          EXPECTED=$(git rev-parse HEAD)
          python - <<'PYCODE'
        import json,os
        from pathlib import Path
        p=Path('preview-source.json')
        if not p.is_file() or json.loads(p.read_text()).get('sourceBranch') != os.environ['SOURCE_BRANCH']:
            raise SystemExit('Delivery branch is not owned by this source; refusing replacement')
        PYCODE
          git switch -c "$DELIVERY_BRANCH"
        else
          EXPECTED=''
          git switch --orphan "$DELIVERY_BRANCH"
        fi
        # Preserve the Git database, replace only the dedicated delivery working tree.
        rsync -a --delete --exclude '.git/' "$RUNNER_TEMP/publication/" ./
        [ ! -d .github ]
        [ -f preview-source.json ]
        git add -A
        if git diff --cached --quiet; then echo 'Publication unchanged'; exit 0; fi
        git commit -m "Preview publication from $SOURCE_COMMIT"
        if [ -n "$EXPECTED" ]; then
          git push origin "HEAD:refs/heads/$DELIVERY_BRANCH"
        else
          git push origin "HEAD:refs/heads/$DELIVERY_BRANCH"
        fi
        printf 'Delivery branch: %s\nSource commit: %s\n' "$DELIVERY_BRANCH" "$SOURCE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
  reconcile:
    needs:
    - build
    - browser
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        pattern: integrated-shard-*-${{ github.run_id }}
        path: ${{ runner.temp }}/checks
        merge-multiple: true
    - name: Reject missing viewport and theme coverage
      env:
        REVIEW_TARGETS: ${{ needs.build.outputs.targets }}
      run: |-
        python - <<'PYCODE'
        import json,os
        from pathlib import Path
        folder=Path(os.environ['RUNNER_TEMP']+'/checks');expected=set(json.loads(os.environ['REVIEW_TARGETS']));seen=set();dark=set();layouts=set();dark_cases=set();votes=set();config=json.loads(Path('.github/article-components/integration.json').read_text())
        for shard in range(6):
         a=json.loads((folder/f'browser-checks-shard-{shard}.json').read_text());b=json.loads((folder/f'article-dark-checks-shard-{shard}.json').read_text())
         if a['failures'] or b['failures']:raise SystemExit('Browser failure')
         targets=set(a['targets'])
         if targets&seen:raise SystemExit('Duplicate article coverage')
         seen |= targets
         dark |= {r['path'] for r in b['results']}
         layouts |= {(r['path'],r['width']) for r in a['results']}
         dark_cases |= {(r['path'],r['width']) for r in b['results']}
         votes |= {r['path'] for r in a['votes'] if 'path' in r}
        if seen != expected or dark != expected:raise SystemExit('Missing article/theme coverage')
        wanted={(p,width) for p in expected for width in ([320,390,768,1024,1440] if p in config['representatives'] else [390,768,1440])}
        if not wanted <= layouts or dark_cases != {(p,w) for p in expected for w in (390,1440)} or votes != {p for p in expected if not p.startswith('en/')}:
         raise SystemExit('Missing viewport/theme/vote coverage')
        print('Browser coverage verified:',len(expected),'articles across six shards')
        PYCODE
