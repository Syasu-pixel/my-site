name: Verify article feedback placement

on:
  push:
    branches:
      - preview-article-feedback-placement-fix
    paths:
      - .github/workflows/verify-article-feedback-placement.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify all article placement targets via GitHub API
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ref = context.sha;
            const tree = await github.rest.git.getTree({owner, repo, tree_sha: ref, recursive: '1'});
            const files = tree.data.tree.filter(x => x.type === 'blob' && /^articles\/[^/]+\.html$/.test(x.path));
            const failures = [];
            let enabled = 0;
            let semanticHeadingTargets = 0;
            let exactIdTargets = 0;
            let relatedGridFallbacks = 0;

            for (const file of files) {
              const blob = await github.rest.git.getBlob({owner, repo, file_sha: file.sha});
              const html = Buffer.from(blob.data.content, 'base64').toString('utf8');
              const hasSiteSearch = /<script[^>]+src=["'][^"']*assets\/js\/site-search\.js[^"']*["']/i.test(html);
              const hasDirect = /<script[^>]+src=["'][^"']*assets\/js\/article-feedback\.js[^"']*["']/i.test(html);
              if (!(hasSiteSearch || hasDirect)) {
                failures.push(`${file.path}: feedback loader missing`);
                continue;
              }
              enabled++;

              if (/id=["']related["']/i.test(html) || /id=["']related-career["']/i.test(html)) {
                exactIdTargets++;
                continue;
              }

              const headings = [...html.matchAll(/<h2\b[^>]*>([\s\S]*?)<\/h2>/gi)].map(m =>
                m[1].replace(/<[^>]+>/g, '').replace(/&[^;]+;/g, ' ').replace(/\s+/g, ' ').trim()
              );
              const semantic = headings.some(label =>
                label === 'あわせて読みたい' || label.includes('あわせて読みたい記事') || label === '関連記事'
              );
              if (semantic) {
                semanticHeadingTargets++;
                continue;
              }

              if (/class=["'][^"']*\brelated-grid\b[^"']*["']/i.test(html)) {
                relatedGridFallbacks++;
                continue;
              }

              failures.push(`${file.path}: no related target`);
            }

            const feedbackJs = await github.rest.repos.getContent({owner, repo, path:'assets/js/article-feedback.js', ref});
            const feedbackText = Buffer.from(feedbackJs.data.content, 'base64').toString('utf8');
            if (feedbackText.includes("mainColumn.querySelector('[id^=\"related\"]')") || feedbackText.includes("mainColumn.querySelector('[id^=\'related\']')")) {
              failures.push('article-feedback.js: unsafe generic related-id fallback remains');
            }
            if (!feedbackText.includes("label === 'あわせて読みたい'")) failures.push('article-feedback.js: short related heading not supported');

            console.log(`TOTAL_ARTICLES=${files.length}`);
            console.log(`FEEDBACK_ENABLED=${enabled}`);
            console.log(`EXACT_ID_TARGETS=${exactIdTargets}`);
            console.log(`SEMANTIC_HEADING_TARGETS=${semanticHeadingTargets}`);
            console.log(`RELATED_GRID_FALLBACKS=${relatedGridFallbacks}`);
            console.log(`FAILURES=${failures.length}`);
            failures.forEach(x => console.log(`FAIL ${x}`));
            if (files.length !== 176) core.setFailed(`Expected 176 articles, got ${files.length}`);
            if (enabled !== files.length) core.setFailed('Not all articles have feedback loader');
            if (failures.length) core.setFailed(`${failures.length} placement verification failures`);
