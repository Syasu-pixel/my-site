name: Verify feedback production 1495
on:
  push:
    branches: [audit-feedback-production-1495]
    paths: [.github/workflows/verify-feedback-production-1495.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Check actual production pages
        run: |
          cat > verify.mjs <<'JS'
          import {chromium} from 'playwright';
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const origin='https://denkicontrol.com';
          const slugs=['control-panel-noise-troubleshooting-guide','plc-xymd-device-basic'];
          const out='production-evidence';fs.mkdirSync(out,{recursive:true});
          const rows=[],errors=[],blockedWrites=[];
          const browser=await chromium.launch({headless:true});
          const measure=()=>{
            const main=document.querySelector('.main-column');
            const card=document.getElementById('articleFeedbackCard');
            const norm=s=>(s||'').normalize('NFKC').replace(/^\s*\d+[.、:)\s]+/,'').replace(/\s+/g,'');
            const headings=[...main.querySelectorAll('h2')].filter(h=>!card?.contains(h)&&(/^(あわせて読みたい|合わせて読みたい)/.test(norm(h.textContent))||norm(h.textContent)==='関連記事'));
            const related=headings.map(h=>h.closest('section,.section-card,.article-card')).find(Boolean);
            const rect=e=>{if(!e)return null;const r=e.getBoundingClientRect();return {x:r.x,width:r.width,right:r.right,y:r.y,bottom:r.bottom};};
            const m=rect(main),c=rect(card),r=rect(related),issues=[];
            if(document.querySelectorAll('#articleFeedbackCard').length!==1)issues.push('card-count');
            if(!card||!related||card.nextElementSibling!==related||card.parentElement!==related.parentElement)issues.push('independent-position');
            if(c&&r&&(Math.abs(c.x-r.x)>1||Math.abs(c.width-r.width)>1))issues.push('alignment');
            if(c&&(c.x<0||c.right>innerWidth+1))issues.push('card-overflow');
            if(c&&r&&r.y-c.bottom<0)issues.push('overlap');
            if(document.documentElement.scrollWidth>innerWidth+1)issues.push('page-overflow');
            if(getComputedStyle(main).minWidth!=='0px')issues.push('css-not-active');
            const buttons=card?[...card.querySelectorAll('button')]:[];
            if(buttons.length!==2)issues.push('button-count');
            if(c&&buttons.some(b=>rect(b).x<c.x||rect(b).right>c.right+1))issues.push('button-overflow');
            const tables=[...document.querySelectorAll('.table-wrap')].map(e=>{const old=e.scrollLeft;e.scrollLeft=100;const canScroll=e.scrollLeft>0;e.scrollLeft=old;return {width:e.clientWidth,scrollWidth:e.scrollWidth,canScroll};});
            if(innerWidth<=390&&tables.some(t=>t.scrollWidth>t.width&&!t.canScroll))issues.push('table-not-scrollable');
            return {issues,viewport:innerWidth,documentWidth:document.documentElement.scrollWidth,main:m,card:c,related:r,gap:c&&r?r.y-c.bottom:null,tables,canonical:document.querySelector('link[rel="canonical"]')?.href};
          };
          for(const width of [320,390,1440]){
            for(const slug of slugs){
              const context=await browser.newContext({viewport:{width,height:width>700?1000:844},deviceScaleFactor:1,serviceWorkers:'block'});
              await context.route('**/*',route=>{
                const req=route.request(),url=new URL(req.url());
                if(!['GET','HEAD'].includes(req.method())){blockedWrites.push({url:req.url(),method:req.method()});return route.abort();}
                if(!['denkicontrol.com','www.denkicontrol.com'].includes(url.hostname))return route.abort();
                return route.continue();
              });
              const page=await context.newPage();const url=`${origin}/articles/${slug}.html`;
              try{
                let response,html;
                for(let attempt=0;attempt<12;attempt++){
                  response=await page.goto(url,{waitUntil:'networkidle',timeout:45000});
                  html=await response?.text();
                  if(response?.status()===200&&html.includes('.main-column{min-width:0}'))break;
                  if(attempt===11)throw new Error('Updated CSS not served after retries');
                  await page.waitForTimeout(10000);
                }
                await page.waitForSelector('#articleFeedbackCard',{timeout:15000});
                await page.evaluate(()=>document.fonts.ready);
                await page.addStyleTag({content:'html{scroll-behavior:auto!important}'});
                await page.evaluate(()=>{const c=document.getElementById('articleFeedbackCard');scrollTo(0,c.getBoundingClientRect().top+scrollY-110);});
                await page.waitForTimeout(500);
                await page.evaluate(async()=>{await Promise.all([...document.images].filter(i=>i.getBoundingClientRect().top<innerHeight&&i.getBoundingClientRect().bottom>0).map(i=>i.decode().catch(()=>{})));});
                const row={slug,url:page.url(),status:response.status(),html_sha256:createHash('sha256').update(html).digest('hex'),...await page.evaluate(measure)};
                if(row.canonical!==url)row.issues.push('canonical');
                rows.push(row);
                if(width===390||width===1440){
                  await page.screenshot({path:`${out}/${slug}-${width}.png`});
                  if(width===390){await page.locator('.table-wrap').first().scrollIntoViewIfNeeded();await page.screenshot({path:`${out}/${slug}-${width}-table.png`});}
                }
                console.log('RESULT '+JSON.stringify(row));
              }catch(e){errors.push({slug,width,error:String(e)});console.log('ERROR '+JSON.stringify(errors.at(-1)));}
              await context.close();
            }
          }
          await browser.close();
          const summary={environment:'production',merge_commit:'b5371c7763217dfb6b937fc1aad390a93e025226',checked_at:new Date().toISOString(),rendered:rows.length,passed:rows.filter(r=>!r.issues.length).length,failed:rows.filter(r=>r.issues.length).length,errors,real_votes_sent:0,blocked_writes:blockedWrites};
          fs.writeFileSync(`${out}/report.json`,JSON.stringify({summary,rows},null,2));
          console.log('PRODUCTION_SUMMARY '+JSON.stringify(summary));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'## Production verification\n```json\n'+JSON.stringify(summary,null,2)+'\n```\n');
          if(rows.length!==6||summary.failed||errors.length)process.exitCode=1;
          JS
          node verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feedback-production-1495-evidence
          path: production-evidence/
          retention-days: 7
          if-no-files-found: error
