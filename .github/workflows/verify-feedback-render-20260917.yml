name: Verify feedback rendered placement
on:
  push:
    branches: [preview-article-feedback-placement-fix]
    paths: [.github/workflows/verify-feedback-render-20260917.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify actual DOM and card dimensions
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/feedback-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          cat > .feedback-render-test.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const out='feedback-render-evidence';fs.mkdirSync(out,{recursive:true});
          const browser=await chromium.launch({headless:true});
          const files=fs.readdirSync('articles').filter(f=>f.endsWith('.html')).sort();
          const rows=[], errors=[], exclusions=[], live=[];
          const representatives=['plc-basic.html','relay-basic.html','power-watt-basic.html','safety-control-basic.html','motor-nameplate-basic.html','gxw3-mul-div-instruction-basic.html','tester.html','plc-drilling-line-design-project-01.html','alternate-operation-circuit-basic.html','equipment-maintenance-career.html','control-panel-noise-troubleshooting-guide.html','plc-xymd-device-basic.html'];
          const viewports=[['desktop',{width:1440,height:1000}],['mobile',{width:390,height:844}]];
          async function guard(page,images,origin='http://127.0.0.1:4173'){
            await page.route('**/*',route=>{
              const r=route.request();
              if(!r.url().startsWith(origin+'/')||!['GET','HEAD'].includes(r.method())) return route.abort();
              if(!images&&['image','media','font'].includes(r.resourceType())) return route.abort();
              return route.continue();
            });
          }
          const measure=()=>{
            const main=document.querySelector('.main-column, .article-main, .main');
            const card=document.getElementById('articleFeedbackCard');
            const norm=s=>(s||'').normalize('NFKC').replace(/^\s*\d+[.、:)\s]+/,'').replace(/\s+/g,'').trim();
            const labelMatches=s=>/^(?:あわせて読みたい|合わせて読みたい)/.test(norm(s))||norm(s)==='関連記事';
            const block=e=>{const b=e?.closest('section,.section-card,.article-card');return b&&b!==main&&main?.contains(b)?b:null;};
            const candidates=main?[...main.querySelectorAll('h2')].filter(h=>!card?.contains(h)&&labelMatches(h.textContent)).map(block).filter(Boolean):[];
            const expected=block(main?.querySelector('#related'))||block(main?.querySelector('#related-career'))||candidates.find(s=>s.querySelector('.related-grid'))||candidates[0]||block(main?.querySelector('.related-grid'));
            const rect=el=>{if(!el)return null;const r=el.getBoundingClientRect();return {x:r.x,y:r.y,width:r.width,height:r.height,right:r.right,bottom:r.bottom};};
            const c=rect(card),r=rect(expected),m=rect(main);
            const buttons=card?[...card.querySelectorAll('[data-feedback-vote]')]:[];
            const issues=[];
            if(document.querySelectorAll('#articleFeedbackCard').length!==1)issues.push('card-count');
            if(!main?.contains(card))issues.push('outside-main');
            if(!expected)issues.push('expected-related-missing');
            if(card&&expected&&(card.parentElement!==expected.parentElement||card.nextElementSibling!==expected))issues.push('not-independent-before-related');
            if(c&&r&&(Math.abs(c.x-r.x)>2||Math.abs(c.width-r.width)>2))issues.push('column-width-alignment');
            if(c&&r&&r.y-c.bottom < -1)issues.push('card-related-overlap');
            if(buttons.length!==2)issues.push('button-count');
            if(c&&buttons.some(b=>{const x=rect(b);return x.x<c.x-1||x.right>c.right+1}))issues.push('button-overflow');
            let pageOverflow=null;
            if(c&&(c.x < -1||c.right>window.innerWidth+1)){
              const old=card.style.display;card.style.display='none';
              const withoutMain=rect(main),withoutRelated=rect(expected);
              pageOverflow={viewport:window.innerWidth,withCardMain:m,withoutCardMain:withoutMain,withoutCardRelated:withoutRelated,mainMinWidth:main?getComputedStyle(main).minWidth:null,layoutColumns:main?.parentElement?getComputedStyle(main.parentElement).gridTemplateColumns:null};
              pageOverflow.preExisting=!!(withoutMain&&withoutRelated&&withoutRelated.right>window.innerWidth+1&&Math.abs(withoutMain.width-m.width)<2&&Math.abs(withoutRelated.width-r.width)<2);
              card.style.display=old;
              if(!pageOverflow.preExisting)issues.push('feedback-caused-viewport-overflow');
            }
            return {issues,card:c,related:r,relatedHeading:expected?.querySelector('h2')?.textContent?.trim(),relatedTag:expected?.tagName,cardParent:card?.parentElement?.className,gap:c&&r?r.y-c.bottom:null,headingAlign:card?getComputedStyle(card.querySelector('h2')).textAlign:null,pageOverflow};
          };
          for(const [name,viewport]of viewports){
            let cursor=0;
            async function worker(){
              const page=await browser.newPage({viewport});await guard(page,false);
              while(cursor<files.length){const file=files[cursor++];try{
                const response=await page.goto(`http://127.0.0.1:4173/articles/${file}`,{waitUntil:'domcontentloaded',timeout:20000});
                if(!response?.ok())throw new Error(`HTTP ${response?.status()}`);
                await page.waitForSelector('#articleFeedbackCard',{timeout:5000});
                const row={file,viewport:name,...await page.evaluate(measure)};rows.push(row);
                if(row.issues.length)console.log('FAIL '+JSON.stringify(row));
                if(row.pageOverflow)console.log('PAGE_OVERFLOW '+JSON.stringify(row));
              }catch(e){errors.push({file,viewport:name,error:String(e)});}}
              await page.close();
            }
            await Promise.all([worker(),worker(),worker()]);
          }
          for(const path of ['en/articles/plc-basic.html','en/articles/relay-basic.html','categories/control-basics.html','index.html']){
            const page=await browser.newPage({viewport:{width:390,height:844}});await guard(page,false);
            const response=await page.goto('http://127.0.0.1:4173/'+path,{waitUntil:'domcontentloaded',timeout:20000});await page.waitForTimeout(300);
            exclusions.push({path,status:response?.status(),cards:await page.locator('#articleFeedbackCard').count()});await page.close();
          }
          async function capture(file,name,viewport,origin='http://127.0.0.1:4173',prefix=''){
            const page=await browser.newPage({viewport});await guard(page,true,origin);
            const response=await page.goto(origin+'/articles/'+file,{waitUntil:'networkidle',timeout:45000});
            if(!response?.ok())throw new Error(`HTTP ${response?.status()}`);
            await page.waitForSelector('#articleFeedbackCard');await page.addStyleTag({content:'html{scroll-behavior:auto!important}'});
            await page.evaluate(async()=>{await document.fonts.ready;const c=document.getElementById('articleFeedbackCard');window.scrollTo(0,c.getBoundingClientRect().top+window.scrollY-130);});await page.waitForTimeout(500);
            const result={file,viewport:name,...await page.evaluate(measure)};
            await page.screenshot({path:`${out}/${prefix}${file.replace('.html','')}-${name}.png`});
            if(result.pageOverflow){
              await page.evaluate(()=>document.getElementById('articleFeedbackCard').style.display='none');
              await page.screenshot({path:`${out}/${prefix}${file.replace('.html','')}-${name}-without-feedback.png`});
            }
            await page.close();return result;
          }
          for(const file of representatives)for(const [name,viewport]of viewports)await capture(file,name,viewport);
          // Use only an actually issued Cloudflare URL tied to this run's commit.
          let previewUrl=null,previewError=null;
          const expectedHash=createHash('sha256').update(fs.readFileSync('assets/js/article-feedback.js')).digest('hex');
          for(let attempt=0;attempt<12;attempt++){
            try{
              const response=await fetch('https://api.github.com/repos/Syasu-pixel/my-site/issues/1493/comments?per_page=100',{headers:{'User-Agent':'feedback-layout-audit'},signal:AbortSignal.timeout(15000)});
              if(!response.ok)throw new Error(`comments HTTP ${response.status}`);
              const comments=await response.json();
              const comment=comments.find(c=>c.user?.login==='cloudflare-workers-and-pages[bot]'&&c.body.includes(process.env.HEAD_SHA.slice(0,7))&&c.body.includes('Deploy successful'));
              const match=comment?.body.match(/https:\/\/[a-f0-9]{8}\.denkicontrol-preview\.pages\.dev/);
              if(match){const r=await fetch(match[0]+'/assets/js/article-feedback.js',{signal:AbortSignal.timeout(15000)});const text=await r.text();if(r.ok&&createHash('sha256').update(text).digest('hex')===expectedHash){previewUrl=match[0];previewError=null;break;}}
            }catch(e){previewError=String(e);}
            await new Promise(r=>setTimeout(r,10000));
          }
          if(previewUrl){
            for(const file of ['plc-basic.html','power-watt-basic.html','alternate-operation-circuit-basic.html','gxw3-mul-div-instruction-basic.html'])for(const [name,viewport]of viewports){
              try{live.push(await capture(file,name,viewport,previewUrl,'live-'));}catch(e){live.push({file,viewport:name,issues:['live-capture-error'],error:String(e)});}
            }
          }
          await browser.close();
          const summary={head_sha:process.env.HEAD_SHA,source:'exact PR checkout executed in Chromium',article_count:files.length,rendered:rows.length,placement_passed:rows.filter(x=>!x.issues.length).length,placement_failed:rows.filter(x=>x.issues.length).length,pre_existing_page_overflow:rows.filter(x=>x.pageOverflow?.preExisting).map(x=>({file:x.file,viewport:x.viewport,...x.pageOverflow})),errors,exclusions,representative_screenshots:representatives.length*2,preview_url:previewUrl,preview_error:previewError,live_rendered:live.length,live_failed:live.filter(x=>x.issues.length).length,feedback_js_sha256:expectedHash,real_votes_sent:0};
          fs.writeFileSync(`${out}/report.json`,JSON.stringify({summary,rows,live},null,2));
          console.log('FEEDBACK_RENDER_SUMMARY '+JSON.stringify(summary));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'## Feedback rendered placement\n```json\n'+JSON.stringify(summary,null,2)+'\n```\n');
          if(summary.placement_failed||errors.length||rows.length!==files.length*2||exclusions.some(x=>x.cards!==0||x.status!==200)||summary.live_failed)process.exitCode=1;
          JS
          node .feedback-render-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feedback-render-evidence
          path: feedback-render-evidence/
          retention-days: 7
          if-no-files-found: error
