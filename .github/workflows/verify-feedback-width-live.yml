name: Verify issued feedback width Preview
on:
  push:
    branches: [audit-feedback-width-live]
    paths: [.github/workflows/verify-feedback-width-live.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Check real Preview URLs and capture screenshots
        run: |
          mkdir -p live-width-evidence
          cat > live-check.mjs <<'JS'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          import {chromium} from 'playwright';
          const origin='https://d2ddaf63.denkicontrol-preview.pages.dev';
          const head='83550209edecbc4a0dcffccbb8253e87b499a5d8';
          const files={'control-panel-noise-troubleshooting-guide.html':'80eaab7ae01530e746233a9e127c7a5638e6dbe3ddbbfb92baac73f0b4e17b08','plc-xymd-device-basic.html':'fb4d28782c16ca9fe89512348858b946c9ea06626f81e2e720e0b4b6fdce877e'};
          const rows=[],sources=[],errors=[];
          const browser=await chromium.launch({headless:true});
          for(const [file,expectedHash]of Object.entries(files)){
            try{
              const response=await fetch(origin+'/articles/'+file,{signal:AbortSignal.timeout(30000)});
              const html=await response.text();
              const actualHash=createHash('sha256').update(html).digest('hex');
              sources.push({file,status:response.status,expectedHash,actualHash,identical:actualHash===expectedHash});
              if(!response.ok||actualHash!==expectedHash)throw new Error('Deployed HTML differs from tested HTML: '+file);
              for(const width of [320,390,1440]){
                const page=await browser.newPage({viewport:{width,height:900}});
                try{
                  await page.route('**/*',route=>{const r=route.request();return r.url().startsWith(origin+'/')&&['GET','HEAD'].includes(r.method())?route.continue():route.abort();});
                  const nav=await page.goto(origin+'/articles/'+file,{waitUntil:'networkidle',timeout:45000});
                  if(!nav?.ok())throw new Error('Navigation failed');
                  await page.waitForSelector('#articleFeedbackCard',{timeout:10000});
                  await page.evaluate(async()=>{await document.fonts.ready;document.querySelectorAll('img[loading="lazy"]').forEach(i=>i.loading='eager');});
                  await page.waitForLoadState('networkidle');
                  const metrics=await page.evaluate(()=>{
                    const c=document.getElementById('articleFeedbackCard'),r=c.nextElementSibling,m=document.querySelector('.main-column');
                    const rect=e=>{const x=e.getBoundingClientRect();return {left:x.left,right:x.right,width:x.width,top:x.top,bottom:x.bottom};};
                    const cr=rect(c),rr=rect(r),mr=rect(m),v=document.documentElement.clientWidth;
                    const issues=[];
                    if(document.querySelectorAll('#articleFeedbackCard').length!==1||!r.querySelector('.related-grid')||c.parentElement!==r.parentElement)issues.push('placement');
                    if(Math.abs(cr.left-rr.left)>1||Math.abs(cr.width-rr.width)>1||rr.top<cr.bottom-1)issues.push('alignment-overlap');
                    if(mr.right>v+1||cr.right>v+1||document.documentElement.scrollWidth>v+1)issues.push('horizontal-overflow');
                    const tables=[...document.querySelectorAll('.table-wrap')].map(t=>{t.scrollLeft=t.scrollWidth;const result={width:t.clientWidth,scrollWidth:t.scrollWidth,scrolls:t.scrollLeft>0};t.scrollLeft=0;return result;});
                    if(v<=390&&tables.some(t=>t.scrollWidth>t.width+1&&!t.scrolls))issues.push('table-scroll');
                    return {issues,viewport:v,pageWidth:document.documentElement.scrollWidth,main:mr,card:cr,related:rr,tables};
                  });
                  rows.push({file,width,...metrics});
                  if(width!==320){
                    await page.addStyleTag({content:'html{scroll-behavior:auto!important}'});
                    await page.evaluate(()=>{const c=document.getElementById('articleFeedbackCard');window.scrollTo(0,c.getBoundingClientRect().top+scrollY-110);});
                    await page.waitForTimeout(300);
                    await page.screenshot({path:`live-width-evidence/${file.replace('.html','')}-${width}.png`});
                  }
                }finally{await page.close();}
              }
            }catch(e){errors.push({file,error:String(e)});}
          }
          await browser.close();
          const report={origin,head,sources,rows,errors,real_votes_sent:0,passed:rows.filter(r=>!r.issues.length).length};
          fs.writeFileSync('live-width-evidence/report.json',JSON.stringify(report,null,2));
          console.log('LIVE_PREVIEW_RESULT '+JSON.stringify(report));
          if(errors.length||rows.length!==6||rows.some(r=>r.issues.length))process.exitCode=1;
          JS
          node live-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issued-feedback-width-preview
          path: live-width-evidence/
          retention-days: 7
          if-no-files-found: error
