name: Verify remote feedback preview

on:
  push:
    branches:
      - preview-article-feedback-rollout

permissions:
  contents: read

jobs:
  verify-remote:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify fixed Cloudflare deployment
        env:
          PREVIEW_BASE: https://2a012460.denkicontrol-preview.pages.dev
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const cases = [
            { path: '/articles/air-cylinder-basic.html', label: 'air-cylinder' },
            { path: '/articles/tester.html', label: 'tester' }
          ];
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const failures = [];
            for (const c of cases) {
              const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
              const pageErrors = [];
              page.on('pageerror', err => pageErrors.push(err.message));
              const response = await page.goto(process.env.PREVIEW_BASE + c.path + '?remotecheck=' + Date.now(), { waitUntil: 'networkidle', timeout: 90000 });
              await page.waitForTimeout(1200);
              const result = await page.evaluate(() => {
                const card = document.getElementById('articleFeedbackCard');
                const main = document.querySelector('.main-column, .article-main, .main');
                const related = document.getElementById('related')
                  || document.getElementById('related-career')
                  || (main ? [...main.children].find((el) => {
                    const text = el.querySelector?.('h2')?.textContent?.trim() || '';
                    return text.includes('あわせて読みたい記事') || text === '関連記事';
                  }) : null);
                return {
                  pathname: location.pathname,
                  cardCount: document.querySelectorAll('#articleFeedbackCard').length,
                  cardText: card?.innerText || '',
                  cardBeforeRelated: Boolean(card && related && (card.compareDocumentPosition(related) & Node.DOCUMENT_POSITION_FOLLOWING)),
                  feedbackScripts: [...document.scripts].map(s => s.src).filter(src => src.includes('article-feedback.js'))
                };
              });
              console.log(JSON.stringify({ label: c.label, status: response?.status(), ...result, pageErrors }, null, 2));
              if (!response || response.status() >= 400) failures.push(`${c.label}: bad HTTP status`);
              if (result.cardCount !== 1) failures.push(`${c.label}: expected 1 feedback card, got ${result.cardCount}`);
              if (!result.cardBeforeRelated) failures.push(`${c.label}: feedback card not before related section`);
              if (pageErrors.length) failures.push(`${c.label}: page errors: ${pageErrors.join(' | ')}`);
              await page.close();
            }
            await browser.close();
            if (failures.length) {
              console.error('FAILURES');
              failures.forEach(f => console.error('- ' + f));
              process.exit(1);
            }
            console.log('REMOTE FIXED DEPLOYMENT CHECK PASSED');
          })();
          NODE
