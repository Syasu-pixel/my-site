name: Verify remote feedback preview

on:
  push:
    branches:
      - preview-article-feedback-rollout

permissions:
  contents: read

jobs:
  verify-remote:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Diagnose actual Cloudflare Preview
        env:
          PREVIEW_BASE: https://21a95118.denkicontrol-preview.pages.dev
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const cases = [
            '/articles/air-cylinder-basic.html',
            '/articles/tester.html'
          ];
          (async () => {
            const browser = await chromium.launch({ headless: true });
            for (const path of cases) {
              const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
              const consoleErrors = [];
              const pageErrors = [];
              page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
              page.on('pageerror', err => pageErrors.push(err.message));
              const url = process.env.PREVIEW_BASE + path + '?remotecheck=' + Date.now();
              let response = null;
              try {
                response = await page.goto(url, { waitUntil: 'networkidle', timeout: 90000 });
              } catch (e) {
                console.log(JSON.stringify({ path, navigationError: e.message }, null, 2));
                await page.close();
                continue;
              }
              await page.waitForTimeout(1500);
              const status = response ? response.status() : 0;
              const scriptSrcs = await page.locator('script').evaluateAll(nodes => nodes.map(n => n.src).filter(Boolean));
              const feedbackSrc = scriptSrcs.find(src => src.includes('/assets/js/article-feedback.js')) || null;
              let feedbackStatus = null;
              let feedbackText = '';
              if (feedbackSrc) {
                const r = await page.request.get(feedbackSrc, { headers: { 'cache-control': 'no-cache' } });
                feedbackStatus = r.status();
                feedbackText = await r.text();
              }
              const dom = await page.evaluate(() => ({
                pathname: location.pathname,
                bodySlug: document.body?.dataset?.articleSlug || null,
                mainColumnCount: document.querySelectorAll('.main-column, .article-main, .main').length,
                relatedIdCount: document.querySelectorAll('#related, #related-career').length,
                feedbackCount: document.querySelectorAll('#articleFeedbackCard').length,
                styleCount: document.querySelectorAll('#article-feedback-style').length
              }));
              console.log(JSON.stringify({
                path,
                status,
                feedbackSrc,
                feedbackStatus,
                feedbackTextStart: feedbackText.slice(0, 500),
                feedbackHasPathMatch: feedbackText.includes('pathMatch'),
                feedbackHasMainFallback: feedbackText.includes('.main-column, .article-main, .main'),
                dom,
                pageErrors,
                consoleErrors
              }, null, 2));
              await page.close();
            }
            await browser.close();
          })();
          NODE
