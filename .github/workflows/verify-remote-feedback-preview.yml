name: Verify remote feedback preview

on:
  push:
    branches:
      - preview-article-feedback-rollout

permissions:
  contents: read

jobs:
  verify-remote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Wait for latest Cloudflare branch Preview and verify
        env:
          PREVIEW_BASE: https://preview-article-feedback-rol.denkicontrol-preview.pages.dev
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const cases = [
            { path: '/articles/air-cylinder-basic.html', label: 'air-cylinder' },
            { path: '/articles/tester.html', label: 'tester' }
          ];
          const sleep = ms => new Promise(r => setTimeout(r, ms));

          async function inspect(page, c) {
            const errors = [];
            page.removeAllListeners('pageerror');
            page.on('pageerror', err => errors.push(err.message));
            const response = await page.goto(`${process.env.PREVIEW_BASE}${c.path}?remotecheck=${Date.now()}`, {
              waitUntil: 'networkidle', timeout: 90000
            });
            await page.waitForTimeout(800);
            return await page.evaluate(() => {
              const card = document.getElementById('articleFeedbackCard');
              const main = document.querySelector('.main-column, .article-main, .main');
              const related = document.getElementById('related')
                || document.getElementById('related-career')
                || (main ? [...main.children].find((el) => {
                  const text = el.querySelector?.('h2')?.textContent?.trim() || '';
                  return text.includes('あわせて読みたい記事') || text === '関連記事';
                }) : null);
              return {
                pathname: location.pathname,
                cardCount: document.querySelectorAll('#articleFeedbackCard').length,
                cardBeforeRelated: Boolean(card && related && (card.compareDocumentPosition(related) & Node.DOCUMENT_POSITION_FOLLOWING)),
                feedbackScripts: [...document.scripts].map(s => s.src).filter(src => src.includes('article-feedback.js'))
              };
            }).then(result => ({ status: response?.status() || 0, errors, ...result }));
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            let last = null;
            for (let attempt = 1; attempt <= 24; attempt++) {
              const results = [];
              for (const c of cases) results.push({ label: c.label, ...(await inspect(page, c)) });
              last = results;
              console.log(`Attempt ${attempt}:`, JSON.stringify(results, null, 2));
              const ok = results.every(r =>
                r.status === 200 &&
                r.cardCount === 1 &&
                r.cardBeforeRelated &&
                r.errors.length === 0 &&
                r.feedbackScripts.length === 1 &&
                r.feedbackScripts[0].includes('v=20260916-8')
              );
              if (ok) {
                console.log('REMOTE BRANCH PREVIEW CHECK PASSED');
                await browser.close();
                return;
              }
              await sleep(10000);
            }
            await browser.close();
            console.error('Preview did not converge to the expected latest deployment. Last result:', JSON.stringify(last, null, 2));
            process.exit(1);
          })();
          NODE
