name: Wire Color Related OGP Sync

on:
  push:
    branches:
      - preview-control-panel-wire-color-refresh-v2-20260914
    paths:
      - .github/workflows/wire-color-related-ogp-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: preview-control-panel-wire-color-refresh-v2-20260914
          fetch-depth: 1

      - name: Download and verify missing OGP assets
        shell: bash
        env:
          SHARE_ID: PpZQMPUSqKC2
        run: |
          set -euo pipefail
          API="https://api.firestorage.ai/dev/file"
          mkdir -p /tmp/related-ogp assets/images/terminal-block-basic assets/images/tester
          curl --proto '=https' --tlsv1.2 --fail-with-body --silent --show-error "$API/shares/$SHARE_ID/files?maxResults=1000" > /tmp/meta.json

          download_one() {
            FILE_ID="$1"; FILE_NAME="$2"; EXPECTED_SIZE="$3"; EXPECTED_SHA256="$4"; EXPECTED_DIM="$5"; OUT="$6"
            FILE_ID="$FILE_ID" FILE_NAME="$FILE_NAME" EXPECTED_SIZE="$EXPECTED_SIZE" python3 - <<'PY'
          import json, os
          meta=json.load(open('/tmp/meta.json','r',encoding='utf-8'))
          files=meta.get('files') or []
          fid=os.environ['FILE_ID']; fn=os.environ['FILE_NAME']; sz=int(os.environ['EXPECTED_SIZE'])
          hit=next((f for f in files if f.get('fileId')==fid), None)
          if not hit: raise SystemExit(f'file id not found: {fid}')
          if hit.get('fileName') != fn: raise SystemExit(f"filename mismatch: {hit.get('fileName')} != {fn}")
          if hit.get('sizeBytes') != sz: raise SystemExit(f"size mismatch: {hit.get('sizeBytes')} != {sz}")
          print(f'metadata ok: {fn} {sz} bytes')
          PY
            curl --proto '=https' --tlsv1.2 --fail-with-body --silent --show-error -X POST "$API/shares/$SHARE_ID/files/$FILE_ID/download" > /tmp/download.json
            DOWNLOAD_URL="$(python3 - <<'PY'
          import json
          d=json.load(open('/tmp/download.json','r',encoding='utf-8'))
          u=d.get('downloadUrl')
          if not isinstance(u,str) or not u.startswith('https://s3.ap-northeast-1.wasabisys.com/'):
              raise SystemExit('download URL rejected')
          print(u)
          PY
            )"
            curl --proto '=https' --tlsv1.2 --fail-with-body --silent --show-error "$DOWNLOAD_URL" -o "$OUT"
            test "$(wc -c < "$OUT")" = "$EXPECTED_SIZE"
            printf '%s  %s\n' "$EXPECTED_SHA256" "$OUT" | sha256sum -c -
            OUT="$OUT" EXPECTED_DIM="$EXPECTED_DIM" python3 - <<'PY'
          from pathlib import Path
          import os, struct
          p=Path(os.environ['OUT']); data=p.read_bytes()
          if not data.startswith(b'\x89PNG\r\n\x1a\n') or data[12:16] != b'IHDR': raise SystemExit('PNG verification failed')
          w,h=struct.unpack('>II',data[16:24]); ew,eh=map(int,os.environ['EXPECTED_DIM'].split('x'))
          if (w,h)!=(ew,eh): raise SystemExit(f'PNG dimensions mismatch: {w}x{h} != {ew}x{eh}')
          print(f'PNG verified: {w}x{h}, {len(data)} bytes')
          PY
          }

          download_one "01a0a5aedacc75f48a3d4d5496fbcc65" "terminal-block-basic-ogp.png" "763211" "b65e4bc78d94f52350fffa4cc0ce24819a162ef7e689f73144b72449a5ef84e6" "1200x630" "/tmp/related-ogp/terminal-block-basic-ogp.png"
          download_one "01a0a5af0ee575a4a06567081843b7ee" "tester-ogp.png" "730999" "504619c19c380f7c670d2521be1818a3a84dafa2c45b43a5f6c0a120e4684921" "1200x630" "/tmp/related-ogp/tester-ogp.png"

          cp /tmp/related-ogp/terminal-block-basic-ogp.png assets/images/terminal-block-basic/terminal-block-basic-ogp.png
          cp /tmp/related-ogp/tester-ogp.png assets/images/tester/tester-ogp.png

      - name: Switch related cards to OGP images
        shell: bash
        run: |
          set -euo pipefail
          FILE="articles/control-panel-wire-color-basic.html"
          sed -i 's#../assets/images/terminal-block-basic/terminal-block-hero.png#../assets/images/terminal-block-basic/terminal-block-basic-ogp.png#g' "$FILE"
          sed -i 's#../assets/images/plc-io-unit-basic/plc-io-unit-basic-hero.png#../assets/images/plc-io-unit-basic/plc-io-unit-basic-ogp.png#g' "$FILE"
          sed -i 's#../assets/images/control-panel-grounding-basic/control-panel-grounding-basic-hero.png#../assets/images/control-panel-grounding-basic/control-panel-grounding-basic-ogp.png#g' "$FILE"
          sed -i 's#../assets/images/wiring-duct-basic/wiring-duct-basic-hero.png#../assets/images/wiring-duct-basic/wiring-duct-basic-ogp.png#g' "$FILE"
          sed -i 's#../assets/images/tester/tester-hero.png#../assets/images/tester/tester-ogp.png#g' "$FILE"
          grep -q 'wire-number-marker-basic-ogp.png' "$FILE"
          grep -q 'terminal-block-basic-ogp.png' "$FILE"
          grep -q 'plc-io-unit-basic-ogp.png' "$FILE"
          grep -q 'control-panel-grounding-basic-ogp.png' "$FILE"
          grep -q 'wiring-duct-basic-ogp.png' "$FILE"
          grep -q 'tester-ogp.png' "$FILE"

      - name: Commit OGP assets, card refs, and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/wire-color-related-ogp-sync.yml
          git config user.name "denkicontrol-preview-writer"
          git config user.email "actions@users.noreply.github.com"
          git add -A articles/control-panel-wire-color-basic.html assets/images/terminal-block-basic/terminal-block-basic-ogp.png assets/images/tester/tester-ogp.png .github/workflows/wire-color-related-ogp-sync.yml
          git diff --cached --check
          git commit -m "Use OGP images for related article cards"
          git push origin HEAD:preview-control-panel-wire-color-refresh-v2-20260914
