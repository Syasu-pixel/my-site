<script>
const SUPABASE_URL='https://pavitnsnmoaiospswiys.supabase.co';
const SUPABASE_KEY='sb_publishable_J3Muz4RVr7sqDsSTen1LNA_y_mgKAyG';
const FEED=SUPABASE_URL+'/functions/v1/ai-editorial-secure-feed?limit=1000';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const personas={'openai-editor':{icon:'🧠',name:'GPT',role:'編集担当'},'editor-controller':{icon:'⚙️',name:'編集長',role:'編集担当'},'google-gemini':{icon:'🔍',name:'Gemini',role:'反対・検証担当'},'challenger-controller':{icon:'🔄',name:'検証代理',role:'代理担当'},'orchestrator-reviewer':{icon:'⚖️',name:'最終確認Controller',role:'最終確認担当'},'orchestrator':{icon:'🧭',name:'進行管理',role:'システム'},'github-actions':{icon:'⚙️',name:'自動処理',role:'システム'}};
const roleFallback={editor:{icon:'⚙️',name:'編集担当',role:'編集担当'},builder:{icon:'🛠️',name:'制作担当',role:'制作担当'},challenger:{icon:'🔍',name:'検証担当',role:'反対・検証担当'},reviewer:{icon:'⚖️',name:'最終確認担当',role:'最終確認担当'},system:{icon:'⚙️',name:'システム',role:'システム'},human:{icon:'👤',name:'管理者',role:'管理者'}};
const stanceJP={propose:'提案',oppose:'反対',revise:'修正',withdraw:'反対取り下げ',support:'賛成',question:'質問',adjudicate:'最終判断'};
const stateJP={FAILED:'失敗',ESCALATED:'管理者確認待ち',REVIEWING:'最終確認中',CHALLENGING:'検証中',HUMAN_GATE:'管理者確認待ち',DONE:'完了',ADOPTED:'採用'};
let rows=[],selectedJob=null,manualSelection=false,previousNewest=null,firstRender=true,refreshTimer=null;
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function persona(x){return personas[x.provider]||roleFallback[x.role]||{icon:'🤖',name:x.provider||'AI',role:'AI担当'}}
function setConn(ok,label){const e=document.querySelector('#conn');e.classList.toggle('off',!ok);e.textContent=label}
function latestProvider(provider){return [...rows].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).find(x=>x.provider===provider)}
function attendanceData(){const gem=latestProvider('google-gemini'),fb=latestProvider('challenger-controller'),ed=latestProvider('editor-controller'),rv=latestProvider('orchestrator-reviewer');const gemDown=fb&&(!gem||new Date(fb.created_at)>new Date(gem.created_at));return[{icon:'🔍',name:'Gemini',role:'反対・検証担当',status:gemDown?'🔴 離席中':gem?'🟢 出勤中':'⚪ 未確認',cls:gemDown?'bad':gem?'ok':'idle'},{icon:'⚙️',name:'編集長',role:'編集担当',status:ed?'🟢 稼働中':'⚪ 待機',cls:ed?'ok':'idle'},{icon:'⚖️',name:'最終確認',role:'最終確認担当',status:rv?'🟢 稼働中':'⚪ 待機',cls:rv?'ok':'idle'},{icon:'🧠',name:'GPT API',role:'代理候補',status:'⚪ 未接続',cls:'idle'},{icon:'🧩',name:'Claude',role:'技術確認候補',status:'⚪ 未接続',cls:'idle'}]}
function renderAttendance(){document.querySelector('#attendance').innerHTML=attendanceData().map(m=>`<div class="member"><div class="memberTop"><div class="memberIcon">${m.icon}</div><div class="memberName">${esc(m.name)}</div></div><div class="memberRole">${esc(m.role)}</div><div class="memberStatus ${m.cls}">${esc(m.status)}</div></div>`).join('')}
function groupedJobs(){const map=new Map();for(const r of rows){if(!map.has(r.job_id))map.set(r.job_id,[]);map.get(r.job_id).push(r)}return [...map.entries()].map(([id,ev])=>{ev.sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));return{id,ev,last:ev.at(-1),first:ev[0]}}).sort((a,b)=>new Date(b.last.created_at)-new Date(a.last.created_at))}
function queueTitle(g){const text=(g.first?.summary||'').replace(/^提案[:：]\s*/,'').replace(/目的と変更概要:[\s\S]*$/,'').trim();if(g.id.startsWith('discussion-'))return text&&text.length<55?text:'AI編集会議 '+g.id.slice(11,19);return g.id.slice(0,18)}
function cleanMessage(x){let s=String(x.summary||'');return s.replace(/^提案[:：]\s*/,'').replace(/目的と変更概要[:：][\s\S]*$/,'').replace(/\bEDITOR\b/g,'編集担当').replace(/\bCHALLENGER\b/g,'反対・検証担当').replace(/\bREVIEWER\b/g,'最終確認担当').replace(/\bBUILDER\b/g,'制作担当').replace(/\bHUMAN GATE\b/gi,'管理者確認待ち').replace(/\bproduction\b/gi,'本番').trim()}
function jpState(s){return stateJP[s]||s||'—'}
function collectUrls(value,out=new Set(),depth=0){if(depth>4||value==null)return out;if(typeof value==='string'){(value.match(/https:\/\/[^\s"'<>]+/g)||[]).forEach(u=>out.add(u.replace(/[),.;]+$/,'')));return out}if(Array.isArray(value)){value.forEach(v=>collectUrls(v,out,depth+1));return out}if(typeof value==='object')Object.values(value).forEach(v=>collectUrls(v,out,depth+1));return out}
function artifactLabel(url){try{const u=new URL(url),p=u.pathname.toLowerCase();if(u.hostname.includes('netlify'))return['🌐 確認用ページを開く','記事プレビュー'];if(u.hostname==='github.com'&&p.includes('/pull/'))return['🔧 変更内容を見る','GitHub'];if(/\.(webp|png|jpe?g)$/.test(p))return['🖼️ 画像を確認','画像'];if(u.hostname.includes('denkicontrol.com'))return['🌐 公開ページを見る','公開ページ'];return['🔗 確認先を開く',u.hostname]}catch{return['🔗 確認先を開く','リンク']}}
function renderArtifacts(ev){const urls=[...collectUrls(ev)].filter(u=>{try{return new URL(u).protocol==='https:'}catch{return false}}).slice(0,6);document.querySelector('#artifacts').innerHTML=urls.length?urls.map(u=>{const [label,hint]=artifactLabel(u);return `<a class="artifactLink" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${label}<div class="artifactHint">${esc(hint)}</div></a>`}).join(''):'<div class="card empty">確認できるものはまだありません。</div>'}
function closeDrawers(){document.querySelector('#queuePane').classList.remove('drawerOpen');document.querySelector('#sidePane').classList.remove('drawerOpen');document.querySelector('#drawerBackdrop').classList.remove('show')}
function openDrawer(id){if(!window.matchMedia('(max-width:760px)').matches)return;closeDrawers();document.querySelector(id).classList.add('drawerOpen');document.querySelector('#drawerBackdrop').classList.add('show')}
document.querySelector('#openQueue').onclick=()=>openDrawer('#queuePane');document.querySelector('#openSide').onclick=()=>openDrawer('#sidePane');document.querySelector('#drawerBackdrop').onclick=closeDrawers;document.querySelectorAll('[data-close-drawer]').forEach(b=>b.onclick=closeDrawers);window.addEventListener('resize',()=>{if(!window.matchMedia('(max-width:760px)').matches)closeDrawers()});
const menuButton=document.querySelector('#menuButton'),mobileMenu=document.querySelector('#mobileMenu');function closeMobileMenu(){mobileMenu.classList.remove('open');menuButton.setAttribute('aria-expanded','false')}menuButton.onclick=e=>{e.stopPropagation();const open=!mobileMenu.classList.contains('open');mobileMenu.classList.toggle('open',open);menuButton.setAttribute('aria-expanded',String(open))};document.addEventListener('click',e=>{if(!e.target.closest('.mobileMenuWrap'))closeMobileMenu()});window.addEventListener('resize',()=>{if(!window.matchMedia('(max-width:760px)').matches)closeMobileMenu()});
function render(){const groups=groupedJobs();const newest=groups[0]?.id||null;if(!selectedJob||!groups.some(g=>g.id===selectedJob)){selectedJob=newest;manualSelection=false}else if(!manualSelection&&newest&&previousNewest&&newest!==previousNewest){selectedJob=newest}previousNewest=newest;renderAttendance();document.querySelector('#jobs').innerHTML=groups.map((g,i)=>`<div class="job ${g.id===selectedJob?'active':''}" data-job="${esc(g.id)}"><div class="state">${i===0?'<span class="latestDot"></span>最新 · ':''}${esc(jpState(g.last.state))}</div><div class="title">${esc(queueTitle(g))}</div><div class="meta">${g.ev.length}発言 · ${new Date(g.last.created_at).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</div></div>`).join('')||'<div class="empty">イベントはまだありません。</div>';document.querySelectorAll('.job').forEach(el=>el.onclick=()=>{selectedJob=el.dataset.job;manualSelection=true;closeDrawers();render()});const g=groups.find(x=>x.id===selectedJob),ev=g?.ev||[],last=g?.last||{},lp=persona(last);document.querySelector('#topic').textContent=g?queueTitle(g):'AI編集会議';document.querySelector('#jobmeta').textContent=g?`${ev.length}発言 · ${new Date(last.created_at).toLocaleString('ja-JP')}`:'最新の会議を表示します';document.querySelector('#roomState').textContent=jpState(last.state);document.querySelector('#state').textContent=jpState(last.state);document.querySelector('#role').textContent='担当：'+lp.name+' / '+lp.role;renderArtifacts(ev);const html=ev.map((x,i)=>{const p=persona(x),d=x.discussion||{},isEditor=x.role==='editor',isSystem=x.role==='system'||x.type==='heartbeat',cls=isSystem?'system':isEditor?'mine':x.role==='reviewer'?'reviewer':'';const degraded=x.availability&&x.availability.provider_diversity==='degraded';const t=new Date(x.created_at);const audit=[d.round?`ラウンド ${d.round}`:'',d.turn?`発言 ${d.turn}`:'',d.stance?`判断：${stanceJP[d.stance]||d.stance}`:'',d.confidence!=null?`確信度 ${Math.round(Number(d.confidence)*100)}%`:'',degraded?'代理対応中（独立性低下）':''].filter(Boolean).join(' / ');const evidence=(x.evidence||[]).map(e=>e.ref).filter(Boolean).join('\n');return `${i===0?`<div class="dayline"><span>${t.toLocaleDateString('ja-JP')}</span></div>`:''}<div class="msg ${cls}">${!isSystem?`<div class="avatar">${p.icon}</div>`:''}<div class="pack"><div class="name">${esc(p.name)} · ${esc(p.role)}</div><div class="bubble">${esc(cleanMessage(x))}${audit||evidence?`<details class="detail"><summary>詳細</summary><div class="audit">${esc(audit)}${audit&&evidence?'<br>':''}${evidence?'根拠：'+esc(evidence):''}</div></details>`:''}</div><div class="time">${t.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}</div></div></div>`}).join('')||'<div class="empty">この案件の会話はまだありません。</div>';const box=document.querySelector('#events');const nearBottom=box.scrollHeight-box.scrollTop-box.clientHeight<120;box.innerHTML=html;if(firstRender||nearBottom||!manualSelection){requestAnimationFrame(()=>{box.scrollTop=box.scrollHeight;firstRender=false})}const gateCard=document.querySelector('#gateCard');gateCard.classList.remove('alert');if(last.state==='HUMAN_GATE'){document.querySelector('#gate').textContent='管理者の確認を待っています。';gateCard.classList.add('alert')}else if(last.state==='ESCALATED'){document.querySelector('#gate').textContent='重要な未解決事項があります。管理者の判断が必要です。';gateCard.classList.add('alert')}else{document.querySelector('#gate').textContent='現在、管理者確認はありません。'}}
async function refresh(){const{data:{session},error:sessionError}=await sb.auth.getSession();if(sessionError){console.error('[AI編集部] session error',sessionError);setConn(false,'認証エラー');return}if(!session)return lockApp();try{const r=await fetch(FEED,{cache:'no-store',headers:{Authorization:'Bearer '+session.access_token,apikey:SUPABASE_KEY}});const raw=await r.text();let d={};try{d=raw?JSON.parse(raw):{}}catch{d={raw}}if(r.status===401){console.warn('[AI編集部] feed 401',d);return lockApp('ログインの有効期限が切れました。もう一度ログインしてください。')}if(r.status===403){console.warn('[AI編集部] feed 403',d);return lockApp('このアカウントには管理者権限がありません。')}if(!r.ok){console.error('[AI編集部] feed HTTP error',{status:r.status,statusText:r.statusText,body:d});throw new Error(`feed HTTP ${r.status}`)}rows=Array.isArray(d.events)?d.events:[];setConn(true,'ライブ接続中');render()}catch(e){console.error('[AI編集部] feed request failed',{error:e,feed:FEED,online:navigator.onLine,origin:location.origin});setConn(false,'接続できません');document.querySelector('#events').innerHTML='<div class="msg system"><div class="pack"><div class="bubble">安全なイベントfeedへ接続できません。自動で再接続します。</div></div></div>'}}
function unlockApp(){document.querySelector('#authGate').classList.add('hidden');document.querySelector('#app').classList.remove('appLocked');document.querySelector('#loginMsg').textContent='';refresh();if(refreshTimer)clearInterval(refreshTimer);refreshTimer=setInterval(refresh,10000)}
function lockApp(message=''){if(refreshTimer){clearInterval(refreshTimer);refreshTimer=null}rows=[];closeDrawers();document.querySelector('#app').classList.add('appLocked');document.querySelector('#authGate').classList.remove('hidden');document.querySelector('#loginMsg').textContent=message}
document.querySelector('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const email=document.querySelector('#email').value.trim(),password=document.querySelector('#password').value;document.querySelector('#loginMsg').textContent='ログイン確認中…';const{error}=await sb.auth.signInWithPassword({email,password});if(error){console.error('[AI編集部] login error',error);return lockApp('ログインできませんでした。入力内容を確認してください。')}unlockApp()});
async function logout(){closeMobileMenu();await sb.auth.signOut();lockApp('ログアウトしました.')}document.querySelector('#logout').onclick=logout;document.querySelector('#mobileLogout').onclick=logout;sb.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'||!session)lockApp()});(async()=>{const{data:{session}}=await sb.auth.getSession();session?unlockApp():lockApp()})();
</script>
