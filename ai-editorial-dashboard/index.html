<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive">
<title>AI編集部 Dashboard</title>
<style>
:root{font-family:system-ui,sans-serif;color:#172033;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}header{height:58px;background:#172033;color:white;display:flex;align-items:center;padding:0 20px;gap:14px}header b{font-size:18px}.live{font-size:12px;background:#2d8a5b;padding:5px 9px;border-radius:999px}.live.off{background:#7b879b}.layout{display:grid;grid-template-columns:270px minmax(360px,1fr) 320px;height:calc(100vh - 58px)}aside,main{overflow:auto}.queue{border-right:1px solid #dce3ee;background:white;padding:14px}.queue h2,.side h2{font-size:13px;color:#697386;text-transform:uppercase}.job{border:1px solid #dce3ee;border-radius:12px;padding:12px;margin:10px 0;background:#f9fbff;cursor:pointer}.job.active{border-color:#5d78ff;background:#f0f4ff}.state{font-size:11px;font-weight:700;color:#5d78ff}.chat{padding:22px;max-width:900px;margin:auto}.chat h1{font-size:22px;margin:0 0 6px}.sub{color:#697386;font-size:13px;margin-bottom:22px}.event{display:grid;grid-template-columns:42px 1fr;gap:10px;margin:16px 0}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#e4e9f2;font-weight:800}.bubble{background:white;border:1px solid #dce3ee;border-radius:14px;padding:12px 14px}.meta{font-size:12px;color:#697386;margin-bottom:5px}.role{font-weight:800;color:#172033}.sev-high{border-left:4px solid #b64a4a}.heartbeat{opacity:.72}.unverified{display:inline-block;margin-top:7px;padding:3px 7px;border-radius:999px;background:#fff0f0;color:#a13b3b;font-size:11px;font-weight:800}.side{border-left:1px solid #dce3ee;background:white;padding:16px}.card{border:1px solid #dce3ee;border-radius:12px;padding:12px;margin:10px 0}.big{font-size:18px;font-weight:800}.gate{background:#fff7dd;border-color:#e8cf78}.gate.alert{background:#fff0f0;border-color:#d88}.empty{color:#697386;font-size:13px}a{color:#315ee8}@media(max-width:900px){.layout{grid-template-columns:1fr}.queue,.side{display:none}}
</style>
</head><body>
<header><b>⚡ AI編集部</b><span id="conn" class="live off">● connecting…</span><span style="margin-left:auto;font-size:12px">read-only v0.1</span></header>
<div class="layout">
<aside class="queue"><h2>案件キュー</h2><div id="jobs"><div class="empty">イベントを読み込み中…</div></div></aside>
<main class="chat"><h1 id="topic">AI編集部の活動</h1><div class="sub" id="jobmeta">実際のOrchestratorイベントだけを表示します。</div><div id="events"></div></main>
<aside class="side"><h2>現在の状態</h2><div class="card"><div class="big" id="state">—</div><div id="role" class="empty">担当: —</div></div><h2>人間ゲート</h2><div id="gateCard" class="card gate"><div id="gate">現在、確認待ちはありません。</div></div><h2>成果物</h2><div class="card empty" id="artifacts">Preview / PR / 画像候補をここに表示</div></aside>
</div>
<script>
const FEED='https://raw.githubusercontent.com/Syasu-pixel/my-site/ai-dashboard-events/dashboard-data/events.json';
const initials={editor:'E',builder:'B',challenger:'C',reviewer:'R',system:'S',human:'H','image-reviewer':'I'};let rows=[];let selectedJob=null;
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setConn(ok,label){const e=document.querySelector('#conn');e.classList.toggle('off',!ok);e.textContent='● '+label}
function render(){
 const jobs=[...new Set(rows.map(x=>x.job_id))]; if(!selectedJob||!jobs.includes(selectedJob))selectedJob=jobs.at(-1);
 document.querySelector('#jobs').innerHTML=jobs.map(j=>{const x=rows.filter(r=>r.job_id===j);const last=x.at(-1)||{};return `<div class="job ${j===selectedJob?'active':''}" data-job="${esc(j)}"><div class="state">${esc(last.state||'—')}</div><b>${esc(j.slice(0,18))}</b><div class="empty">${x.length} events · ${esc(last.role||'—')}</div></div>`}).join('')||'<div class="empty">イベントはまだありません。</div>';
 document.querySelectorAll('.job').forEach(el=>el.onclick=()=>{selectedJob=el.dataset.job;render()});
 const ev=rows.filter(x=>x.job_id===selectedJob);const last=ev.at(-1)||{};document.querySelector('#state').textContent=last.state||'—';document.querySelector('#role').textContent='担当: '+(last.role||'—');document.querySelector('#jobmeta').textContent=selectedJob?`job: ${selectedJob} · ${ev.length} events`:'実際のOrchestratorイベントだけを表示します。';
 document.querySelector('#events').innerHTML=ev.map(x=>{const important=['high','blocker'].includes(x.severity);const hasEvidence=(x.evidence||[]).length>0;return `<div class="event ${x.type==='heartbeat'?'heartbeat':''}"><div class="avatar">${initials[x.role]||'A'}</div><div class="bubble ${important?'sev-high':''}"><div class="meta"><span class="role">${esc(x.role)}</span> · ${esc(x.provider)} · ${esc(x.type)} · ${new Date(x.created_at).toLocaleString('ja-JP')}</div><div>${esc(x.summary)}</div>${hasEvidence?`<div class="meta" style="margin-top:7px">根拠: ${x.evidence.map(e=>esc(e.ref)).join(' / ')}</div>`:''}${important&&!hasEvidence?'<span class="unverified">UNVERIFIED · 根拠未登録</span>':''}</div></div>`}).join('')||'<div class="empty">この案件のイベントはまだありません。</div>';
 const gateCard=document.querySelector('#gateCard');gateCard.classList.remove('alert');if(last.state==='HUMAN_GATE'){document.querySelector('#gate').textContent='あなたの確認を待っています。'}else if(last.state==='ESCALATED'){document.querySelector('#gate').textContent='重要な未解決事項があります。人間の判断が必要です。';gateCard.classList.add('alert')}else{document.querySelector('#gate').textContent='現在、確認待ちはありません。'}
}
async function refresh(){try{const url=FEED+'?t='+Date.now();const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error('feed');const d=await r.json();rows=Array.isArray(d.events)?d.events:[];setConn(true,'live event feed');render()}catch(e){setConn(false,'feed unavailable');document.querySelector('#events').innerHTML='<div class="event"><div class="avatar">S</div><div class="bubble"><div class="meta"><span class="role">SYSTEM</span> · dashboard</div><div>イベントfeedへ接続できません。自動再接続します。</div></div></div>'}}
refresh();setInterval(refresh,10000);
</script></body></html>
