<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive">
<title>AI編集部 Dashboard</title>
<style>
:root{font-family:system-ui,sans-serif;color:#172033;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}header{height:58px;background:#172033;color:white;display:flex;align-items:center;padding:0 20px;gap:14px}header b{font-size:18px}.live{font-size:12px;background:#2d8a5b;padding:5px 9px;border-radius:999px}.live.off{background:#7b879b}.layout{display:grid;grid-template-columns:250px minmax(420px,1fr) 290px;height:calc(100vh - 58px)}aside,main{overflow:auto}.queue{border-right:1px solid #dce3ee;background:white;padding:14px}.queue h2,.side h2{font-size:13px;color:#697386;text-transform:uppercase}.job{border:1px solid #dce3ee;border-radius:12px;padding:12px;margin:10px 0;background:#f9fbff;cursor:pointer}.job.active{border-color:#5d78ff;background:#f0f4ff}.state{font-size:11px;font-weight:700;color:#5d78ff}.chat{padding:22px;max-width:980px;margin:auto}.chat h1{font-size:22px;margin:0 0 6px}.sub{color:#697386;font-size:13px;margin-bottom:14px}.attendanceTitle{font-size:13px;color:#697386;font-weight:800;margin:12px 0 8px}.attendance{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-bottom:18px}.member{background:white;border:1px solid #dce3ee;border-radius:12px;padding:10px 12px}.memberTop{display:flex;align-items:center;gap:8px}.memberIcon{font-size:20px}.memberName{font-weight:800;font-size:13px}.memberRole{font-size:10px;color:#697386}.memberStatus{margin-top:7px;font-size:12px;font-weight:800}.memberMeta{font-size:11px;color:#697386;margin-top:3px}.ok{color:#25744a}.warn{color:#9a6b00}.bad{color:#a13b3b}.idle{color:#697386}.event{display:grid;grid-template-columns:52px 1fr;gap:12px;margin:18px 0}.avatar{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:#e4e9f2;font-size:22px}.bubble{background:white;border:1px solid #dce3ee;border-radius:14px;padding:13px 15px}.meta{font-size:12px;color:#697386;margin-bottom:6px}.speaker{font-weight:800;color:#172033}.roleTag{display:inline-block;font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;background:#eef2ff;color:#4157a8;margin-left:6px}.discussion{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.pill{font-size:11px;padding:3px 7px;border-radius:999px;background:#f1f4f8;color:#566176}.pill.oppose{background:#fff0f0;color:#9d3737}.pill.support,.pill.withdraw{background:#eaf8ef;color:#25744a}.pill.adjudicate{background:#fff7dd;color:#8a6811}.pill.question,.pill.revise{background:#fff7dd;color:#8a6811}.sev-high{border-left:4px solid #b64a4a}.heartbeat{opacity:.72}.unverified{display:inline-block;margin-top:7px;padding:3px 7px;border-radius:999px;background:#fff0f0;color:#a13b3b;font-size:11px;font-weight:800}.fallbackBadge{display:inline-block;margin-top:7px;padding:3px 7px;border-radius:999px;background:#fff7dd;color:#8a6811;font-size:11px;font-weight:800}.side{border-left:1px solid #dce3ee;background:white;padding:16px}.card{border:1px solid #dce3ee;border-radius:12px;padding:12px;margin:10px 0}.big{font-size:18px;font-weight:800}.gate{background:#fff7dd;border-color:#e8cf78}.gate.alert{background:#fff0f0;border-color:#d88}.empty{color:#697386;font-size:13px}a{color:#315ee8}@media(max-width:1000px){.layout{grid-template-columns:220px minmax(430px,1fr)}.side{display:none}}@media(max-width:760px){.layout{grid-template-columns:1fr}.queue,.side{display:none}.chat{padding:14px}.attendance{grid-template-columns:1fr 1fr}}
</style>
</head><body>
<header><b>⚡ AI編集部</b><span id="conn" class="live off">● connecting…</span><span style="margin-left:auto;font-size:12px">read-only v0.2</span></header>
<div class="layout">
<aside class="queue"><h2>案件キュー</h2><div id="jobs"><div class="empty">イベントを読み込み中…</div></div></aside>
<main class="chat"><h1 id="topic">AI編集部の活動</h1><div class="sub" id="jobmeta">実際のOrchestratorイベントだけを表示します。</div><div class="attendanceTitle">🏢 AI編集部・出勤状況</div><div id="attendance" class="attendance"></div><div id="events"></div></main>
<aside class="side"><h2>現在の状態</h2><div class="card"><div class="big" id="state">—</div><div id="role" class="empty">担当: —</div></div><h2>人間ゲート</h2><div id="gateCard" class="card gate"><div id="gate">現在、確認待ちはありません。</div></div><h2>成果物</h2><div class="card empty" id="artifacts">Preview / PR / 画像候補をここに表示</div></aside>
</div>
<script>
const FEED='https://raw.githubusercontent.com/Syasu-pixel/my-site/ai-dashboard-events/dashboard-data/events.json';
const personas={
 'openai-editor':{icon:'🧠',name:'GPT',role:'EDITOR (historical)'},
 'editor-controller':{icon:'⚙️',name:'EDITOR Controller',role:'EDITOR'},
 'google-gemini':{icon:'🔍',name:'Gemini',role:'CHALLENGER'},
 'challenger-controller':{icon:'🔄',name:'CHALLENGER Controller',role:'FALLBACK'},
 'orchestrator-reviewer':{icon:'⚖️',name:'REVIEWER Controller',role:'ADJUDICATOR'},
 'orchestrator':{icon:'🧭',name:'Orchestrator',role:'SYSTEM'},
 'github-actions':{icon:'⚙️',name:'GitHub Actions',role:'SYSTEM'}
};
const roleFallback={editor:{icon:'⚙️',name:'EDITOR',role:'EDITOR'},builder:{icon:'🛠️',name:'BUILDER',role:'BUILDER'},challenger:{icon:'🔍',name:'CHALLENGER',role:'CHALLENGER'},reviewer:{icon:'⚖️',name:'REVIEWER',role:'REVIEWER'},system:{icon:'⚙️',name:'SYSTEM',role:'SYSTEM'},human:{icon:'👤',name:'HUMAN',role:'OWNER'},'image-reviewer':{icon:'🖼️',name:'IMAGE REVIEWER',role:'REVIEWER'}};
let rows=[];let selectedJob=null;
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function persona(x){return personas[x.provider]||roleFallback[x.role]||{icon:'🤖',name:x.provider||'AI',role:(x.role||'AI').toUpperCase()}}
function setConn(ok,label){const e=document.querySelector('#conn');e.classList.toggle('off',!ok);e.textContent='● '+label}
function latestProvider(provider){return [...rows].reverse().find(x=>x.provider===provider)}
function fmtAgo(d){if(!d)return '応答記録なし';const ms=Date.now()-new Date(d).getTime();if(ms<60000)return 'たった今';if(ms<3600000)return Math.floor(ms/60000)+'分前';if(ms<86400000)return Math.floor(ms/3600000)+'時間前';return Math.floor(ms/86400000)+'日前'}
function attendanceData(){
 const gem=latestProvider('google-gemini');const fb=latestProvider('challenger-controller');const ed=latestProvider('editor-controller');const rv=latestProvider('orchestrator-reviewer');
 const gemDown=fb&&(!gem||new Date(fb.created_at)>new Date(gem.created_at));
 return [
  {icon:'🔍',name:'Gemini',role:'CHALLENGER',status:gemDown?'🔴 障害・離席中':gem?'🟢 出勤中':'⚪ 未確認',cls:gemDown?'bad':gem?'ok':'idle',meta:gemDown?'fallback発動 · '+fmtAgo(fb.created_at):gem?'最終応答 '+fmtAgo(gem.created_at):'まだ実働記録なし'},
  {icon:'⚙️',name:'EDITOR Controller',role:'EDITOR',status:ed?'🟢 稼働中':'⚪ 待機',cls:ed?'ok':'idle',meta:ed?'最終処理 '+fmtAgo(ed.created_at):'実働記録なし'},
  {icon:'⚖️',name:'REVIEWER Controller',role:'ADJUDICATOR',status:rv?'🟢 稼働中':'⚪ 待機',cls:rv?'ok':'idle',meta:rv?'最終裁定 '+fmtAgo(rv.created_at):'実働記録なし'},
  {icon:'🧠',name:'GPT API',role:'FALLBACK候補',status:'⚪ 未接続',cls:'idle',meta:'自動代理経路はまだ未接続'},
  {icon:'🧩',name:'Claude',role:'TECH REVIEWER候補',status:'⚪ 未接続',cls:'idle',meta:'将来接続予定'}
 ];
}
function renderAttendance(){document.querySelector('#attendance').innerHTML=attendanceData().map(m=>`<div class="member"><div class="memberTop"><div class="memberIcon">${m.icon}</div><div><div class="memberName">${esc(m.name)}</div><div class="memberRole">${esc(m.role)}</div></div></div><div class="memberStatus ${m.cls}">${esc(m.status)}</div><div class="memberMeta">${esc(m.meta)}</div></div>`).join('')}
function render(){
 const jobs=[...new Set(rows.map(x=>x.job_id))]; if(!selectedJob||!jobs.includes(selectedJob))selectedJob=jobs.at(-1);
 renderAttendance();
 document.querySelector('#jobs').innerHTML=jobs.map(j=>{const x=rows.filter(r=>r.job_id===j);const last=x.at(-1)||{};return `<div class="job ${j===selectedJob?'active':''}" data-job="${esc(j)}"><div class="state">${esc(last.state||'—')}</div><b>${esc(j.startsWith('discussion-')?'編集会議 '+j.slice(11,19):j.slice(0,18))}</b><div class="empty">${x.length} events · ${esc(persona(last).name)}</div></div>`}).join('')||'<div class="empty">イベントはまだありません。</div>';
 document.querySelectorAll('.job').forEach(el=>el.onclick=()=>{selectedJob=el.dataset.job;render()});
 const ev=rows.filter(x=>x.job_id===selectedJob);const last=ev.at(-1)||{};const lp=persona(last);document.querySelector('#state').textContent=last.state||'—';document.querySelector('#role').textContent='担当: '+lp.name+' / '+lp.role;document.querySelector('#jobmeta').textContent=selectedJob?`${selectedJob.startsWith('discussion-')?'AI編集会議':'job'} · ${ev.length} events`:'実際のOrchestratorイベントだけを表示します。';
 document.querySelector('#events').innerHTML=ev.map(x=>{const p=persona(x);const important=['high','blocker'].includes(x.severity);const hasEvidence=(x.evidence||[]).length>0;const d=x.discussion||null;const discuss=d?`<div class="discussion"><span class="pill">Round ${esc(d.round)}</span><span class="pill">Turn ${esc(d.turn)}</span><span class="pill ${esc(d.stance)}">${esc(d.stance)}</span><span class="pill">confidence ${Math.round(Number(d.confidence||0)*100)}%</span></div>`:'';const degraded=x.availability&&x.availability.provider_diversity==='degraded';return `<div class="event ${x.type==='heartbeat'?'heartbeat':''}"><div class="avatar" title="${esc(p.name+' / '+p.role)}">${p.icon}</div><div class="bubble ${important?'sev-high':''}"><div class="meta"><span class="speaker">${esc(p.name)}</span><span class="roleTag">${esc(p.role)}</span> · ${new Date(x.created_at).toLocaleString('ja-JP')}</div>${discuss}<div>${esc(x.summary)}</div>${degraded?'<span class="fallbackBadge">🔄 代理対応中 · provider diversity degraded</span>':''}${hasEvidence?`<div class="meta" style="margin-top:8px">根拠: ${x.evidence.map(e=>esc(e.ref)).join(' / ')}</div>`:''}${important&&!hasEvidence?'<span class="unverified">UNVERIFIED · 根拠未登録</span>':''}</div></div>`}).join('')||'<div class="empty">この案件のイベントはまだありません。</div>';
 const gateCard=document.querySelector('#gateCard');gateCard.classList.remove('alert');if(last.state==='HUMAN_GATE'){document.querySelector('#gate').textContent='あなたの確認を待っています。'}else if(last.state==='ESCALATED'){document.querySelector('#gate').textContent='重要な未解決事項があります。人間の判断が必要です。';gateCard.classList.add('alert')}else{document.querySelector('#gate').textContent='現在、確認待ちはありません。'}
}
async function refresh(){try{const url=FEED+'?t='+Date.now();const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error('feed');const d=await r.json();rows=Array.isArray(d.events)?d.events:[];setConn(true,'live event feed');render()}catch(e){setConn(false,'feed unavailable');document.querySelector('#events').innerHTML='<div class="event"><div class="avatar">⚙️</div><div class="bubble"><div class="meta"><span class="speaker">SYSTEM</span></div><div>イベントfeedへ接続できません。自動再接続します。</div></div></div>'}}
refresh();setInterval(refresh,10000);
</script></body></html>
