<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive">
<title>AI編集部</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#eef3f8}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{overflow:hidden}header{height:58px;background:#172033;color:#fff;display:flex;align-items:center;padding:0 20px;gap:14px;position:relative;z-index:5}header b{font-size:18px}.live{font-size:12px;background:#2d8a5b;padding:5px 9px;border-radius:999px}.live.off{background:#7b879b}.version{margin-left:auto;font-size:12px;opacity:.8}.layout{display:grid;grid-template-columns:250px minmax(520px,1fr) 300px;height:calc(100vh - 58px);min-height:0;overflow:hidden}aside{height:100%;min-height:0;overflow:hidden;background:#fff}.queue{border-right:1px solid #dce3ee;padding:14px}.queue h2,.side h2{font-size:12px;color:#697386;margin:10px 0}.job{border:1px solid #dce3ee;border-radius:14px;padding:12px;margin:9px 0;background:#f9fbff;cursor:pointer;transition:.15s}.job:hover{border-color:#9eadef}.job.active{border-color:#5d78ff;background:#eef2ff}.job .state{font-size:10px;font-weight:800;color:#5d78ff;margin-bottom:4px}.job .title{font-size:13px;font-weight:800;line-height:1.35}.job .meta{font-size:11px;color:#697386;margin-top:5px}.chat{min-width:0;min-height:0;height:100%;display:flex;flex-direction:column;background:#dfe8f3;overflow:hidden}.roomHead{height:70px;flex:0 0 70px;background:rgba(255,255,255,.94);border-bottom:1px solid #d4dde9;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2}.roomHead h1{font-size:17px;margin:0}.roomSub{font-size:11px;color:#697386;margin-top:3px}.roomBadge{font-size:11px;background:#eef2ff;color:#4157a8;padding:5px 8px;border-radius:999px}.messages{flex:1;min-height:0;overflow-y:scroll;overflow-x:hidden;padding:22px 20px 26px;scroll-behavior:smooth;scrollbar-gutter:stable;overscroll-behavior:contain}.messages::-webkit-scrollbar{width:12px}.messages::-webkit-scrollbar-track{background:#cbd6e4}.messages::-webkit-scrollbar-thumb{background:#7d8ca1;border:3px solid #cbd6e4;border-radius:999px}.messages::-webkit-scrollbar-thumb:hover{background:#64758c}.messages{scrollbar-width:auto;scrollbar-color:#7d8ca1 #cbd6e4}.dayline{text-align:center;margin:6px 0 18px}.dayline span{font-size:11px;color:#738095;background:rgba(255,255,255,.72);padding:4px 9px;border-radius:999px}.msg{display:flex;align-items:flex-end;gap:9px;margin:12px 0}.msg.mine{justify-content:flex-end}.msg.system{justify-content:center}.avatar{width:38px;height:38px;flex:0 0 38px;border-radius:12px;background:#f3f6fb;display:grid;place-items:center;font-size:20px;border:1px solid #d7e0eb}.msg.mine .avatar{order:2}.pack{max-width:min(72%,680px)}.name{font-size:11px;color:#526176;margin:0 0 4px 4px}.msg.mine .name{text-align:right;margin:0 4px 4px 0}.bubble{background:#fff;padding:10px 13px;border-radius:17px 17px 17px 5px;box-shadow:0 1px 2px rgba(24,32,51,.08);line-height:1.62;font-size:14px;white-space:pre-wrap;word-break:break-word}.msg.mine .bubble{background:#9fe66e;border-radius:17px 17px 5px 17px}.msg.reviewer .bubble{background:#fff3c9}.msg.system .bubble{background:rgba(255,255,255,.75);font-size:12px;color:#5c677a;border-radius:999px;box-shadow:none}.time{font-size:10px;color:#7b879b;margin:4px 4px 0}.msg.mine .time{text-align:right}.detail{margin-top:7px}.detail summary{cursor:pointer;font-size:10px;color:#6b7890;list-style:none}.detail summary::-webkit-details-marker{display:none}.detail summary:before{content:'▸ '}.detail[open] summary:before{content:'▾ '}.audit{margin-top:6px;padding:8px 9px;border-radius:9px;background:rgba(240,244,248,.9);font-size:10px;color:#657186;line-height:1.5}.side{border-left:1px solid #dce3ee;padding:14px}.card{border:1px solid #dce3ee;border-radius:14px;padding:12px;margin:8px 0;background:#fff}.big{font-size:16px;font-weight:800}.small{font-size:11px;color:#697386;margin-top:4px}.gate{background:#fff8dc;border-color:#ead17a}.gate.alert{background:#fff0f0;border-color:#d88}.attendance{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.member{min-width:0;padding:8px;border:1px solid #e0e6ef;border-radius:11px}.memberTop{display:flex;align-items:center;gap:5px}.memberIcon{font-size:17px;flex:0 0 auto}.memberName{font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.memberRole{font-size:9px;color:#7a8698;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.memberStatus{font-size:9px;font-weight:800;margin-top:3px}.ok{color:#25744a}.bad{color:#a13b3b}.idle{color:#697386}.empty{color:#697386;font-size:12px}.latestDot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#2d8a5b;margin-right:5px}.artifactList{display:grid;gap:7px}.artifactLink{display:block;text-decoration:none;border:1px solid #dce3ee;border-radius:10px;padding:9px 10px;background:#f9fbff;color:#304a9a;font-size:11px;font-weight:800}.artifactLink:hover{background:#eef2ff}.artifactHint{font-size:10px;color:#697386;margin-top:3px;font-weight:400}@media(max-width:1050px){.layout{grid-template-columns:220px minmax(480px,1fr)}.side{display:none}}@media(max-width:760px){header{padding:0 12px}.layout{grid-template-columns:1fr}.queue,.side{display:none}.pack{max-width:84%}.messages{padding:16px 12px}.roomHead{padding:10px 12px}}
</style>
</head><body>
<header><b>⚡ AI編集部</b><span id="conn" class="live off">● 接続中…</span><span class="version">chat v0.3.2</span></header>
<div class="layout">
<aside class="queue"><h2>案件キュー</h2><div id="jobs"><div class="empty">読み込み中…</div></div></aside>
<main class="chat"><div class="roomHead"><div><h1 id="topic">AI編集会議</h1><div class="roomSub" id="jobmeta">最新の会議を表示します</div></div><div class="roomBadge" id="roomState">—</div></div><div id="events" class="messages"><div class="empty">会話を読み込み中…</div></div></main>
<aside class="side">
<h2>現在の状態</h2><div class="card"><div class="big" id="state">—</div><div id="role" class="small">担当：—</div></div>
<h2>管理者確認</h2><div id="gateCard" class="card gate"><div id="gate">現在、管理者確認はありません。</div></div>
<h2>🏢 出勤状況</h2><div id="attendance" class="attendance"></div>
<h2>完成したもの</h2><div id="artifacts" class="artifactList"><div class="card empty">確認できるものはまだありません。</div></div>
</aside></div>
<script>
const FEED='https://raw.githubusercontent.com/Syasu-pixel/my-site/ai-dashboard-events/dashboard-data/events.json';
const personas={'openai-editor':{icon:'🧠',name:'GPT',role:'編集担当'},'editor-controller':{icon:'⚙️',name:'編集長',role:'編集担当'},'google-gemini':{icon:'🔍',name:'Gemini',role:'反対・検証担当'},'challenger-controller':{icon:'🔄',name:'検証代理',role:'代理担当'},'orchestrator-reviewer':{icon:'⚖️',name:'最終確認Controller',role:'最終確認担当'},'orchestrator':{icon:'🧭',name:'進行管理',role:'システム'},'github-actions':{icon:'⚙️',name:'自動処理',role:'システム'}};
const roleFallback={editor:{icon:'⚙️',name:'編集担当',role:'編集担当'},builder:{icon:'🛠️',name:'制作担当',role:'制作担当'},challenger:{icon:'🔍',name:'検証担当',role:'反対・検証担当'},reviewer:{icon:'⚖️',name:'最終確認担当',role:'最終確認担当'},system:{icon:'⚙️',name:'システム',role:'システム'},human:{icon:'👤',name:'管理者',role:'管理者'}};
const stanceJP={propose:'提案',oppose:'反対',revise:'修正',withdraw:'反対取り下げ',support:'賛成',question:'質問',adjudicate:'最終判断'};
const stateJP={FAILED:'失敗',ESCALATED:'管理者確認待ち',REVIEWING:'最終確認中',CHALLENGING:'検証中',HUMAN_GATE:'管理者確認待ち',DONE:'完了',ADOPTED:'採用'};
let rows=[],selectedJob=null,manualSelection=false,previousNewest=null,firstRender=true;
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function persona(x){return personas[x.provider]||roleFallback[x.role]||{icon:'🤖',name:x.provider||'AI',role:'AI担当'}}
function setConn(ok,label){const e=document.querySelector('#conn');e.classList.toggle('off',!ok);e.textContent='● '+label}
function latestProvider(provider){return [...rows].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).find(x=>x.provider===provider)}
function fmtAgo(d){if(!d)return '応答記録なし';const ms=Math.max(0,Date.now()-new Date(d).getTime());if(ms<60000)return 'たった今';if(ms<3600000)return Math.floor(ms/60000)+'分前';if(ms<86400000)return Math.floor(ms/3600000)+'時間前';return Math.floor(ms/86400000)+'日前'}
function attendanceData(){const gem=latestProvider('google-gemini'),fb=latestProvider('challenger-controller'),ed=latestProvider('editor-controller'),rv=latestProvider('orchestrator-reviewer');const gemDown=fb&&(!gem||new Date(fb.created_at)>new Date(gem.created_at));return[{icon:'🔍',name:'Gemini',role:'反対・検証担当',status:gemDown?'🔴 離席中':gem?'🟢 出勤中':'⚪ 未確認',cls:gemDown?'bad':gem?'ok':'idle'},{icon:'⚙️',name:'編集長',role:'編集担当',status:ed?'🟢 稼働中':'⚪ 待機',cls:ed?'ok':'idle'},{icon:'⚖️',name:'最終確認',role:'最終確認担当',status:rv?'🟢 稼働中':'⚪ 待機',cls:rv?'ok':'idle'},{icon:'🧠',name:'GPT API',role:'代理候補',status:'⚪ 未接続',cls:'idle'},{icon:'🧩',name:'Claude',role:'技術確認候補',status:'⚪ 未接続',cls:'idle'}]}
function renderAttendance(){document.querySelector('#attendance').innerHTML=attendanceData().map(m=>`<div class="member"><div class="memberTop"><div class="memberIcon">${m.icon}</div><div class="memberName">${esc(m.name)}</div></div><div class="memberRole">${esc(m.role)}</div><div class="memberStatus ${m.cls}">${esc(m.status)}</div></div>`).join('')}
function groupedJobs(){const map=new Map();for(const r of rows){if(!map.has(r.job_id))map.set(r.job_id,[]);map.get(r.job_id).push(r)}return [...map.entries()].map(([id,ev])=>{ev.sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));return{id,ev,last:ev.at(-1),first:ev[0]}}).sort((a,b)=>new Date(b.last.created_at)-new Date(a.last.created_at))}
function queueTitle(g){const text=(g.first?.summary||'').replace(/^提案[:：]\s*/,'').replace(/目的と変更概要:[\s\S]*$/,'').trim();if(g.id.startsWith('discussion-'))return text&&text.length<55?text:'AI編集会議 '+g.id.slice(11,19);return g.id.slice(0,18)}
function cleanMessage(x){let s=String(x.summary||'');s=s.replace(/^提案[:：]\s*/,'').replace(/目的と変更概要[:：][\s\S]*$/,'').replace(/\bEDITOR\b/g,'編集担当').replace(/\bCHALLENGER\b/g,'反対・検証担当').replace(/\bREVIEWER\b/g,'最終確認担当').replace(/\bBUILDER\b/g,'制作担当').replace(/\bHUMAN GATE\b/gi,'管理者確認待ち').replace(/\bproduction\b/gi,'本番').replace(/\bprovider diversity degraded\b/gi,'独立性が低下しています');return s.trim()||x.summary||''}
function jpState(s){return stateJP[s]||s||'—'}
function collectUrls(value,out=new Set(),depth=0){if(depth>4||value==null)return out;if(typeof value==='string'){const m=value.match(/https:\/\/[^\s"'<>]+/g)||[];m.forEach(u=>out.add(u.replace(/[),.;]+$/,'')));return out}if(Array.isArray(value)){value.forEach(v=>collectUrls(v,out,depth+1));return out}if(typeof value==='object')Object.entries(value).forEach(([k,v])=>{if(!['summary','message','prompt'].includes(k)||depth<2)collectUrls(v,out,depth+1)});return out}
function artifactLabel(url){try{const u=new URL(url),p=u.pathname.toLowerCase();if(u.hostname.includes('netlify'))return['🌐 確認用ページを開く','記事プレビュー'];if(u.hostname==='github.com'&&p.includes('/pull/'))return['🔧 変更内容を見る','GitHub'];if(/\.(webp|png|jpe?g)$/.test(p))return['🖼️ 画像を確認','画像'];if(u.hostname.includes('denkicontrol.com'))return['🌐 公開ページを見る','公開ページ'];return['🔗 確認先を開く',u.hostname]}catch{return['🔗 確認先を開く','リンク']}}
function renderArtifacts(ev){const urls=[...collectUrls(ev)].filter(u=>{try{return new URL(u).protocol==='https:'}catch{return false}}).slice(0,6);document.querySelector('#artifacts').innerHTML=urls.length?urls.map(u=>{const [label,hint]=artifactLabel(u);return `<a class="artifactLink" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${label}<div class="artifactHint">${esc(hint)}</div></a>`}).join(''):'<div class="card empty">確認できるものはまだありません。</div>'}
function render(){const groups=groupedJobs();const newest=groups[0]?.id||null;if(!selectedJob||!groups.some(g=>g.id===selectedJob)){selectedJob=newest;manualSelection=false}else if(!manualSelection&&newest&&previousNewest&&newest!==previousNewest){selectedJob=newest}previousNewest=newest;renderAttendance();document.querySelector('#jobs').innerHTML=groups.map((g,i)=>`<div class="job ${g.id===selectedJob?'active':''}" data-job="${esc(g.id)}"><div class="state">${i===0?'<span class="latestDot"></span>最新 · ':''}${esc(jpState(g.last.state))}</div><div class="title">${esc(queueTitle(g))}</div><div class="meta">${g.ev.length}発言 · ${new Date(g.last.created_at).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</div></div>`).join('')||'<div class="empty">イベントはまだありません。</div>';document.querySelectorAll('.job').forEach(el=>el.onclick=()=>{selectedJob=el.dataset.job;manualSelection=true;render()});const g=groups.find(x=>x.id===selectedJob),ev=g?.ev||[],last=g?.last||{},lp=persona(last);document.querySelector('#topic').textContent=g?queueTitle(g):'AI編集会議';document.querySelector('#jobmeta').textContent=g?`${ev.length}発言 · ${new Date(last.created_at).toLocaleString('ja-JP')}`:'最新の会議を表示します';document.querySelector('#roomState').textContent=jpState(last.state);document.querySelector('#state').textContent=jpState(last.state);document.querySelector('#role').textContent='担当：'+lp.name+' / '+lp.role;renderArtifacts(ev);const html=ev.map((x,i)=>{const p=persona(x),d=x.discussion||{},isEditor=x.role==='editor',isSystem=x.role==='system'||x.type==='heartbeat',cls=isSystem?'system':isEditor?'mine':x.role==='reviewer'?'reviewer':'';const degraded=x.availability&&x.availability.provider_diversity==='degraded';const t=new Date(x.created_at);const audit=[d.round?`ラウンド ${d.round}`:'',d.turn?`発言 ${d.turn}`:'',d.stance?`判断：${stanceJP[d.stance]||d.stance}`:'',d.confidence!=null?`確信度 ${Math.round(Number(d.confidence)*100)}%`:'',degraded?'代理対応中（独立性低下）':''].filter(Boolean).join(' / ');const evidence=(x.evidence||[]).map(e=>e.ref).filter(Boolean).join('\n');return `${i===0?`<div class="dayline"><span>${t.toLocaleDateString('ja-JP')}</span></div>`:''}<div class="msg ${cls}">${!isSystem?`<div class="avatar">${p.icon}</div>`:''}<div class="pack"><div class="name">${esc(p.name)} · ${esc(p.role)}</div><div class="bubble">${esc(cleanMessage(x))}${audit||evidence?`<details class="detail"><summary>詳細</summary><div class="audit">${audit?esc(audit):''}${audit&&evidence?'<br>':''}${evidence?'根拠：'+esc(evidence):''}</div></details>`:''}</div><div class="time">${t.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}</div></div></div>`}).join('')||'<div class="empty">この案件の会話はまだありません。</div>';const box=document.querySelector('#events');const nearBottom=box.scrollHeight-box.scrollTop-box.clientHeight<120;box.innerHTML=html;if(firstRender||nearBottom||!manualSelection){requestAnimationFrame(()=>{box.scrollTop=box.scrollHeight;firstRender=false})}const gateCard=document.querySelector('#gateCard');gateCard.classList.remove('alert');if(last.state==='HUMAN_GATE'){document.querySelector('#gate').textContent='管理者の確認を待っています。';gateCard.classList.add('alert')}else if(last.state==='ESCALATED'){document.querySelector('#gate').textContent='重要な未解決事項があります。管理者の判断が必要です。';gateCard.classList.add('alert')}else{document.querySelector('#gate').textContent='現在、管理者確認はありません。'}}
async function refresh(){try{const r=await fetch(FEED+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('feed');const d=await r.json();rows=Array.isArray(d.events)?d.events:[];setConn(true,'ライブ接続中');render()}catch(e){setConn(false,'接続できません');document.querySelector('#events').innerHTML='<div class="msg system"><div class="pack"><div class="bubble">イベントfeedへ接続できません。自動で再接続します。</div></div></div>'}}
refresh();setInterval(refresh,10000);
</script></body></html>
