<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>AI編集部</title>
</head>
<body>
<script>
(async()=>{
  try{
    const r=await fetch('./index-shell-v067.html?v=0.6.8',{cache:'no-store'});
    if(!r.ok)throw new Error('dashboard shell HTTP '+r.status);
    let html=await r.text();
    html=html
      .replaceAll('chat v0.6.6','chat v0.6.8')
      .replaceAll('command-center.js?v=0.6.6','command-center.js?v=0.6.8')
      .replaceAll('queue-organizer.js?v=0.6.6','queue-organizer.js?v=0.6.8');
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.body.innerHTML='<main style="font-family:system-ui;padding:24px"><h1>AI編集部</h1><p>画面の読み込みに失敗しました。再読み込みしてください。</p></main>';
    console.error('[AI編集部] shell load failed',err);
  }
})();
</script>
</body>
</html>
