<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>GX Works2 二重送信防止テスト</title>
  <style>
    body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;background:#f5f8fc;color:#0f172a}
    main{max-width:760px;margin:40px auto;padding:24px}
    .card{background:#fff;border:1px solid #dbe4ef;border-radius:16px;padding:24px;box-shadow:0 8px 30px rgba(15,23,42,.06)}
    h1{font-size:24px;margin-top:0}.muted{color:#64748b;line-height:1.7}.row{margin:16px 0;padding:14px;background:#f8fafc;border-radius:10px;word-break:break-all}
    label{display:block;font-weight:700;margin:18px 0 8px}input{width:100%;box-sizing:border-box;min-height:48px;padding:10px 12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;font-size:16px}
    button{min-height:48px;border:0;border-radius:10px;padding:0 18px;background:#2563eb;color:#fff;font-weight:700;font-size:16px;cursor:pointer}
    button:disabled{opacity:.55;cursor:not-allowed}.ok{color:#047857;font-weight:700}.ng{color:#b91c1c;font-weight:700}.warn{color:#92400e;font-weight:700}
    code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  </style>
</head>
<body>
<main>
  <div class="card">
    <h1>二重送信防止テスト</h1>
    <p class="muted">このページ単体で、同じ内容・同じ <code>idempotencyKey</code> を2回連続送信します。1回目と2回目で同じ相談番号が返れば二重受付防止は成功です。ZIP本体は送信しません。</p>

    <label for="email">テストメール受信先</label>
    <input id="email" type="email" autocomplete="email" placeholder="受付メールを確認できるメールアドレス">
    <p class="muted">1回目の受付で管理者通知とお客様確認メールが送信されます。2回目は同じ受付を再利用するため、新しい相談番号は発行されない想定です。</p>

    <button id="run">二重送信防止テストを実行</button>
    <div class="row" id="result">まだテストしていません。</div>
  </div>
</main>
<script>
(()=>{
  const API='https://gxworks2-support-api.syasuta0819.workers.dev';
  const email=document.getElementById('email');
  const run=document.getElementById('run');
  const result=document.getElementById('result');

  function makeKey(){
    if(crypto.randomUUID)return `gxw_test_${crypto.randomUUID()}`;
    const bytes=new Uint8Array(24);crypto.getRandomValues(bytes);
    return `gxw_test_${Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('')}`;
  }

  async function post(path,body){
    const res=await fetch(`${API}${path}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const data=await res.json().catch(()=>({}));
    return {res,data};
  }

  run.addEventListener('click',async()=>{
    const address=email.value.trim();
    if(!address||!/^\S+@\S+\.\S+$/.test(address)){
      result.innerHTML='<span class="ng">有効なテスト用メールアドレスを入力してください。</span>';
      email.focus();return;
    }

    run.disabled=true;
    result.textContent='1回目を送信しています…';

    const idempotencyKey=makeKey();
    const payload={
      idempotencyKey,
      name:'二重送信防止テスト',
      email:address,
      company:'Preview test',
      plc:'FX3U',
      problem:'二重送信防止テスト用のダミー相談です。',
      desired:'同じ送信を2回実行しても相談番号が増えないことを確認します。',
      photo:'なし',
      gxdata:'なし',
      zipName:'',
      zipSize:0
    };

    try{
      const first=await post('/consultations',payload);
      if(!first.res.ok||!first.data.ok||!first.data.caseNumber)throw new Error(`1回目: ${first.data.error||`HTTP ${first.res.status}`}`);
      const firstCase=first.data.caseNumber;

      result.innerHTML=`1回目成功：<strong>${firstCase}</strong><br>同じキーで2回目を送信しています…`;

      const second=await post('/consultations',payload);
      if(!second.res.ok||!second.data.ok||!second.data.caseNumber)throw new Error(`2回目: ${second.data.error||`HTTP ${second.res.status}`}`);
      const secondCase=second.data.caseNumber;

      const status=await post('/consultations/status',{idempotencyKey});
      const completed=status.res.ok&&status.data.ok&&status.data.completed;
      const same=firstCase===secondCase;

      if(same&&completed){
        result.innerHTML=`<span class="ok">成功：二重送信防止が確認できました。</span><br><br>1回目：<strong>${firstCase}</strong><br>2回目：<strong>${secondCase}</strong><br>受付状態：<strong>${status.data.state}</strong><br>管理者メール：${status.data.adminMail} / お客様メール：${status.data.customerMail}<br><br><span class="ok">同じ idempotencyKey で再送しても新しい相談番号は発行されていません。</span>`;
      }else if(same){
        result.innerHTML=`<span class="warn">相談番号は同じですが、受付状態が未完了です。</span><br>1回目：${firstCase}<br>2回目：${secondCase}<br>状態：${status.data?.state||'確認できません'}`;
      }else{
        result.innerHTML=`<span class="ng">要確認：相談番号が変わりました。</span><br>1回目：${firstCase}<br>2回目：${secondCase}`;
      }
    }catch(err){
      result.innerHTML=`<span class="ng">テストに失敗しました：${err.message}</span>`;
    }finally{
      run.disabled=false;
    }
  });
})();
</script>
</body>
</html>
