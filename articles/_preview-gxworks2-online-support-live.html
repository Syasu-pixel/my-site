<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>GX Works2 オンライン相談 Live Preview</title>
  <style>
    html,body{margin:0;min-height:100%;background:#f5f8fc}
    #previewShell{display:block;width:100%;height:100vh;border:0;background:#fff}
  </style>
</head>
<body>
  <iframe id="previewShell" title="GX Works2 オンライン相談 Live Preview" src="./_preview-gxworks2-online-support.html"></iframe>
  <script>
    (()=>{
      const API='https://gxworks2-support-api.syasuta0819.workers.dev';
      const shell=document.getElementById('previewShell');
      let wired=false;

      function getServiceDocument(){
        try{
          const outer=shell.contentDocument;
          const inner=outer?.getElementById('previewFrame');
          return inner?.contentDocument || null;
        }catch{return null;}
      }

      function injectPlcSelector(d){
        const current=d.getElementById('plc');
        if(!current||current.tagName==='SELECT')return;

        const select=d.createElement('select');
        select.id='plc';
        select.name='plc';
        select.setAttribute('aria-label','PLC型式');
        select.innerHTML=`
          <option value="">PLC型式を選択してください</option>
          <optgroup label="FXシリーズ">
            <option>FX0</option><option>FX0S</option><option>FX0N</option><option>FX1</option><option>FX2</option><option>FX2C</option>
            <option>FX1S</option><option>FX1N</option><option>FX1NC</option><option>FX2N</option><option>FX2NC</option>
            <option>FX3S</option><option>FX3G</option><option>FX3GC</option><option>FX3U</option><option>FX3UC</option>
          </optgroup>
          <optgroup label="Lシリーズ">
            <option>L02SCPU</option><option>L02SCPU-P</option><option>L02CPU</option><option>L02CPU-P</option>
            <option>L06CPU</option><option>L06CPU-P</option><option>L26CPU-BT</option><option>L26CPU-PBT</option><option>L26CPU</option>
          </optgroup>
          <optgroup label="Qシリーズ｜ベーシックモデル">
            <option>Q00JCPU</option><option>Q00CPU</option><option>Q01CPU</option>
          </optgroup>
          <optgroup label="Qシリーズ｜ハイパフォーマンスモデル">
            <option>Q02CPU</option><option>Q02HCPU</option><option>Q06HCPU</option><option>Q12HCPU</option><option>Q25HCPU</option>
          </optgroup>
          <optgroup label="Qシリーズ｜ユニバーサルモデル">
            <option>Q00UJCPU</option><option>Q00UCPU</option><option>Q01UCPU</option><option>Q02UCPU</option>
            <option>Q03UDCPU</option><option>Q03UDECPU</option><option>Q04UDHCPU</option><option>Q04UDEHCPU</option>
            <option>Q06UDHCPU</option><option>Q06UDEHCPU</option><option>Q10UDHCPU</option><option>Q10UDEHCPU</option>
            <option>Q13UDHCPU</option><option>Q13UDEHCPU</option><option>Q20UDHCPU</option><option>Q20UDEHCPU</option>
            <option>Q26UDHCPU</option><option>Q26UDEHCPU</option><option>Q50UDEHCPU</option><option>Q100UDEHCPU</option>
            <option>Q03UDVCPU</option><option>Q04UDVCPU</option><option>Q06UDVCPU</option><option>Q13UDVCPU</option><option>Q26UDVCPU</option>
            <option>Q04UDPVCPU</option><option>Q06UDPVCPU</option><option>Q13UDPVCPU</option><option>Q26UDPVCPU</option>
          </optgroup>
          <optgroup label="Qシリーズ｜プロセス・二重化">
            <option>Q02PHCPU</option><option>Q06PHCPU</option><option>Q12PHCPU</option><option>Q25PHCPU</option>
            <option>Q12PRHCPU</option><option>Q25PRHCPU</option>
          </optgroup>
          <optgroup label="その他">
            <option value="型式不明・確認中">型式不明・確認中</option>
            <option value="一覧にないGX Works2対応機種">一覧にないGX Works2対応機種</option>
          </optgroup>`;
        current.replaceWith(select);

        const field=select.closest('.form-field');
        const label=field?.querySelector('label[for="plc"]');
        if(label)label.innerHTML='PLC型式 <small>分かる範囲で</small>';
        if(field&&!field.querySelector('.plc-help')){
          const help=d.createElement('div');
          help.className='case-help plc-help';
          help.textContent='GX Works2で扱う主なMELSEC-Q / L / FXシリーズから選択できます。型式が分からない場合は「型式不明・確認中」を選んでください。';
          select.insertAdjacentElement('afterend',help);
        }

        if(!d.getElementById('plc-select-mobile-style')){
          const style=d.createElement('style');
          style.id='plc-select-mobile-style';
          style.textContent=`
            #plc{width:100%;min-height:46px;padding:10px 40px 10px 12px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;color:#0f172a;font:inherit;font-size:16px;line-height:1.35}
            #plc:focus{outline:2px solid #93c5fd;outline-offset:1px;border-color:#2563eb}
            .plc-help{margin-top:7px;line-height:1.55}
            @media(max-width:760px){
              #plc{min-height:50px;font-size:16px;padding-top:12px;padding-bottom:12px}
              #plc option,#plc optgroup{font-size:16px}
              .plc-help{font-size:12px}
            }
          `;
          d.head.appendChild(style);
        }
      }

      function wire(){
        if(wired)return;
        const d=getServiceDocument();
        if(!d)return;
        const oldButton=d.getElementById('preview-submit-demo');
        const zipInput=d.getElementById('zip-input');
        const complete=d.getElementById('preview-complete');
        const caseCode=d.getElementById('preview-case-code');
        const caseInput=d.getElementById('case-number');
        const status=d.getElementById('send-status');
        const localOnly=d.querySelector('.local-only');
        const notice=d.querySelector('#consultation .preview-notice');
        if(!oldButton||!zipInput||!complete||!caseCode||!caseInput||!status)return;

        injectPlcSelector(d);

        wired=true;
        const button=oldButton.cloneNode(true);
        button.textContent='相談内容を実送信する（ZIP本体は次段階）';
        oldButton.replaceWith(button);
        status.textContent='Live Preview：相談内容・ZIP情報をWorkerへ実送信します。ZIP本体はまだ送信しません。';
        if(localOnly)localOnly.textContent='Live Preview：ZIPのファイル名・容量だけ送信します。ZIP本体のアップロードはR2接続後に有効化します。';
        if(notice)notice.textContent='公開前Live Previewです。相談内容は実際に受付APIへ送信され、相談番号の発行と受付メール送信まで確認できます。ZIP本体とパスワードはまだ保存しません。';

        const fields={
          name:d.getElementById('name'),email:d.getElementById('email'),company:d.getElementById('company'),plc:d.getElementById('plc'),problem:d.getElementById('problem'),desired:d.getElementById('desired'),photo:d.getElementById('photo'),gxdata:d.getElementById('gxdata')
        };

        button.addEventListener('click',async()=>{
          const file=zipInput.files?.[0];
          const required=[['お名前',fields.name],['返信用メールアドレス',fields.email],['現在困っていること',fields.problem],['どのように変更したいか',fields.desired]];
          for(const [label,el] of required){
            if(!el?.value?.trim()){
              status.textContent=`${label}を入力してください。`;
              el?.focus();return;
            }
          }
          if(!file){
            status.textContent='パスワード付きZIPファイルを選択してください。';
            d.getElementById('zip-drop')?.scrollIntoView({behavior:'smooth',block:'center'});return;
          }
          if(!file.name.toLowerCase().endsWith('.zip')){
            status.textContent='ZIPファイルを選択してください。';return;
          }

          button.disabled=true;
          status.textContent='相談内容を送信中…';
          complete.classList.remove('is-visible');
          try{
            const res=await fetch(`${API}/consultations`,{
              method:'POST',
              headers:{'Content-Type':'application/json'},
              body:JSON.stringify({
                name:fields.name.value,
                email:fields.email.value,
                company:fields.company?.value||'',
                plc:fields.plc?.value||'',
                problem:fields.problem.value,
                desired:fields.desired.value,
                photo:fields.photo?.value||'',
                gxdata:fields.gxdata?.value||'',
                zipName:file.name,
                zipSize:file.size
              })
            });
            const data=await res.json().catch(()=>({}));
            if(!res.ok||!data.ok)throw new Error(data.error||`HTTP ${res.status}`);
            caseCode.textContent=data.caseNumber;
            caseInput.value=data.caseNumber;
            const p=complete.querySelector('p');
            if(p)p.innerHTML='相談内容の受付・相談番号発行・受付メール送信まで<strong>実際に完了しました</strong>。ZIP本体のアップロードは次の実装段階で接続します。';
            complete.classList.add('is-visible');
            status.textContent='送信成功。受付メールと相談番号を確認してください。';
            complete.scrollIntoView({behavior:'smooth',block:'center'});
          }catch(err){
            console.error(err);
            status.textContent=`送信に失敗しました：${err.message}`;
          }finally{
            button.disabled=false;
          }
        });
      }

      shell.addEventListener('load',()=>{
        let tries=0;
        const timer=setInterval(()=>{
          tries++;
          wire();
          if(wired||tries>80)clearInterval(timer);
        },250);
      });
    })();
  </script>
</body>
</html>
