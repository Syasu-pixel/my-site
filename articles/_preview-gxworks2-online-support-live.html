<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>GX Works2 オンライン相談 Live Preview</title>
  <style>
    html,body{margin:0;min-height:100%;background:#f5f8fc}
    #previewShell{display:block;width:100%;height:100vh;border:0;background:#fff}
  </style>
</head>
<body>
  <iframe id="previewShell" title="GX Works2 オンライン相談 Live Preview" src="./_preview-gxworks2-online-support.html"></iframe>
  <script>
    (()=>{
      const API='https://gxworks2-support-api.syasuta0819.workers.dev';
      const STORAGE_KEY='gxw-preview-idempotency-key';
      const STORAGE_PAYLOAD='gxw-preview-idempotency-payload';
      const shell=document.getElementById('previewShell');
      let wired=false;

      function getServiceDocument(){
        try{
          const outer=shell.contentDocument;
          const inner=outer?.getElementById('previewFrame');
          return inner?.contentDocument||null;
        }catch{return null;}
      }

      function sleep(ms){return new Promise(resolve=>setTimeout(resolve,ms));}

      function createIdempotencyKey(){
        if(crypto.randomUUID)return `gxw_${crypto.randomUUID()}`;
        const bytes=new Uint8Array(24);
        crypto.getRandomValues(bytes);
        return `gxw_${Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('')}`;
      }

      function getOrCreateSubmission(payload){
        const serialized=JSON.stringify(payload);
        const savedKey=sessionStorage.getItem(STORAGE_KEY)||'';
        const savedPayload=sessionStorage.getItem(STORAGE_PAYLOAD)||'';
        if(savedKey&&savedPayload===serialized)return {key:savedKey,serialized};
        const key=createIdempotencyKey();
        sessionStorage.setItem(STORAGE_KEY,key);
        sessionStorage.setItem(STORAGE_PAYLOAD,serialized);
        return {key,serialized};
      }

      function clearPendingSubmission(){
        sessionStorage.removeItem(STORAGE_KEY);
        sessionStorage.removeItem(STORAGE_PAYLOAD);
      }

      async function postJson(path,body){
        const res=await fetch(`${API}${path}`,{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify(body)
        });
        const data=await res.json().catch(()=>({}));
        return {res,data};
      }

      async function putZip(file,idempotencyKey){
        const res=await fetch(`${API}/consultations/zip`,{
          method:'PUT',
          headers:{
            'Content-Type':'application/zip',
            'X-GXW-Idempotency-Key':idempotencyKey,
            'X-GXW-File-Size':String(file.size)
          },
          body:file
        });
        const data=await res.json().catch(()=>({}));
        if(res.status===413&&!data.error)data.error='ZIPファイルがCloudflareの受信上限を超えています。';
        return {res,data};
      }

      async function getReceiptStatus(idempotencyKey){
        try{
          const {res,data}=await postJson('/consultations/status',{idempotencyKey});
          if(res.status===404)return {found:false};
          if(!res.ok||!data.ok)return {found:false,error:data.error||`HTTP ${res.status}`};
          return data;
        }catch(err){
          return {found:false,error:err.message};
        }
      }

      async function waitForCompletion(idempotencyKey,attempts=5){
        for(let i=0;i<attempts;i++){
          const state=await getReceiptStatus(idempotencyKey);
          if(state.found&&state.completed)return state;
          if(i<attempts-1)await sleep(900*(i+1));
        }
        return getReceiptStatus(idempotencyKey);
      }

      async function resumeAfterZip(payload,idempotencyKey){
        const retry=await postJson('/consultations',{...payload,idempotencyKey});
        if(retry.res.ok&&retry.data.ok&&retry.data.completed)return {ok:true,data:retry.data,recovered:true};
        if(retry.res.ok&&retry.data.ok&&retry.data.processing){
          const state=await waitForCompletion(idempotencyKey,5);
          if(state.found&&state.completed)return {ok:true,data:state,recovered:true};
          return {ok:false,processing:true,data:state.found?state:retry.data};
        }
        if(retry.res.ok&&retry.data.ok&&retry.data.uploadRequired){
          return {ok:false,needsUpload:true,data:retry.data};
        }
        const err=new Error(retry.data?.error||`HTTP ${retry.res.status}`);
        err.httpStatus=retry.res.status;
        throw err;
      }

      async function submitAll(payload,file,idempotencyKey,onStage){
        onStage('受付情報をD1へ保存しています…');
        let init=await postJson('/consultations',{...payload,idempotencyKey});
        if(!init.res.ok||!init.data.ok){
          const err=new Error(init.data?.error||`HTTP ${init.res.status}`);
          err.httpStatus=init.res.status;
          throw err;
        }
        if(init.data.completed)return {ok:true,data:init.data,recovered:true};

        if(init.data.processing){
          const state=await waitForCompletion(idempotencyKey,4);
          if(state.found&&state.completed)return {ok:true,data:state,recovered:true};
        }

        const beforeUpload=await getReceiptStatus(idempotencyKey);
        if(beforeUpload.found&&beforeUpload.zipUploaded){
          onStage('ZIPは保存済みです。メール処理を再開しています…');
          return resumeAfterZip(payload,idempotencyKey);
        }

        onStage('ZIPを非公開R2へアップロードしています…');
        let upload;
        try{
          upload=await putZip(file,idempotencyKey);
        }catch(err){
          const state=await getReceiptStatus(idempotencyKey);
          if(state.found&&state.zipUploaded){
            onStage('ZIP保存済みを確認しました。メール処理を再開しています…');
            return resumeAfterZip(payload,idempotencyKey);
          }
          throw err;
        }

        if(upload.res.ok&&upload.data.ok&&upload.data.completed){
          return {ok:true,data:upload.data};
        }
        if(upload.res.ok&&upload.data.ok&&upload.data.processing){
          onStage('ZIP保存完了。受付メールの完了を確認しています…');
          const state=await waitForCompletion(idempotencyKey,5);
          if(state.found&&state.completed)return {ok:true,data:state,recovered:true};
          return resumeAfterZip(payload,idempotencyKey);
        }

        if(!upload.res.ok||!upload.data.ok){
          if(upload.data?.recoverable||upload.data?.zipUploaded){
            const state=await getReceiptStatus(idempotencyKey);
            if(state.found&&state.zipUploaded){
              onStage('ZIP保存済みを確認しました。メール処理を再開しています…');
              return resumeAfterZip(payload,idempotencyKey);
            }
          }
          const err=new Error(upload.data?.error||`HTTP ${upload.res.status}`);
          err.httpStatus=upload.res.status;
          throw err;
        }

        onStage('ZIP保存完了。受付メールを確認しています…');
        return resumeAfterZip(payload,idempotencyKey);
      }

      function injectPlcSelector(d){
        const current=d.getElementById('plc');
        if(!current||current.tagName==='SELECT')return;
        const select=d.createElement('select');
        select.id='plc';
        select.name='plc';
        select.setAttribute('aria-label','PLC型式');
        select.innerHTML=`
          <option value="">PLC型式を選択してください</option>
          <optgroup label="FXシリーズ">
            <option>FX0</option><option>FX0S</option><option>FX0N</option><option>FX1</option><option>FX2</option><option>FX2C</option>
            <option>FX1S</option><option>FX1N</option><option>FX1NC</option><option>FX2N</option><option>FX2NC</option>
            <option>FX3S</option><option>FX3G</option><option>FX3GC</option><option>FX3U</option><option>FX3UC</option>
          </optgroup>
          <optgroup label="Lシリーズ">
            <option>L02SCPU</option><option>L02SCPU-P</option><option>L02CPU</option><option>L02CPU-P</option>
            <option>L06CPU</option><option>L06CPU-P</option><option>L26CPU-BT</option><option>L26CPU-PBT</option><option>L26CPU</option>
          </optgroup>
          <optgroup label="Qシリーズ｜ベーシックモデル">
            <option>Q00JCPU</option><option>Q00CPU</option><option>Q01CPU</option>
          </optgroup>
          <optgroup label="Qシリーズ｜ハイパフォーマンスモデル">
            <option>Q02CPU</option><option>Q02HCPU</option><option>Q06HCPU</option><option>Q12HCPU</option><option>Q25HCPU</option>
          </optgroup>
          <optgroup label="Qシリーズ｜ユニバーサルモデル">
            <option>Q00UJCPU</option><option>Q00UCPU</option><option>Q01UCPU</option><option>Q02UCPU</option>
            <option>Q03UDCPU</option><option>Q03UDECPU</option><option>Q04UDHCPU</option><option>Q04UDEHCPU</option>
            <option>Q06UDHCPU</option><option>Q06UDEHCPU</option><option>Q10UDHCPU</option><option>Q10UDEHCPU</option>
            <option>Q13UDHCPU</option><option>Q13UDEHCPU</option><option>Q20UDHCPU</option><option>Q20UDEHCPU</option>
            <option>Q26UDHCPU</option><option>Q26UDEHCPU</option><option>Q50UDEHCPU</option><option>Q100UDEHCPU</option>
            <option>Q03UDVCPU</option><option>Q04UDVCPU</option><option>Q06UDVCPU</option><option>Q13UDVCPU</option><option>Q26UDVCPU</option>
            <option>Q04UDPVCPU</option><option>Q06UDPVCPU</option><option>Q13UDPVCPU</option><option>Q26UDPVCPU</option>
          </optgroup>
          <optgroup label="Qシリーズ｜プロセス・二重化">
            <option>Q02PHCPU</option><option>Q06PHCPU</option><option>Q12PHCPU</option><option>Q25PHCPU</option>
            <option>Q12PRHCPU</option><option>Q25PRHCPU</option>
          </optgroup>
          <optgroup label="その他">
            <option value="型式不明・確認中">型式不明・確認中</option>
            <option value="一覧にないGX Works2対応機種">一覧にないGX Works2対応機種</option>
          </optgroup>`;
        current.replaceWith(select);
        const field=select.closest('.form-field');
        const label=field?.querySelector('label[for="plc"]');
        if(label)label.innerHTML='PLC型式 <small>分かる範囲で</small>';
        if(field&&!field.querySelector('.plc-help')){
          const help=d.createElement('div');
          help.className='case-help plc-help';
          help.textContent='GX Works2で扱う主なMELSEC-Q / L / FXシリーズから選択できます。型式が分からない場合は「型式不明・確認中」を選んでください。';
          select.insertAdjacentElement('afterend',help);
        }
        if(!d.getElementById('plc-select-mobile-style')){
          const style=d.createElement('style');
          style.id='plc-select-mobile-style';
          style.textContent=`
            #plc{width:100%;min-height:46px;padding:10px 40px 10px 12px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;color:#0f172a;font:inherit;font-size:16px;line-height:1.35}
            #plc:focus{outline:2px solid #93c5fd;outline-offset:1px;border-color:#2563eb}
            .plc-help{margin-top:7px;line-height:1.55}
            @media(max-width:760px){#plc{min-height:50px;font-size:16px;padding-top:12px;padding-bottom:12px}#plc option,#plc optgroup{font-size:16px}.plc-help{font-size:12px}}
          `;
          d.head.appendChild(style);
        }
      }

      function injectPasswordPasteUx(d){
        const input=d.getElementById('zip-password');
        if(!input||input.dataset.pasteUx==='1')return;
        input.dataset.pasteUx='1';
        input.type='text';
        input.name='zip_secret';
        input.autocomplete='off';
        input.setAttribute('autocapitalize','none');
        input.setAttribute('autocorrect','off');
        input.setAttribute('spellcheck','false');
        input.classList.add('zip-password-masked');
        const wrap=input.parentElement;
        const eye=wrap?.querySelector('button');
        if(eye){
          eye.setAttribute('aria-label','パスワードの表示切替');
          eye.addEventListener('click',()=>input.classList.toggle('zip-password-masked'));
        }
        if(wrap&&!wrap.parentElement?.querySelector('.zip-paste-btn')){
          const btn=d.createElement('button');
          btn.type='button';
          btn.className='zip-paste-btn';
          btn.textContent='クリップボードから貼り付け';
          btn.addEventListener('click',async()=>{
            try{
              const text=await navigator.clipboard.readText();
              input.value=text.trim();
              input.dispatchEvent(new Event('input',{bubbles:true}));
              input.focus();
              btn.textContent='貼り付けました';
              setTimeout(()=>{btn.textContent='クリップボードから貼り付け';},1400);
            }catch{
              input.focus();
              btn.textContent='Ctrl+Vで貼り付け';
              setTimeout(()=>{btn.textContent='クリップボードから貼り付け';},1800);
            }
          });
          wrap.insertAdjacentElement('afterend',btn);
        }
        const field=input.closest('.form-field');
        if(field&&!field.querySelector('.zip-paste-help')){
          const help=d.createElement('div');
          help.className='case-help zip-paste-help';
          help.textContent='ZIP作成時に設定したパスワードをコピーして、上のボタンから貼り付けできます。';
          const btn=field.querySelector('.zip-paste-btn');
          if(btn)btn.insertAdjacentElement('afterend',help);
        }
        if(!d.getElementById('zip-password-paste-style')){
          const style=d.createElement('style');
          style.id='zip-password-paste-style';
          style.textContent=`
            #zip-password.zip-password-masked{-webkit-text-security:disc}
            .zip-paste-btn{margin-top:9px;min-height:44px;padding:10px 14px;border:1px solid #93c5fd;border-radius:10px;background:#eff6ff;color:#1d4ed8;font:inherit;font-weight:700;cursor:pointer}
            .zip-paste-btn:hover{background:#dbeafe}.zip-paste-help{margin-top:7px;line-height:1.55}
            @media(max-width:760px){.zip-paste-btn{width:100%;min-height:48px;font-size:16px}.zip-paste-help{font-size:12px}}
          `;
          d.head.appendChild(style);
        }
      }

      function wire(){
        if(wired)return;
        const d=getServiceDocument();
        if(!d)return;
        const oldButton=d.getElementById('preview-submit-demo');
        const zipInput=d.getElementById('zip-input');
        const complete=d.getElementById('preview-complete');
        const caseCode=d.getElementById('preview-case-code');
        const caseInput=d.getElementById('case-number');
        const status=d.getElementById('send-status');
        const localOnly=d.querySelector('.local-only');
        const notice=d.querySelector('#consultation .preview-notice');
        if(!oldButton||!zipInput||!complete||!caseCode||!caseInput||!status)return;

        injectPlcSelector(d);
        injectPasswordPasteUx(d);
        wired=true;

        const button=oldButton.cloneNode(true);
        button.textContent='相談内容とZIPを実送信する';
        oldButton.replaceWith(button);
        status.textContent='Live Preview：相談内容をD1へ保存し、ZIP本体を非公開R2へ実際にアップロードします。';
        if(localOnly)localOnly.textContent='Live Preview：選択したZIP本体は非公開R2バケットへ実際に保存されます。パスワードはまだ保存しません。';
        if(notice)notice.textContent='公開前Live Previewです。相談内容はD1、ZIP本体は非公開R2へ保存します。同じ送信の再試行では同じ相談番号を引き継ぎます。ZIPパスワードはSTEP 2で別送します。';

        const fields={
          name:d.getElementById('name'),
          email:d.getElementById('email'),
          company:d.getElementById('company'),
          plc:d.getElementById('plc'),
          problem:d.getElementById('problem'),
          desired:d.getElementById('desired'),
          photo:d.getElementById('photo'),
          gxdata:d.getElementById('gxdata')
        };
        let submitted=false;
        let liveSelectedFile=zipInput.files?.[0]||null;
        const zipDrop=d.getElementById('zip-drop');
        const zipRemove=d.getElementById('zip-remove');
        zipInput.addEventListener('change',()=>{liveSelectedFile=zipInput.files?.[0]||null;});
        zipDrop?.addEventListener('drop',e=>{liveSelectedFile=e.dataTransfer?.files?.[0]||null;},true);
        zipRemove?.addEventListener('click',()=>{liveSelectedFile=null;},true);
        const getSelectedZip=()=>zipInput.files?.[0]||liveSelectedFile;

        function showCompleted(data,message='受付が完了しました。'){
          submitted=true;
          caseCode.textContent=data.caseNumber;
          caseInput.value=data.caseNumber;
          const p=complete.querySelector('p');
          if(p)p.innerHTML='相談内容をD1へ保存し、ZIP本体を<strong>非公開R2へ保存</strong>、相談番号発行・受付メール送信まで実際に完了しました。同じ送信を再試行しても相談番号は増えません。';
          complete.classList.add('is-visible');
          button.textContent='送信済み';
          button.disabled=true;
          button.setAttribute('aria-disabled','true');
          status.textContent=`${message} 相談番号：${data.caseNumber}`;
          complete.scrollIntoView({behavior:'smooth',block:'center'});
        }

        function buildPayload(){
          const file=getSelectedZip()||null;
          return {
            name:fields.name.value,
            email:fields.email.value,
            company:fields.company?.value||'',
            plc:fields.plc?.value||'',
            problem:fields.problem.value,
            desired:fields.desired.value,
            photo:fields.photo?.value||'',
            gxdata:fields.gxdata?.value||'',
            zipName:file?.name||'',
            zipSize:file?.size||0
          };
        }

        button.addEventListener('click',async()=>{
          if(submitted)return;
          const file=getSelectedZip()||null;
          const required=[
            ['お名前',fields.name],
            ['返信用メールアドレス',fields.email],
            ['現在困っていること',fields.problem],
            ['どのように変更したいか',fields.desired]
          ];
          for(const [label,el] of required){
            if(!el?.value?.trim()){
              status.textContent=`${label}を入力してください。`;
              el?.focus();
              return;
            }
          }
          if(!file){
            status.textContent='パスワード付きZIPファイルを選択してください。';
            zipInput.focus();
            return;
          }
          if(!file.name.toLowerCase().endsWith('.zip')){
            status.textContent='ZIPファイルを指定してください。';
            return;
          }

          const payload=buildPayload();
          const {key:idempotencyKey}=getOrCreateSubmission(payload);
          button.disabled=true;
          complete.classList.remove('is-visible');

          try{
            const result=await submitAll(payload,file,idempotencyKey,text=>{status.textContent=text;});
            if(result.ok){
              showCompleted(
                result.data,
                result.recovered
                  ? '受付状態を復元し、D1・R2・メール送信の完了を確認しました。'
                  : '送信成功。D1保存・R2保存・メール送信を確認しました。'
              );
              return;
            }
            if(result.processing){
              status.textContent=`受付処理中です。相談番号 ${result.data.caseNumber||''} を保持したまま続行できます。`;
            }else if(result.needsUpload){
              status.textContent='受付情報は保存済みです。ZIPを選択したまま、もう一度送信してください。';
            }
            button.disabled=false;
          }catch(err){
            console.error(err);
            const state=await getReceiptStatus(idempotencyKey);
            if(state.found&&state.completed){
              showCompleted(state,'画面応答は途切れましたが、D1・R2・メール送信まで受付済みであることを確認しました。');
              return;
            }
            if(state.found&&state.zipUploaded){
              status.textContent=`ZIPは非公開R2へ保存済みです。相談番号 ${state.caseNumber} を保持したまま、もう一度押すとメール処理から再開します。`;
            }else if(state.found){
              status.textContent=`受付情報はD1へ保存済みです。ZIPをもう一度選択して送信すれば、相談番号 ${state.caseNumber} の続きから再開します。`;
            }else if(err.httpStatus===409){
              clearPendingSubmission();
              status.textContent='入力内容が前回送信時から変更されています。もう一度押すと新しい受付として送信します。';
            }else{
              status.textContent=`送信に失敗しました：${err.message}。同じ入力内容なら二重受付にならず、再試行できます。`;
            }
            button.disabled=false;
          }
        });

        (async()=>{
          const savedKey=sessionStorage.getItem(STORAGE_KEY)||'';
          const savedPayload=sessionStorage.getItem(STORAGE_PAYLOAD)||'';
          if(!savedKey||!savedPayload)return;

          status.textContent='前回の受付状態を確認しています…';
          const state=await getReceiptStatus(savedKey);

          if(state.found&&state.completed){
            showCompleted(state,'前回の受付済み状態を復元しました。');
            return;
          }

          if(state.found&&state.zipUploaded){
            try{
              const payload=JSON.parse(savedPayload);
              const resumed=await resumeAfterZip(payload,savedKey);
              if(resumed.ok){
                showCompleted(resumed.data,'ZIP保存済みの受付をメール処理から再開して完了しました。');
                return;
              }
            }catch(err){
              console.error('Receipt restore failed',err);
            }
            status.textContent=`ZIPは非公開R2へ保存済みです。相談番号 ${state.caseNumber} のメール処理を送信ボタンから再開できます。`;
            return;
          }

          if(state.found){
            status.textContent=`前回の受付情報はD1へ保存済みです。相談番号 ${state.caseNumber} のZIP送信を続けるには、ZIPをもう一度選択して送信ボタンを押してください。`;
            return;
          }

          status.textContent='Live Preview：相談内容をD1へ保存し、ZIP本体を非公開R2へ実際にアップロードします。';
        })();
      }

      shell.addEventListener('load',()=>{
        let tries=0;
        const timer=setInterval(()=>{
          tries++;
          wire();
          if(wired||tries>80)clearInterval(timer);
        },250);
      });
    })();
  </script>
</body>
</html>
