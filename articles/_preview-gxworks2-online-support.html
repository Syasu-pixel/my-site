<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>GX Works2 オンライン相談 Preview</title>
  <style>
    html,body{margin:0;min-height:100%;background:#f5f8fc}
    #previewFrame{display:block;width:100%;height:100vh;border:0;background:#fff}
  </style>
</head>
<body>
  <iframe id="previewFrame" title="GX Works2 オンライン相談 Preview" src="../services/gxworks2-online-support.html"></iframe>
  <script>
    (()=>{
      const frame=document.getElementById('previewFrame');
      frame.addEventListener('load',()=>{
        const d=frame.contentDocument;
        if(!d)return;

        const prep=d.getElementById('prepare');
        if(prep){
          const intro=prep.querySelector('p');
          if(intro)intro.innerHTML='ご相談時には、確認できる資料を<strong>1つのパスワード付きZIPファイル</strong>にまとめてください。ラダーPDFやCSVを別途作成していただく必要はありません。設備仕様書や取扱説明書など、すでにお持ちの資料があれば一緒に入れていただくと確認がスムーズです。';
          const list=prep.querySelector('.number-list');
          if(list&&!list.textContent.includes('設備仕様書・機械仕様書')){
            const extra1=d.createElement('li');
            extra1.innerHTML='<strong>設備仕様書・機械仕様書・動作仕様書などのPDF（あれば）</strong>';
            const extra2=d.createElement('li');
            extra2.innerHTML='<strong>電気図面・取扱説明書・メーカー資料など（あれば）</strong>';
            list.appendChild(extra1);
            list.appendChild(extra2);
          }
        }

        d.querySelectorAll('.note-box').forEach(box=>{
          const h=box.querySelector('h3');
          if(h&&h.textContent.includes('安全に関わる変更'))box.remove();
        });
        const ns=d.getElementById('not-supported');
        if(ns){
          ns.querySelectorAll('li').forEach(li=>{
            if(li.textContent.includes('現地確認をしないと安全に変更内容を判断できない'))li.remove();
          });
          if(!d.getElementById('open-consultation-note')){
            const open=d.createElement('div');
            open.className='key-highlight';
            open.id='open-consultation-note';
            open.innerHTML='<h3>回路変更・動作変更は、内容を問わずまずご相談いただけます</h3><p>GX Works2プロジェクトデータとご要望を確認したうえで、対応可否とお見積りをご案内します。変更後データの実機書込み・動作確認・設備としての最終確認はお客様側で実施してください。</p>';
            ns.parentNode.insertBefore(open,ns);
          }
        }

        d.querySelectorAll('#faq p').forEach(p=>{
          if(p.textContent.includes('写真は任意です。撮影禁止の設備でもご相談いただけます。')){
            p.textContent='写真は任意です。撮影禁止の設備でもご相談いただけます。必要な情報が不足する場合は、確認したい内容をこちらからご案内します。';
          }
        });

        const style=d.createElement('style');
        style.textContent=`
          .preview-demo-button{cursor:pointer!important;opacity:1!important}
          .preview-complete{display:none;margin-top:18px;padding:22px;border:1px solid #bbf7d0;border-radius:20px;background:linear-gradient(180deg,#ecfdf3 0%,#f8fffb 100%)}
          .preview-complete.is-visible{display:block}
          .preview-complete h3{margin:0 0 8px;font-size:18px;color:#166534}
          .preview-case-number{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:14px 0;padding:14px 16px;border:1px solid #86efac;border-radius:14px;background:#fff}
          .preview-case-number code{font-size:18px;font-weight:900;color:#0f172a;letter-spacing:.03em}
          .preview-copy{border:1px solid #cbd5e1;border-radius:10px;background:#fff;padding:7px 10px;font-size:12px;font-weight:800;cursor:pointer}
          .password-wrap{position:relative}
          .password-wrap input{padding-right:48px!important}
          .password-eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;border-radius:9px;background:transparent;cursor:pointer;display:grid;place-items:center;color:#475569}
          .password-eye:hover{background:#f1f5f9}
          .password-eye svg{width:20px;height:20px;display:block}
          .case-help{margin-top:6px;color:#64748b;font-size:11px}
          .consult-flow{display:grid;grid-template-columns:1fr 34px 1fr 34px 1fr;align-items:stretch;gap:8px;margin:0 0 22px}
          .consult-flow-step{border:1px solid #d7e4f3;border-radius:18px;background:#f8fbff;padding:16px;min-width:0}
          .consult-flow-step strong{display:block;margin-bottom:4px;font-size:14px;color:#0f172a}
          .consult-flow-step p{margin:0!important;font-size:12px!important;color:#64748b!important;line-height:1.65}
          .consult-flow-badge{display:inline-flex;align-items:center;justify-content:center;min-height:26px;padding:0 9px;border-radius:999px;background:#2563eb;color:#fff;font-size:11px;font-weight:900;margin-bottom:8px}
          .consult-flow-step:last-child .consult-flow-badge{background:#16a34a}
          .consult-flow-arrow{display:grid;place-items:center;color:#94a3b8;font-size:22px;font-weight:900}
          .consult-flow-note{margin:0 0 16px;padding:12px 14px;border-radius:14px;background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a8a;font-size:12px;font-weight:800}
          @media(max-width:760px){.consult-flow{grid-template-columns:1fr}.consult-flow-arrow{transform:rotate(90deg);height:20px}}
        `;
        d.head.appendChild(style);

        const consultation=d.getElementById('consultation');
        if(consultation){
          if(!d.getElementById('consult-flow')){
            const flow=d.createElement('div');
            flow.id='consult-flow';
            flow.innerHTML=`
              <div class="consult-flow-note">ご相談は2ステップで完了です。送信後は、入力いただいた返信用メールアドレスへご連絡します。</div>
              <div class="consult-flow">
                <div class="consult-flow-step"><span class="consult-flow-badge">STEP 1 / 2</span><strong>相談内容とパスワード付きZIPを送信</strong><p>必要事項とGX Works2データ・資料をまとめたZIPを送信します。受付完了後、相談番号を自動発行します。</p></div>
                <div class="consult-flow-arrow">→</div>
                <div class="consult-flow-step"><span class="consult-flow-badge">STEP 2 / 2</span><strong>ZIPパスワードを別送</strong><p>相談番号を引き継ぎ、別フォームからZIPパスワードだけを送信します。</p></div>
                <div class="consult-flow-arrow">→</div>
                <div class="consult-flow-step"><span class="consult-flow-badge">送信完了</span><strong>内容確認後、メールで返信</strong><p>GX Works2プロジェクトとご相談内容を確認後、返信用メールアドレスへ対応可否・確認事項・お見積りをご連絡します。</p></div>
              </div>`;
            const h2=consultation.querySelector('h2');
            if(h2)h2.insertAdjacentElement('afterend',flow);
          }

          const notice=consultation.querySelector('.preview-notice');
          if(notice)notice.textContent='このページは公開前Previewです。現在は画面確認用のため、実際の送信・ファイルアップロードは行われません。下のボタンでは送信完了後の画面だけ確認できます。';

          const fileBox=consultation.querySelector('.file-box');
          if(fileBox){
            fileBox.innerHTML='<strong>STEP 1 / 2｜パスワード付きZIPを送信</strong><br><small>GX Works2データ・説明メモ・任意の設備写真に加え、設備仕様書、電気図面、取扱説明書、メーカー資料などお持ちの資料があれば、1つのZIPにまとめてください。ZIP自体にパスワードを設定し、そのパスワードはこのフォームには入力しません。</small>';
          }

          const submitRow=consultation.querySelector('.submit-row');
          if(submitRow){
            submitRow.innerHTML='<button id="preview-submit-demo" class="btn btn-primary preview-demo-button" type="button">Preview：送信完了画面を見る</button><small>実際のデータ送信は行いません。相談番号の自動発行イメージを確認できます。</small>';
          }

          let complete=d.getElementById('preview-complete');
          if(!complete){
            complete=d.createElement('div');
            complete.id='preview-complete';
            complete.className='preview-complete';
            complete.innerHTML=`<h3>相談を受け付けました</h3><p>本番では、相談内容とZIPの受付完了後に<strong>相談番号をサーバー側で自動発行</strong>し、この画面と受付完了メールの両方に表示する想定です。</p><div class="preview-case-number"><span>相談番号</span><code id="preview-case-code">GXW-20260916-001</code><button id="preview-copy-case" class="preview-copy" type="button">番号をコピー</button></div><p><strong>この番号はパスワード送信時に使います。</strong>このまま下の「ZIPパスワードを別送する」へ進んでください。</p>`;
            consultation.appendChild(complete);
          }

          const passwordSection=d.createElement('section');
          passwordSection.className='section-card';
          passwordSection.id='password-submit';
          passwordSection.innerHTML=`
            <h2>ZIPパスワードを別送する</h2>
            <div class="preview-notice">STEP 2 / 2｜ZIP本体とは別の送信系統です。Previewのため現在は送信されません。</div>
            <div class="key-highlight"><h3>ZIPとパスワードは同時に送信しません</h3><p>相談フォームでZIPを送信したあと、自動発行された相談番号を使って、この別フォームからZIPパスワードだけを登録する想定です。ファイル本体とパスワードを分離して扱います。</p></div>
            <form onsubmit="return false;">
              <div class="form-grid">
                <div class="form-field"><label for="case-number">相談番号</label><input id="case-number" type="text" placeholder="例：GXW-20260916-001"><div class="case-help">本番ではStep 1完了後、この番号を自動表示・引き継ぎする想定です。</div></div>
                <div class="form-field"><label for="zip-password">ZIPパスワード</label><div class="password-wrap"><input id="zip-password" type="password" autocomplete="off" placeholder="ZIPに設定したパスワード"><button id="password-eye" class="password-eye" type="button" aria-label="パスワードを表示" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div><div class="case-help">通常は伏せ字で表示します。目のマークをクリックすると表示／非表示を切り替えられます。</div></div>
              </div>
              <div class="submit-row"><button class="btn btn-primary" type="button" disabled>パスワードを別送する</button><small>本番ではZIP保管先とは分離して受け付ける設計にします。</small></div>
            </form>`;
          const existing=d.getElementById('password-submit');
          if(existing)existing.replaceWith(passwordSection); else consultation.insertAdjacentElement('afterend',passwordSection);

          const demoButton=d.getElementById('preview-submit-demo');
          const completeBox=d.getElementById('preview-complete');
          const caseInput=d.getElementById('case-number');
          const code=d.getElementById('preview-case-code');
          if(demoButton&&completeBox&&caseInput&&code){
            demoButton.addEventListener('click',()=>{
              const sample='GXW-20260916-001';
              code.textContent=sample;
              caseInput.value=sample;
              completeBox.classList.add('is-visible');
              completeBox.scrollIntoView({behavior:'smooth',block:'center'});
            });
          }
          const copy=d.getElementById('preview-copy-case');
          if(copy&&code){copy.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(code.textContent);copy.textContent='コピーしました';setTimeout(()=>copy.textContent='番号をコピー',1400)}catch(e){copy.textContent='番号を選択してコピー';}})}
          const eye=d.getElementById('password-eye');
          const pass=d.getElementById('zip-password');
          if(eye&&pass){eye.addEventListener('click',()=>{const show=pass.type==='password';pass.type=show?'text':'password';eye.setAttribute('aria-pressed',show?'true':'false');eye.setAttribute('aria-label',show?'パスワードを隠す':'パスワードを表示');})}
        }

        const faq=d.getElementById('faq');
        if(faq&&!d.getElementById('data-transfer-rule')){
          const rule=d.createElement('div');
          rule.className='field-highlight';
          rule.id='data-transfer-rule';
          rule.innerHTML='<h3>データの送受信ルール</h3><p>お客様からの送信時も、変更済みデータの返却時も、パスワード付きZIPとパスワードを同じ送信にまとめません。返却時はZIP本体とパスワードを別々にご案内します。</p>';
          faq.appendChild(rule);
        }

        d.querySelectorAll('.side-card').forEach(card=>{
          if(card.textContent.includes('相談前に')){
            const p=card.querySelector('p');
            if(p)p.textContent='相談は2ステップです。相談内容＋パスワード付きZIPを送信後、自動発行された相談番号を使って別フォームからZIPパスワードを送信します。';
          }
        });
      });
    })();
  </script>
</body>
</html>
