<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>GX Works2 オンライン相談 Preview</title>
  <style>
    html,body{margin:0;min-height:100%;background:#f5f8fc}
    #previewFrame{display:block;width:100%;height:100vh;border:0;background:#fff}
  </style>
</head>
<body>
  <iframe id="previewFrame" title="GX Works2 オンライン相談 Preview" src="../services/gxworks2-online-support.html"></iframe>
  <script>
    (()=>{
      const frame=document.getElementById('previewFrame');
      frame.addEventListener('load',()=>{
        const d=frame.contentDocument;
        if(!d)return;

        const prep=d.getElementById('prepare');
        if(prep){
          const intro=prep.querySelector('p');
          if(intro)intro.innerHTML='ご相談時には、確認できる資料を<strong>1つのパスワード付きZIPファイル</strong>にまとめてください。ラダーPDFやCSVを別途作成していただく必要はありません。設備仕様書や取扱説明書など、すでにお持ちの資料があれば一緒に入れていただくと確認がスムーズです。';
          const list=prep.querySelector('.number-list');
          if(list&&!list.textContent.includes('設備仕様書・機械仕様書')){
            const a=d.createElement('li');a.innerHTML='<strong>設備仕様書・機械仕様書・動作仕様書などのPDF（あれば）</strong>';
            const b=d.createElement('li');b.innerHTML='<strong>電気図面・取扱説明書・メーカー資料など（あれば）</strong>';
            list.append(a,b);
          }
        }

        d.querySelectorAll('.note-box').forEach(box=>{const h=box.querySelector('h3');if(h&&h.textContent.includes('安全に関わる変更'))box.remove();});
        const ns=d.getElementById('not-supported');
        if(ns){
          ns.querySelectorAll('li').forEach(li=>{if(li.textContent.includes('現地確認をしないと安全に変更内容を判断できない'))li.remove();});
          if(!d.getElementById('open-consultation-note')){
            const open=d.createElement('div');open.className='key-highlight';open.id='open-consultation-note';
            open.innerHTML='<h3>回路変更・動作変更は、内容を問わずまずご相談いただけます</h3><p>GX Works2プロジェクトデータとご要望を確認したうえで、対応可否とお見積りをご案内します。変更後データの実機書込み・動作確認・設備としての最終確認はお客様側で実施してください。</p>';
            ns.parentNode.insertBefore(open,ns);
          }
        }
        d.querySelectorAll('#faq p').forEach(p=>{if(p.textContent.includes('写真は任意です。撮影禁止の設備でもご相談いただけます。'))p.textContent='写真は任意です。撮影禁止の設備でもご相談いただけます。必要な情報が不足する場合は、確認したい内容をこちらからご案内します。';});

        const style=d.createElement('style');
        style.textContent=`
          .preview-demo-button{cursor:pointer!important;opacity:1!important}
          .preview-demo-button[disabled]{cursor:wait!important;opacity:.7!important}
          .preview-complete{display:none;margin-top:18px;padding:22px;border:1px solid #bbf7d0;border-radius:20px;background:linear-gradient(180deg,#ecfdf3 0%,#f8fffb 100%)}
          .preview-complete.is-visible{display:block}.preview-complete h3{margin:0 0 8px;font-size:18px;color:#166534}
          .preview-case-number{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:14px 0;padding:14px 16px;border:1px solid #86efac;border-radius:14px;background:#fff}
          .preview-case-number code{font-size:18px;font-weight:900;color:#0f172a;letter-spacing:.03em}.preview-copy{border:1px solid #cbd5e1;border-radius:10px;background:#fff;padding:7px 10px;font-size:12px;font-weight:800;cursor:pointer}
          .password-wrap{position:relative}.password-wrap input{padding-right:48px!important}.password-eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;border-radius:9px;background:transparent;cursor:pointer;display:grid;place-items:center;color:#475569}.password-eye:hover{background:#f1f5f9}.password-eye svg{width:20px;height:20px;display:block}.case-help{margin-top:6px;color:#64748b;font-size:11px}
          .consult-flow{display:grid;grid-template-columns:1fr 34px 1fr 34px 1fr;align-items:stretch;gap:8px;margin:0 0 22px}.consult-flow-step{border:1px solid #d7e4f3;border-radius:18px;background:#f8fbff;padding:16px;min-width:0}.consult-flow-step strong{display:block;margin-bottom:4px;font-size:14px;color:#0f172a}.consult-flow-step p{margin:0!important;font-size:12px!important;color:#64748b!important;line-height:1.65}.consult-flow-badge{display:inline-flex;align-items:center;justify-content:center;min-height:26px;padding:0 9px;border-radius:999px;background:#2563eb;color:#fff;font-size:11px;font-weight:900;margin-bottom:8px}.consult-flow-step:last-child .consult-flow-badge{background:#16a34a}.consult-flow-arrow{display:grid;place-items:center;color:#94a3b8;font-size:22px;font-weight:900}.consult-flow-note{margin:0 0 16px;padding:12px 14px;border-radius:14px;background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a8a;font-size:12px;font-weight:800}
          .zip-drop{margin-top:12px;border:2px dashed #93b5df;border-radius:16px;background:#fff;padding:24px 16px;text-align:center;cursor:pointer;transition:.16s ease}.zip-drop:hover,.zip-drop.is-dragover{border-color:#2563eb;background:#eff6ff;transform:translateY(-1px)}.zip-drop-icon{font-size:28px;line-height:1;margin-bottom:8px}.zip-drop strong{display:block;font-size:14px}.zip-drop span{display:block;margin-top:4px;color:#64748b;font-size:12px}.zip-input{display:none}.zip-selected{display:none;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;padding:12px 14px;border:1px solid #bbf7d0;border-radius:14px;background:#f0fdf4;text-align:left}.zip-selected.is-visible{display:flex}.zip-file-info{min-width:0}.zip-file-name{font-size:13px;font-weight:900;color:#166534;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.zip-file-size{font-size:11px;color:#64748b}.zip-remove{flex:0 0 auto;border:1px solid #cbd5e1;border-radius:9px;background:#fff;padding:7px 10px;font-size:11px;font-weight:800;cursor:pointer}.zip-error{display:none;margin-top:10px;color:#b91c1c;font-size:12px;font-weight:800}.zip-error.is-visible{display:block}.local-only{margin-top:9px;color:#854d0e;font-size:11px;font-weight:800}.send-status{min-height:20px;color:#475569;font-size:12px;font-weight:800}
          @media(max-width:760px){.consult-flow{grid-template-columns:1fr}.consult-flow-arrow{transform:rotate(90deg);height:20px}.zip-selected{align-items:flex-start}}
        `;d.head.appendChild(style);

        const consultation=d.getElementById('consultation');
        if(!consultation)return;
        if(!d.getElementById('consult-flow')){
          const flow=d.createElement('div');flow.id='consult-flow';flow.innerHTML=`<div class="consult-flow-note">ご相談は2ステップで完了です。送信後は、入力いただいた返信用メールアドレスへご連絡します。</div><div class="consult-flow"><div class="consult-flow-step"><span class="consult-flow-badge">STEP 1 / 2</span><strong>相談内容とパスワード付きZIPを送信</strong><p>必要事項とGX Works2データ・資料をまとめたZIPを送信します。受付完了後、相談番号を自動発行します。</p></div><div class="consult-flow-arrow">→</div><div class="consult-flow-step"><span class="consult-flow-badge">STEP 2 / 2</span><strong>ZIPパスワードを別送</strong><p>相談番号を引き継ぎ、別フォームからZIPパスワードだけを送信します。</p></div><div class="consult-flow-arrow">→</div><div class="consult-flow-step"><span class="consult-flow-badge">送信完了</span><strong>内容確認後、メールで返信</strong><p>GX Works2プロジェクトとご相談内容を確認後、返信用メールアドレスへ対応可否・確認事項・お見積りをご連絡します。</p></div></div>`;
          consultation.querySelector('h2')?.insertAdjacentElement('afterend',flow);
        }
        const notice=consultation.querySelector('.preview-notice');if(notice)notice.textContent='このページは公開前Previewです。ZIPの選択・ドラッグ＆ドロップと送信後の流れを確認できます。選んだZIPはブラウザ内だけで保持され、現在は外部へ送信されません。';

        const fileBox=consultation.querySelector('.file-box');
        if(fileBox){fileBox.innerHTML=`<strong>STEP 1 / 2｜パスワード付きZIPを送信</strong><br><small>GX Works2データ・説明メモ・任意の設備写真、設備仕様書、電気図面、取扱説明書などを1つのZIPにまとめてください。ZIPのパスワードはこのフォームには入力しません。</small><div id="zip-drop" class="zip-drop" role="button" tabindex="0" aria-label="ZIPファイルを選択"><div class="zip-drop-icon">⇩</div><strong>ZIPファイルをここへドラッグ＆ドロップ</strong><span>またはクリックしてZIPファイルを選択</span><input id="zip-input" class="zip-input" type="file" accept=".zip,application/zip,application/x-zip-compressed"></div><div id="zip-selected" class="zip-selected"><div class="zip-file-info"><div id="zip-file-name" class="zip-file-name"></div><div id="zip-file-size" class="zip-file-size"></div></div><button id="zip-remove" class="zip-remove" type="button">選択を解除</button></div><div id="zip-error" class="zip-error"></div><div class="local-only">Preview中：ファイルはまだアップロードされません。実保存は専用の非公開保管先を接続後に有効化します。</div>`;}

        const submitRow=consultation.querySelector('.submit-row');
        if(submitRow)submitRow.innerHTML='<button id="preview-submit-demo" class="btn btn-primary preview-demo-button" type="button">相談内容とZIPを送信する</button><span id="send-status" class="send-status">Previewでは送信処理を疑似実行します。</span>';

        let complete=d.getElementById('preview-complete');
        if(!complete){complete=d.createElement('div');complete.id='preview-complete';complete.className='preview-complete';complete.innerHTML=`<h3>相談を受け付けました</h3><p>本番では、相談内容とZIPの保存が正常に完了した時点で<strong>相談番号をサーバー側で自動発行</strong>し、この画面と受付完了メールに表示します。</p><div class="preview-case-number"><span>相談番号</span><code id="preview-case-code">GXW-20260916-001</code><button id="preview-copy-case" class="preview-copy" type="button">番号をコピー</button></div><p><strong>続けてSTEP 2 / 2へ進み、ZIPパスワードを別送します。</strong></p>`;consultation.appendChild(complete);}

        const passwordSection=d.createElement('section');passwordSection.className='section-card';passwordSection.id='password-submit';passwordSection.innerHTML=`<h2>ZIPパスワードを別送する</h2><div class="preview-notice">STEP 2 / 2｜ZIP本体とは別の送信系統です。Previewのため現在は保存されません。</div><div class="key-highlight"><h3>ZIPとパスワードは同時に送信しません</h3><p>STEP 1完了後に自動発行された相談番号を使って、別フォームからZIPパスワードだけを登録する想定です。</p></div><form onsubmit="return false;"><div class="form-grid"><div class="form-field"><label for="case-number">相談番号</label><input id="case-number" type="text" placeholder="例：GXW-20260916-001"><div class="case-help">本番ではSTEP 1完了後、この番号を自動で引き継ぎます。</div></div><div class="form-field"><label for="zip-password">ZIPパスワード</label><div class="password-wrap"><input id="zip-password" type="password" autocomplete="off" placeholder="ZIPに設定したパスワード"><button id="password-eye" class="password-eye" type="button" aria-label="パスワードを表示" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div><div class="case-help">通常は伏せ字表示。目のマークで表示／非表示を切り替えます。</div></div></div><div class="submit-row"><button class="btn btn-primary" type="button" disabled>パスワードを別送する</button><small>実保存はバックエンド接続後に有効化します。</small></div></form>`;
        d.getElementById('password-submit')?.replaceWith(passwordSection) || consultation.insertAdjacentElement('afterend',passwordSection);

        let selectedZip=null;
        const drop=d.getElementById('zip-drop'),input=d.getElementById('zip-input'),selected=d.getElementById('zip-selected'),fileName=d.getElementById('zip-file-name'),fileSize=d.getElementById('zip-file-size'),remove=d.getElementById('zip-remove'),error=d.getElementById('zip-error');
        const humanSize=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':n<1073741824?(n/1048576).toFixed(1)+' MB':(n/1073741824).toFixed(2)+' GB';
        const clearError=()=>{error.textContent='';error.classList.remove('is-visible');};
        const showError=m=>{error.textContent=m;error.classList.add('is-visible');};
        const setFile=f=>{clearError();if(!f)return;const zip=f.name.toLowerCase().endsWith('.zip')||['application/zip','application/x-zip-compressed'].includes(f.type);if(!zip){selectedZip=null;selected.classList.remove('is-visible');showError('ZIPファイルのみ選択できます。');return;}selectedZip=f;fileName.textContent=f.name;fileSize.textContent=humanSize(f.size);selected.classList.add('is-visible');};
        drop.addEventListener('click',()=>input.click());drop.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();input.click();}});input.addEventListener('change',()=>setFile(input.files?.[0]));
        ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();e.stopPropagation();drop.classList.add('is-dragover');}));['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();e.stopPropagation();drop.classList.remove('is-dragover');}));drop.addEventListener('drop',e=>setFile(e.dataTransfer?.files?.[0]));remove.addEventListener('click',e=>{e.stopPropagation();selectedZip=null;input.value='';selected.classList.remove('is-visible');clearError();});

        const demoButton=d.getElementById('preview-submit-demo'),completeBox=d.getElementById('preview-complete'),caseInput=d.getElementById('case-number'),code=d.getElementById('preview-case-code'),status=d.getElementById('send-status');
        demoButton.addEventListener('click',()=>{if(!selectedZip){showError('送信前にパスワード付きZIPファイルを選択してください。');drop.scrollIntoView({behavior:'smooth',block:'center'});return;}clearError();demoButton.disabled=true;status.textContent='Preview：送信処理を確認中…';setTimeout(()=>{const sample='GXW-20260916-001';code.textContent=sample;caseInput.value=sample;completeBox.classList.add('is-visible');status.textContent='Preview：送信完了。実際のファイル送信は行っていません。';demoButton.disabled=false;completeBox.scrollIntoView({behavior:'smooth',block:'center'});},700);});
        const copy=d.getElementById('preview-copy-case');copy?.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(code.textContent);copy.textContent='コピーしました';setTimeout(()=>copy.textContent='番号をコピー',1400)}catch{copy.textContent='番号を選択してコピー';}});
        const eye=d.getElementById('password-eye'),pass=d.getElementById('zip-password');eye?.addEventListener('click',()=>{const show=pass.type==='password';pass.type=show?'text':'password';eye.setAttribute('aria-pressed',show?'true':'false');eye.setAttribute('aria-label',show?'パスワードを隠す':'パスワードを表示');});

        const faq=d.getElementById('faq');if(faq&&!d.getElementById('data-transfer-rule')){const rule=d.createElement('div');rule.className='field-highlight';rule.id='data-transfer-rule';rule.innerHTML='<h3>データの送受信ルール</h3><p>お客様からの送信時も、変更済みデータの返却時も、パスワード付きZIPとパスワードを同じ送信にまとめません。返却時はZIP本体とパスワードを別々にご案内します。</p>';faq.appendChild(rule);}
        d.querySelectorAll('.side-card').forEach(card=>{if(card.textContent.includes('相談前に')){const p=card.querySelector('p');if(p)p.textContent='相談内容＋パスワード付きZIPを送信後、自動発行された相談番号を使って別フォームからZIPパスワードを送る2段階受付です。';}});
      });
    })();
  </script>
</body>
</html>
