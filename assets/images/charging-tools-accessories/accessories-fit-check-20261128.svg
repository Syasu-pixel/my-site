<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 768" role="img" aria-labelledby="t d">
  <title id="t">充電工具と周辺工具の適合は、先端と電源を分けて見る</title>
  <desc id="d">上段は工具本体の受け口、先端工具の軸と溝、作業方式の確認。下段は工具本体に合う電池と、充電器が受け付ける電池の確認。</desc>
  <rect width="1080" height="768" rx="38" fill="#eaf3fd"/>
  <rect x="32" y="32" width="1016" height="704" rx="30" fill="#10263f"/>
  <g font-family="'Noto Sans CJK JP','Noto Sans JP',sans-serif">
  <text x="70" y="104" fill="#a0d7ff" font-size="28" font-weight="700">買う前の適合チェック</text>
  <text x="70" y="165" fill="#fff" font-size="48" font-weight="700">先端と電源を分けて見る</text>
  <rect x="70" y="205" width="940" height="208" rx="26" fill="#f3f8fd"/>
  <circle cx="138" cy="270" r="38" fill="#146ead"/>
  <text x="138" y="284" fill="#fff" text-anchor="middle" font-size="43" font-weight="700">1</text>
  <text x="196" y="283" fill="#133253" font-size="44" font-weight="700">先端工具</text>
  <text x="102" y="345" fill="#1c425e" font-size="37">受け口 → 軸の形と溝 → 作業方式</text>
  <text x="102" y="388" fill="#3f5970" font-size="31">差し込めても、打撃対応とは限らない。</text>
  <rect x="70" y="438" width="940" height="208" rx="26" fill="#effaf3"/>
  <circle cx="138" cy="502" r="38" fill="#19764a"/>
  <text x="138" y="516" fill="#fff" text-anchor="middle" font-size="43" font-weight="700">2</text>
  <text x="196" y="515" fill="#184b32" font-size="44" font-weight="700">電池・充電器</text>
  <text x="102" y="577" fill="#20573d" font-size="37">本体 ⇄ 電池　／　電池 ⇄ 充電器</text>
  <text x="102" y="620" fill="#395e4c" font-size="31">充電できても、本体に装着できるとは限らない。</text>
  <text x="92" y="700" fill="#dfeafa" font-size="29">型番を控え、メーカー資料で両方の組み合わせを照合。</text>
  </g>
</svg>
