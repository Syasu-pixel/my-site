<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="t d">
<title id="t">MOVとMOVP：同じON時間で転送されるタイミング</title>
<desc id="d">実行条件がスキャン2でOFFからON、スキャン3もON、スキャン4でOFFになる。D10が10、20、30、40なら、転送先D20の初期値が0のとき、MOVは0、20、30、30、MOVPは0、20、20、20となる。他の書き込みはないと仮定。</desc>
<rect width="960" height="460" rx="26" fill="#eef4f9"/>
<rect x="24" y="24" width="912" height="412" rx="20" fill="#fff" stroke="#b7c7d7" stroke-width="2"/>
<g font-family="Noto Sans CJK JP, Yu Gothic, sans-serif" fill="#182b42">
<text x="48" y="77" font-size="37" font-weight="bold">MOVは追いかける、MOVPは一度だけ</text>
<text x="48" y="115" font-size="24">転送先D20は初期値0。他からの書き込みはない学習例。</text>
<rect x="377" y="137" width="110" height="237" rx="13" fill="#e4eefb"/>
<g font-size="27" text-anchor="middle">
<text x="305" y="173">①</text><text x="432" y="173">②</text><text x="560" y="173">③</text><text x="688" y="173">④</text>
<text x="305" y="218">OFF</text><text x="432" y="218" font-weight="bold">ON</text><text x="560" y="218">ON</text><text x="688" y="218">OFF</text>
<text x="305" y="264">10</text><text x="432" y="264">20</text><text x="560" y="264">30</text><text x="688" y="264">40</text>
<text x="305" y="310">0</text><text x="432" y="310" fill="#155987" font-weight="bold">20</text><text x="560" y="310" fill="#155987" font-weight="bold">30</text><text x="688" y="310">30</text>
<text x="305" y="356">0</text><text x="432" y="356" fill="#963b1e" font-weight="bold">20</text><text x="560" y="356">20</text><text x="688" y="356">20</text>
</g>
<g x="52" font-size="25" font-weight="bold"><text x="52" y="173">スキャン</text><text x="52" y="218">実行条件</text><text x="52" y="264">転送元 D10</text><text x="52" y="310">MOV の D20</text><text x="52" y="356">MOVP の D20</text></g>
<path d="M51 187H908 M51 232H908 M51 278H908 M51 324H908 M51 375H908" stroke="#c9d7e3" fill="none"/>
<text x="755" y="212" font-size="21" font-weight="bold" fill="#155987">②で立上り</text>
<text x="755" y="310" font-size="21" fill="#155987">②と③で転送</text>
<text x="755" y="356" font-size="21" fill="#963b1e">②だけで転送</text>
<text x="52" y="409" font-size="21">数値は各スキャンで命令を通過した後。条件OFFで自動的に0には戻らない。</text>
</g></svg>
