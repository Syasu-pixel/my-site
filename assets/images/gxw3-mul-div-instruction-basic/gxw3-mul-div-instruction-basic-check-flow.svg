<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <rect width="1400" height="900" fill="#ffffff"/>
  <text x="70" y="90" font-size="42" font-family="'Yu Gothic','Hiragino Sans',sans-serif" font-weight="700" fill="#0f172a">MUL・DIV がうまく動かない時の確認順</text>
  <g fill="#f8fbff" stroke="#dbe7f3" stroke-width="3">
    <rect x="120" y="160" width="1160" height="110" rx="22"/>
    <rect x="120" y="310" width="1160" height="110" rx="22"/>
    <rect x="120" y="460" width="1160" height="110" rx="22"/>
    <rect x="120" y="610" width="1160" height="110" rx="22"/>
  </g>
  <g font-family="'Yu Gothic','Hiragino Sans',sans-serif">
    <text x="170" y="228" font-size="32" font-weight="700" fill="#1d4ed8">1. 実行条件はONしているか</text>
    <text x="170" y="378" font-size="32" font-weight="700" fill="#1d4ed8">2. s1 / s2 に期待した値があるか</text>
    <text x="170" y="528" font-size="32" font-weight="700" fill="#1d4ed8">3. MUL は d+1 側、DIV は余り側まで見ているか</text>
    <text x="170" y="678" font-size="32" font-weight="700" fill="#1d4ed8">4. 別回路で d や d+1 を上書きしていないか</text>
    <text x="170" y="258" font-size="24" fill="#475569">前段条件がOFFなら計算は走らない</text>
    <text x="170" y="408" font-size="24" fill="#475569">元の値が違えば結果も違う</text>
    <text x="170" y="558" font-size="24" fill="#475569">MUL は2ワード、DIV は商と余り</text>
    <text x="170" y="708" font-size="24" fill="#475569">後段や別ネットワークも確認する</text>
  </g>
</svg>