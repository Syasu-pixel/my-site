<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#f8fbff"/>
  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef4ff"/>
    </linearGradient>
  </defs>
  <g opacity="0.9">
    <rect x="930" y="120" width="520" height="660" rx="28" fill="#ffffff" stroke="#cfe0f5" stroke-width="4"/>
    <rect x="980" y="190" width="370" height="110" rx="22" fill="#eff6ff" stroke="#93c5fd" stroke-width="3"/>
    <text x="1165" y="255" text-anchor="middle" font-size="54" font-family="'Yu Gothic','Hiragino Sans',sans-serif" font-weight="700" fill="#1d4ed8">MUL</text>
    <text x="1165" y="325" text-anchor="middle" font-size="32" font-family="'Yu Gothic','Hiragino Sans',sans-serif" fill="#475569">結果は d と d+1</text>
    <rect x="980" y="355" width="370" height="110" rx="22" fill="#ecfdf3" stroke="#86efac" stroke-width="3"/>
    <text x="1165" y="420" text-anchor="middle" font-size="54" font-family="'Yu Gothic','Hiragino Sans',sans-serif" font-weight="700" fill="#15803d">DIV</text>
    <text x="1165" y="490" text-anchor="middle" font-size="32" font-family="'Yu Gothic','Hiragino Sans',sans-serif" fill="#475569">商 d / 余り d+1</text>
    <rect x="980" y="530" width="170" height="150" rx="20" fill="#ffffff" stroke="#bfdbfe" stroke-width="3"/>
    <rect x="1180" y="530" width="170" height="150" rx="20" fill="#ffffff" stroke="#bbf7d0" stroke-width="3"/>
    <text x="1065" y="590" text-anchor="middle" font-size="34" font-family="'Yu Gothic','Hiragino Sans',sans-serif" font-weight="700" fill="#1d4ed8">d</text>
    <text x="1265" y="590" text-anchor="middle" font-size="34" font-family="'Yu Gothic','Hiragino Sans',sans-serif" font-weight="700" fill="#15803d">d+1</text>
    <text x="1065" y="640" text-anchor="middle" font-size="26" font-family="'Yu Gothic','Hiragino Sans',sans-serif" fill="#64748b">商や下位側</text>
    <text x="1265" y="640" text-anchor="middle" font-size="26" font-family="'Yu Gothic','Hiragino Sans',sans-serif" fill="#64748b">余りや上位側</text>
  </g>
</svg>