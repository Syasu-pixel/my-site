<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <rect width="1400" height="900" fill="#ffffff"/>
  <text x="70" y="90" font-size="42" font-family="'Yu Gothic','Hiragino Sans',sans-serif" font-weight="700" fill="#0f172a">MUL・DIV の見方</text>
  <g>
    <rect x="70" y="150" width="580" height="280" rx="24" fill="#eff6ff" stroke="#93c5fd" stroke-width="3"/>
    <text x="110" y="220" font-size="40" font-family="'Yu Gothic','Hiragino Sans',sans-serif" font-weight="700" fill="#1d4ed8">MUL</text>
    <text x="110" y="285" font-size="32" font-family="'Yu Gothic','Hiragino Sans',sans-serif" fill="#334155">(s1) × (s2) → [(d)+1, (d)]</text>
    <rect x="120" y="320" width="150" height="70" rx="16" fill="#fff" stroke="#bfdbfe" stroke-width="2"/>
    <rect x="305" y="320" width="150" height="70" rx="16" fill="#fff" stroke="#bfdbfe" stroke-width="2"/>
    <rect x="490" y="300" width="110" height="50" rx="12" fill="#dbeafe"/>
    <rect x="490" y="365" width="110" height="50" rx="12" fill="#dbeafe"/>
    <text x="195" y="365" text-anchor="middle" font-size="28" font-family="'Yu Gothic','Hiragino Sans',sans-serif" fill="#0f172a">s1</text>
    <text x="380" y="365" text-anchor="middle" font-size="28" font-family="'Yu Gothic','Hiragino Sans',sans-serif" fill="#0f172a">s2</text>
    <text x="545" y="334" text-anchor="middle" font-size="24" font-family="'Yu Gothic','Hiragino Sans',sans-serif" fill="#1d4ed8">d+1</text>
    <text x="545" y="399" text-anchor="middle" font-size="24" font-family="'Yu Gothic','Hiragino Sans',sans-serif" fill="#1d4ed8">d</text>
  </g>
  <g>
    <rect x="750" y="150" width="580" height="280" rx="24" fill="#ecfdf3" stroke="#86efac" stroke-width="3"/>
    <text x="790" y="220" font-size="40" font-family="'Yu Gothic','Hiragino Sans',sans-serif" font-weight="700" fill="#15803d">DIV</text>
    <text x="790" y="285" font-size="32" font-family="'Yu Gothic','Hiragino Sans',sans-serif" fill="#334155">(s1) ÷ (s2) → 商(d) / 余り(d+1)</text>
    <rect x="800" y="320" width="150" height="70" rx="16" fill="#fff" stroke="#bbf7d0" stroke-width="2"/>
    <rect x="985" y="320" width="150" height="70" rx="16" fill="#fff" stroke="#bbf7d0" stroke-width="2"/>
    <rect x="1170" y="300" width="110" height="50" rx="12" fill="#dcfce7"/>
    <rect x="1170" y="365" width="110" height="50" rx="12" fill="#dcfce7"/>
    <text x="875" y="365" text-anchor="middle" font-size="28" font-family="'Yu Gothic','Hiragino Sans',sans-serif" fill="#0f172a">s1</text>
    <text x="1060" y="365" text-anchor="middle" font-size="28" font-family="'Yu Gothic','Hiragino Sans',sans-serif" fill="#0f172a">s2</text>
    <text x="1225" y="334" text-anchor="middle" font-size="24" font-family="'Yu Gothic','Hiragino Sans',sans-serif" fill="#15803d">d+1</text>
    <text x="1225" y="399" text-anchor="middle" font-size="24" font-family="'Yu Gothic','Hiragino Sans',sans-serif" fill="#15803d">d</text>
  </g>
  <rect x="70" y="500" width="1260" height="280" rx="24" fill="#f8fbff" stroke="#dbe7f3" stroke-width="3"/>
  <text x="110" y="570" font-size="36" font-family="'Yu Gothic','Hiragino Sans',sans-serif" font-weight="700" fill="#0f172a">最初に見る順番</text>
  <text x="110" y="640" font-size="30" font-family="'Yu Gothic','Hiragino Sans',sans-serif" fill="#334155">1. 実行条件</text>
  <text x="110" y="700" font-size="30" font-family="'Yu Gothic','Hiragino Sans',sans-serif" fill="#334155">2. 計算元 s1 / s2</text>
  <text x="110" y="760" font-size="30" font-family="'Yu Gothic','Hiragino Sans',sans-serif" fill="#334155">3. 結果格納先 d / d+1</text>
</svg>