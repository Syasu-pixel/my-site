    <text x="765" y="250" text-anchor="middle" fill="#1d4ed8" font-size="30" font-weight="800" font-family="'Hiragino Sans','Yu Gothic',sans-serif">手動優先</text>
    <text x="1065" y="250" text-anchor="middle" fill="#15803d" font-size="30" font-weight="800" font-family="'Hiragino Sans','Yu Gothic',sans-serif">自動優先</text>
    <text x="1365" y="250" text-anchor="middle" fill="#b45309" font-size="30" font-weight="800" font-family="'Hiragino Sans','Yu Gothic',sans-serif">停止位置あり</text>
    <circle cx="765" cy="340" r="34" fill="#fff" stroke="#1d4ed8" stroke-width="6"/><line x1="765" y1="340" x2="792" y2="313" stroke="#1d4ed8" stroke-width="8" stroke-linecap="round"/>
    <circle cx="1065" cy="340" r="34" fill="#fff" stroke="#15803d" stroke-width="6"/><line x1="1065" y1="340" x2="1092" y2="313" stroke="#15803d" stroke-width="8" stroke-linecap="round"/>
    <circle cx="1365" cy="340" r="34" fill="#fff" stroke="#b45309" stroke-width="6"/><line x1="1365" y1="340" x2="1365" y2="305" stroke="#b45309" stroke-width="8" stroke-linecap="round"/>
    <text x="765" y="430" text-anchor="middle" fill="#475569" font-size="24" font-weight="700" font-family="'Hiragino Sans','Yu Gothic',sans-serif">作業者操作を優先</text>
    <text x="1065" y="430" text-anchor="middle" fill="#475569" font-size="24" font-weight="700" font-family="'Hiragino Sans','Yu Gothic',sans-serif">自動条件を優先</text>
    <text x="1365" y="430" text-anchor="middle" fill="#475569" font-size="24" font-weight="700" font-family="'Hiragino Sans','Yu Gothic',sans-serif">切替中は一度停止</text>
    <text x="765" y="500" text-anchor="middle" fill="#64748b" font-size="22" font-weight="700" font-family="'Hiragino Sans','Yu Gothic',sans-serif">調整・試運転向き</text>
    <text x="1065" y="500" text-anchor="middle" fill="#64748b" font-size="22" font-weight="700" font-family="'Hiragino Sans','Yu Gothic',sans-serif">連続運転向き</text>
    <text x="1365" y="500" text-anchor="middle" fill="#64748b" font-size="22" font-weight="700" font-family="'Hiragino Sans','Yu Gothic',sans-serif">誤動作を抑えやすい</text>
  </g>
  <text x="88" y="110" fill="#1d4ed8" font-size="32" font-weight="700" font-family="'Hiragino Sans','Yu Gothic',sans-serif">回路の基本</text>
  <text x="88" y="176" fill="#0f172a" font-size="54" font-weight="800" font-family="'Hiragino Sans','Yu Gothic',sans-serif">優先ルール比較</text>
