<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#edf4ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#9ab6d8" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="520" y="220" width="230" height="420" rx="24" fill="#ffffff" stroke="#cfe0f4" stroke-width="4"/>
    <rect x="820" y="220" width="230" height="420" rx="24" fill="#ffffff" stroke="#cfe0f4" stroke-width="4"/>
    <rect x="1120" y="220" width="230" height="420" rx="24" fill="#ffffff" stroke="#cfe0f4" stroke-width="4"/>
    <text x="635" y="282" text-anchor="middle" fill="#1d4ed8" font-size="30" font-weight="800" font-family="'Hiragino Sans','Yu Gothic',sans-serif">手動優先</text>
    <text x="935" y="282" text-anchor="middle" fill="#15803d" font-size="30" font-weight="800" font-family="'Hiragino Sans','Yu Gothic',sans-serif">自動優先</text>
    <text x="1235" y="282" text-anchor="middle" fill="#b45309" font-size="30" font-weight="800" font-family="'Hiragino Sans','Yu Gothic',sans-serif">停止位置あり</text>
    <circle cx="635" cy="358" r="30" fill="#ffffff" stroke="#1d4ed8" stroke-width="6"/><line x1="635" y1="358" x2="660" y2="333" stroke="#1d4ed8" stroke-width="8" stroke-linecap="round"/>
    <circle cx="935" cy="358" r="30" fill="#ffffff" stroke="#15803d" stroke-width="6"/><line x1="935" y1="358" x2="960" y2="333" stroke="#15803d" stroke-width="8" stroke-linecap="round"/>
    <circle cx="1235" cy="358" r="30" fill="#ffffff" stroke="#b45309" stroke-width="6"/><line x1="1235" y1="358" x2="1235" y2="327" stroke="#b45309" stroke-width="8" stroke-linecap="round"/>
    <text x="635" y="446" text-anchor="middle" fill="#475569" font-size="24" font-weight="700" font-family="'Hiragino Sans','Yu Gothic',sans-serif">手動操作を最優先</text>
    <text x="935" y="446" text-anchor="middle" fill="#475569" font-size="24" font-weight="700" font-family="'Hiragino Sans','Yu Gothic',sans-serif">自動条件を優先</text>
    <text x="1235" y="446" text-anchor="middle" fill="#475569" font-size="24" font-weight="700" font-family="'Hiragino Sans','Yu Gothic',sans-serif">切替時は一度停止</text>
    <text x="635" y="512" text-anchor="middle" fill="#64748b" font-size="22" font-weight="700" font-family="'Hiragino Sans','Yu Gothic',sans-serif">調整・復旧向き</text>
    <text x="935" y="512" text-anchor="middle" fill="#64748b" font-size="22" font-weight="700" font-family="'Hiragino Sans','Yu Gothic',sans-serif">通常運転向き</text>
    <text x="1235" y="512" text-anchor="middle" fill="#64748b" font-size="22" font-weight="700" font-family="'Hiragino Sans','Yu Gothic',sans-serif">誤動作を抑えやすい</text>
  </g>
  <text x="88" y="110" fill="#1d4ed8" font-size="32" font-weight="700" font-family="'Hiragino Sans','Yu Gothic',sans-serif">回路の基本</text>
  <text x="88" y="176" fill="#0f172a" font-size="54" font-weight="800" font-family="'Hiragino Sans','Yu Gothic',sans-serif">優先ルール比較</text>
  <text x="88" y="232" fill="#334155" font-size="28" font-weight="700" font-family="'Hiragino Sans','Yu Gothic',sans-serif">手動優先・自動優先・停止位置の違いを一目で整理</text>
</svg>