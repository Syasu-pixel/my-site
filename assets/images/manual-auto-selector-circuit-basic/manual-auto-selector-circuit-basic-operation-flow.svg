<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#edf4ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#9ab6d8" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="430" y="330" width="190" height="120" rx="24" fill="#eff6ff" stroke="#60a5fa" stroke-width="4"/>
    <rect x="690" y="330" width="190" height="120" rx="24" fill="#ecfdf3" stroke="#4ade80" stroke-width="4"/>
    <rect x="950" y="330" width="190" height="120" rx="24" fill="#fff7ed" stroke="#fb923c" stroke-width="4"/>
    <rect x="1210" y="330" width="190" height="120" rx="24" fill="#ffffff" stroke="#94a3b8" stroke-width="4"/>
    <text x="525" y="383" text-anchor="middle" fill="#1d4ed8" font-size="27" font-weight="800" font-family="'Hiragino Sans','Yu Gothic',sans-serif">1 モード</text>
    <text x="525" y="418" text-anchor="middle" fill="#1d4ed8" font-size="27" font-weight="800" font-family="'Hiragino Sans','Yu Gothic',sans-serif">状態確認</text>
    <text x="785" y="383" text-anchor="middle" fill="#15803d" font-size="27" font-weight="800" font-family="'Hiragino Sans','Yu Gothic',sans-serif">2 有効入力</text>
    <text x="785" y="418" text-anchor="middle" fill="#15803d" font-size="27" font-weight="800" font-family="'Hiragino Sans','Yu Gothic',sans-serif">を確認</text>
    <text x="1045" y="383" text-anchor="middle" fill="#b45309" font-size="27" font-weight="800" font-family="'Hiragino Sans','Yu Gothic',sans-serif">3 禁止条件</text>
    <text x="1045" y="418" text-anchor="middle" fill="#b45309" font-size="27" font-weight="800" font-family="'Hiragino Sans','Yu Gothic',sans-serif">を確認</text>
    <text x="1305" y="383" text-anchor="middle" fill="#334155" font-size="27" font-weight="800" font-family="'Hiragino Sans','Yu Gothic',sans-serif">4 最終出力</text>
    <text x="1305" y="418" text-anchor="middle" fill="#334155" font-size="27" font-weight="800" font-family="'Hiragino Sans','Yu Gothic',sans-serif">を確認</text>
    <path d="M620 390 C646 390 664 390 690 390" fill="none" stroke="#94a3b8" stroke-width="10" stroke-linecap="round"/>
    <path d="M880 390 C906 390 924 390 950 390" fill="none" stroke="#94a3b8" stroke-width="10" stroke-linecap="round"/>
    <path d="M1140 390 C1166 390 1184 390 1210 390" fill="none" stroke="#94a3b8" stroke-width="10" stroke-linecap="round"/>
  </g>
  <text x="88" y="110" fill="#1d4ed8" font-size="32" font-weight="700" font-family="'Hiragino Sans','Yu Gothic',sans-serif">回路の基本</text>
  <text x="88" y="176" fill="#0f172a" font-size="54" font-weight="800" font-family="'Hiragino Sans','Yu Gothic',sans-serif">確認フロー</text>
  <text x="88" y="232" fill="#334155" font-size="28" font-weight="700" font-family="'Hiragino Sans','Yu Gothic',sans-serif">切替不良は、モード・入力・禁止条件・出力の順に追う</text>
</svg>