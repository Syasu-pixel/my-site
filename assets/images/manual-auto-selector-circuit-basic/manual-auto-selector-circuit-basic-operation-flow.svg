<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef5ff"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f7fbff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#93b4d8" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="680" y="250" rx="24" ry="24" width="220" height="120" fill="#eff6ff" stroke="#60a5fa" stroke-width="4"/>
    <rect x="980" y="250" rx="24" ry="24" width="220" height="120" fill="#ecfdf3" stroke="#4ade80" stroke-width="4"/>
    <rect x="1280" y="250" rx="24" ry="24" width="220" height="120" fill="#fff7ed" stroke="#fb923c" stroke-width="4"/>
    <rect x="980" y="470" rx="24" ry="24" width="220" height="120" fill="#ffffff" stroke="#94a3b8" stroke-width="4"/>
    <text x="790" y="320" text-anchor="middle" fill="#1d4ed8" font-size="28" font-weight="800" font-family="'Hiragino Sans','Yu Gothic',sans-serif">1 モード確認</text>
    <text x="1090" y="320" text-anchor="middle" fill="#15803d" font-size="28" font-weight="800" font-family="'Hiragino Sans','Yu Gothic',sans-serif">2 入力確認</text>
    <text x="1390" y="320" text-anchor="middle" fill="#b45309" font-size="28" font-weight="800" font-family="'Hiragino Sans','Yu Gothic',sans-serif">3 禁止条件</text>
    <text x="1090" y="540" text-anchor="middle" fill="#334155" font-size="28" font-weight="800" font-family="'Hiragino Sans','Yu Gothic',sans-serif">4 最終出力</text>
    <path d="M900 310 C930 310 950 310 980 310" fill="none" stroke="#94a3b8" stroke-width="10" stroke-linecap="round"/>
    <path d="M1200 310 C1230 310 1250 310 1280 310" fill="none" stroke="#94a3b8" stroke-width="10" stroke-linecap="round"/>
    <path d="M1390 370 C1390 420 1160 420 1090 470" fill="none" stroke="#94a3b8" stroke-width="10" stroke-linecap="round"/>
  </g>
  <text x="88" y="110" fill="#1d4ed8" font-size="32" font-weight="700" font-family="'Hiragino Sans','Yu Gothic',sans-serif">回路の基本</text>
  <text x="88" y="176" fill="#0f172a" font-size="54" font-weight="800" font-family="'Hiragino Sans','Yu Gothic',sans-serif">確認フロー</text>
