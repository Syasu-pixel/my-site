<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">PE・FG・SGを確認する流れ</title>
  <desc id="desc">図面や端子表記を見たときに、略号だけで接続先を決めず、端子名称、回路図、マニュアルの順に役割を確認する流れを示す図。</desc>
  <rect width="1200" height="640" rx="28" fill="#f8fbff"/>
  <text x="600" y="68" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="700" fill="#0f172a">図面・端子でPE / FG / SGを見つけたら</text>
  <text x="600" y="106" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#475569">「いつものつなぎ方」ではなく、その機器の定義を確認してから判断します</text>

  <g transform="translate(55 170)">
    <rect width="230" height="250" rx="22" fill="#ffffff" stroke="#bfdbfe" stroke-width="3"/>
    <circle cx="52" cy="52" r="28" fill="#2563eb"/>
    <text x="52" y="61" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#fff">1</text>
    <text x="115" y="58" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#1d4ed8">端子名を見る</text>
    <rect x="42" y="96" width="146" height="62" rx="12" fill="#eff6ff"/>
    <text x="115" y="136" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#0f172a">PE / FG / SG</text>
    <text x="115" y="192" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#475569">略号だけで結論を出さない</text>
  </g>

  <path d="M300 295h70" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  <path d="M358 282l18 13-18 13" fill="none" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(385 170)">
    <rect width="230" height="250" rx="22" fill="#ffffff" stroke="#c4b5fd" stroke-width="3"/>
    <circle cx="52" cy="52" r="28" fill="#7c3aed"/>
    <text x="52" y="61" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#fff">2</text>
    <text x="120" y="58" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#6d28d9">回路図を見る</text>
    <path d="M55 122h38l22-24 28 48 22-24h38" fill="none" stroke="#7c3aed" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="115" y="192" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#475569">何とつながる端子か確認</text>
  </g>

  <path d="M630 295h70" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  <path d="M688 282l18 13-18 13" fill="none" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(715 170)">
    <rect width="230" height="250" rx="22" fill="#ffffff" stroke="#fed7aa" stroke-width="3"/>
    <circle cx="52" cy="52" r="28" fill="#f97316"/>
    <text x="52" y="61" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#fff">3</text>
    <text x="118" y="58" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#c2410c">端子表を見る</text>
    <rect x="52" y="98" width="126" height="70" rx="10" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/>
    <path d="M64 120h102M64 143h102M104 99v69" stroke="#fb923c" stroke-width="3"/>
    <text x="115" y="202" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#475569">名称・注記・接続先を照合</text>
  </g>

  <path d="M960 295h70" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  <path d="M1018 282l18 13-18 13" fill="none" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(1045 170)">
    <rect width="100" height="250" rx="22" fill="#ffffff" stroke="#bbf7d0" stroke-width="3"/>
    <circle cx="50" cy="52" r="28" fill="#16a34a"/>
    <text x="50" y="61" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#fff">4</text>
    <path d="M30 104h40v76H30z" fill="#ecfdf3" stroke="#16a34a" stroke-width="3"/>
    <path d="M39 119h22M39 133h22M39 147h22" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>
    <text x="50" y="210" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#166534">取説で</text>
    <text x="50" y="232" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#166534">確定</text>
  </g>

  <rect x="170" y="474" width="860" height="102" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="600" y="516" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#0f172a">確認できないときは「推測でつながない」</text>
  <text x="600" y="550" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#475569">PEは保護目的。FG・SG・0Vとの関係は、使用機器の公式資料に従います</text>
</svg>