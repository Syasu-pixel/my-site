<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">FG・SGの表記は機器ごとに確認</title>
  <desc id="desc">FGやSGの意味がメーカーや機器によって異なるため、端子表記だけで判断せず、回路図・端子表・マニュアルを確認する考え方を示す図。</desc>
  <rect width="1200" height="660" rx="28" fill="#f8fbff"/>
  <text x="600" y="72" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="700" fill="#0f172a">FG・SGは「表記だけ」で決めつけない</text>
  <text x="600" y="112" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#475569">同じ略号でも、メーカー・シリーズ・端子用途によって意味が異なることがあります</text>

  <g transform="translate(55 170)">
    <rect width="300" height="330" rx="22" fill="#ffffff" stroke="#bfdbfe" stroke-width="3"/>
    <text x="150" y="54" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#1d4ed8">機器A</text>
    <rect x="65" y="92" width="170" height="92" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="3"/>
    <text x="150" y="130" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#1d4ed8">FG</text>
    <text x="150" y="164" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#334155">Frame Ground</text>
    <text x="150" y="228" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#334155">フレーム・シールド処理など</text>
    <text x="150" y="264" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#64748b">例：端子台やコネクタ外装</text>
  </g>

  <g transform="translate(450 170)">
    <rect width="300" height="330" rx="22" fill="#ffffff" stroke="#c4b5fd" stroke-width="3"/>
    <text x="150" y="54" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#7c3aed">機器B</text>
    <rect x="65" y="92" width="170" height="92" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="3"/>
    <text x="150" y="130" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#7c3aed">FG</text>
    <text x="150" y="164" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#334155">Protective / Functional?</text>
    <text x="150" y="228" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#334155">メーカー独自の呼び方の場合</text>
    <text x="150" y="264" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#64748b">役割をマニュアルで確認</text>
  </g>

  <g transform="translate(845 170)">
    <rect width="300" height="330" rx="22" fill="#ffffff" stroke="#fed7aa" stroke-width="3"/>
    <text x="150" y="54" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#c2410c">機器C</text>
    <rect x="65" y="92" width="170" height="92" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/>
    <text x="150" y="130" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#c2410c">SG</text>
    <text x="150" y="164" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#334155">Signal Ground</text>
    <text x="150" y="228" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#334155">通信・アナログ信号の基準</text>
    <text x="150" y="264" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#64748b">0Vとの関係も要確認</text>
  </g>

  <path d="M205 530h790" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <circle cx="205" cy="530" r="10" fill="#2563eb"/><circle cx="600" cy="530" r="10" fill="#7c3aed"/><circle cx="995" cy="530" r="10" fill="#f97316"/>
  <rect x="265" y="548" width="670" height="74" rx="18" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>
  <text x="600" y="579" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#155e75">判断の順番：端子名 → 回路図 → 端子表 → 取扱説明書</text>
  <text x="600" y="606" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#475569">略号が同じでも、接続先や目的を本文・注記まで確認します</text>
</svg>