<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">PE・FG・SGの役割比較</title>
  <desc id="desc">PEは保護目的、FGは機器フレームや機能上の接地、SGは信号基準として整理し、FGとSGは機器マニュアルで定義確認が必要であることを示す図。</desc>
  <rect width="1200" height="720" rx="28" fill="#f8fbff"/>
  <text x="600" y="72" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="700" fill="#0f172a">PE・FG・SGは「名前」より役割で見る</text>
  <text x="600" y="112" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#475569">同じグランド系の表記でも、目的・基準・接続先の考え方が異なります</text>

  <g transform="translate(50 155)">
    <rect width="340" height="430" rx="24" fill="#ffffff" stroke="#bbf7d0" stroke-width="3"/>
    <rect width="340" height="74" rx="24" fill="#16a34a"/>
    <rect y="52" width="340" height="22" fill="#16a34a"/>
    <text x="170" y="48" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#ffffff">PE</text>
    <text x="170" y="116" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#166534">Protective Earth / 保護接地</text>
    <circle cx="170" cy="188" r="54" fill="#ecfdf3" stroke="#16a34a" stroke-width="4"/>
    <path d="M170 154v70M138 196h64M146 208h48M156 220h28" stroke="#16a34a" stroke-width="8" stroke-linecap="round"/>
    <text x="30" y="282" font-family="sans-serif" font-size="20" font-weight="700" fill="#0f172a">主な役割</text>
    <text x="30" y="316" font-family="sans-serif" font-size="19" fill="#334155">人や設備の安全を守る保護目的</text>
    <text x="30" y="360" font-family="sans-serif" font-size="20" font-weight="700" fill="#0f172a">見るポイント</text>
    <text x="30" y="394" font-family="sans-serif" font-size="19" fill="#334155">保護導体・筐体・接地端子との関係</text>
  </g>

  <g transform="translate(430 155)">
    <rect width="340" height="430" rx="24" fill="#ffffff" stroke="#bfdbfe" stroke-width="3"/>
    <rect width="340" height="74" rx="24" fill="#2563eb"/>
    <rect y="52" width="340" height="22" fill="#2563eb"/>
    <text x="170" y="48" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#ffffff">FG</text>
    <text x="170" y="116" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#1d4ed8">Frame / Functional Ground</text>
    <rect x="112" y="150" width="116" height="82" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/>
    <circle cx="170" cy="191" r="18" fill="#ffffff" stroke="#2563eb" stroke-width="4"/>
    <path d="M170 232v30M146 262h48M154 274h32M162 286h16" stroke="#2563eb" stroke-width="7" stroke-linecap="round"/>
    <text x="30" y="322" font-family="sans-serif" font-size="20" font-weight="700" fill="#0f172a">主な役割</text>
    <text x="30" y="356" font-family="sans-serif" font-size="19" fill="#334155">機器フレームや機能上の接地</text>
    <text x="30" y="394" font-family="sans-serif" font-size="18" fill="#475569">※ FGの意味はメーカー・機器で異なる</text>
  </g>

  <g transform="translate(810 155)">
    <rect width="340" height="430" rx="24" fill="#ffffff" stroke="#fed7aa" stroke-width="3"/>
    <rect width="340" height="74" rx="24" fill="#f97316"/>
    <rect y="52" width="340" height="22" fill="#f97316"/>
    <text x="170" y="48" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#ffffff">SG</text>
    <text x="170" y="116" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#c2410c">Signal Ground / 信号基準</text>
    <path d="M110 195h42l18-28 24 56 20-28h46" fill="none" stroke="#f97316" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="110" cy="195" r="7" fill="#f97316"/><circle cx="260" cy="195" r="7" fill="#f97316"/>
    <text x="30" y="282" font-family="sans-serif" font-size="20" font-weight="700" fill="#0f172a">主な役割</text>
    <text x="30" y="316" font-family="sans-serif" font-size="19" fill="#334155">通信・計測などの信号基準</text>
    <text x="30" y="360" font-family="sans-serif" font-size="20" font-weight="700" fill="#0f172a">見るポイント</text>
    <text x="30" y="394" font-family="sans-serif" font-size="18" fill="#475569">0V・GNDとの関係は機器仕様で確認</text>
  </g>

  <rect x="190" y="620" width="820" height="66" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="600" y="650" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#9a3412">重要：FG・SGをPEや0Vと同一視しない</text>
  <text x="600" y="677" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#7c2d12">端子名称・回路図・取扱説明書で、その機器の定義を確認します</text>
</svg>