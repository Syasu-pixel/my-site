<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="t d"><title id="t">停電保持の確認順</title><desc id="d">PLCで値が残るときに、CPU、設定、対象デバイス、初期化処理の順に確認する図</desc><rect width="1000" height="560" rx="30" fill="#f8fafc"/><text x="60" y="72" font-family="sans-serif" font-size="34" font-weight="700" fill="#0f172a">「値が残る」時の確認順</text><text x="60" y="112" font-family="sans-serif" font-size="20" fill="#64748b">番号だけで判断せず、設定と起動処理まで追います</text><g font-family="sans-serif"><rect x="90" y="160" width="820" height="70" rx="20" fill="#eff6ff" stroke="#60a5fa" stroke-width="3"/><circle cx="135" cy="195" r="24" fill="#2563eb"/><text x="128" y="203" font-size="22" font-weight="700" fill="#fff">1</text><text x="180" y="204" font-size="23" font-weight="700" fill="#1e3a8a">CPU・シリーズ・プロジェクトを特定する</text><rect x="90" y="250" width="820" height="70" rx="20" fill="#ecfdf5" stroke="#4ade80" stroke-width="3"/><circle cx="135" cy="285" r="24" fill="#16a34a"/><text x="128" y="293" font-size="22" font-weight="700" fill="#fff">2</text><text x="180" y="294" font-size="23" font-weight="700" fill="#166534">ラッチ／保持範囲の設定を確認する</text><rect x="90" y="340" width="820" height="70" rx="20" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/><circle cx="135" cy="375" r="24" fill="#ea580c"/><text x="128" y="383" font-size="22" font-weight="700" fill="#fff">3</text><text x="180" y="384" font-size="23" font-weight="700" fill="#9a3412">対象デバイス・ラベルが範囲内か照合する</text><rect x="90" y="430" width="820" height="70" rx="20" fill="#f5f3ff" stroke="#a78bfa" stroke-width="3"/><circle cx="135" cy="465" r="24" fill="#7c3aed"/><text x="128" y="473" font-size="22" font-weight="700" fill="#fff">4</text><text x="180" y="474" font-size="23" font-weight="700" fill="#5b21b6">起動時の初期化・復帰ロジックを確認する</text></g><text x="60" y="535" font-family="sans-serif" font-size="17" fill="#64748b">設定変更や実機操作はバックアップと設備条件を確認してから行います。</text></svg>