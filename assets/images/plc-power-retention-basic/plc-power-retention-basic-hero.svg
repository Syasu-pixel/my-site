<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">PLCの停電保持</title><desc id="d">電源OFF後も保持するデータと初期化されるデータを分けて考える概念図</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eff6ff"/><stop offset="1" stop-color="#f8fafc"/></linearGradient></defs><rect width="1200" height="630" rx="36" fill="url(#bg)"/><rect x="70" y="72" width="1060" height="486" rx="30" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="110" y="145" font-family="sans-serif" font-size="42" font-weight="700" fill="#0f172a">PLCの停電保持</text><text x="110" y="192" font-family="sans-serif" font-size="24" fill="#475569">電源OFF → ONで「残すもの」と「初期化するもの」を分ける</text><rect x="110" y="245" width="270" height="180" rx="24" fill="#dbeafe" stroke="#60a5fa" stroke-width="3"/><text x="185" y="315" font-family="sans-serif" font-size="30" font-weight="700" fill="#1d4ed8">PLC</text><text x="143" y="360" font-family="sans-serif" font-size="22" fill="#334155">運転中のデータ</text><path d="M400 335H505" stroke="#64748b" stroke-width="8" stroke-linecap="round"/><path d="M485 317l28 18-28 18" fill="none" stroke="#64748b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="540" y="245" width="250" height="180" rx="24" fill="#ecfdf5" stroke="#4ade80" stroke-width="3"/><text x="590" y="305" font-family="sans-serif" font-size="26" font-weight="700" fill="#15803d">保持する</text><text x="575" y="350" font-family="sans-serif" font-size="20" fill="#334155">累積値・補正値</text><text x="575" y="382" font-family="sans-serif" font-size="20" fill="#334155">必要な設定値など</text><rect x="830" y="245" width="250" height="180" rx="24" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/><text x="875" y="305" font-family="sans-serif" font-size="26" font-weight="700" fill="#c2410c">初期化する</text><text x="865" y="350" font-family="sans-serif" font-size="20" fill="#334155">運転指令・一時条件</text><text x="865" y="382" font-family="sans-serif" font-size="20" fill="#334155">安全上残さない値など</text><text x="110" y="500" font-family="sans-serif" font-size="21" fill="#64748b">※保持範囲はCPU・プロジェクト設定・デバイス種別で異なります。</text></svg>