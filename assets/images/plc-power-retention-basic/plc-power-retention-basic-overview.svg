<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="t d"><title id="t">保持データと非保持データの違い</title><desc id="d">PLCの電源OFFからONの前後で、保持データは値を維持し、非保持データは初期状態へ戻る考え方を示す図</desc><rect width="1000" height="560" rx="30" fill="#f8fafc"/><text x="60" y="70" font-family="sans-serif" font-size="34" font-weight="700" fill="#0f172a">保持データと非保持データの違い</text><text x="60" y="110" font-family="sans-serif" font-size="20" fill="#64748b">同じPLC内でも、すべての値が同じ動きをするわけではありません</text><rect x="70" y="160" width="390" height="310" rx="28" fill="#ecfdf5" stroke="#4ade80" stroke-width="3"/><text x="115" y="215" font-family="sans-serif" font-size="28" font-weight="700" fill="#15803d">保持するデータ</text><text x="115" y="260" font-family="sans-serif" font-size="20" fill="#334155">電源OFF前：123</text><text x="115" y="300" font-family="sans-serif" font-size="20" fill="#334155">電源OFF</text><path d="M135 330v55" stroke="#15803d" stroke-width="7" stroke-linecap="round"/><path d="M118 370l17 22 17-22" fill="none" stroke="#15803d" stroke-width="7" stroke-linecap="round"/><text x="115" y="430" font-family="sans-serif" font-size="20" fill="#334155">再起動後：123</text><rect x="540" y="160" width="390" height="310" rx="28" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/><text x="585" y="215" font-family="sans-serif" font-size="28" font-weight="700" fill="#c2410c">非保持データ</text><text x="585" y="260" font-family="sans-serif" font-size="20" fill="#334155">電源OFF前：ON</text><text x="585" y="300" font-family="sans-serif" font-size="20" fill="#334155">電源OFF</text><path d="M605 330v55" stroke="#c2410c" stroke-width="7" stroke-linecap="round"/><path d="M588 370l17 22 17-22" fill="none" stroke="#c2410c" stroke-width="7" stroke-linecap="round"/><text x="585" y="430" font-family="sans-serif" font-size="20" fill="#334155">再起動後：初期状態</text><text x="60" y="525" font-family="sans-serif" font-size="18" fill="#64748b">※実際の保持範囲・初期値・リセット時の挙動はCPUやプロジェクト設定で確認します。</text></svg>