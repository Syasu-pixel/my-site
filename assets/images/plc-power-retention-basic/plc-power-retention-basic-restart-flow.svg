<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="t d"><title id="t">復電時の確認フロー</title><desc id="d">電源OFFから再起動後に、保持対象、初期化処理、安全条件を順番に確認する流れ</desc><rect width="1000" height="560" rx="30" fill="#f8fafc"/><text x="60" y="72" font-family="sans-serif" font-size="34" font-weight="700" fill="#0f172a">復電時は「残った値」だけで判断しない</text><text x="60" y="112" font-family="sans-serif" font-size="20" fill="#64748b">保持設定と初期化処理をセットで確認します</text><g font-family="sans-serif"><rect x="70" y="175" width="190" height="115" rx="22" fill="#eff6ff" stroke="#60a5fa" stroke-width="3"/><text x="112" y="220" font-size="23" font-weight="700" fill="#1d4ed8">1. 電源OFF</text><text x="104" y="255" font-size="17" fill="#334155">停止条件を確認</text><path d="M280 232H360" stroke="#64748b" stroke-width="7"/><path d="M340 214l28 18-28 18" fill="none" stroke="#64748b" stroke-width="7" stroke-linejoin="round"/><rect x="390" y="175" width="220" height="115" rx="22" fill="#ecfdf5" stroke="#4ade80" stroke-width="3"/><text x="435" y="220" font-size="23" font-weight="700" fill="#15803d">2. 保持確認</text><text x="425" y="255" font-size="17" fill="#334155">対象データを照合</text><path d="M630 232H710" stroke="#64748b" stroke-width="7"/><path d="M690 214l28 18-28 18" fill="none" stroke="#64748b" stroke-width="7" stroke-linejoin="round"/><rect x="740" y="175" width="190" height="115" rx="22" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/><text x="772" y="220" font-size="23" font-weight="700" fill="#c2410c">3. 再起動</text><text x="772" y="255" font-size="17" fill="#334155">初期値も確認</text><path d="M835 315v60" stroke="#64748b" stroke-width="7"/><path d="M817 355l18 28 18-28" fill="none" stroke="#64748b" stroke-width="7" stroke-linejoin="round"/><rect x="620" y="395" width="310" height="105" rx="22" fill="#fef2f2" stroke="#f87171" stroke-width="3"/><text x="665" y="438" font-size="22" font-weight="700" fill="#b91c1c">4. 安全条件を確認</text><text x="655" y="472" font-size="17" fill="#334155">意図しない再始動がないか確認</text><path d="M600 447H510" stroke="#64748b" stroke-width="7"/><path d="M530 429l-28 18 28 18" fill="none" stroke="#64748b" stroke-width="7" stroke-linejoin="round"/><rect x="170" y="395" width="310" height="105" rx="22" fill="#f5f3ff" stroke="#a78bfa" stroke-width="3"/><text x="215" y="438" font-size="22" font-weight="700" fill="#6d28d9">5. プログラム確認</text><text x="205" y="472" font-size="17" fill="#334155">初期化・復帰処理まで読む</text></g><text x="60" y="535" font-family="sans-serif" font-size="17" fill="#64748b">※実機操作は設備の停止条件・社内手順・メーカー資料を優先してください。</text></svg>