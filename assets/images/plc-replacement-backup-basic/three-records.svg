<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title">
<title id="title">交換前のバックアップを三つに分ける</title>
<rect width="960" height="430" rx="28" fill="#ebf5ff"/>
<g font-family="Noto Sans CJK JP, sans-serif" font-weight="700">
<text x="50" y="65" fill="#152f4c" font-size="37">「どこから取ったか」を残す</text>
<g fill="#fff" stroke="#b1cde3" stroke-width="3"><rect x="47" y="91" width="866" height="87" rx="19"/><rect x="47" y="190" width="866" height="87" rx="19"/><rect x="47" y="289" width="866" height="87" rx="19"/></g>
<g fill="#1e557f"><circle cx="100" cy="134" r="31"/><circle cx="100" cy="233" r="31"/><circle cx="100" cy="332" r="31"/></g>
<g text-anchor="middle" fill="#fff" font-size="35"><text x="100" y="146">1</text><text x="100" y="245">2</text><text x="100" y="344">3</text></g>
<g fill="#173552" font-size="32"><text x="157" y="144">プログラム</text><text x="157" y="243">パラメータ</text><text x="157" y="342">現在値</text></g>
<g fill="#344e62" font-size="29"><text x="428" y="144">設計元と実機の版</text><text x="428" y="243">CPU・ユニット・通信</text><text x="428" y="342">どの機器の値か、いつ取ったか</text></g>
</g>
</svg>
