<svg xmlns="http://www.w3.org/2000/svg" width="960" height="574" viewBox="0 0 960 574" role="img" aria-labelledby="title desc" lang="ja">
  <title id="title">条件OFFでTは0、Cはカウントを維持</title>
  <desc id="desc">三菱電機FX5の読み取り例。通常タイマT0は条件の途中OFFで現在値が12から0に戻る。通常カウンタC0は立ち上がりで1増え、条件OFFの後も1。RST C0で0になる。</desc>
  <rect width="960" height="574" rx="28" fill="#102636"/>
  <g font-family="Noto Sans CJK JP,Hiragino Sans,Yu Gothic,sans-serif">
    <text x="47" y="52" font-size="21" fill="#a7e3ee" font-weight="700" letter-spacing="2">FX5・オフライン読解例</text>
    <text x="47" y="105" font-size="42" fill="#fff" font-weight="700">「条件OFF」で値はどうなる？</text>
    <rect x="46" y="141" width="868" height="172" rx="22" fill="#e5f7fa"/>
    <rect x="46" y="334" width="868" height="179" rx="22" fill="#fff2d6"/>
    <path d="M62 165v123" stroke="#067587" stroke-width="8" stroke-linecap="round"/>
    <path d="M62 359v127" stroke="#a15413" stroke-width="8" stroke-linecap="round"/>
    <g fill="#143344">
      <text x="86" y="191" font-size="29" font-weight="700">T0　通常タイマ</text>
      <text x="86" y="234" font-size="28">起動条件ONで進む</text><text x="516" y="234" font-size="28">途中で条件OFF</text>
      <text x="86" y="279" font-size="34" font-weight="700">現在値 12</text><text x="516" y="279" font-size="34" font-weight="700">現在値 0</text>
      <text x="86" y="383" font-size="29" font-weight="700">C0　通常カウンタ</text>
      <text x="86" y="426" font-size="28">条件OFF→ON</text><text x="516" y="426" font-size="28">その後に条件OFF</text>
      <text x="86" y="472" font-size="34" font-weight="700">現在値 1</text><text x="516" y="472" font-size="34" font-weight="700">1のまま</text>
    </g>
    <path d="M362 258h104m-15-12 15 12-15 12M362 451h104m-15-12 15 12-15 12" stroke="#355361" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="47" y="552" font-size="24" fill="#fff">C0のリセット条件成立 → RST C0 → 現在値0</text>
  </g>
</svg>
