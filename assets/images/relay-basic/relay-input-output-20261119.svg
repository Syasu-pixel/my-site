<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="relay-title relay-desc">
<title id="relay-title">リレーのコイル側と接点側</title>
<desc id="relay-desc">左のコイル側の定格と右の接点側の定格は別。コイルが接点を動かすが、接点自身は負荷側へ電源を供給しない。</desc>
<rect width="1200" height="675" rx="34" fill="#edf4fb"/>
<text x="600" y="89" font-family="Noto Sans CJK JP, sans-serif" font-size="55" font-weight="700" text-anchor="middle" fill="#193e66">リレーの定格は「2か所」に分ける</text>
<g font-family="Noto Sans CJK JP, sans-serif" text-anchor="middle">
 <rect x="70" y="153" width="494" height="370" rx="25" fill="#fff" stroke="#2d6ba7" stroke-width="5"/>
 <rect x="636" y="153" width="494" height="370" rx="25" fill="#fff" stroke="#96611e" stroke-width="5"/>
 <text x="317" y="232" font-size="54" font-weight="700" fill="#164a7c">コイル側</text>
 <text x="883" y="232" font-size="54" font-weight="700" fill="#784714">接点側</text>
 <g stroke="#2d6ba7" stroke-width="8" fill="none" stroke-linecap="round">
  <path d="M200 315h33q22-74 44 0q22-74 44 0q22-74 44 0q22-74 44 0h29"/>
 </g>
 <g stroke="#96611e" stroke-width="8" fill="none" stroke-linecap="round">
  <path d="M770 315h83l68-48m0 48h78"/>
  <circle cx="921" cy="315" r="4"/>
 </g>
 <path d="M576 305h48m-15-14 15 14-15 14" fill="none" stroke="#526979" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
 <text x="317" y="393" font-size="43" fill="#253e58">駆動する条件</text>
 <text x="317" y="455" font-size="39" fill="#253e58">AC/DC・電圧・電流</text>
 <text x="883" y="393" font-size="43" fill="#493b29">負荷を開閉する条件</text>
 <text x="883" y="455" font-size="39" fill="#493b29">電圧・電流・負荷の種類</text>
 <rect x="70" y="564" width="1060" height="64" rx="16" fill="#dbe9f4"/>
 <text x="600" y="609" font-size="37" font-weight="700" fill="#183f63">コイルが接点を動かす。接点は電源にならない。</text>
</g>
</svg>
