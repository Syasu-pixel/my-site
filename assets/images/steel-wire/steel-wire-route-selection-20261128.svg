<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" width="1000" height="780" role="img" aria-labelledby="title desc">
 <title id="title">通線工具を選ぶ前の3つの確認</title>
 <desc id="desc">経路の内径・曲がり・既設線、呼線の先端寸法・長さ・目印、抵抗が急に変わったときの中止判断を並べる図。</desc>
 <rect width="1000" height="780" rx="36" fill="#eff6ff"/>
 <g font-family="sans-serif" fill="#172554">
  <text x="42" y="77" font-size="45" font-weight="700">通線ワイヤーを選ぶ前に</text>
  <g fill="#fff"><rect x="40" y="117" width="920" height="176" rx="24"/><rect x="40" y="316" width="920" height="176" rx="24"/><rect x="40" y="515" width="920" height="176" rx="24"/></g>
  <g fill="#1d4ed8"><circle cx="91" cy="170" r="24"/><circle cx="91" cy="369" r="24"/></g><circle cx="91" cy="568" r="24" fill="#b91c1c"/>
  <g text-anchor="middle" font-size="27" font-weight="700" fill="white"><text x="91" y="180">1</text><text x="91" y="379">2</text><text x="91" y="578">3</text></g>
  <g font-size="38" font-weight="700"><text x="136" y="183">経路を見る</text><text x="136" y="382">製品の仕様を照合</text><text x="136" y="581">急な抵抗は中止</text></g>
  <g font-size="32" fill="#334155"><text x="137" y="245">内径・曲がり・既設線</text><text x="137" y="444">先端の太さ・長さ・目印</text><text x="137" y="643">押さずに、経路を確認</text></g>
  <path d="M738 231v-54q0-19 19-19h137M775 231v-33h119" fill="none" stroke="#2563eb" stroke-width="11" stroke-linecap="round"/>
  <path d="M729 398h170" stroke="#94a3b8" stroke-width="15" stroke-linecap="round"/><path d="M741 398h37m50 0h37" stroke="#1d4ed8" stroke-width="15" stroke-linecap="round"/>
  <path d="M814 548l52 90H762z" fill="#fee2e2" stroke="#b91c1c" stroke-width="9" stroke-linejoin="round"/><path d="M814 581v22m0 13v2" stroke="#b91c1c" stroke-width="9" stroke-linecap="round"/>
  <text x="45" y="746" font-size="27" fill="#334155">目印は送り出した長さの目安。詰まりの位置を断定しない。</text>
 </g>
</svg>
