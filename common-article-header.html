<style>
  :root {
    --header-bg: rgba(0, 80, 50, 0.75);
    --header-border: rgba(255, 255, 255, 0.18);
    --header-link: #ffffff;
    --header-link-hover: rgba(255, 255, 255, 0.2);
  }

  body {
    margin: 0;
    padding-top: 56px;
  }

  .site-header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 1000;
    background: var(--header-bg);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--header-border);
  }

  .site-header__inner {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 4px 6px;
  }

  .site-header__brand {
    display: none;
    margin: 0;
    color: #e8fff3;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }

  .site-header__nav {
    display: flex;
    width: 100%;
    gap: 6px;
  }

  .site-header__nav a {
    flex: 1;
    text-align: center;
    text-decoration: none;
    color: var(--header-link);
    font-size: 11px;
    font-weight: 700;
    line-height: 1;
    padding: 8px 4px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.18);
  }

  .site-header__nav a:hover,
  .site-header__nav a:focus-visible {
    background: var(--header-link-hover);
    outline: none;
  }

  @media (min-width: 769px) {
    body {
      padding-top: 76px;
    }

    .site-header__inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 10px 16px;
      justify-content: space-between;
      gap: 16px;
    }

    .site-header__brand {
      display: block;
    }

    .site-header__nav {
      width: auto;
      gap: 10px;
    }

    .site-header__nav a {
      flex: 0 0 auto;
      min-width: 120px;
      font-size: 13px;
      padding: 10px 14px;
    }
  }


#scrollTopBtn {
  position: fixed;
  bottom: 20px;
  right: 16px;
  z-index: 999;
  background: rgba(0, 80, 50, 0.85);
  color: #fff;
  border: none;
  border-radius: 999px;
  padding: 10px 12px;
  font-size: 12px;
  font-weight: bold;
  cursor: pointer;
  display: none;
}

#scrollTopBtn:hover {
  background: rgba(0, 80, 50, 1);
}

</style>

<header class="site-header">
  <div class="site-header__inner">
    <p class="site-header__brand">電気工事士向け工具紹介サイト</p>
    <nav class="site-header__nav" aria-label="共通ナビゲーション">
      <a href="index.html">トップ</a>
      <a href="index.html#category">カテゴリ</a>
      <a href="index.html#tips">コツ記事</a>
    </nav>
  </div>
</header>
