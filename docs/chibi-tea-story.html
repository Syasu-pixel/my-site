<script>
(()=>{const r=document.getElementById('tea-story'),q=s=>r.querySelector(s),names=['テーブルを運ぶ','椅子を並べる','お茶を入れる','お茶を運ぶ','ひと休み','片づける'];
const lines=[['先輩','よいしょ。休憩場所は、このへんでどう？','後輩','先輩、テーブルまで持ってきたんですか！'],['後輩','椅子、今日はちゃんとふたつです。','先輩','「今日は」の話は、お茶を飲みながら聞こうかな。'],['後輩','先輩の分も入れますね。少し待っていてください。','先輩','ありがとう。待つ準備はできているよ。'],['後輩','お待たせしました。お茶、到着です！','先輩','ありがとう。まずはゆっくり置こうね。'],['先輩','……ふう。こういう時間も大事だね。','後輩','休憩の段取りだけ、どんどん上手になっています。'],['後輩','あ、新しい依頼の合図です！（デモ）','先輩','カップを片づけて、依頼を確認しよう。']];
let base=0,start=performance.now(),paused=matchMedia('(prefers-reduced-motion: reduce)').matches,last=-1;const duration=16;
const buttons=names.map((name,i)=>{const b=document.createElement('button');b.type='button';b.textContent=name;b.onclick=()=>{base=i*duration;start=performance.now();last=-1;draw()};q('nav').append(b);return b});
function elapsed(){return Math.min(96,base+(paused?0:(performance.now()-start)/1000))}
function draw(){const t=elapsed(),scene=Math.min(5,Math.floor(t/duration)),half=t%duration>=8?2:0,k=scene*2+half/2;if(k!==last){last=k;q('.picture').style.backgroundPosition=`${scene%3*50}% ${Math.floor(scene/3)*100}%`;q('.picture').setAttribute('aria-label',names[scene]);q('.who').textContent=lines[scene][half];q('.line').textContent=lines[scene][half+1];buttons.forEach((b,i)=>b.setAttribute('aria-pressed',String(i===scene)));q('.count').textContent=`${scene+1} / 6`}if(t>=96){base=96;paused=true;q('#tea-play').textContent='もう一度再生'}}
function frame(){if(!r.isConnected)return;draw();requestAnimationFrame(frame)}
q('#tea-play').textContent=paused?'再生':'一時停止';q('#tea-play').onclick=()=>{const t=elapsed();base=t>=96?0:t;start=performance.now();paused=t>=96?false:!paused;q('#tea-play').textContent=paused?'再生':'一時停止';draw()};q('#tea-restart').onclick=()=>{base=0;start=performance.now();paused=false;last=-1;q('#tea-play').textContent='一時停止';draw()};draw();requestAnimationFrame(frame);
})();
</script>
