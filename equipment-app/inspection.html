<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>点検入力 Preview｜設備管理Webアプリ</title><link rel="stylesheet" href="./app.css"></head><body>
<div class="app-shell">
<aside class="sidebar"><a class="brand" href="./dashboard.html"><img src="./assets/dcl-logo-transparent.png" alt="DCLロゴ"><span><strong>設備管理</strong><small>Denkicontrol Workspace</small></span></a><nav class="nav"><a href="./dashboard.html"><span class="icon">◈</span>ダッシュボード</a><a href="./equipment.html"><span class="icon">▦</span>設備</a><a class="active" href="./inspection.html"><span class="icon">✓</span>点検</a><a href="#"><span class="icon">◫</span>カレンダー</a><a href="./settings.html"><span class="icon">⚙</span>組織・設定</a></nav></aside>
<div class="main"><header class="topbar"><h1>点検</h1><div class="spacer"></div><span class="pill">本日 3件</span></header>
<main class="content"><div class="inspection-layout">
<section class="inspection-queue"><div class="inspection-queue-head"><div><h2>今日の点検</h2><p>未実施 2件 / 完了 1件</p></div><button class="btn ghost">＋ 点検を作成</button></div>
<button class="inspection-item active"><span class="dot yellow"></span><div><strong>CV-04 月次点検</strong><small>第1工場 / 搬送ライン</small></div><em>09:30</em></button>
<button class="inspection-item"><span class="dot red"></span><div><strong>ホイスト 日常点検</strong><small>組立エリア</small></div><em>未実施</em></button>
<button class="inspection-item done"><span class="dot green"></span><div><strong>コンプレッサ 圧力確認</strong><small>第2工場</small></div><em>完了</em></button>
</section>
<section class="inspection-form-panel">
<div class="inspection-form-head"><div><span class="asset-kicker">CV-04 / MONTHLY CHECK</span><h2>月次点検</h2><p>担当：保全班 / 期限：2026-10-08</p></div><span class="badge free">未実施</span></div>
<form id="inspectionForm">
<div class="check-entry"><div><strong>1. 異音・振動</strong><small>コンベア運転中に異常な音・振動がないか</small></div><div class="check-buttons"><label><input type="radio" name="c1" value="ok">正常</label><label><input type="radio" name="c1" value="ng">要確認</label></div></div>
<div class="check-entry"><div><strong>2. ベルト状態</strong><small>蛇行・損傷・著しい汚れがないか</small></div><div class="check-buttons"><label><input type="radio" name="c2" value="ok">正常</label><label><input type="radio" name="c2" value="ng">要確認</label></div></div>
<div class="check-entry value-entry"><div><strong>3. エア圧力</strong><small>基準 0.45〜0.60 MPa</small></div><div class="value-input"><input type="number" step="0.01" value="0.52"><span>MPa</span></div></div>
<div class="check-entry"><div><strong>4. センサ検出</strong><small>CV3 / CV4 在荷センサの検出確認</small></div><div class="check-buttons"><label><input type="radio" name="c4" value="ok">正常</label><label><input type="radio" name="c4" value="ng">要確認</label></div></div>
<div class="field"><label>コメント / 申し送り</label><textarea rows="4" placeholder="気づいたことがあれば記録"></textarea></div>
<div class="inspection-actions"><button type="button" class="btn ghost">写真を追加</button><div class="spacer"></div><button type="button" class="btn ghost">下書き保存</button><button type="submit" class="btn primary">点検を完了</button></div>
</form>
</section></div></main></div></div>
<nav class="mobile-nav"><a href="./dashboard.html">◈<br>ホーム</a><a href="./equipment.html">▦<br>設備</a><a class="active" href="./inspection.html">✓<br>点検</a><a href="#">◫<br>予定</a><a href="./settings.html">⚙<br>設定</a></nav>
<script>document.getElementById('inspectionForm').addEventListener('submit',e=>{e.preventDefault();alert('Preview: 点検完了として扱います')})</script></body></html>
