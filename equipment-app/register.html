<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>会員登録 Preview｜設備管理Webアプリ</title><link rel="stylesheet" href="./app.css"></head><body><main class="auth-wrap"><section class="auth-visual"><a class="brand" href="./"><img src="../assets/images/common/site-logo-dcl.png" alt=""><span><strong>電気コントロール</strong><small>Equipment Management</small></span></a><div class="auth-copy"><span class="kicker">SELF-SERVICE FIRST</span><h1>説明なしでも、<br>迷わず始められる。</h1><p>登録から設備追加、点検、通知、ウィジェット設定まで、ユーザー自身で完了できることを開発方針としています。</p></div><small style="color:#607c92">Preview / 実データはまだ保存しません</small></section><section class="auth-panel"><div class="form-card"><h2>無料会員登録</h2><p>まずは無料枠で開始。決済情報は不要です。</p><form id="form"><div class="field"><label>利用形態</label><select><option>法人利用</option><option>個人利用</option></select></div><div class="field"><label>会社名 / 組織名</label><input placeholder="あとから変更できます"></div><div class="field"><label>メールアドレス</label><input type="email" autocomplete="email" required></div><div class="field"><label>パスワード</label><input type="password" autocomplete="new-password" required></div><div class="form-note">カード情報は無料利用開始時には不要です。設備数や有料ウィジェットが必要になった時点でアップグレードできます。</div><button class="btn primary" type="submit">無料で始める</button></form><div class="auth-links"><a href="./login.html">すでに登録済みの方はこちら</a><br><a href="./">← サービス紹介へ戻る</a></div></div></section></main><script>document.querySelector('#form').addEventListener('submit',e=>{e.preventDefault();location.href='./dashboard.html'})</script></body></html>
