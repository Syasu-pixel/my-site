<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>タイマー Preview｜設備管理Webアプリ</title><link rel="stylesheet" href="./app.css"></head><body>
<div class="app-shell"><aside class="sidebar"><a class="brand" href="./dashboard.html"><img src="./assets/dcl-logo-transparent.png" alt="DCLロゴ"><span><strong>設備管理</strong><small>Denkicontrol Workspace</small></span></a><nav class="nav"><a href="./dashboard.html"><span class="icon">◈</span>ダッシュボード</a><a href="./equipment.html"><span class="icon">▦</span>設備</a><a href="./inspection.html"><span class="icon">✓</span>点検</a><a href="./calendar.html"><span class="icon">◫</span>カレンダー</a><a href="./settings.html"><span class="icon">⚙</span>組織・設定</a></nav></aside><div class="main"><header class="topbar"><a class="btn ghost" href="./dashboard.html" style="text-decoration:none">← マイページ</a><h1>タイマー・ストップウォッチ</h1><div class="spacer"></div><span class="pill">端末</span></header><main class="content module-content"><section class="module-hero"><div class="module-icon">⏱</div><div><span class="asset-kicker">UTILITY</span><h2>タイマー・ストップウォッチ</h2><p>保全作業、暖機、待機時間、測定時間などをその場で計測します。</p></div></section><section class="module-grid"><article class="module-panel"><div class="timer-page"><strong id="timerPageDisplay">00:00:00</strong><div><button class="btn primary" id="timerPageStart">開始</button><button class="btn ghost" id="timerPageStop">停止</button><button class="btn ghost" id="timerPageReset">リセット</button></div></div></article><article class="module-panel"><h3>用途例</h3><p>設備停止時間、エア抜き待ち、加熱・冷却待ち、定期測定など。将来は作業履歴への記録にもつなげられます。</p></article></section></main></div></div><script src="./ui-preferences.js"></script><script>let s=0,r=false,t=null;function u(){timerPageDisplay.textContent=String(Math.floor(s/3600)).padStart(2,'0')+':'+String(Math.floor((s%3600)/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}timerPageStart.onclick=()=>{if(r)return;r=true;t=setInterval(()=>{s++;u()},1000)};timerPageStop.onclick=()=>{r=false;clearInterval(t)};timerPageReset.onclick=()=>{r=false;clearInterval(t);s=0;u()};u()</script></body></html>
