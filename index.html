<script>
(function () {
  const slider = document.getElementById("nipper-slider");
  if (!slider) return;

  const cards = Array.from(slider.querySelectorAll("a"));
  if (cards.length <= 1) return;

  let currentIndex = 0;
  let timer;

  const INTERVAL = 2500;

  function goTo(index) {
    slider.scrollTo({
      left: cards[index].offsetLeft,
      behavior: "smooth"
    });
  }

  function loopSlide() {
    if (window.innerWidth <= 768) return;

    goTo(currentIndex);

    // 次のindex準備
    if (currentIndex === cards.length - 1) {
      currentIndex = 0;
    } else {
      currentIndex++;
    }
  }

  function start() {
    timer = setInterval(loopSlide, INTERVAL);
  }

  function stop() {
    clearInterval(timer);
  }

  // ホバー制御
  slider.addEventListener("mouseenter", stop);
  slider.addEventListener("mouseleave", start);

  // 初期位置
  goTo(0);

  start();
})();
</script>
