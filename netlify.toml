[build]
  publish = "."

# Netlify is used only as a review/preview surface for this repository.
# The production site remains GitHub Pages on https://denkicontrol.com/.
# Keep every Netlify-served response out of search indexes, including the
# duplicate Netlify production URL created by the Git integration.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "no-referrer"
