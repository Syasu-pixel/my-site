[build]
  publish = "."
  # Netlify Preview is retired for this repository.
  # Exit 0 tells Netlify to skip automatic Git-triggered builds so monthly
  # credits are not consumed again after the quota resets.

# Historical safety headers remain in place in case an existing Netlify URL
# is still reachable. Canonical Production remains GitHub Pages on
# https://denkicontrol.com/.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, noarchive"
    Referrer-Policy = "no-referrer"
